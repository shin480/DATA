/* ===== admin_users.css ===== */
/* ==============================
   Reset
============================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #050816;
  color: #f8fafc;
}

button,
input,
select {

}


/* ==============================
   Layout
============================== */

.admin-users-layout {
  display: flex;
  min-height: 100vh;
  background: #020817;
}


/* ==============================
   Sidebar
============================== */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 270px;
  background:
    radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 34%),
    linear-gradient(180deg, #0b1020 0%, #020817 100%);

  padding-top: 28px;
  z-index: 100;
  box-shadow: 18px 0 45px rgba(0, 0, 0, 0.22);
}

.logo-wrap {
  margin: 0 20px 26px;
  padding: 0 14px;
  height: 76px;
  border-radius: 16px;
  background:
    radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 45%),
    rgba(15, 23, 42, 0.72);
  border: 1px solid rgba(56, 189, 248, 0.22);
  cursor: pointer;
  transition: 0.2s ease;

  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-wrap:hover {
  transform: translateY(-2px);
  border-color: rgba(56, 189, 248, 0.4);
  box-shadow: 0 14px 32px rgba(37, 99, 235, 0.2);
}

.admin-side-logo {
  display: block;
  width: 158px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

.logo-small {
  color: #7dd3fc;
  font-size: 12px;
  margin-bottom: 0;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.side-title-wrap {
  padding: 0 24px 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
}

.side-title {
  color: #64748b;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.side-menu {
  list-style: none;
  padding: 0;
  margin: 0;
}

  height: 50px;
  display: flex;
  align-items: center;
  padding-left: 28px;
  color: #94a3b8;
  font-size: 15px;
  border-left: 4px solid transparent;
  cursor: pointer;
  transition: 0.2s ease;
}

.side-menu li:hover {
  background: rgba(56, 189, 248, 0.08);
  color: #e0f2fe;
}

.side-menu li.active {
  background: linear-gradient(
    90deg,

  );
  color: #7dd3fc;
  border-left-color: #38bdf8;
  font-weight: 800;
}


/* ==============================
   Main
============================== */

.admin-users-main {

  min-height: 100vh;
  background:
    radial-gradient(circle at top right, rgba(139, 92, 246, 0.1), transparent 32%),

}

.admin-users-header {
  height: 74px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 0 30px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);

  top: 0;
  z-index: 50;
}

.main-btn,
.logout-btn {

  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

.main-btn:hover,
.logout-btn:hover {
  border-color: #38bdf8;
  color: #38bdf8;
}

.admin-users-content {
  max-width: 1060px;
  margin: 0 auto;
  padding: 28px 24px 80px;
}


/* ==============================
   Card
============================== */

.admin-card,
.chart-card,
.reaction-card {
  background:
    linear-gradient(180deg, rgba(17, 28, 49, 0.96), rgba(13, 23, 41, 0.96));
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
}

.card-title {
  color: #eaf6ff;
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 16px;
}

.sub-title {
  color: #9be7ff;
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 12px;
}

.usage-card {
  margin-top: 18px;
}


/* ==============================
   Filter
============================== */

.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.filter-row label {

  color: #f8fafc;
  margin-right: 8px;
}

input,
select {

  background: #050b1b;
  color: #dbeafe;

  border-radius: 999px;
  padding: 0 12px;
  outline: none;
}

input::placeholder {
  color: #697996;
}

select {
  border-radius: 8px;
}

input[type="date"]::-webkit-calendar-picker-indicator {

.search-btn {

  height: 32px;

.search-btn:hover {

/* ==============================
   Table
============================== */

.table-box {

}

.table-box.large {
  max-height: 310px;
}

.table-box::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.table-box::-webkit-scrollbar-track {
  background: #0b1426;
  border-radius: 999px;
}

.table-box::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 999px;
  border: 2px solid #0b1426;
}

.table-box::-webkit-scrollbar-thumb:hover {

table {

th,

th:last-child,

th {

td select {

  height: 28px;
  border-radius: 6px;
  background: #1f2b3d;
}


/* ==============================
   Stats
============================== */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 28px;
}

.stat-box {
  background:
    radial-gradient(circle at top right, rgba(56, 189, 248, 0.13), transparent 36%),

  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 18px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.stat-box .label {
  font-size: 15px;
  font-weight: 800;
}

.stat-box .value {
  font-size: 28px;
  font-weight: 900;
  color: #99a6bb;
}

.cyan {
  color: #20d6d2;
}

.purple {
  color: #a78bfa;
}

.blue {
  color: #93c5fd;
}

.orange {
  color: #fb923c;
}


/* ==============================
   Graph / Reaction
============================== */

.grid-section {
  display: grid;
  grid-template-columns: 1.25fr 0.85fr;
  gap: 14px;
  margin-top: 18px;
}

.chart-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.chart-card,
.reaction-card {
  padding: 18px;

.graph-box {
  height: 150px;
  background:

  border-radius: 14px;
  padding: 16px;
  font-size: 18px;
  font-weight: 900;
  position: relative;
  overflow: hidden;
}

.graph-box svg {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  opacity: 0.55;
}

.reaction-title {
  margin-right: auto;
  margin-bottom: 0;

/* ==============================
   Admin Log
============================== */

.log-card {
  margin-top: 18px;

/* ==============================
   Toast
============================== */

.toast {

  right: 24px;
  bottom: 24px;

  color: #e0f2fe;

/* ==============================
   Responsive
============================== */

@media (max-width: 1100px) {
  .sidebar {

  .admin-users-layout {

  }

  .grid-section {
    grid-template-columns: 1fr;
  }

  .stats-grid {

  }

@media (max-width: 720px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }

    padding: 20px 14px 80px;
  }

function showToast(message) {
  const toast = document.getElementById("toast");

  if (!toast) {
    alert(message);
    return;
  }

  toast.textContent = message;
  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  }, 2200);
}

function adminUsersLogout() {
  localStorage.removeItem("access_token");
  localStorage.removeItem("user_name");
  localStorage.removeItem("user_role");
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("userName");

  sessionStorage.removeItem("access_token");
  sessionStorage.removeItem("user_name");
  sessionStorage.removeItem("user_role");
  sessionStorage.removeItem("token");
  sessionStorage.removeItem("role");
  sessionStorage.removeItem("userName");

  axios.post("/logout");

  location.href = "/view/main.html";
}

      <td>${user.login}</td>
      <td>
        <select onchange="changeRole('${user.id}', this.value)">
          <option value="일반" ${user.role === "일반" ? "selected" : ""}>일반</option>
          <option value="관리자" ${user.role === "관리자" ? "selected" : ""}>관리자</option>
          <option value="최고관리자" ${user.role === "최고관리자" ? "selected" : ""}>최고관리자</option>
        </select>
      </td>
    </tr>
  `).join("");
}

function searchUsers() {
  const keyword = document.getElementById("userKeyword").value.trim().toLowerCase();
  const role = document.getElementById("roleFilter").value;

  let result = [...userData];

  if (keyword) {
    result = result.filter(user =>
      user.id.toLowerCase().includes(keyword) ||
      user.name.toLowerCase().includes(keyword)
    );
  }

  if (role !== "전체") {
    result = result.filter(user => user.role === role);
  }

  renderUsers(result);
  showToast("임시 사용자 데이터가 조회되었습니다.");
}

function changeRole(userId, newRole) {
  const target = userData.find(user => user.id === userId);

  if (!target) return;

  target.role = newRole;

  logData.unshift({
    date: new Date().toISOString().slice(0, 19).replace("T", " "),
    admin: "current_admin@data.com",
    action: "권한변경",
    content: `${userId} 사용자의 권한을 ${newRole}(으)로 변경함.`
  });

  renderLogs();
  showToast("권한 변경이 임시 저장되었습니다.");
}


// ==============================
// 언론사별 반응도
// ==============================

function renderReaction() {
  const tbody = document.getElementById("reactionTable");

  if (!tbody) return;

  tbody.innerHTML = reactionData
    .sort((a, b) => b.views - a.views)
    .map(item => `
      <tr>
        <td>${item.press}</td>
        <td>${item.views.toLocaleString()}</td>
        <td>${item.likes.toLocaleString()}</td>
      </tr>
    `).join("");
}


// ==============================
// 관리자 로그
// ==============================

function renderLogs(data = logData) {
  const tbody = document.getElementById("logTable");

  if (!tbody) return;

  tbody.innerHTML = data.map(log => `
    <tr>
      <td>${log.date}</td>
      <td>${log.admin}</td>
      <td>${log.action}</td>
      <td class="log-content">${log.content}</td>
    </tr>
  `).join("");
}

function searchLogs() {
  const adminId = document.getElementById("adminId").value.trim().toLowerCase();
  const actionName = document.getElementById("actionName").value.trim().toLowerCase();

  let result = [...logData];

  if (adminId) {
    result = result.filter(log => log.admin.toLowerCase().includes(adminId));
  }

  if (actionName) {
    result = result.filter(log => log.action.toLowerCase().includes(actionName));
  }

  renderLogs(result);
  showToast("임시 관리자 로그가 조회되었습니다.");
}


// ==============================
// 날짜 초기화
// ==============================

function setToday() {
  const today = new Date().toISOString().slice(0, 10);

  const reactionStart = document.getElementById("reactionStart");
  const reactionEnd = document.getElementById("reactionEnd");
  const logDate = document.getElementById("logDate");

  if (reactionStart) reactionStart.value = today;
  if (reactionEnd) reactionEnd.value = today;
  if (logDate) logDate.value = today;
}


// ==============================
// 전역 등록
// ==============================

window.adminUsersLogout = adminUsersLogout;
window.searchUsers = searchUsers;
window.changeRole = changeRole;
window.searchLogs = searchLogs;


// ==============================
// 최초 실행
// ==============================

document.addEventListener("DOMContentLoaded", function () {
  setToday();
  renderUsers();
  renderReaction();
  renderLogs();
});
</script>
</body>
</html>
