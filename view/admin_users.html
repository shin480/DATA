<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
/* ===== admin_users.css ===== */
/* ==============================
   Reset
============================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #020817;
  color: #f8fafc;
}

button,
input,
select {
  font-family: inherit;
}

.search-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: 0.2s ease;
}

.search-btn:hover {
  background: rgba(0,0,0,0.05);
}

.search-icon {
  width: 16px;
  height: 16px;

  fill: none;
  stroke: #06101f;

  stroke-width: 2.3;
  stroke-linecap: round;
  stroke-linejoin: round;

  display: block;
}


/* ==============================
   Layout
============================== */

.admin-users-layout {
  display: flex;
  min-height: 100vh;
  background: #020817;
}


/* ==============================
   Sidebar
============================== */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 270px;
  background:
    radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 34%),
    linear-gradient(180deg, #0b1020 0%, #020817 100%);
  border-right: 1px solid rgba(148, 163, 184, 0.16);
  padding-top: 28px;
  z-index: 100;
  box-shadow: 18px 0 45px rgba(0, 0, 0, 0.22);
}

.logo-wrap {
  margin: 0 24px 32px;
  padding: 0;
  height: auto;

  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.logo-wrap:hover {
  transform: none;
  border: none;
  box-shadow: none;
}

.admin-side-logo {
  display: block;
  width: 170px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

.logo-small {
  color: #7dd3fc;
  font-size: 12px;
  margin-bottom: 0;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.side-title-wrap {
  padding: 0 24px 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
}

.side-title {
  color: #64748b;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.side-menu {
  list-style: none;
  padding: 0;
  margin: 0;
}

.side-menu li {
  height: 50px;
  display: flex;
  align-items: center;
  padding-left: 28px;
  color: #94a3b8;
  font-size: 15px;
  border-left: 4px solid transparent;
  cursor: pointer;
  transition: 0.2s ease;
}

.side-menu li:hover {
  background: rgba(56, 189, 248, 0.08);
  color: #e0f2fe;
}

.side-menu li.active {
  background: linear-gradient(
    90deg,
    rgba(56, 189, 248, 0.18),
    rgba(139, 92, 246, 0.12)
  );
  color: #7dd3fc;
  border-left-color: #38bdf8;
  font-weight: 800;
}


/* ==============================
   Main
============================== */

.admin-users-main {
  width: calc(100% - 270px);
  margin-left: 270px;
  min-height: 100vh;
  background:
    radial-gradient(circle at top right, rgba(139, 92, 246, 0.1), transparent 32%),
    radial-gradient(circle at top left, rgba(56, 189, 248, 0.08), transparent 28%),
    #020817;
}

.admin-users-header {
  height: 74px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  padding: 0 30px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
  background: rgba(2, 8, 23, 0.86);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 50;
}

.main-btn,
.logout-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(148, 163, 184, 0.35);
  padding: 9px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

.main-btn:hover,
.logout-btn:hover {
  border-color: #38bdf8;
  color: #38bdf8;
}

.admin-users-content {
  max-width: 1060px;
  margin: 0 auto;
  padding: 28px 24px 80px;
}


/* ==============================
   Card
============================== */

.admin-card,
.chart-card,
.reaction-card {
  background:
    linear-gradient(180deg, rgba(17, 28, 49, 0.96), rgba(13, 23, 41, 0.96));
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
}

.card-title {
  font-size: 22px;
  font-weight: 900;
  color: #e0f2fe;
  margin-bottom: 20px;
  letter-spacing: -0.03em;
}

.sub-title {
  font-size: 22px;
  font-weight: 900;
  color: #e0f2fe;
  margin-bottom: 20px;
  letter-spacing: -0.03em;
}

.usage-card {
  margin-top: 18px;
}


/* ==============================
   Filter
============================== */

.reaction-card {
  width: 100%;
  max-width: none;
  margin-left: 0;
  padding: 18px;
}

.reaction-card table {
  width: 100%;
  min-width: unset !important;   /* 기존 min-width:760px 제거 */
  table-layout: fixed;           /* 칸 너비 균등 고정 */
}

.reaction-card th,
.reaction-card td {
  padding: 8px 4px;              /* 셀 내부 여백 축소 */
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 각 열 비율 직접 축소 */
.reaction-card th:nth-child(1),
.reaction-card td:nth-child(1) {
  width: 38%;
}

.reaction-card th:nth-child(2),
.reaction-card td:nth-child(2) {
  width: 31%;
}

.reaction-card th:nth-child(3),
.reaction-card td:nth-child(3) {
  width: 31%;
}

#pressreaction {
  display: grid;
  grid-template-columns: auto 20px auto;
  row-gap: 20px;
  width: 100%;
}

/* 제목은 첫 줄 전체 */
#pressreaction .reaction-title {
  grid-column: 1 / -1;
  margin-bottom: 0;
  white-space: normal;
}

/* 날짜줄은 둘째 줄 가로 배치 */
#pressreaction input#reactionStart,
#pressreaction span,
#pressreaction input#reactionEnd {
  display: inline-flex;
  align-items: center;
}

#pressreaction span {
  grid-row: 2;
  grid-column: 2;
  justify-self: center;
}

#pressreaction input#reactionStart,
#pressreaction input#reactionEnd {
  width: 145px;
  min-width: 145px;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  font-size: 14px;
}

#pressreaction {
  justify-content: flex-start;
  column-gap: 8px;
}

/* 날짜줄 3칸 구조 */
#pressreaction {
  grid-template-columns: auto 20px auto;
}

.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.filter-row label {
  display: flex;
  align-items: center;
  height: 36px;
  margin-bottom: 0;
}

.filter-row label {
  font-size: 14px;
  font-weight: 800;
  color: #f8fafc;
  margin-right: 8px;
}

input,
select {
  height: 36px;
  background: #050b1b;
  color: #dbeafe;
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 999px;
  padding: 0 38px 0 14px;
  outline: none;
  display: flex;
  align-items: center;
  font-size: 14px;
}

select {
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;

  background-image:
    linear-gradient(45deg, transparent 50%, #94a3b8 50%),
    linear-gradient(135deg, #94a3b8 50%, transparent 50%);

  background-position:
    calc(100% - 18px) 15px,
    calc(100% - 12px) 15px;

  background-size: 6px 6px;
  background-repeat: no-repeat;
}

#actionName {
  min-width: 170px;
  padding-right: 32px;
  appearance: none;
  -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, #94a3b8 50%),
    linear-gradient(135deg, #94a3b8 50%, transparent 50%);
  background-position:
    calc(100% - 18px) 13px,
    calc(100% - 12px) 13px;
  background-size: 6px 6px;
  background-repeat: no-repeat;
}

input::placeholder {
  color: #697996;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
  cursor: pointer;
}

#logDate {
  width: 150px;
  min-width: 150px;
}

.search-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #38bdf8, #2563eb);
  color: #06101f;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(56, 189, 248, 0.16);
}

.search-btn:hover {
  background: linear-gradient(135deg, #7dd3fc, #3b82f6);
}

.dashboard-title {
  font-size: 22px;
  font-weight: 900;
  color: #e0f2fe;
  margin-bottom: 20px;
  letter-spacing: -0.03em;
}

.filter {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #38bdf8, #2563eb);
  color: #06101f;
  font-weight: 900;
  padding: 12px 24px;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(56, 189, 248, 0.18);
}

.action-btn:hover {
  background: linear-gradient(135deg, #7dd3fc, #3b82f6);
}


/* ==============================
   Table
============================== */



.table-box {
  max-height: 245px;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: #334155 #0b1426;
}

.table-box.large {
  max-height: 310px;
}

.table-box::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.table-box::-webkit-scrollbar-track {
  background: #0b1426;
  border-radius: 999px;
}

.table-box::-webkit-scrollbar-thumb {
  background: #334155;
  border-radius: 999px;
  border: 2px solid #0b1426;
}

.table-box::-webkit-scrollbar-thumb:hover {
  background: #38bdf8;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}

th,
td {
  padding: 11px 10px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.35);
  border-right: 1px solid rgba(148, 163, 184, 0.3);
  color: #dbeafe;
  font-size: 13px;
  text-align: center;
  white-space: nowrap;
}

th:last-child,
td:last-child {
  border-right: none;
}

th {
  color: #f8fafc;
  font-size: 14px;
  font-weight: 900;
}

td select {
  width: 90px;
  height: 28px;
  border-radius: 6px;
  background-color: #1f2b3d;
  padding: 0 24px 0 12px;

  appearance: none;
  -webkit-appearance: none;

  background-image:
    linear-gradient(45deg, transparent 50%, #94a3b8 50%),
    linear-gradient(135deg, #94a3b8 50%, transparent 50%);

  background-position:
    calc(100% - 14px) 11px,
    calc(100% - 9px) 11px;

  background-size: 5px 5px;
  background-repeat: no-repeat;
}


/* ==============================
   Stats
============================== */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 28px;
}

.stat-box {
  background:
    radial-gradient(circle at top right, rgba(56, 189, 248, 0.13), transparent 36%),
    #0b1426;
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 18px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.stat-box .label {
  font-size: 15px;
  font-weight: 800;
}

.stat-box .value {
  font-size: 28px;
  font-weight: 900;
  color: #99a6bb;
}

.cyan {
  color: #20d6d2;
}

.purple {
  color: #a78bfa;
}

.blue {
  color: #93c5fd;
}

.orange {
  color: #fb923c;
}


/* ==============================
   Graph / Reaction
============================== */

.grid-section {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 18px;
  width: 100%;
}

.chart-stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
}

.chart-card {
  width: 100%;
}

.chart-card,
.reaction-card {
  padding: 18px;
}

.graph-box {
  height: 250px;
  background:#0b1426;
  color: #e0f2fe;
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 400;
  position: relative;
  overflow: hidden;
} 

.graph-box svg {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  opacity: 1;
}

.reaction-title {
  margin-right: auto;
  margin-bottom: 0;
}


/* ==============================
   Admin Log
============================== */

.log-card {
  margin-top: 18px;
}


/* ==============================
   Toast
============================== */

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: #0f172a;
  border: 1px solid rgba(56, 189, 248, 0.6);
  color: #e0f2fe;
  padding: 14px 18px;
  border-radius: 12px;
  display: none;
  z-index: 2000;
}


/* ==============================
   Responsive
============================== */

@media (max-width: 1100px) {
  .sidebar {
    position: relative;
    width: 100%;
    height: auto;
  }

  .admin-users-main {
    width: 100%;
    margin-left: 0;
  }

  .admin-users-layout {
    flex-direction: column;
  }

  .grid-section {
    flex-direction: column;
  }

  .chart-stack {
    min-width: 0;
  }

  .reaction-card {
    width: 100%;
    max-width: none;
  }

  .reaction-card .table-box.large {
    max-height: 340px;
    overflow-y: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 720px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }

  .admin-users-content {
    padding: 20px 14px 80px;
  }
}
</style>
</head>
<body>
<div class="admin-users-layout">
<!-- 관리자 사이드바 -->
<aside class="sidebar">
<div class="logo-wrap" onclick="location.href='/view/admin_dashboard.html'">
  <img class="admin-side-logo" src="/view/img/header_logo.svg?v=2" alt="DATA 다타 로고">
</div>
<div class="side-title-wrap">

<ul class="side-menu">

        수집 정보
      </li>

      </li>
<li onclick="location.href='/view/sentiment_dashboard_dark.html'">
        모델 보정
      </li>
</ul>
</aside>
<!-- 오른쪽 관리자 본문 -->
<main class="admin-users-main">
<header class="admin-users-header">

        메인으로
      </button>

        로그아웃
      </button>
</header>
<section class="admin-users-content">
<!-- 사용자 검색 -->
<article class="admin-card">
<h2 class="dashboard-title">사용자 검색</h2>
<div class="filter">
  <input id="userKeyword" placeholder="아이디" type="text"/>
  <select id="roleFilter">
    <option value="전체">전체</option>
    <option value="일반">일반</option>

  </select>
  <button class="search-btn" onclick="searchUsers()" type="button" aria-label="검색">
  <svg viewBox="0 0 24 24" class="search-icon">

    <path d="M15.5 15.5L20 20"></path>
  </svg>
</button>
</div>
<div class="table-box">
<table>
<thead>
<tr>
<th>사용자ID</th>
<th>이름</th>

</thead>
<tbody id="userTable"></tbody>
</table>
</div>
</article>
<!-- 서비스 이용 현황 통계 -->
<article class="admin-card usage-card">

<div class="stats-grid">
<div class="stat-box">
<div class="label cyan">사용자 평균 체류시간</div>
<div class="value" id="avgStay"></div>
</div>
<div class="stat-box">
<div class="label purple">일일 접속자 수</div>
<div class="value" id="dailyUser"></div>
</div>
<div class="stat-box">
<div class="label blue">일일 누적 체류 시간</div>

<article class="chart-card">

</div>
<article class="reaction-card">

<div class="filter">
  <input id="adminId" placeholder="관리자 아이디" type="text"/>
  <select id="actionName">
    <option value="">전체 작업</option>
    <option value="ADMIN_LOGIN">관리자 로그인</option>

  </select>
  <input id="logDate" type="date"/>
  <button class="search-btn" onclick="searchUsers()" type="button" aria-label="검색">
  <svg viewBox="0 0 24 24" class="search-icon">

<script>
/* ===== admin_users.js ===== */
// ==============================
// 관리자 접근 체크
// ==============================
const currentUserRole = (
  sessionStorage.getItem("user_role") ||
  localStorage.getItem("user_role") ||

// ==============================
// SVG 그래프 생성
// ==============================
function drawLineGraph(svgId, rows, color) {
  const svg = document.getElementById(svgId);

  if (!svg) return;

  const width = 600;
  const height = 180;

  // 여백 (축 라벨 공간 확보)
  const paddingLeft = 38;
  const paddingRight = 28;
  const paddingTop = 24;
  const paddingBottom = 32;

  svg.innerHTML = "";

  if (!rows.length) {
    svg.innerHTML = `
      <text x="30" y="90" fill="#94a3b8">
        데이터 없음
      </text>
    `;
    return;
  }

  const values = rows.map(row => Number(row.count || 0));
  const maxValue = Math.max(...values, 1);

  // 보기 좋은 Y축 최대값
  const roundedMax =
    maxValue <= 5
      ? 5
      : Math.ceil(maxValue / 5) * 5;

  const graphWidth = width - paddingLeft - paddingRight;
  const graphHeight = height - paddingTop - paddingBottom;

  let svgContent = "";

  // ==============================
  // Y축 / 가이드라인 (5단계)
  // ==============================
  for (let i = 0; i <= 5; i++) {
    const value = Math.round((roundedMax / 5) * (5 - i));

    const y =
      paddingTop +
      (graphHeight / 5) * i;

    // 가이드 라인
    svgContent += `
      <line
        x1="${paddingLeft}"
        y1="${y}"
        x2="${width - paddingRight}"
        y2="${y}"
        stroke="rgba(148,163,184,0.18)"
        stroke-width="1"
      />
    `;

    // Y축 숫자
    svgContent += `
      <text
        x="${paddingLeft - 8}"
        y="${y + 4}"
        fill="#94a3b8"
        font-size="9.5"
        font-weight="400"
        text-anchor="end"
      >
        ${value}
      </text>
    `;
  }

  // ==============================
  // X축 / 날짜
  // ==============================
  rows.forEach((row, index) => {
    const x =
      rows.length === 1
        ? paddingLeft + graphWidth / 2
        : paddingLeft + (index * graphWidth) / (rows.length - 1);

    // 날짜를 MM-DD 형식으로 축약
    const shortDate =
      row.date?.slice(5) || "";

    svgContent += `
      <text
        x="${x}"
        y="${height - 14}"
        fill="#94a3b8"
        font-size="9.5"
        font-weight="400"
        letter-spacing="-0.6px"
        text-anchor="middle"
      >
        ${shortDate}
      </text>
    `;
  });

  // ==============================
  // 축 라인
  // ==============================
  svgContent += `
    <line
      x1="${paddingLeft}"
      y1="${paddingTop}"
      x2="${paddingLeft}"
      y2="${height - paddingBottom}"
      stroke="rgba(148,163,184,0.45)"
      stroke-width="1.8"
    />
  `;

  svgContent += `
    <line
      x1="${paddingLeft}"
      y1="${height - paddingBottom}"
      x2="${width - paddingRight}"
      y2="${height - paddingBottom}"
      stroke="rgba(148,163,184,0.45)"
      stroke-width="1.8"
    />
  `;

  // ==============================
  // 그래프 포인트 계산
  // ==============================
  const points = rows.map((row, index) => {
    const x =
      rows.length === 1
        ? paddingLeft + graphWidth / 2
        : paddingLeft + (index * graphWidth) / (rows.length - 1);

    const y =
      height -
      paddingBottom -
      (Number(row.count || 0) / roundedMax) *
        graphHeight;

    return { x, y, count: row.count };
  });

  // ==============================
  // 선
  // ==============================
  const linePoints = points.map(p => `${p.x},${p.y}`).join(" ");

  const areaPoints = `
    ${linePoints}
    ${points[points.length - 1].x},${height - paddingBottom}
    ${points[0].x},${height - paddingBottom}
  `;

  svgContent += `
    <polygon
      points="${areaPoints}"
      fill="${color}"
      opacity="0.16"
    />
  `;

  svgContent += `
    <polyline
      fill="none"
      points="${linePoints}"
      stroke="${color}"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.75"
    />
  `;

  // ==============================
  // 점 + 실제 수치
  // ==============================
  points.forEach(point => {

  // 점
  svgContent += `
    <circle
      cx="${point.x}"
      cy="${point.y}"
      r="3"
      fill="${color}"
      opacity="0.95"
    />
  `;

  // 말풍선 배경
  svgContent += `
    <rect
      x="${point.x - 18}"
      y="${Math.max(point.y - 31, 6)}"
      width="36"
      height="22"
      rx="5"
      fill="#4b5563"
      opacity="0"
      class="tooltip-bg"
    />
  `;

  // 숫자
  svgContent += `
    <text
      x="${point.x}"
      y="${Math.max(point.y - 16, 21)}"
      fill="#ffffff"
      font-size="10"
      font-weight="400"
      text-anchor="middle"
      opacity="0"
      class="tooltip-text"
    >
      ${point.count}명
    </text>
  `;  

  // hover 영역
  svgContent += `
    <circle
      cx="${point.x}"
      cy="${point.y}"
      r="10"
      fill="transparent"
      class="hover-point"
      onmousemove="
        const svg = this.ownerSVGElement;
        svg.querySelectorAll('.tooltip-bg')[${points.indexOf(point)}].setAttribute('opacity','1');
        svg.querySelectorAll('.tooltip-text')[${points.indexOf(point)}].setAttribute('opacity','1');
      "
      onmouseleave="
        const svg = this.ownerSVGElement;
        svg.querySelectorAll('.tooltip-bg')[${points.indexOf(point)}].setAttribute('opacity','0');
        svg.querySelectorAll('.tooltip-text')[${points.indexOf(point)}].setAttribute('opacity','0');
      "
    />
  `;
});

  svg.innerHTML = svgContent;
}

function renderUsers(data = []) {
  const tbody = document.getElementById("userTable");

  if (!tbody) return;

  tbody.innerHTML = data.map(user => `
    <tr>
      <td>${user.id}</td>
      <td>${user.name}</td>
      <td>${user.join}</td>
      <td>${user.role}</td>
      <td>${user.like} / ${user.dislike}</td>
      <td>${user.login}</td>
      <td>
        ${
          currentUserRole === "superadmin"
            ? `
              <select onchange="changeRole('${user.id}', this.value)">
                <option value="일반" ${user.role === "일반" ? "selected" : ""}>일반</option>
                <option value="관리자" ${user.role === "관리자" ? "selected" : ""}>관리자</option>
                <option value="최고관리자" ${user.role === "최고관리자" ? "selected" : ""}>최고관리자</option>
              </select>
            `
            : `-`
        }
      </td>
    </tr>
  `).join("");
}

async function searchUsers() {
  const keyword = document.getElementById("userKeyword").value.trim();
  const role = document.getElementById("roleFilter").value;

  try {
    const { data } = await axios.get("/search-users", {
      params: {
        user_id: keyword || "",
        role: role === "전체" ? "" : role
      },
      withCredentials: true
    });

    if (!data.success) {
      showToast("사용자 조회에 실패했습니다.");
      return;
    }

    console.log(data);
    console.log(currentUserRole);


    userData = (data.users || []).map(user => ({
      id: user.user_id,
      name: user.user_name || "-",
      join: user.created_at || "-",
      role:
        user.role === "SUPERADMIN" || user.role === "최고관리자"
          ? "최고관리자"
          : user.role === "ADMIN" || user.role === "관리자"
          ? "관리자"
          : "일반",
      like: Number(user.like_count || 0),
      dislike: Number(user.dislike_count || 0),
      login: user.last_login || "-"
    }));

    renderUsers(userData);

    showToast(`사용자 ${userData.length}명 조회 완료`);

  } catch (error) {
    console.error("사용자 검색 실패:", error);
    showToast("서버 통신 중 오류가 발생했습니다.");
  }
}

async function changeRole(userId, newRole) {
  const target = userData.find(user => user.id === userId);
  console.log(newRole);
  if (!target) return;

  try {
    const roleMap = {
      "일반": "general",
      "관리자": "admin",
      "최고관리자": "superadmin"
    };

    const serverRole = roleMap[newRole];
    const { data } = await axios.post(
      "/change_role",
      {
        user_id: userId,
        role: serverRole
      },
      {
        withCredentials: true
      }
    );

    if (!data.success) {
      showToast(data.message || "권한 변경에 실패했습니다.");
      await searchUsers();
      return;
    }

    target.role = newRole;


    renderLogs();
    renderUsers(userData);

    showToast("권한이 변경되었습니다.");

  } catch (error) {
    console.error("권한 변경 실패:", error);
    showToast("서버 통신 중 오류가 발생했습니다.");
    await searchUsers();
  }
}

async function loadPressReaction() {
  const startDate =
    document.getElementById("reactionStart")?.value || "";

  const endDate =
    document.getElementById("reactionEnd")?.value || "";

  try {
    const { data } = await axios.get(
      "/press_reaction",
      {
        params: {
          start_date: startDate,
          end_date: endDate
        },
        withCredentials: true
      }
    );

    if (!data.success) {
      showToast("언론사 반응도 조회 실패");
      return;
    }

    reactionData = (data.data || []).map(item => ({
      press: item.press || "-",
      views: Number(item.views || 0),
      likes: Number(item.likes || 0)
    }));

    renderReaction();

  } catch (error) {
    console.error("언론사 반응도 로딩 실패:", error);
    showToast("서버 통신 중 오류가 발생했습니다.");
  }
}

// ==============================
// 테이블 렌더링
// ==============================

function renderReaction() {
  const tbody = document.getElementById("reactionTable");

  if (!tbody) return;

  tbody.innerHTML = reactionData
    .sort((a, b) => b.views - a.views)
    .map(item => `
      <tr>
        <td>${item.press}</td>
        <td>${item.views.toLocaleString()}</td>
        <td>${item.likes.toLocaleString()}</td>
      </tr>
    `).join("");
}

// ==============================
// 날짜 변경 감지
// 마지막 날짜 기준 자동 반영
// ==============================
function bindReactionDateEvents() {
  const startDateInput = document.getElementById("reactionStart");
  const endDateInput = document.getElementById("reactionEnd");

  if (startDateInput) {
    startDateInput.addEventListener("change", function () {
      loadPressReaction();
      loadTrendGraphs();
    });
  }

  if (endDateInput) {
    endDateInput.addEventListener("change", function () {
      loadPressReaction();
      loadTrendGraphs();
    });
  }
}

  const logDate =

  if (reactionStart) reactionStart.value = "";
  if (reactionEnd) reactionEnd.value = today;
