<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>뉴스 상세보기 | DATA 다타</title>
<link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

<style>
/* 컬러 유틸리티 */
.c-teal { color: #2dd4bf; border-color: #2dd4bf; } .bg-teal { background: #2dd4bf; }
.c-purple { color: #a855f7; border-color: #a855f7; } .bg-purple { background: #a855f7; }
.c-blue { color: #3b82f6; border-color: #3b82f6; } .bg-blue { background: #3b82f6; }
.c-orange { color: #fb923c; border-color: #fb923c; } .bg-orange { background: #fb923c; }
.c-yellow { color: #facc15; border-color: #facc15; } .bg-yellow { background: #facc15; }

/* ==============================
   Common
============================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  overflow-x: hidden;
}

.hidden {
  display: none !important;
}

body {
  background: #050816;
  color: #e5e7eb;
  font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
}

.page {
  width: 1440px;
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 72px;
  background: #050816;

  display: flex;
  flex-direction: column;
}

/* ==============================
   Header
============================== */

.header {
  position: fixed;
  top: 0;
  left: 0;
  transform: none;
  z-index: 10000;

  width: 100%;
  height: 72px;
  padding: 0 56px;

  display: flex;
  align-items: center;

  background: #070b1a;
  border-bottom: 1px solid #111827;
}

.logo {
  width: 155px;
  height: 52px;
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  overflow: hidden;
}

.header-logo-full {
  height: 52px;
  width: auto;
  display: block;
  object-fit: contain;
}

.nav {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: 22px;
  color: #6b7280;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}

.nav a {
  text-decoration: none;
  color: inherit;
  transition: color 0.2s;
}

.nav a:hover {
  color: #00e5ff;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.main-search-wrap {
  position: relative;
  width: 410px;
  height: 40px;
  border-radius: 999px;
  background: #070b1a;
  border: 1px solid #1f2937;
  display: flex;
  align-items: center;
  padding: 0 14px 0 20px;
}

.search-box {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 15px;
  padding: 0;
}

.search-box::placeholder {
  color: #7c8493;
}

.main-search-wrap:focus-within {
  border-color: #334155;
}

.search-icon-btn {
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: #8b95a7;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}

.search-icon-btn:hover {
  color: #00e5ff;
}

.theme-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #070b1a;
  color: #facc15;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-btn:hover {
  border-color: #334155;
}

.header-btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.header-btn.login {
  border: 1px solid #00cfe8;
  background: #00cfe8;
  color: #020617;
}

.header-btn.login:hover {
  filter: brightness(1.08);
}

.header-btn.join {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
}

.header-btn.join:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}

/* ==============================
   Search Suggest
============================== */

.search-suggest-box {
  position: fixed;
  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #00e5ff;
  font-weight: 900;
}

/* ==============================
   Article Detail Page
============================== */

.article-detail-page {
  padding: 40px 24px 100px;
  background: #050916;
  color: #dce8ff;

  flex: 1;
}

.article-detail-wrap {
  width: 1280px;
  max-width: 100%;
  margin: 0 auto;
}

.back-btn {
  display: inline-block;
  margin-bottom: 26px;
  color: #3b82a0;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.back-btn:hover {
  color: #00e5ff;
}

.article-category {
  margin-bottom: 14px;
  color: #10d9ff;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.6px;
}

.article-detail-title {
  margin: 0 0 20px;
  color: #f8fafc;
  font-size: 44px;
  font-weight: 900;
  line-height: 1.35;
  letter-spacing: -1.2px;
}

.article-meta {
  margin-bottom: 34px;
  color: #7f8ea9;
  font-size: 14px;
}

.article-meta span {
  margin-right: 18px;
}

.article-line {
  height: 1px;
  margin: 34px 0;
  background: #16223b;
}

.content-box {
  background: #0b1223;
  border: 1px solid #16223b;
  border-radius: 18px;
  padding: 28px 32px;
  color: #d8e6ff;
  font-size: 17px;
  line-height: 2;
  white-space: pre-line;
}

.source-wrap {
  margin: 34px 0;
  text-align: center;
}

.source-btn {
  border: 0;
  border-radius: 10px;
  background: #1b2b47;
  color: #dce8ff;
  padding: 14px 28px;
  font-weight: 800;
  cursor: pointer;
}

.source-btn:hover {
  background: #22385d;
}

/* ==============================
   Article Viewpoint Card
============================== */

.article-viewpoint-card {
  margin: 10px auto 34px;
  padding: 26px 30px;
  max-width: 720px;
  background: #0b1223;
  border: 1px solid #16223b;
  border-radius: 22px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
}

.viewpoint-card-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

.viewpoint-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid #2dd4bf;
  color: #2dd4bf;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.viewpoint-icon img {
  width: 26px;
  height: 26px;
  object-fit: contain;
  display: block;
}

.viewpoint-label {
  margin-bottom: 6px;
  color: #2dd4bf;
  font-size: 13px;
  font-weight: 900;
}

.viewpoint-name {
  margin: 0;
  color: #f8fafc;
  font-size: 24px;
  font-weight: 900;
}

.viewpoint-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 18px;
  border-top: 1px solid #16223b;
}

.viewpoint-meta span {
  padding: 6px 12px;
  border-radius: 999px;
  background: #111d35;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 900;
}

.viewpoint-meta strong {
  color: #e5e7eb;
  font-size: 16px;
  font-weight: 900;
}

body.light-mode .article-viewpoint-card {
  background: #ffffff;
  border-color: #dbe7df;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
}

body.light-mode .viewpoint-name {
  color: #0f172a;
}

body.light-mode .viewpoint-meta {
  border-top-color: #e2e8f0;
}

body.light-mode .viewpoint-meta span {
  background: #f1f5f9;
  color: #64748b;
}

body.light-mode .viewpoint-meta strong {
  color: #0f172a;
}

.vote-wrap {
  padding: 18px 0 24px;
  text-align: center;
}

.vote-title {
  margin-bottom: 28px;
  color: #f8fafc;
  font-size: 26px;
  font-weight: 900;
}

.vote-box {
  display: flex;
  justify-content: center;
  gap: 30px;
}

.vote-btn {
  width: 220px;
  height: 95px;
  border: 0;
  border-radius: 50px;
  background: #111d35;
  color: #ffffff;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}

.vote-btn span {
  font-size: 18px;
  font-weight: 700;
}

.vote-btn:hover {
  transform: translateY(-2px);
}

.vote-btn.active {
  background: #19d8ff;
  color: #00131f;
}

.vote-btn.active span {
  color: #00131f;
}

.deep-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 52px 0 22px;
  color: #f8fafc;
  font-size: 26px;
  font-weight: 900;
}

.deep-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.deep-card {
  background: #0b1223;
  border: 1px solid #16223b;
  border-radius: 18px;
  padding: 22px;
  cursor: pointer;
  transition: 0.2s;
}

.deep-card:hover {
  transform: translateY(-3px);
  border-color: #2f6dff;
}

.deep-tag {
  display: inline-block;
  margin-bottom: 12px;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 900;
}

.deep-tag.positive {
  background: #0f3341;
  color: #15d9ff;
}

.deep-tag.negative {
  background: #331318;
  color: #ff6070;
}

.deep-tag.neutral {
  background: #2e2f39;
  color: #c8d0e0;
}

.deep-text {
  color: #dce8ff;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.6;
}

/* ==============================
   Footer
============================== */

/* footer가 .page 안에 있어도 화면 전체 폭으로 빼기 */
#footer {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  flex-shrink: 0;
}

/* 실제 footer */
.footer {
  width: 100%;
  background: #020617;
  color: #fff;
  box-sizing: border-box;
}

/* footer 안쪽 내용 */
.footer-inner {
  width: 100%;
  min-height: 88px;
  padding: 0 70px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  gap: 22px;
}

html,
body {
  overflow-x: hidden;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  background-color: #ffffff;

  -webkit-mask-image: url("/view/img/favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;

  mask-image: url("/view/img/favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;

  flex-shrink: 0;
}

.footer-link {
  border: 0;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
  text-decoration: none;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}

.footer-modal {
  position: fixed;
  inset: 0;
  background: rgba(2, 8, 23, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30000;
}

.footer-modal.hidden {
  display: none !important;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}

/* ==============================
   Light Mode
============================== */

body.light-mode {
  background: #f8fafc;
  color: #0f172a;
}

body.light-mode .page,
body.light-mode .article-detail-page {
  background: #f8fafc;
  color: #0f172a;
}

body.light-mode .header {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
}

body.light-mode .nav {
  color: #64748b;
}

body.light-mode .nav a:hover {
  color: #0284c7;
}

body.light-mode .main-search-wrap {
  background: #ffffff;
  border-color: #cbd5e1;
}

body.light-mode .search-box {
  color: #0f172a;
}

body.light-mode .search-box::placeholder {
  color: #94a3b8;
}

body.light-mode .search-icon-btn {
  color: #64748b;
}

body.light-mode .theme-btn {
  background: #ffffff;
  border-color: #cbd5e1;
  color: #334155;
}

body.light-mode .header-btn.join {
  background: #ffffff;
  border-color: #94a3b8;
  color: #334155;
}

body.light-mode .header-btn.login {
  background: #00cfe8;
  border-color: #00cfe8;
  color: #020617;
}

body.light-mode .back-btn {
  color: #64748b;
}

body.light-mode .back-btn:hover,
body.light-mode .article-category {
  color: #0284c7;
}

body.light-mode .article-detail-title,
body.light-mode .vote-title,
body.light-mode .deep-title {
  color: #0f172a;
}

body.light-mode .article-meta {
  color: #64748b;
}

body.light-mode .article-line {
  background: #e2e8f0;
}

body.light-mode .content-box,
body.light-mode .deep-card {
  background: #ffffff;
  border-color: #e2e8f0;
  color: #334155;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
}

body.light-mode .source-btn {
  background: #ecfeff;
  color: #0891b2;
  border: 1px solid #67e8f9;
}

body.light-mode .source-btn:hover {
  background: #cffafe;
}

body.light-mode .vote-btn {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  color: #0f172a;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
}

body.light-mode .vote-btn span {
  color: #64748b;
}

body.light-mode .vote-btn.active {
  background: #22d3ee;
  color: #020817;
}

body.light-mode .vote-btn.active span {
  color: #020817;
}

body.light-mode .deep-card:hover {
  border-color: #0284c7;
}

body.light-mode .deep-text {
  color: #0f172a;
}

body.light-mode .deep-tag.positive {
  background: #ccfbf1;
  color: #0f766e;
}

body.light-mode .deep-tag.negative {
  background: #ffe4e6;
  color: #e11d48;
}

body.light-mode .deep-tag.neutral {
  background: #f1f5f9;
  color: #475569;
}

body.light-mode .search-suggest-box {
  background: #ffffff;
  border-color: #cbd5e1;
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
}

body.light-mode .search-suggest-item {
  color: #334155;
}

body.light-mode .search-suggest-item:hover {
  background: #e0f7ff;
  color: #0284c7;
}

body.light-mode .search-suggest-icon {
  background: #e2e8f0;
  color: #475569;
}

body.light-mode .search-suggest-arrow {
  color: #64748b;
}

body.light-mode .footer {
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
}

body.light-mode .footer-logo-white {
  background-color: #020617;
}

body.light-mode .footer-link {
  color: #475569;
}

body.light-mode .footer-link:hover {
  color: #0284c7;
}

body.light-mode .footer-copy {
  color: #64748b;
}

body.light-mode .footer-modal-box {
  background: #ffffff;
  border-color: #cbd5e1;
}

body.light-mode .footer-modal-content {
  color: #334155;
}

body.light-mode .footer-modal-content h3 {
  color: #0f172a;
}

/* ==============================
   Responsive
============================== */

@media (max-width: 980px) {
  .header {
    padding: 0 20px;
  }

  .main-search-wrap {
    width: 260px;
  }

  .footer-inner {
    padding: 0 24px;
    flex-wrap: wrap;
  }
}

@media (max-width: 900px) {
  .article-detail-page {
    padding: 40px 18px 80px;
  }

  .article-detail-title {
    font-size: 32px;
  }

  .vote-box {
    flex-direction: column;
    align-items: center;
  }

  .vote-btn {
    width: 100%;
    max-width: 320px;
  }

  .deep-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .page {
    width: 100%;
  }

  .search-suggest-box {
    left: 18px !important;
    right: 18px !important;
    width: auto !important;
    max-width: none;
  }

  .footer-inner {
    padding: 0 18px;
  }
}

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<div class="page">

  <div id="header"></div>

  <main class="article-detail-page">
    <div class="article-detail-wrap">

      <a class="back-btn" href="javascript:history.back()">← 이전페이지로</a>

      <div class="article-category">ECONOMIC NEWS</div>

      <h1 class="article-detail-title" id="newsTitle"></h1>

      <div class="article-meta">
        <span id="newsDate"></span>
        <span id="newsPress"></span>
        <span id="newsReporter"></span>
      </div>

      <div class="article-line"></div>

      <article class="content-box" id="newsContent"></article>

      <div class="source-wrap">
        <button class="source-btn" onclick="goSource()" type="button">
          🔗 원문 보기
        </button>
      </div>

      <section class="article-viewpoint-card">
        <div class="viewpoint-card-head">
          <span class="viewpoint-icon" id="articleViewpointIconWrap">
            <img
              id="articleViewpointIcon"
              src="/view/icons/neutral.svg"
              alt="관점 아이콘"
            >
          </span>
          <div>
            <div class="viewpoint-label">분석 관점</div>
            <h3 class="viewpoint-name" id="articleViewpoint">정부 관점</h3>
          </div>
        </div>

        <div class="viewpoint-meta">
          <span>감성</span>
          <strong id="articleSentiment">중립</strong>
        </div>

      </section>

      <div class="article-line"></div>

      <section class="vote-wrap">
        <div class="vote-title">
          이 기사에서 분석된 관점에 동의하시나요?
        </div>

        <div class="vote-box">
          <button class="vote-btn" id="likeBtn" onclick="selectVote('like')" type="button">
            👍 동의해요
            <span id="likeCount">0</span>
          </button>

          <button class="vote-btn" id="hateBtn" onclick="selectVote('hate')" type="button">
            👎 반대해요
            <span id="hateCount">0</span>
          </button>
        </div>
      </section>

      <div class="article-line"></div>

      <section>
        <div class="deep-title">
          💡 깊이 읽기
        </div>

function applyThemeMode() {

  if (savedTheme === "light") {

  } else {
    document.body.classList.remove("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");

function bindGlobalClickEvents() {

// ==============================
// 검색어 자동완성
// ==============================
function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;

        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();

    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);

    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
}

    icon: "/view/icons/neutral.svg",
    color: "#94a3b8",
    bg: "rgba(148, 163, 184, 0.12)"
  };
}

// ==============================
// 원문 보기
// ==============================
function goSource() {
  window.open(newsDetail.sourceUrl, "_blank");
}

// ==============================
// 좋아요 / 싫어요 토글
// ==============================
async function selectVote(type) {
  const articleId = getArticleIdFromUrl();

  const likeBtn = document.getElementById("likeBtn");
  const hateBtn = document.getElementById("hateBtn");

  const likeCountEl = document.getElementById("likeCount");
  const hateCountEl = document.getElementById("hateCount");

  if (!articleId) {
    alert("기사 ID가 없습니다.");
    return;
  }

  if (!likeBtn || !hateBtn || !likeCountEl || !hateCountEl) return;

  try {
    const res = await axios.post("/api/articles/vote", {
      article_id: articleId,
      vote_type: type
    }, {
      withCredentials: true
    });

    if (!res.data.success) {
      alert(res.data.message || "투표 처리에 실패했습니다.");
      return;
    }

    likeCountEl.innerText = Number(res.data.like_count).toLocaleString();
    hateCountEl.innerText = Number(res.data.hate_count).toLocaleString();

    currentVote = res.data.current_vote || "";

    likeBtn.classList.remove("active");
    hateBtn.classList.remove("active");

    if (currentVote === "like") {
      likeBtn.classList.add("active");
    }

    if (currentVote === "hate") {
      hateBtn.classList.add("active");
    }

  } catch (error) {
    console.error("투표 처리 실패:", error);
    alert("투표 처리 중 오류가 발생했습니다.");
    fetchArticleDetail();
  }
}

// ==============================
// 깊이 읽기
// ==============================
function loadDeepNews() {
  const grid = document.getElementById("deepGrid");

  if (!grid) return;

  const list = newsDetail.deepNews || [];

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="deep-card">
        <div class="deep-tag neutral">관련 뉴스</div>
        <div class="deep-text">추천할 관련 뉴스가 없습니다.</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = list.map(item => `
    <div class="deep-card" onclick="location.href='/view/article_detail.html?article_id=${item.article_id}'">
      <div class="deep-tag ${item.type}">
        ${item.tag}
      </div>

      <div class="deep-text">
        ${item.title}
      </div>
    </div>
  `).join("");
}

// ==============================
// 전역 함수 등록
// ==============================
window.goSource = goSource;
window.selectVote = selectVote;

// ==============================
// 최초 실행
// ==============================
document.addEventListener("DOMContentLoaded", function () {
  fetchArticleDetail();
});
</script>
</body>
