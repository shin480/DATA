<script>
/* =========================
   공통 유틸
========================= */

function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}

function isAdminUser() {
  const loginInfo = getLoginInfo();

  return (
    loginInfo.role === "ADMIN" ||
    loginInfo.role === "SUPERADMIN" ||
    loginInfo.role === "admin" ||
    loginInfo.role === "superadmin" ||
    loginInfo.token === "admin-test-token"
  );
}

/* =========================
   검색어 자동완성
========================= */

function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;
        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();
    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);
    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
}

function goLoginRequiredPage(targetUrl) {
  location.href = targetUrl;
}

let hasMoreArticles = true;
let isAutoLoading = false;
let totalArticleCount = 0;

async function fetchArticles() {
  if (isAutoLoading) return;
  if (!hasMoreArticles) return;

  try {
    isAutoLoading = true;

    const urlParams = new URLSearchParams(location.search);

    const sentiment = urlParams.get("sentiment") || "";
    const viewpoint = urlParams.get("viewpoint") || "";
    const keyword = urlParams.get("keyword") || "";

    console.log("ARTICLE_LIST URL:", location.href);
    console.log("ARTICLE_LIST keyword:", keyword);

    const res = await axios.get("/api/articles", {
      params: {
        page: currentPage,
        size: pageSize,
        sentiment: sentiment,
        viewpoint: viewpoint,
        keyword: keyword
      }
    });

    const newArticles = res.data.articles || [];

    articles = articles.concat(newArticles);
    totalArticleCount = res.data.total || articles.length;

    hasMoreArticles = res.data.hasMore === true;
    currentPage += 1;

    appendArticles(newArticles);

    setTimeout(function () {
      isAutoLoading = false;
      checkAutoLoad();
    }, 200);

  } catch (error) {
    isAutoLoading = false;
    console.error("기사 목록 불러오기 실패:", error);
    alert("기사 목록을 불러오지 못했습니다.");
  }
}

function appendArticles(newArticles) {
  const articleList = document.getElementById("articleList");
  const articleCount = document.getElementById("articleCount");

if (!articleList || !articleCount) return;

if (totalArticleCount >= 1000) {
  articleCount.innerText = "1000+건";
} else {
  articleCount.innerText = `(${totalArticleCount}건)`;
}

  const html = newArticles.map(function (item) {
    return `
      <article class="article-card">
        <div>
          <div class="article-source">
            ${item.source || item.press || ""}
          </div>

          <h2 class="article-title">
            ${item.title || ""}
          </h2>

          <p class="article-summary">
            ${item.summary || ""}
          </p>
        </div>

        <button
          class="origin-btn"
          type="button"
          onclick="openArticleDetail('${item.article_id}')"
        >
          원문 보기
        </button>
      </article>
    `;
  }).join("");

  articleList.insertAdjacentHTML("beforeend", html);
}

function checkAutoLoad() {
  if (isAutoLoading) return;
  if (!hasMoreArticles) return;

  const scrollTop = window.scrollY;
  const windowHeight = window.innerHeight;
  const documentHeight = document.documentElement.scrollHeight;

  const scrollPercent = (scrollTop + windowHeight) / documentHeight;

  const hasNoScroll = documentHeight <= windowHeight + 50;

  if (scrollPercent >= 0.9 || hasNoScroll) {
    fetchArticles();
  }
}

function openArticleDetail(articleId) {
  if (!articleId) {
    alert("기사 ID가 없습니다.");
    return;
  }

  location.href = `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;
}

/* =========================
   Header / Footer
========================= */

function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  if (headerArea.innerHTML.trim()) {
    setHeaderLoginState();
    bindCommonSearch();
    applyThemeMode();
    return;
  }

  fetch("/view/header.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("header.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}

function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  if (!loginBtn || !joinBtn || !primaryUserBtn || !logoutBtn) return;

  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    loginBtn.classList.remove("hidden");
    joinBtn.classList.remove("hidden");
    primaryUserBtn.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  loginBtn.classList.add("hidden");
  joinBtn.classList.add("hidden");
  primaryUserBtn.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");

  primaryUserBtn.innerText = isAdminUser() ? "관리자 페이지" : "마이페이지";
}

function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  if (footerArea.innerHTML.trim()) {
    return;
  }

  fetch("/view/footer.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("footer.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}

/* =========================
   Theme
========================= */

function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  } else {
    document.body.classList.remove("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  }
}

/* =========================
   공통 클릭 이벤트
========================= */

document.addEventListener("click", function (e) {
  const primaryUserBtn = e.target.closest("#primaryUserBtn");
  const logoutBtn = e.target.closest("#logoutBtn");
  const themeToggleBtn = e.target.closest("#themeToggleBtn");
  const loginRequiredLink = e.target.closest("[data-login-page]");

  const footerTermsBtn = e.target.closest("#footerTermsBtn");
  const footerPrivacyBtn = e.target.closest("#footerPrivacyBtn");
  const footerModalCloseBtn = e.target.closest("#footerModalCloseBtn");

  if (themeToggleBtn) {
    e.preventDefault();
    toggleThemeMode();
    return;
  }

  if (primaryUserBtn) {
    location.href = isAdminUser()
      ? "/view/admin_dashboard.html"
      : "/view/mypage_home.html";
    return;
  }

  if (logoutBtn) {
    localStorage.removeItem("access_token");
    localStorage.removeItem("user_name");
    localStorage.removeItem("user_role");
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    localStorage.removeItem("userName");

    sessionStorage.removeItem("access_token");
    sessionStorage.removeItem("user_name");
    sessionStorage.removeItem("user_role");
    sessionStorage.removeItem("token");
    sessionStorage.removeItem("role");
    sessionStorage.removeItem("userName");

    axios.post("/logout");
    location.href = "/view/main.html";
    return;
  }

  if (loginRequiredLink) {
    const targetUrl = loginRequiredLink.dataset.loginPage;
    location.href = targetUrl;
    return;
  }

  if (footerTermsBtn) {
    openFooterTermsModal();
    return;
  }

  if (footerPrivacyBtn) {
    openFooterPrivacyModal();
    return;
  }

  if (footerModalCloseBtn) {
    closeFooterModal();
    return;
  }
});

/* =========================
   Init
========================= */

document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();

  window.addEventListener("scroll", checkAutoLoad);
  window.addEventListener("resize", checkAutoLoad);

  fetchArticles();
});
</script>
