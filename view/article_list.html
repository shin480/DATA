<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴스 목록 | DATA 다타</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020617;
      color: #e5e7eb;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    .page {
      width: 1300px;
      min-height: 100vh;
      margin: 0 auto;
      background: #020617;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 86px;
      padding: 0 44px;
      background: #050a1a;
      border-bottom: 1px solid #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 58px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      width: 170px;
      height: 170px;
      object-fit: contain;
      display: block;
    }

    .logo-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-sub {
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    .logo-main {
      color: #00e5ff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 44px;
    }

    .nav a {
      color: #64748b;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: #00e5ff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-wrap {
      width: 270px;
      height: 34px;
      border: 1px solid #1e293b;
      border-radius: 999px;
      background: #050816;
      display: flex;
      align-items: center;
      padding: 0 12px 0 18px;
    }

    .search-wrap input {
      flex: 1;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 12px;
    }

    .search-wrap input::placeholder {
      color: #64748b;
    }

    .search-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .search-btn:hover {
      color: #00e5ff;
    }

    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid #1e293b;
      background: #050816;
      color: #facc15;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .header-btn {
      height: 34px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: transparent;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .header-btn.primary {
      border-color: #00e5ff;
      background: #00e5ff;
      color: #020617;
    }

    .header-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .header-btn.primary:hover {
      color: #020617;
      filter: brightness(1.08);
    }

    /* =========================
       ARTICLE LIST PAGE
    ========================= */

    .article-page {
      min-height: calc(100vh - 86px);
      padding: 56px 0 120px;
      background: #020617;
    }

    .article-wrap {
      width: 900px;
      margin-left: 270px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 26px;
      color: #3b82a0;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-link:hover {
      color: #00e5ff;
    }

    .section-label {
      color: #00e5ff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .article-count {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 22px;
    }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .article-card {
      height: 136px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px 24px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }

    .article-card:hover {
      border-color: #334155;
      background: #131c2f;
    }

    .article-source {
      color: #00e5ff;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .article-title {
      color: #f8fafc;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .article-summary {
      color: #5382a3;
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 680px;
    }

    .origin-btn {
      min-width: 60px;
      height: 32px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
    }

    .origin-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      border-top: 1px solid #111827;
      background: #070b1a;
      padding: 24px 0;
    }

    .footer-inner {
      width: 1440px;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #64748b;
      font-size: 12px;
    }

    .footer-logo-white {
      width: 34px;
      height: 34px;
      background-color: #ffffff;

      -webkit-mask-image: url("/view/img/data_favicon.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/view/img/data_favicon.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      flex-shrink: 0;
    }

    .footer-link {
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
    }

    .footer-link:hover {
      color: #00e5ff;
    }

    .footer-divider {
      width: 1px;
      height: 12px;
      background: #334155;
    }

    .footer-copy {
      margin: 0;
      color: #64748b;
    }

    .hidden {
      display: none !important;
    }

    .footer-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30000;
    }

    .footer-modal-box {
      width: 520px;
      max-width: calc(100% - 32px);
      max-height: 70vh;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
    }

    .footer-modal-content {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }

    .footer-modal-content h3 {
      margin: 0 0 16px;
      color: #f8fafc;
    }

    .footer-modal-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #020617;
      font-weight: 900;
      cursor: pointer;
    }
.search-suggest-item {
  width: 100%;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  cursor: pointer;
  color: #dbeafe;
  transition: 0.2s;
}

.search-suggest-item:hover {
  background: #0f172a;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-suggest-icon {
  color: #38bdf8;
  font-size: 13px;
}

.search-suggest-keyword {
  font-size: 14px;
}

.search-suggest-arrow {
  color: #64748b;
  font-size: 12px;
}

.search-highlight {
  color: #00e5ff;
  font-weight: 700;
}
.main-search-wrap {
  position: relative;
}
.search-suggest-box {
  position: fixed;
  width: 270px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-top: 0;
  border-radius: 0 0 18px 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<div class="page">

  <header class="header">
    <div class="header-left">
      <a class="logo" href="/view/main.html">
        <img class="logo-img" src="/view/img/header_logo.png" alt="DATA 로고" />
        <!-- <div class="logo-text-wrap">
          <div class="logo-sub">뉴스를 이해하는 방식</div>
          <div class="logo-main">DATA 다타</div>
        </div> -->
      </a>

      <nav class="nav">
        <a href="/view/main.html">뉴스흐름</a>
        <a href="/view/keyword_detail.html">키워드</a>
        <a href="/view/article_list.html">뉴스</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="main-search-wrap">

      <div class="search-wrap">

        <input
          id="commonSearchInput"
          type="text"
          autocomplete="off"
          placeholder="예: 금리, 취업, 전세, 반도체"
        />

        <button
          class="search-btn"
          type="button"
          onclick="moveSearch(document.getElementById('commonSearchInput').value)"
          aria-label="검색"
        >

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>

        </button>

      </div>

      <div class="search-suggest-box hidden" id="searchSuggestBox">
        <div class="search-suggest-list" id="searchSuggestList"></div>
      </div>

    </div>

      <button class="theme-btn" type="button">🌙</button>
      <button class="header-btn primary" type="button" onclick="location.href='/view/mypage_home.html'">마이페이지</button>
      <button class="header-btn" type="button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main class="article-page">
    <div class="article-wrap">
      <a class="back-link" href="javascript:history.back()">← 이전페이지로</a>

      <div class="section-label">REFERENCE ARTICLES</div>
      <div class="article-count" id="articleCount">(0건)</div>

      <section class="article-list" id="articleList"></section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo-white" aria-label="DATA 로고"></div>

      <button class="footer-link" type="button" onclick="openFooterTermsModal()">
        이용약관
      </button>

      <div class="footer-divider"></div>

      <button class="footer-link" type="button" onclick="openFooterPrivacyModal()">
        개인정보처리방침
      </button>

      <div class="footer-divider"></div>

      <p class="footer-copy">
        Copyright © 2026 DATA 다타. All Rights Reserved.
      </p>
    </div>

    <div class="footer-modal hidden" id="footerModal">
      <div class="footer-modal-box">
        <div class="footer-modal-content" id="footerModalContent"></div>

        <button class="footer-modal-btn" type="button" onclick="closeFooterModal()">
          확인
        </button>
      </div>
    </div>
  </footer>

</div>

<script>
  function goLoginRequiredPage(targetUrl) {
  const token =
    sessionStorage.getItem("access_token") ||
    localStorage.getItem("access_token") ||
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");

  if (!token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
    return;
  }

  location.href = targetUrl;
}

  // ==============================
// 검색어 자동완성
// ==============================
function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");

  if (!input) return;

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;

        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();

    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);

    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const input = document.getElementById("commonSearchInput");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!input || !suggestBox) return;

  const rect = input.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
}

  let articles = [];

  async function fetchArticles() {
    try {
      const res = await axios.get("/api/articles");

      articles = res.data.articles || [];
      visibleArticleCount = 5;

      renderArticles();

    } catch (error) {
      console.error("기사 목록 불러오기 실패:", error);
      alert("기사 목록을 불러오지 못했습니다.");
    }
  }

let visibleArticleCount = 5;
const articleStep = 5;

function renderArticles() {
  const articleList = document.getElementById("articleList");
  const articleCount = document.getElementById("articleCount");

  articleCount.innerText = `(${articles.length}건)`;

  const visibleArticles = articles.slice(0, visibleArticleCount);

  articleList.innerHTML = visibleArticles.map(function (item) {
    return `
      <article class="article-card">
        <div>
          <div class="article-source">${item.source}</div>
          <h2 class="article-title">${item.title}</h2>
          <p class="article-summary">${item.summary}</p>
        </div>

        <button
          class="origin-btn"
          type="button"
          onclick="openArticleDetail('${item.article_id}')"
        >
          원문 보기
        </button>
      </article>
    `;
  }).join("");
}

function loadMoreArticles() {
  visibleArticleCount += articleStep;
  renderArticles();
}

  function openArticleDetail(articleId) {
    if (!articleId) {
      alert("기사 ID가 없습니다.");
      return;
    }

    location.href = `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;
  }

  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    location.href = "/view/main.html";
  }

  window.openFooterTermsModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>이용약관</h3>
      <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
      <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
      <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
    `;

    modal.classList.remove("hidden");
  };

  window.openFooterPrivacyModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>개인정보처리방침</h3>
      <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
      <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
      <p>개인정보 관련 문의: data260417@gmail.com</p>
    `;

    modal.classList.remove("hidden");
  };

  window.closeFooterModal = function () {
    const modal = document.getElementById("footerModal");

    if (!modal) return;

    modal.classList.add("hidden");
  };

  fetchArticles();
  bindCommonSearch();

  let isAutoLoading = false;

window.addEventListener("scroll", function () {

  if (isAutoLoading) return;

  const scrollTop =
    window.scrollY;

  const windowHeight =
    window.innerHeight;

  const documentHeight =
    document.documentElement.scrollHeight;

  const scrollPercent =
    (scrollTop + windowHeight) / documentHeight;

  // 90% 내려오면 실행
  if (scrollPercent >= 0.9) {

    // 이미 다 불러왔으면 종료
    if (visibleArticleCount >= articles.length) {
      return;
    }

    isAutoLoading = true;

    loadMoreArticles();

    setTimeout(function () {
      isAutoLoading = false;
    }, 200);
  }
});
</script>
</body>
</html>
