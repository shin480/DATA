<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴스 목록 | DATA 다타</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020617;
      color: #e5e7eb;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    .page {
      width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      background: #020617;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 86px;
      padding: 0 44px;
      background: #050a1a;
      border-bottom: 1px solid #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 58px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    .logo-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-sub {
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    .logo-main {
      color: #00e5ff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 44px;
    }

    .nav a {
      color: #64748b;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      transition: color 0.2s ease;
    }

    .nav a:hover {
      color: #00e5ff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-wrap {
      width: 270px;
      height: 34px;
      border: 1px solid #1e293b;
      border-radius: 999px;
      background: #050816;
      display: flex;
      align-items: center;
      padding: 0 12px 0 18px;
    }

    .search-wrap input {
      flex: 1;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 12px;
    }

    .search-wrap input::placeholder {
      color: #64748b;
    }

    .search-btn {
      width: 22px;
      height: 22px;
      border: 0;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .search-btn:hover {
      color: #00e5ff;
    }

    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid #1e293b;
      background: #050816;
      color: #facc15;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .header-btn {
      height: 34px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: transparent;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .header-btn.primary {
      border-color: #00e5ff;
      background: #00e5ff;
      color: #020617;
    }

    .header-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .header-btn.primary:hover {
      color: #020617;
      filter: brightness(1.08);
    }

    /* =========================
       ARTICLE LIST PAGE
    ========================= */

    .article-page {
      min-height: calc(100vh - 86px);
      padding: 56px 0 120px;
      background: #020617;
    }

    .article-wrap {
      width: 900px;
      margin-left: 270px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 26px;
      color: #3b82a0;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-link:hover {
      color: #00e5ff;
    }

    .section-label {
      color: #00e5ff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .article-count {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 22px;
    }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .article-card {
      height: 136px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px 24px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }

    .article-card:hover {
      border-color: #334155;
      background: #131c2f;
    }

    .article-source {
      color: #00e5ff;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .article-title {
      color: #f8fafc;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .article-summary {
      color: #5382a3;
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 680px;
    }

    .origin-btn {
      min-width: 60px;
      height: 32px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
    }

    .origin-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      border-top: 1px solid #111827;
      background: #070b1a;
      padding: 24px 0;
    }

    .footer-inner {
      width: 1440px;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #64748b;
      font-size: 12px;
    }

    .footer-logo-white {
      width: 34px;
      height: 34px;
      background-color: #ffffff;

      -webkit-mask-image: url("/view/img/data_favicon.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/view/img/data_favicon.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      flex-shrink: 0;
    }

    .footer-link {
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
    }

    .footer-link:hover {
      color: #00e5ff;
    }

    .footer-divider {
      width: 1px;
      height: 12px;
      background: #334155;
    }

    .footer-copy {
      margin: 0;
      color: #64748b;
    }

    .hidden {
      display: none !important;
    }

    .footer-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30000;
    }

    .footer-modal-box {
      width: 520px;
      max-width: calc(100% - 32px);
      max-height: 70vh;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
    }

    .footer-modal-content {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }

    .footer-modal-content h3 {
      margin: 0 0 16px;
      color: #f8fafc;
    }

    .footer-modal-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #020617;
      font-weight: 900;
      cursor: pointer;
    }
.more-wrap {
  display: flex;
  justify-content: center;
  margin-top: 28px;
}

.more-btn {
  min-width: 120px;
  height: 42px;
  border: 1px solid #334155;

  color: #cbd5e1;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
}

.more-btn:hover {
  border-color: #00e5ff;
  color: #00e5ff;
  background: #111827;
}

.more-btn.hidden {
  display: none;
}

</head>

        </div>
      </a>

      <nav class="nav">
        <a href="/view/main.html">뉴스흐름</a>
        <a href="/view/keyword_detail.html">키워드</a>

      </nav>
    </div>

    <div class="header-right">
      <div class="search-wrap">
        <input
          id="searchInput"

      <button class="theme-btn" type="button">🌙</button>
      <button class="header-btn primary" type="button" onclick="location.href='/view/mypage_home.html'">마이페이지</button>
      <button class="header-btn" type="button" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <main class="article-page">

</div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo-white" aria-label="DATA 로고"></div>

      <button class="footer-link" type="button" onclick="openFooterTermsModal()">
        이용약관
      </button>

      <div class="footer-divider"></div>

      <button class="footer-link" type="button" onclick="openFooterPrivacyModal()">
        개인정보처리방침
      </button>

      <div class="footer-divider"></div>

      <p class="footer-copy">
        Copyright © 2026 DATA 다타. All Rights Reserved.
      </p>
    </div>

    <div class="footer-modal hidden" id="footerModal">
      <div class="footer-modal-box">
        <div class="footer-modal-content" id="footerModalContent"></div>

        <button class="footer-modal-btn" type="button" onclick="closeFooterModal()">
          확인
        </button>
      </div>
    </div>
  </footer>

</div>

let visibleArticleCount = 5;
const articleStep = 5;

function renderArticles() {
  const articleList = document.getElementById("articleList");
  const articleCount = document.getElementById("articleCount");
  const moreBtn = document.getElementById("moreBtn");

  articleCount.innerText = `(${articles.length}건)`;

  const visibleArticles = articles.slice(0, visibleArticleCount);

  articleList.innerHTML = visibleArticles.map(function (item) {
    return `
      <article class="article-card">
        <div>
          <div class="article-source">${item.source}</div>
          <h2 class="article-title">${item.title}</h2>
          <p class="article-summary">${item.summary}</p>
        </div>

        <button class="origin-btn" type="button" onclick="openOriginal('${item.url}')">
          원문 보기
        </button>
      </article>
    `;
  }).join("");

  if (visibleArticleCount >= articles.length) {
    moreBtn.classList.add("hidden");
  } else {
    moreBtn.classList.remove("hidden");
  }
}

function loadMoreArticles() {
  visibleArticleCount += articleStep;
  renderArticles();
}

  function openOriginal(url) {
    if (!url || url === "#") {
      alert("원문 링크는 서버 연결 후 적용됩니다.");
      return;
    }

    window.open(url, "_blank");
  }

  function moveSearch() {
    const input = document.getElementById("searchInput");
    const keyword = input.value.trim();

    if (!keyword) return;

    location.href = `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`;
  }

  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch();
    }
  });

  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    location.href = "/view/main.html";
  }

  window.openFooterTermsModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `

      <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
