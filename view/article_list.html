<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴스 목록 | DATA 다타</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .hidden {
      display: none !important;
    }

    body {
      background: #020617;
      color: #e5e7eb;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    .page {
      width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      padding-top: 72px;
      background: #020617;
    }

    /* ===== HEADER ===== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      transform: none;
      z-index: 10000;

      width: 100%;
      height: 72px;
      padding: 0 56px;

      display: flex;
      align-items: center;

      background: #070b1a;
      border-bottom: 1px solid #111827;
    }

    .logo {
      width: 155px;
      height: 52px;
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    .header-logo-full {
      height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-left: 22px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .nav a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
    }

    .nav a:hover {
      color: #00e5ff;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-search-wrap {
      position: relative;
      width: 410px;
      height: 40px;
      border-radius: 999px;
      background: #070b1a;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      padding: 0 14px 0 20px;
    }

    .search-box {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 15px;
      padding: 0;
    }

    .search-box::placeholder {
      color: #7c8493;
    }

    .main-search-wrap:focus-within {
      border-color: #334155;
    }

    .search-icon-btn {
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      color: #8b95a7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    .search-icon-btn:hover {
      color: #00e5ff;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      background: #070b1a;
      color: #facc15;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-btn:hover {
      border-color: #334155;
    }

    .header-btn {
      height: 40px;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .header-btn.login {
      border: 1px solid #00cfe8;
      background: #00cfe8;
      color: #020617;
    }

    .header-btn.login:hover {
      filter: brightness(1.08);
    }

    .header-btn.join {
      border: 1px solid #475569;
      background: transparent;
      color: #cbd5e1;
    }

    .header-btn.join:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* ===== SEARCH SUGGEST ===== */
    .search-suggest-box {
      position: fixed;
      width: 410px;
      max-width: 80vw;
      padding: 10px 0 12px;
      border: 1px solid #1e293b;
      border-radius: 18px;
      background: #050b1c;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      z-index: 20000;
      overflow: hidden;
    }

    .search-suggest-list {
      display: flex;
      flex-direction: column;
    }

    .search-suggest-item {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      cursor: pointer;
      color: #dbeafe;
      transition: 0.2s;
    }

    .search-suggest-item:hover {
      background: #0f172a;
    }

    .search-suggest-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-suggest-icon {
      color: #38bdf8;
      font-size: 13px;
    }

    .search-suggest-keyword {
      font-size: 14px;
    }

    .search-suggest-arrow {
      color: #64748b;
      font-size: 12px;
    }

    .search-highlight {
      color: #00e5ff;
      font-weight: 700;
    }

    /* =========================
       ARTICLE LIST PAGE
    ========================= */

    .article-page {
      min-height: calc(100vh - 72px);
      padding: 56px 0 120px;
      background: #020617;
    }

    .article-wrap {
      width: 900px;
      margin-left: 270px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 26px;
      color: #3b82a0;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-link:hover {
      color: #00e5ff;
    }

    .section-label {
      color: #00e5ff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .article-count {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 22px;
    }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .article-card {
      height: 136px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px 24px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }

    .article-card:hover {
      border-color: #334155;
      background: #131c2f;
    }

    .article-source {
      color: #00e5ff;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .article-title {
      color: #f8fafc;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .article-summary {
      color: #5382a3;
      font-size: 12px;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 680px;
    }

    .origin-btn {
      min-width: 60px;
      height: 32px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
    }

    .origin-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* ===== FOOTER ===== */
    .footer {
      border-top: 1px solid #111827;
      background: #070b1a;
      padding: 24px 0;
      margin-top: 60px;
    }

    .footer-inner {
      width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #64748b;
      font-size: 12px;
    }

    .footer-logo-white {
      width: 34px;
      height: 34px;
      background-color: #ffffff;

      -webkit-mask-image: url("/view/img/data_favicon.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/view/img/data_favicon.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      flex-shrink: 0;
    }

    .footer-link {
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
    }

    .footer-link:hover {
      color: #00e5ff;
    }

    .footer-divider {
      width: 1px;
      height: 12px;
      background: #334155;
    }

    .footer-copy {
      color: #64748b;
    }

    /* ==============================
       Footer Modal
    ============================== */

    .footer-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30000;
    }

    .footer-modal-box {
      width: 520px;
      max-width: calc(100% - 32px);
      max-height: 70vh;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
    }

    .footer-modal-content {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }

    .footer-modal-content h3 {
      margin: 0 0 16px;
      color: #f8fafc;
    }

    .footer-modal-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #020617;
      font-weight: 900;
      cursor: pointer;
    }

    /* ==============================
       Light Mode
    ============================== */

    body.light-mode {
      background: #f8fafc;
      color: #0f172a;
    }

    body.light-mode .page,
    body.light-mode .article-page {
      background: #f8fafc;
    }

    body.light-mode .header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .nav {
      color: #64748b;
    }

    body.light-mode .nav a:hover {
      color: #0284c7;
    }

    body.light-mode .main-search-wrap {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    body.light-mode .search-box {
      color: #0f172a;
    }

    body.light-mode .search-box::placeholder {
      color: #94a3b8;
    }

    body.light-mode .search-icon-btn {
      color: #64748b;
    }

    body.light-mode .theme-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.light-mode .header-btn.join {
      background: #ffffff;
      border-color: #94a3b8;
      color: #334155;
    }

    body.light-mode .header-btn.login {
      background: #00cfe8;
      border-color: #00cfe8;
      color: #020617;
    }

    body.light-mode .section-label {
      color: #0284c7;
    }

    body.light-mode .article-count,
    body.light-mode .article-title {
      color: #0f172a;
    }

    body.light-mode .article-card {
      background: #ffffff;
      border-color: #e2e8f0;
    }

    body.light-mode .article-card:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    body.light-mode .article-source {
      color: #0284c7;
    }

    body.light-mode .article-summary,
    body.light-mode .back-link {
      color: #64748b;
    }

    body.light-mode .origin-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.light-mode .origin-btn:hover {
      border-color: #0284c7;
      color: #0284c7;
    }

    body.light-mode .search-suggest-box {
      background: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
    }

    body.light-mode .search-suggest-item {
      color: #334155;
    }

    body.light-mode .search-suggest-item:hover {
      background: #e0f7ff;
      color: #0284c7;
    }

    body.light-mode .footer {
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    body.light-mode .footer-logo-white {
      background-color: #020617;
    }

    body.light-mode .footer-link {
      color: #475569;
    }

    body.light-mode .footer-copy {
      color: #64748b;
    }

    body.light-mode .footer-modal-box {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    body.light-mode .footer-modal-content {
      color: #334155;
    }

    body.light-mode .footer-modal-content h3 {
      color: #0f172a;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<div class="page">

  <div id="header"></div>

  <main class="article-page">
    <div class="article-wrap">
      <a class="back-link" href="javascript:history.back()">← 이전페이지로</a>

      <div class="section-label">REFERENCE ARTICLES</div>
      <div class="article-count" id="articleCount">(0건)</div>

      <section class="article-list" id="articleList"></section>
    </div>
  </main>

  <div id="footer"></div>

</div>

<script>
  /* =========================
     검색어 자동완성
  ========================= */

  function bindCommonSearch() {
    const input = document.getElementById("commonSearchInput");
    const searchBtn = document.getElementById("commonSearchBtn");

    if (!input) return;

    if (searchBtn) {
      searchBtn.addEventListener("click", function () {
        moveSearch(input.value);
      });
    }

    input.addEventListener("input", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("focus", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        moveSearch(input.value);
      }

      if (e.key === "Escape") {
        hideSearchSuggestions();
      }
    });

    document.addEventListener("click", function (e) {
      const searchWrap = document.querySelector(".main-search-wrap");

      if (!searchWrap) return;

      if (!searchWrap.contains(e.target)) {
        hideSearchSuggestions();
      }
    });

    window.addEventListener("resize", positionSearchSuggestBox);
    window.addEventListener("scroll", positionSearchSuggestBox);
  }

  function highlightKeyword(text, keyword) {
    if (!keyword) return text;

    const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(`(${escapedKeyword})`, "gi");

    return text.replace(regex, `<span class="search-highlight">$1</span>`);
  }

  async function renderSearchSuggestions(keyword) {
    const list = document.getElementById("searchSuggestList");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!list || !suggestBox) return;

    const value = keyword.trim();

    if (!value) {
      hideSearchSuggestions();
      return;
    }

    try {
      const res = await axios.get(
        `/api/search/suggest?q=${encodeURIComponent(value)}`
      );

      const results = res.data || [];

      if (results.length === 0) {
        hideSearchSuggestions();
        return;
      }

      list.innerHTML = results.map(function (item) {
        return `
          <button
            class="search-suggest-item"
            type="button"
            data-suggest-keyword="${item}"
          >
            <span class="search-suggest-left">
              <span class="search-suggest-icon">⌕</span>

              <span class="search-suggest-keyword">
                ${highlightKeyword(item, value)}
              </span>
            </span>

            <span class="search-suggest-arrow">↖</span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const keyword = btn.dataset.suggestKeyword;
          selectSearchSuggestion(keyword);
        });
      });

      positionSearchSuggestBox();
      suggestBox.classList.remove("hidden");

    } catch (error) {
      console.error("검색 자동완성 실패:", error);
      hideSearchSuggestions();
    }
  }

  function positionSearchSuggestBox() {
    const searchWrap = document.querySelector(".main-search-wrap");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!searchWrap || !suggestBox) return;

    const rect = searchWrap.getBoundingClientRect();

    suggestBox.style.top = `${rect.bottom + 4}px`;
    suggestBox.style.left = `${rect.left}px`;
    suggestBox.style.width = `${rect.width}px`;
  }

  function hideSearchSuggestions() {
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!suggestBox) return;

    suggestBox.classList.add("hidden");
  }

  function selectSearchSuggestion(keyword) {
    const input = document.getElementById("commonSearchInput");

    if (input) {
      input.value = keyword;
    }

    hideSearchSuggestions();

    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
  }

  function moveSearch(keyword) {
    const value = keyword.trim();

    if (!value) return;

    hideSearchSuggestions();

    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
  }

  function goLoginRequiredPage(targetUrl) {
    location.href = targetUrl;
  }

  /* =========================
     기사 목록
  ========================= */

  let articles = [];
  let visibleArticleCount = 5;
  const articleStep = 5;
  let isAutoLoading = false;

  async function fetchArticles() {
    try {
      const res = await axios.get("/api/articles");

      articles = res.data.articles || [];
      visibleArticleCount = 5;

      renderArticles();

    } catch (error) {
      console.error("기사 목록 불러오기 실패:", error);
      alert("기사 목록을 불러오지 못했습니다.");
    }
  }

  function renderArticles() {
    const articleList = document.getElementById("articleList");
    const articleCount = document.getElementById("articleCount");

    if (!articleList || !articleCount) return;

    articleCount.innerText = `(${articles.length}건)`;

    const visibleArticles = articles.slice(0, visibleArticleCount);

    articleList.innerHTML = visibleArticles.map(function (item) {
      return `
        <article class="article-card">
          <div>
            <div class="article-source">${item.source || item.press || ""}</div>
            <h2 class="article-title">${item.title || ""}</h2>
            <p class="article-summary">${item.summary || ""}</p>
          </div>

          <button
            class="origin-btn"
            type="button"
            onclick="openArticleDetail('${item.article_id}')"
          >
            원문 보기
          </button>
        </article>
      `;
    }).join("");
  }

  function loadMoreArticles() {
    visibleArticleCount += articleStep;
    renderArticles();
  }

  function openArticleDetail(articleId) {
    if (!articleId) {
      alert("기사 ID가 없습니다.");
      return;
    }

    location.href = `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;
  }

  /* =========================
     Header / Footer
  ========================= */

  function loadHeader() {
    const headerArea = document.getElementById("header");

    if (!headerArea) return;

    if (headerArea.innerHTML.trim()) {
      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
      return;
    }

    fetch("/view/header.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("header.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        headerArea.innerHTML = html;

        setHeaderLoginState();
        bindCommonSearch();
        applyThemeMode();
      })
      .catch(function (err) {
        console.error("header 로드 실패:", err);
      });
  }

  function setHeaderLoginState() {
    const loginBtn = document.getElementById("loginBtn");
    const joinBtn = document.getElementById("joinBtn");
    const primaryUserBtn = document.getElementById("primaryUserBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (!primaryUserBtn || !logoutBtn) return;

    if (loginBtn) loginBtn.classList.add("hidden");
    if (joinBtn) joinBtn.classList.add("hidden");

    primaryUserBtn.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    primaryUserBtn.innerText = "마이페이지";
  }

  function loadFooter() {
    const footerArea = document.getElementById("footer");

    if (!footerArea) return;

    if (footerArea.innerHTML.trim()) {
      return;
    }

    fetch("/view/footer.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("footer.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        footerArea.innerHTML = html;
      })
      .catch(function (err) {
        console.error("footer 로드 실패:", err);
      });
  }

  /* =========================
     Theme
  ========================= */

  function applyThemeMode() {
    const savedTheme = localStorage.getItem("theme_mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (savedTheme === "light") {
      document.body.classList.add("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    } else {
      document.body.classList.remove("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    }
  }

  function toggleThemeMode() {
    const isLight = document.body.classList.contains("light-mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (isLight) {
      document.body.classList.remove("light-mode");
      localStorage.setItem("theme_mode", "dark");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    } else {
      document.body.classList.add("light-mode");
      localStorage.setItem("theme_mode", "light");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    }
  }

  /* =========================
     Footer Modal
  ========================= */

  window.openFooterTermsModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>이용약관</h3>
      <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
      <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
      <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
    `;

    modal.classList.remove("hidden");
  };

  window.openFooterPrivacyModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>개인정보처리방침</h3>
      <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
      <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
      <p>개인정보 관련 문의: data260417@gmail.com</p>
    `;

    modal.classList.remove("hidden");
  };

  window.closeFooterModal = function () {
    const modal = document.getElementById("footerModal");

    if (!modal) return;

    modal.classList.add("hidden");
  };

  /* =========================
     공통 클릭 이벤트
  ========================= */

  document.addEventListener("click", function (e) {
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");

    const footerTermsBtn = e.target.closest("#footerTermsBtn");
    const footerPrivacyBtn = e.target.closest("#footerPrivacyBtn");
    const footerModalCloseBtn = e.target.closest("#footerModalCloseBtn");

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (primaryUserBtn) {
      location.href = "/view/mypage_home.html";
      return;
    }

    if (logoutBtn) {
      localStorage.clear();
      sessionStorage.clear();

      location.href = "/view/main.html";
      return;
    }

    if (loginRequiredLink) {
      const targetUrl = loginRequiredLink.dataset.loginPage;
      location.href = targetUrl;
      return;
    }

    if (footerTermsBtn) {
      openFooterTermsModal();
      return;
    }

    if (footerPrivacyBtn) {
      openFooterPrivacyModal();
      return;
    }

    if (footerModalCloseBtn) {
      closeFooterModal();
      return;
    }
  });

  /* =========================
     무한 스크롤
  ========================= */

  window.addEventListener("scroll", function () {
    if (isAutoLoading) return;

    const scrollTop = window.scrollY;
    const windowHeight = window.innerHeight;
    const documentHeight = document.documentElement.scrollHeight;

    const scrollPercent = (scrollTop + windowHeight) / documentHeight;

    if (scrollPercent >= 0.9) {
      if (visibleArticleCount >= articles.length) {
        return;
      }

      isAutoLoading = true;
      loadMoreArticles();

      setTimeout(function () {
        isAutoLoading = false;
      }, 200);
    }
  });

  /* =========================
     Init
  ========================= */

  document.addEventListener("DOMContentLoaded", function () {
    applyThemeMode();
    loadHeader();
    loadFooter();
    fetchArticles();
  });
</script>
</body>
</html>
