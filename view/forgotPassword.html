<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - DATA 다타</title>
    <style>
        /* [확실] 메인 페이지 디자인 시스템 및 컬러 변수 통일 */
        :root {
            --bg-deep: #020617;
            --bg-card: #0F172A;
            --bg-input: #020617;
            --point-cyan: #00E5FF;
            --point-blue: #2563eb;
            --text-main: #e5e7eb;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Pretendard', Arial, sans-serif;
            color: var(--text-main);
        }

        /* [확실] 카드 섹션 - 'section-', 'card-' 네이밍 규칙 적용 */
        .auth-section-card {
            width: 440px;
            padding: 60px 40px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* [확실] 헤더 로고 - 메인 페이지 '.logo', '.logo-mark' 구조 유지 */
        .auth-header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            color: var(--point-cyan);
            text-decoration: none;
            margin-bottom: 32px;
        }

        .auth-title {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 800;
        }
        .auth-desc {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 40px;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* [확실] 입력 그룹 - 'input-group' 네이밍 통일 */
        .auth-input-group {
            text-align: left;
            margin-bottom: 40px;
        }
        .auth-label {
            display: block;
            font-size: 13px;
            color: var(--point-cyan);
            margin-bottom: 10px;
            font-weight: 700;
        }
        .auth-input-field {
            width: 100%;
            height: 52px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .auth-input-field:focus {
            border-color: var(--point-cyan);
            background-color: var(--bg-card);
        }

        /* [확실] 액션 버튼 - 'btn-' 네이밍 규칙 적용 */
        .auth-submit-btn {
            width: 100%;
            height: 56px;
            background-color: var(--point-cyan);
            color: #020617;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 28px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .auth-submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .auth-footer-link {
            display: inline-block;
            font-size: 14px;
            color: var(--point-cyan);
            text-decoration: none;
            font-weight: 700;
        }
        .auth-footer-link:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div class="auth-section-card">
    <div class="auth-header-logo">
        <div>DATA 다타</div>
    </div>
    
    <h2 class="auth-title">비밀번호 찾기</h2>
    <p class="auth-desc">가입하신 이메일 주소로 임시 비밀번호를 전송해 드립니다.</p>

    <form id="authFindPwForm">
        <div class="auth-input-group">
            <label class="auth-label" for="userEmail">이메일 주소</label>
            <input type="email" id="userEmail" class="auth-input-field" placeholder="admin@data.com" required>
        </div>

        <button type="submit" class="auth-submit-btn">임시 비밀번호 받기</button>
    </form>

    <a href="login.html" class="auth-footer-link">로그인화면으로 돌아가기</a>
</div>

<script>
    /* [추정] 이전 코드와 동일한 이벤트 리스너 구조 유지 */
    document.getElementById('authFindPwForm').addEventListener('submit',async function(e) {
        e.preventDefault();
        const emailValue = document.getElementById('userEmail').value;
        const submitBtn = e.target.querySelector('button[type="submit"]'); // 제출 버튼 찾기

        // 연속 클릭 방지용 버튼 비활성화
        if (submitBtn) submitBtn.disabled = true;

        try {
            // 1. 서버로 이메일 전송
            const { data } = await axios.post('/find_password', { email: emailValue });

            // 2. 결과 처리
            if (data.success) {
                // [성공] 임시 비밀번호 발송 또는 인증 메일 발송 완료
                alert(emailValue + ' 주소로 임시 비밀번호가 발송되었습니다.');
                
                // 필요하다면 로그인 페이지로 이동
                // window.location.href = '/login.html'; 
            } else {
                // [실패] 가입되지 않은 이메일이거나 발송 실패
                alert(data.message || '가입된 정보가 없거나 발송에 실패했습니다.');
                
                // 다시 입력할 수 있도록 버튼 활성화
                if (submitBtn) submitBtn.disabled = false;
            }

        } catch (error) {
            // [서버 통신 에러] 500 에러 등 통신 자체가 실패했을 때
            console.error('비밀번호 찾기 오류:', error);
            alert('서버 통신 중 문제가 발생했습니다.');
            
            // 다시 시도할 수 있도록 버튼 활성화
            if (submitBtn) submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
