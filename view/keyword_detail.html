/* ===== keyword_detail.css ===== */
/* ==============================
   Keyword Detail Page
============================== */

.keyword-detail-page {
  max-width: 1060px;
  margin: 0 auto;
  padding: 40px 24px 120px;
  background: #050816;
  color: #f8fafc;

  flex: 1;
}

.keyword-badge {
  display: inline-block;
  padding: 6px 14px;
  border: 1px solid #00d5ff;
  border-radius: 999px;
  color: #00d5ff;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 18px;
}

.keyword-title {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: -1px;
  margin-bottom: 20px;
}

.keyword-desc {
  color: #7891b5;
  font-size: 14px;
  margin-bottom: 36px;
  weight: 990px;
  height: 21px;
}

.back-btn {
  display: inline-block;
  margin-bottom: 26px;
  color: #3b82a0;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.back-btn:hover {
  color: #00e5ff;
}

/* ==============================
   Common Card / Grid
============================== */

.top-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 22px;
  margin-bottom: 22px;
}

.keyword-card {
  background: linear-gradient(180deg, #111c31, #0d1729);
  border: 1px solid rgba(148, 163, 184, 0.1);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 16px 35px rgba(0, 0, 0, 0.25);
}

.section-label {
  color: #22d3ee;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

/* ==============================
   Summary
============================== */

.summary-title {
  font-size: 23px;
  line-height: 1.45;
  font-weight: 900;
  margin-bottom: 24px;
}

.summary-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.stat-box {
  background: #1d293d;
  border-radius: 12px;
  padding: 16px;
}

.stat-label {
  color: #8aa0bf;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}

.stat-value {
  color: #eaf6ff;
  font-size: 17px;
  font-weight: 900;
}

.stat-value.cyan {
  color: #22d3ee;
}

/* ==============================
   Sentiment
============================== */

.sentiment-card {
  min-height: 250px;
}

.sentiment-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  align-items: center;
  gap: 24px;
  min-height: 170px;
}

.sentiment-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-left: 4px;
}

.sentiment-item {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: 900;
  white-space: nowrap;
}

.sentiment-item .dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: inline-block;
}

.sentiment-item.positive {
  color: #34d6cc;
}

.sentiment-item.positive .dot {
  background: #34d6cc;
}

.sentiment-item.neutral {
  color: #94a3b8;
}

.sentiment-item.neutral .dot {
  background: #94a3b8;
}

.sentiment-item.negative {
  color: #ff6578;
}

.sentiment-item.negative .dot {
  background: #ff6578;
}

.donut-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
}

.donut {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: conic-gradient(
    #34d6cc 0 50%,
    #94a3b8 50% 60%,
    #ff6578 60% 100%
  );
  position: relative;
}

.donut::after {
  content: "";
  position: absolute;
  inset: 42px;
  border-radius: 50%;
  background: #0d1729;
}

.sentiment-guide {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(148, 163, 184, 0.12);

  color: #7891b5;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.2px;
  text-align: left;
}

/* ==============================
   Perspective
============================== */

.perspective-card {
  margin-bottom: 22px;
  weight: 990px;
  height:383px;
}

.perspective-title {
  font-size: 24px;
  font-weight: 900;
  margin-bottom: 28px;
}

.perspective-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  width: 100%;
}

.news-card {
  background: #202c40;
  border-radius: 14px;
  padding: 18px;
  min-height: 180px;
  min-width: 0;
}

.news-card.positive {
  border-left: 6px solid #34d6cc;
}

.news-card.neutral {
  border-left: 6px solid #94a3b8;
}

.news-card.negative {
  border-left: 6px solid #ff6578;
}

.news-type {
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 16px;
}

.news-type.positive {
  color: #34d6cc;
}

.news-type.neutral {
  color: #94a3b8;
}

.news-type.negative {
  color: #ff6578;
}

.news-meta-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}

.news-meta {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  flex: 1;
  min-width: 0;
  scrollbar-width: none;
}

.news-meta::-webkit-scrollbar {
  display: none;
}

.meta-pill {
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 8px;
  padding: 5px 9px;
  color: #dbeafe;
  font-size: 11px;
  flex: 0 0 auto;
  cursor: pointer;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;

}

.meta-pill.active {
  border-color: #22d3ee;
  color: #ffffff;
  background: rgba(34, 211, 238, 0.14);
}

.meta-pill.positive-active {
  border-color: #34d6cc;
  color: #34d6cc;
}

.meta-pill.neutral-active {
  border-color: #94a3b8;
  color: #dbeafe;
}

.meta-pill.negative-active {
  border-color: #ff6578;
  color: #ff6578;
}

.meta-arrow {
  width: 22px;
  height: 22px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  background: #111827;
  color: #dbeafe;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  flex: 0 0 auto;
}

.meta-arrow.show {
  display: block;
}

.news-title-roller {
  background: #0e1728;
  border-radius: 8px;
  height: 46px;
  overflow: hidden;
  margin-bottom: 16px;
  min-width: 0;
  width: 100%;
}

.news-title-track {
  display: flex;
  flex-direction: column;
  width: 100%;
}


.news-title-item {
  cursor: pointer;

  display: flex;
  align-items: center;

  width: 100%;
  min-width: 0;

  height: 46px;
  padding: 6px 8px;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;

  border-radius: 8px;

  font-size: 14px; /* 여기 줄이면 됨 */
  line-height: 1.2;

  font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;

  transition:
    transform 0.18s ease,
    color 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
}

.news-title-text {
  flex: 1;
  min-width: 0;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.score-bar {
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: #334155;
  overflow: hidden;
  margin-bottom: 10px;
}

.score-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.6s ease;
}

.score-fill.positive {
  background: #34d6cc;
}

.score-fill.neutral {
  background: #94a3b8;
}

.score-fill.negative {
  background: #ff6578;
}

.score-row {
  display: flex;
  justify-content: flex-end;
  font-size: 11px;
  font-weight: 800;
}

.score-row.positive {
  color: #34d6cc;
}

.score-row.neutral {
  color: #94a3b8;
}

.score-row.negative {
  color: #ff6578;
}

/* ==============================
   Reference Articles
============================== */

.reference-label {
  color: #22d3ee;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.4px;
  margin: 20px 0 12px;
}

.article-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  weight: 1012px;
  height:735px;
}

.article-card {
  background: #101b31;
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 14px;
  padding: 22px;
  min-height: 106px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  transition: 0.18s;
}

.article-card.highlight {
  box-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
  border-color: rgba(34, 211, 238, 0.5);
}

.article-card:hover {
  transform: translateY(-2px);
  border-color: rgba(34, 211, 238, 0.45);
}

.article-source {
  color: #22d3ee;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 16px;
}

.article-title {
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 10px;
}

.article-desc {
  color: #7891b5;
  font-size: 13px;
  line-height: 1.6;
}

.original-btn {
  align-self: center;
  min-width: 86px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: #1e293b;
  color: #dbeafe;
  cursor: pointer;
  font-weight: 800;
}

.original-btn:hover {
  background: #334155;
}

/* ==============================
   Toast
============================== */

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: #0f172a;
  border: 1px solid rgba(34, 211, 238, 0.6);
  color: #e0f2fe;
  padding: 14px 18px;
  border-radius: 12px;
  display: none;
  z-index: 1000;
}

   Responsive
============================== */

@media (max-width: 980px) {
  .top-grid,

    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .sentiment-layout {
    grid-template-columns: 1fr;
    justify-items: center;
  }

  .sentiment-list {
    align-items: flex-start;
  }
}

@media (max-width: 640px) {
  .summary-stats {
    grid-template-columns: 1fr;
  }

  .article-card {
    flex-direction: column;
  }
}

#loadTrigger {

<script>
/* ===== common.js ===== */
// ==============================
// 공통 UI 로드
// ==============================
document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();
  bindGlobalClickEvents();
});

// ==============================
// 다크모드 / 화이트모드
// ==============================
function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.documentElement.classList.add("light-mode");
    document.body.classList.add("light-mode");
  } else {
    document.documentElement.classList.remove("light-mode");
    document.body.classList.remove("light-mode");
  }

  if (themeBtn) {
    themeBtn.innerText =
      savedTheme === "light" ? "☀️" : "🌙";
  }
}

function toggleThemeMode() {
  const isLight =
    document.documentElement.classList.contains("light-mode");

  const themeBtn =
    document.getElementById("themeToggleBtn");

  if (isLight) {

    document.documentElement.classList.remove("light-mode");
    document.body.classList.remove("light-mode");

    localStorage.setItem("theme_mode", "dark");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }

  } else {

    document.documentElement.classList.add("light-mode");
    document.body.classList.add("light-mode");

    localStorage.setItem("theme_mode", "light");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  }
}

// ==============================
// 로그인 정보 가져오기
// ==============================
function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||
      localStorage.getItem("userName"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}

// ==============================
// Header 불러오기
// ==============================
function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  if (headerArea.innerHTML.trim()) {
    setHeaderLoginState();
    bindCommonSearch();
    applyThemeMode();
    activateCurrentHeaderMenu();
    return;
  }

  fetch("/view/header.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("header.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();

      activateCurrentHeaderMenu();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}

function activateCurrentHeaderMenu() {
  const currentFile = window.location.pathname.split("/").pop();

  const navLinks = document.querySelectorAll(".nav a");

  navLinks.forEach(function (link) {
    const targetPath = link.dataset.loginPage;

    if (!targetPath) return;

    const targetFile = targetPath.split("/").pop();

    link.classList.remove("active");

    if (currentFile === targetFile) {
      link.classList.add("active");
    }
  });
}

// ==============================
// Footer 불러오기
// ==============================
function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  if (footerArea.innerHTML.trim()) {
    return;
  }

  fetch("/view/footer.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("footer.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}

// ==============================
// Header 로그인 상태 처리
// ==============================
function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  let headerUserName = document.getElementById("headerUserName");

  // header.html이 구버전이어도 이름 영역을 자동으로 생성
  if (!headerUserName) {
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    if (themeToggleBtn && themeToggleBtn.parentElement) {
      headerUserName = document.createElement("span");
      headerUserName.id = "headerUserName";
      headerUserName.className = "header-user-name hidden";
      themeToggleBtn.insertAdjacentElement("afterend", headerUserName);
    }
  }

  if (
    !loginBtn ||
    !joinBtn ||
    !primaryUserBtn ||
    !logoutBtn ||
    !headerUserName
  ) {
    return;
  }

  const loginInfo = getLoginInfo();
  const token = loginInfo.token;
  const role = loginInfo.role;
  const userName = loginInfo.userName;

  // =========================
  // 비로그인 상태
  // =========================
  if (!token) {
    loginBtn.classList.remove("hidden");
    joinBtn.classList.remove("hidden");

    primaryUserBtn.classList.add("hidden");
    logoutBtn.classList.add("hidden");

    headerUserName.textContent = "";
    headerUserName.classList.add("hidden");

    return;
  }

  // =========================
  // 로그인 상태
  // =========================
  loginBtn.classList.add("hidden");
  joinBtn.classList.add("hidden");

  primaryUserBtn.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");

  if (userName) {
    headerUserName.textContent = `${userName}님`;
    headerUserName.classList.remove("hidden");
  } else {
    headerUserName.textContent = "";
    headerUserName.classList.add("hidden");
  }

  const isAdmin =
    role === "ADMIN" ||
    role === "SUPERADMIN" ||
    role === "admin" ||
    role === "superadmin" ||
    token === "admin-test-token";

  primaryUserBtn.innerText = isAdmin
    ? "관리자 페이지"
    : "마이페이지";
}

// ==============================
// 로그인 필요 페이지 이동
// ==============================
window.goLoginRequiredPage = function (targetUrl) {
  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
    return;
  }

  location.href = targetUrl;
};

// ==============================
// 전역 클릭 이벤트
// fetch로 늦게 들어온 header도 작동
// ==============================
function bindGlobalClickEvents() {
  document.addEventListener("click", function (e) {
    const loginBtn = e.target.closest("#loginBtn");
    const joinBtn = e.target.closest("#joinBtn");
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");

    const heroTag = e.target.closest(".h-tag");
    const chip = e.target.closest(".chip");
    const actionBtn = e.target.closest(".action-btn");
    const newsFooterBtn = e.target.closest(".news-footer-btn");
    const detailBtn = e.target.closest(".detail-btn");
    const articleDetailBtn = e.target.closest(".article-detail-btn");

    if (articleDetailBtn) {
      e.preventDefault();

      const articleId = articleDetailBtn.dataset.articleId;
      openArticleDetail(articleId);

      return;
    }

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (loginBtn) {
      e.preventDefault();
      location.href = "/view/login.html";
      return;
    }

    if (joinBtn) {
      e.preventDefault();
      location.href = "/view/terms.html";
      return;
    }

    if (primaryUserBtn) {
      e.preventDefault();

      const loginInfo = getLoginInfo();
      const role = loginInfo.role;
      const token = loginInfo.token;

      const isAdmin =
        role === "ADMIN" ||
        role === "SUPERADMIN" ||
        role === "admin" ||
        role === "superadmin" ||
        token === "admin-test-token";

      if (isAdmin) {
        location.href = "/view/admin_dashboard.html";
      } else {
        location.href = "/view/mypage_home.html";
      }

      return;
    }

    if (logoutBtn) {
      e.preventDefault();
      logout();
      return;
    }

    if (loginRequiredLink) {
      e.preventDefault();

      const targetUrl = loginRequiredLink.dataset.loginPage;
      goLoginRequiredPage(targetUrl);
      return;
    }

    if (heroTag) {
      e.preventDefault();

      const keyword = heroTag.innerText.replace("#", "").trim();
      goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
      return;
    }

    if (chip) {
      e.preventDefault();

      const keyword = chip.innerText.trim();
      goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
      return;
    }

    if (actionBtn) {
      e.preventDefault();
      goLoginRequiredPage("/view/article_detail.html");
      return;
    }

    if (newsFooterBtn) {
      e.preventDefault();
      goLoginRequiredPage("/view/article_detail.html");
      return;
    }

    if (detailBtn) {
      e.preventDefault();

      const title = detailBtn.dataset.title;
      const percent = detailBtn.dataset.percent;

      if (title) {
        localStorage.setItem("viewpoint_title", title);
      }

      if (percent) {
        localStorage.setItem("viewpoint_percent", percent);
      }

      goLoginRequiredPage("/view/viewpoint_detail.html");
    }
  });
}

// ==============================
// 검색어 자동완성
// ==============================
function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;

        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();

    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);

    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
}

// ==============================
// 로그아웃
// ==============================
window.logout = async function () {
  localStorage.removeItem("access_token");
  localStorage.removeItem("user_name");
  localStorage.removeItem("user_role");
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("userName");

  sessionStorage.removeItem("access_token");
  sessionStorage.removeItem("user_name");
  sessionStorage.removeItem("user_role");
  sessionStorage.removeItem("token");
  sessionStorage.removeItem("role");
  sessionStorage.removeItem("userName");

  try {
    await axios.post("/logout");
  } catch (e) {
    console.error("로그아웃 실패:", e);
  }

  location.href = "/view/main.html";
};

// ==============================
// Footer 모달
// ==============================
window.openFooterTermsModal = function () {
  const modal = document.getElementById("footerModal");
  const content = document.getElementById("footerModalContent");

  if (!modal || !content) return;

  content.innerHTML = `
    <h3>이용약관</h3>
    <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
    <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
    <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
  `;

  modal.classList.remove("hidden");
};

window.openFooterPrivacyModal = function () {
  const modal = document.getElementById("footerModal");
  const content = document.getElementById("footerModalContent");

  if (!modal || !content) return;

  content.innerHTML = `
    <h3>개인정보처리방침</h3>
    <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
    <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
    <p>개인정보 관련 문의: data260417@gmail.com</p>
  `;

  modal.classList.remove("hidden");
};

window.closeFooterModal = function () {
  const modal = document.getElementById("footerModal");

  if (!modal) return;

  modal.classList.add("hidden");
};
</script>

<script>
/* ===== keyword_detail.js ===== */
// ==============================
// 로그인 체크
// ==============================
(function checkKeywordDetailAuth() {
  const token =
    sessionStorage.getItem("access_token") ||
    localStorage.getItem("access_token") ||
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");

  if (!token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
  }
})();

// ==============================
// es 불러옴
// ==============================
let keywordData = {
  category: "ECONOMY",
  keyword: "",
  pressCount: 0,
  summary: "",
  aiCount: 0,
  newsCount: 0,
  flow: "",
  sentiment: {
    positive: 0,
    neutral: 0,
    negative: 0
  }
};

// ==============================
// 서버 데이터
// ==============================
let perspectives = [];
let articles = [];
let analysis = [];
let rollingTimers = [];

let visibleArticleCount = 5;
const ARTICLE_LOAD_SIZE = 5;

let currentArticleTab = "normal";

function buildPerspectiveData(data) {
  articles = data.articles || [];

  perspectives = [
    {
      type: "긍정 관점",
      className: "positive",
      sentimentLabel: "긍정",
      sentimentPercent: data.sentiment?.positive || 0,
      articles: articles
        .filter(item => item.sentiment === "positive")
        .slice(0, 4)
        .map(item => ({
          code: "P",
          press: item.press,
          title: item.title,
          article_id: item.article_id
        }))
    },
    {
      type: "중립 관점",
      className: "neutral",
      sentimentLabel: "중립",
      sentimentPercent: data.sentiment?.neutral || 0,
      articles: articles
        .filter(item => item.sentiment === "neutral")
        .slice(0, 4)
        .map(item => ({
          code: "N",
          press: item.press,
          title: item.title,
          article_id: item.article_id
        }))
    },
    {
      type: "부정 관점",
      className: "negative",
      sentimentLabel: "부정",
      sentimentPercent: data.sentiment?.negative || 0,
      articles: articles
        .filter(item => item.sentiment === "negative")
        .slice(0, 4)
        .map(item => ({
          code: "D",
          press: item.press,
          title: item.title,
          article_id: item.article_id
        }))
    }
  ];

  renderPerspectives();
}

// ==============================
// Toast
// ==============================
function showToast(message) {
  const toast = document.getElementById("toast");

  if (!toast) {
    alert(message);
    return;
  }

  toast.textContent = message;
  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  }, 2000);
}

// ==============================
// Keyword Render
// ==============================
function renderKeyword() {
  const badge = document.querySelector(".keyword-badge");
  const title = document.getElementById("keywordTitle");
  const desc = document.getElementById("keywordDesc");
  const summary = document.getElementById("coreSummary");
  const analysisCount = document.getElementById("analysisCount");
  const newsCount = document.getElementById("newsCount");
  const mainFlow = document.getElementById("mainFlow");

  if (badge) badge.textContent = keywordData.category;
  if (title) title.textContent = keywordData.keyword;

  if (desc) {
    desc.textContent = `총 ${keywordData.pressCount}개의 언론사 데이터 기반으로 AI가 분석한 결과입니다.`;
  }

  if (summary) summary.textContent = keywordData.summary;
  if (analysisCount) analysisCount.textContent = `${keywordData.aiCount}건`;
  if (newsCount) newsCount.textContent = `${keywordData.newsCount}건`;
  if (mainFlow) mainFlow.textContent = keywordData.flow;

  renderSentiment();
}

function renderSentiment() {
  const positive = keywordData.sentiment.positive;
  const neutral = keywordData.sentiment.neutral;
  const negative = keywordData.sentiment.negative;

  const positiveLabel = document.getElementById("positiveLabel");
  const neutralLabel = document.getElementById("neutralLabel");
  const negativeLabel = document.getElementById("negativeLabel");
  const donut = document.getElementById("sentimentDonut");

  if (positiveLabel) positiveLabel.textContent = `긍정 : ${positive}%`;
  if (neutralLabel) neutralLabel.textContent = `중립 : ${neutral}%`;
  if (negativeLabel) negativeLabel.textContent = `부정 : ${negative}%`;

  if (donut) {
    donut.style.background = `
      conic-gradient(
        #34d6cc 0 ${positive}%,
        #94a3b8 ${positive}% ${positive + neutral}%,
        #ff6578 ${positive + neutral}% 100%
      )
    `;
  }
}

// ==============================
// Perspective Render
// ==============================
function renderPerspectives() {
  const grid = document.getElementById("perspectiveGrid");

  if (!grid) return;

  grid.innerHTML = perspectives.map((item, index) => {
    const cardArticles = item.articles?.length
      ? item.articles
      : [{ code: "-", press: "언론사 없음", title: "제목 없음" }];

    const rollingArticles = cardArticles.length > 1
      ? [...cardArticles, cardArticles[0]]
      : cardArticles;

    return `
      <div class="news-card ${item.className}">
        <div class="news-type ${item.className}">● ${item.type}</div>

        <div class="news-meta-wrap">
          <button class="meta-arrow" id="metaPrev${index}" onclick="movePressList(${index}, -1)">‹</button>

          <div class="news-meta" id="pressList${index}">
            ${cardArticles.map((article, articleIndex) => `
              <span
                class="meta-pill ${articleIndex === 0 ? "active " + item.className + "-active" : ""}"
                id="pressPill${index}_${articleIndex}"
                onclick="selectPerspectiveArticle(${index}, ${articleIndex})"
              >
                ${article.code} ${article.press}
              </span>
            `).join("")}
          </div>

          <button class="meta-arrow" id="metaNext${index}" onclick="movePressList(${index}, 1)">›</button>
        </div>

        <div class="news-title-roller">
          <div class="news-title-track" id="titleTrack${index}">
            ${rollingArticles.map(article => `
              <div
  class="news-title-item"
  data-article-id="${article.article_id}"
>
  <span class="news-title-text">
    ${article.title}
  </span>
</div>
            `).join("")}
          </div>
        </div>

        <div class="score-bar">
          <div
            class="score-fill ${item.className}"
            style="width: ${item.sentimentPercent}%;"
          ></div>
        </div>

        <div class="score-row ${item.className}">
          <span>${item.sentimentLabel} ${item.sentimentPercent}%</span>
        </div>
      </div>
    `;
  }).join("");

  checkPressArrow();
  startRolling();
}

function selectPerspectiveArticle(cardIndex, articleIndex) {
  const track = document.getElementById(`titleTrack${cardIndex}`);

  if (!track) return;

  track.dataset.current = articleIndex;

  track.style.transition = "transform 0.4s ease";
  track.style.transform = `translateY(-${46 * articleIndex}px)`;

  updateActivePress(cardIndex, articleIndex);
}

function updateActivePress(cardIndex, articleIndex) {
  const cardType = perspectives[cardIndex].className;
  const list = document.getElementById(`pressList${cardIndex}`);
  const pills = document.querySelectorAll(`[id^="pressPill${cardIndex}_"]`);

  pills.forEach((pill, index) => {
    pill.classList.remove(
      "active",
      "positive-active",
      "neutral-active",
      "negative-active"
    );

    if (index === articleIndex) {
      pill.classList.add("active", `${cardType}-active`);

      if (list) {
        const targetLeft =
          pill.offsetLeft - list.offsetLeft - (list.clientWidth / 2) + (pill.clientWidth / 2);

        list.scrollTo({
          left: targetLeft,
          behavior: "smooth"
        });
      }
    }
  });
}

function movePressList(cardIndex, direction) {
  const list = document.getElementById(`pressList${cardIndex}`);

  if (!list) return;

  list.scrollLeft += direction * 100;
}

function checkPressArrow() {
  perspectives.forEach((item, index) => {
    const list = document.getElementById(`pressList${index}`);
    const prev = document.getElementById(`metaPrev${index}`);
    const next = document.getElementById(`metaNext${index}`);

    if (!list || !prev || !next) return;

    if (list.scrollWidth > list.clientWidth) {
      prev.classList.add("show");
      next.classList.add("show");
    } else {
      prev.classList.remove("show");
      next.classList.remove("show");
    }
  });
}

// ==============================
// Article Render
// ==============================
function renderArticles() {

  const list = document.getElementById("articleList");

  if (!list) return;

  if (!articles || articles.length === 0) {

    list.innerHTML = `
      <article class="article-card">
        <div>
          <div class="article-source">검색 결과 없음</div>

          <h3 class="article-title">
            관련 기사가 없습니다.
          </h3>

          <p class="article-desc">
            다른 키워드로 다시 검색해 주세요.
          </p>
        </div>
      </article>
    `;

    return;
  }

  const visibleArticles =
    articles.slice(0, visibleArticleCount);

  list.innerHTML = visibleArticles.map(article => `

    <article class="article-card">

      <div>

        <div class="article-source">
          ${article.source || "언론사 없음"}
        </div>

        <h3 class="article-title">
          ${article.title || "제목 없음"}
        </h3>

        <p class="article-desc">
          ${article.desc || "요약 정보가 없습니다."}
        </p>

      </div>

      <button
        class="original-btn article-detail-btn"
        type="button"
        data-article-id="${article.article_id || ""}"
      >
        원문 보기
      </button>

    </article>

  `).join("");
}


function renderAIArticles() {
  const list = document.getElementById("aiArticleList");

  if (!list) return;

  if (!analysis || analysis.length === 0) {
    list.innerHTML = `
      <article class="article-card ai-card">
        <div>
          <div class="article-source">[ AI분석 ]</div>
          <h3 class="article-title">AI 분석 결과 없음</h3>
          <p class="article-desc">
            해당 키워드와 연결된 scope 분석 결과가 없습니다.
          </p>
        </div>
      </article>
    `;
    return;
  }

  const visibleAnalysis = analysis.slice(0, visibleArticleCount);

  list.innerHTML = visibleAnalysis.map(item => `
    <article class="article-card ai-card">
      <div>
        <div class="article-source">
          [ AI분석 ] ${item.news_count || 0}건
        </div>

        <h3 class="article-title">
          ${item.scopeTitle || "AI 분석 제목 없음"}
        </h3>

        <p class="article-desc">
          ${item.scope_summary || "AI 분석 요약이 없습니다."}
        </p>
      </div>

      <button
        class="original-btn"
        type="button"
        onclick="location.href='/view/scope_detail.html?scopeID=${encodeURIComponent(item.scopeID || "")}'"
      >
        상세 보기
      </button>
    </article>
  `).join("");
}

function openArticleDetail(articleId) {
  if (!articleId) {
    showToast("기사 ID가 없습니다.");
    return;
  }

  location.href = `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;
}

async function readKeywordFromUrl() {
  const params = new URLSearchParams(window.location.search);
  let keyword = params.get("keyword");

  if (!keyword) {
    try {
      const randomRes = await axios.get("/api/main/random-keyword");

      keyword = randomRes.data.keyword;

      if (!keyword) {
        showToast("키워드 데이터가 없습니다.");
        return;
      }

    } catch (error) {
      console.error("랜덤 키워드 불러오기 실패:", error);
      showToast("랜덤 키워드를 불러오지 못했습니다.");
      return;
    }
  }

  await fetchKeywordDetail(keyword);
}

async function fetchKeywordDetail(keyword) {
  try {
    const res = await axios.get(`/api/keywords/${encodeURIComponent(keyword)}`);

    keywordData = res.data;
    articles = res.data.articles || [];
    analysis = res.data.analysis || [];

    visibleArticleCount = 5;
    console.log(keywordData);

    renderKeyword();
    renderArticles();
    buildPerspectiveData(keywordData);

  } catch (error) {
    console.error("키워드 상세 데이터 불러오기 실패:", error);
    showToast("키워드 데이터를 불러오지 못했습니다.");
  }
}

function handleInfiniteScroll() {

  const scrollY = window.scrollY;
  const windowHeight = window.innerHeight;
  const bodyHeight = document.body.offsetHeight;

  if (scrollY + windowHeight >= bodyHeight - 200) {

    if (visibleArticleCount < articles.length) {

      visibleArticleCount += ARTICLE_LOAD_SIZE;

      if (currentArticleTab === "normal") {
        renderArticles();
      } else {
        renderAIArticles();
      }

    }

  }

}

// ==============================
// Rolling
// ==============================
function startRolling() {
  rollingTimers.forEach(timer => clearInterval(timer));
  rollingTimers = [];

  const tracks = document.querySelectorAll(".news-title-track");

  tracks.forEach((track, cardIndex) => {
    const items = track.children.length;
    const realCount = items - 1;

    if (realCount <= 0) return;

    track.dataset.current = "0";

    const timer = setInterval(() => {
      let current = Number(track.dataset.current || 0);

      current++;

      track.style.transition = "transform 0.6s ease";
      track.style.transform = `translateY(-${46 * current}px)`;

      if (current === realCount) {
        updateActivePress(cardIndex, 0);

        setTimeout(() => {
          track.style.transition = "none";
          track.style.transform = "translateY(0)";
          track.dataset.current = "0";
        }, 650);
      } else {
        track.dataset.current = String(current);
        updateActivePress(cardIndex, current);
      }
    }, 2500);

    rollingTimers.push(timer);
  });
}

// ==============================
// 전역 함수
// ==============================
window.openArticleDetail = openArticleDetail;
window.movePressList = movePressList;
window.selectPerspectiveArticle = selectPerspectiveArticle;

// ==============================
// 랜덤 키워드 새로고침 함수
// ==============================
window.reloadRandomKeyword = async function() {
  try {
    // 1. 서버로부터 새로운 랜덤 키워드를 가져옴
    const res = await axios.get("/api/main/random-keyword");
    const newKeyword = res.data.keyword;

    if (newKeyword) {
      // 2. 새로운 키워드 파라미터와 함께 페이지 이동 (새로고침 효과)
      location.href = `/view/keyword_detail.html?keyword=${encodeURIComponent(newKeyword)}`;
    } else {
      showToast("새로운 키워드를 찾을 수 없습니다.");
    }
  } catch (error) {
    console.error("랜덤 키워드 로드 실패:", error);
    // 서버 통신 실패 시 단순히 현재 페이지 새로고침
    location.reload();
  }
};

function bindArticleTabs() {

  const tabs =
    document.querySelectorAll(".article-tab");

  const normalList =
    document.getElementById("articleList");

  const aiList =
    document.getElementById("aiArticleList");

  if (!tabs.length || !normalList || !aiList) {
    return;
  }

  tabs.forEach(tab => {

    tab.addEventListener("click", function () {

      const target = tab.dataset.tab;

      currentArticleTab = target;

      tabs.forEach(t => {
        t.classList.remove("active");
      });

      tab.classList.add("active");

      if (target === "normal") {

        normalList.classList.remove("hidden");
        aiList.classList.add("hidden");

      } else {

        normalList.classList.add("hidden");
        aiList.classList.remove("hidden");

        renderAIArticles();
      }

    });

  });

}

// ==============================
// 최초 실행
// ==============================
document.addEventListener("DOMContentLoaded", function () {
  readKeywordFromUrl();

  bindArticleTabs();

  window.addEventListener("resize", checkPressArrow);

  window.addEventListener("scroll", handleInfiniteScroll);
});

document.addEventListener("click", function (e) {

const card = e.target.closest(".article-card");
  const btn = e.target.closest(".article-detail-btn");

  if (btn) {
    const articleId = btn.dataset.articleId;
    if (!articleId) return showToast("기사 ID 없음");

    openArticleDetail(articleId);
    return;
  }

  if (card) {
    const btnInside = card.querySelector(".article-detail-btn");
    if (!btnInside) return;

    const articleId = btnInside.dataset.articleId;
    if (!articleId) return showToast("기사 ID 없음");

    openArticleDetail(articleId);
    return;
  }

  // =========================
  // 1. 롤링 뉴스 클릭
  // =========================
  const newsItem = e.target.closest(".news-title-item");
  if (newsItem) {
    const articleId = newsItem.dataset.articleId;

    if (!articleId) {
      showToast("기사 ID가 없습니다.");
      return;
    }

    location.href =
      `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;

    return;
  }

  // =========================
  // 2. 기사 카드 버튼 클릭
  // =========================
  const articleBtn = e.target.closest(".article-detail-btn");
  if (articleBtn) {
    const articleId = articleBtn.dataset.articleId;

    if (!articleId) {
      showToast("기사 ID가 없습니다.");
      return;
    }

    openArticleDetail(articleId);
    return;
  }

  // =========================
  // 3. (선택) chip 클릭
  // =========================
  const chip = e.target.closest(".chip");
  if (chip) {
    const keyword = chip.innerText.trim();

    goLoginRequiredPage(
      `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
    );

    return;
  }

});

</script>
