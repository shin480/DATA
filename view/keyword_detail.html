/* ==============================
   Search Suggest Dropdown
   헤더 디자인은 main.css 기준
============================== */

.main-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-suggest-box {
  position: fixed;
  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #41bfe0;
  font-weight: 900;
}

/* ==============================
   Footer
============================== */

/* footer가 .page 안에 있어도 화면 전체 폭으로 빼기 */
#footer {

/* ==============================
   Footer Modal
============================== */

/* 모달은 화면 중앙 고정 */
.footer-modal {
  position: fixed;
  inset: 0;
  z-index: 30000;

  align-items: center;
  justify-content: center;

}

.footer-modal.hidden {

}

}

.footer-modal-btn {

  padding: 13px;

  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;

/* ==============================
   Responsive
============================== */

@media (max-width: 980px) {
  .footer-inner {
    padding: 0 24px;
    flex-wrap: wrap;
  }
}

@media (max-width: 640px) {
  .search-suggest-box {
    left: 18px !important;
    right: 18px !important;
    width: auto !important;
    max-width: none;
  }

  .footer-inner {
    padding: 0 18px;
  }
}

/* ===== keyword_detail.css ===== */
/* ==============================
   Keyword Detail Page
============================== */

.keyword-detail-page {
  max-width: 1060px;
  margin: 0 auto;
  padding: 40px 24px 120px;
  background: #050816;
  color: #f8fafc;

  flex: 1;
}

.keyword-badge {
  display: inline-block;
  padding: 6px 14px;
  border: 1px solid #00d5ff;
  border-radius: 999px;
  color: #00d5ff;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 18px;
}

.keyword-title {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: -1px;
  margin-bottom: 20px;
}

.keyword-desc {
  color: #7891b5;
  font-size: 14px;
  margin-bottom: 36px;
}

.back-btn {
  display: inline-block;
  margin-bottom: 26px;
  color: #3b82a0;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.back-btn:hover {
  color: #00e5ff;
}

/* ==============================
   Common Card / Grid
============================== */

.top-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 22px;
  margin-bottom: 22px;
}

.keyword-card {
  background: linear-gradient(180deg, #111c31, #0d1729);
  border: 1px solid rgba(148, 163, 184, 0.1);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 16px 35px rgba(0, 0, 0, 0.25);
}

.section-label {
  color: #22d3ee;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

/* ==============================
   Summary
============================== */

.summary-title {
  font-size: 23px;
  line-height: 1.45;
  font-weight: 900;
  margin-bottom: 24px;
}

.summary-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.stat-box {
  background: #1d293d;
  border-radius: 12px;
  padding: 16px;
}

.stat-label {
  color: #8aa0bf;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}

.stat-value {
  color: #eaf6ff;
  font-size: 17px;
  font-weight: 900;
}

.stat-value.cyan {
  color: #22d3ee;
}

/* ==============================
   Sentiment
============================== */

.sentiment-card {
  min-height: 250px;
}

.sentiment-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  align-items: center;
  gap: 24px;
  min-height: 170px;
}

.sentiment-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-left: 4px;
}

.sentiment-item {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: 900;
  white-space: nowrap;
}

.sentiment-item .dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: inline-block;
}

.sentiment-item.positive {
  color: #34d6cc;
}

.sentiment-item.positive .dot {
  background: #34d6cc;
}

.sentiment-item.neutral {
  color: #94a3b8;
}

.sentiment-item.neutral .dot {
  background: #94a3b8;
}

.sentiment-item.negative {
  color: #ff6578;
}

.sentiment-item.negative .dot {
  background: #ff6578;
}

.donut-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
}

.donut {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: conic-gradient(
    #34d6cc 0 50%,
    #94a3b8 50% 60%,
    #ff6578 60% 100%
  );
  position: relative;
}

.donut::after {
  content: "";
  position: absolute;
  inset: 42px;
  border-radius: 50%;
  background: #0d1729;
}

/* ==============================
   Perspective
============================== */

.perspective-card {
  margin-bottom: 22px;
}

.perspective-title {
  font-size: 24px;
  font-weight: 900;
  margin-bottom: 28px;
}

.perspective-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  width: 100%;
}

.news-card {
  background: #202c40;
  border-radius: 14px;
  padding: 18px;
  min-height: 180px;
  min-width: 0;
}

.news-card.positive {
  border-left: 6px solid #34d6cc;
}

.news-card.neutral {
  border-left: 6px solid #94a3b8;
}

.news-card.negative {
  border-left: 6px solid #ff6578;
}

.news-type {
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 16px;
}

.news-type.positive {
  color: #34d6cc;
}

.news-type.neutral {
  color: #94a3b8;
}

.news-type.negative {
  color: #ff6578;
}

.news-meta-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}

.news-meta {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  flex: 1;
  min-width: 0;
  scrollbar-width: none;
}

.news-meta::-webkit-scrollbar {
  display: none;
}

.meta-pill {
  border: 1px solid rgba(148, 163, 184, 0.35);
  border-radius: 8px;
  padding: 5px 9px;
  color: #dbeafe;
  font-size: 11px;
  flex: 0 0 auto;
  cursor: pointer;
  background: transparent;
    display: inline-flex;
  align-items: center;
  justify-content: center;

}

.meta-pill.active {
  border-color: #22d3ee;
  color: #ffffff;
  background: rgba(34, 211, 238, 0.14);
}

.meta-pill.positive-active {
  border-color: #34d6cc;
  color: #34d6cc;
}

.meta-pill.neutral-active {
  border-color: #94a3b8;
  color: #dbeafe;
}

.meta-pill.negative-active {
  border-color: #ff6578;
  color: #ff6578;
}

.meta-arrow {
  width: 22px;
  height: 22px;
  border: 1px solid rgba(148, 163, 184, 0.35);
  background: #111827;
  color: #dbeafe;
  border-radius: 50%;
  cursor: pointer;
  display: none;
  flex: 0 0 auto;
}

.meta-arrow.show {
  display: block;
}

.news-title-roller {
  background: #0e1728;
  border-radius: 8px;
  height: 46px;
  overflow: hidden;
  margin-bottom: 16px;
  min-width: 0;
  width: 100%;
}

.news-title-track {
  width: 100%;
  min-width: 0;
}

.news-title-item {
  height: 46px;
  display: block;
  padding: 0 13px;
  font-size: 13px;
  font-weight: 900;
  line-height: 46px;
  color: #f8fafc;

  width: 100%;
  max-width: 100%;
  min-width: 0;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.score-bar {
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: #334155;
  overflow: hidden;
  margin-bottom: 10px;
}

.score-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.6s ease;
}

.score-fill.positive {
  background: #34d6cc;
}

.score-fill.neutral {
  background: #94a3b8;
}

.score-fill.negative {
  background: #ff6578;
}

.score-row {
  display: flex;
  justify-content: flex-end;
  font-size: 11px;
  font-weight: 800;
}

.score-row.positive {
  color: #34d6cc;
}

.score-row.neutral {
  color: #94a3b8;
}

.score-row.negative {
  color: #ff6578;
}

/* ==============================
   Reference Articles
============================== */

.reference-label {
  color: #22d3ee;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.4px;
  margin: 20px 0 12px;
}

.article-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.article-card {
  background: #101b31;
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 14px;
  padding: 22px;
  min-height: 106px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  transition: 0.18s;
}

.article-card.highlight {
  box-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
  border-color: rgba(34, 211, 238, 0.5);
}

.article-card:hover {
  transform: translateY(-2px);
  border-color: rgba(34, 211, 238, 0.45);
}

.article-source {
  color: #22d3ee;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 16px;
}

.article-title {
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 10px;
}

.article-desc {
  color: #7891b5;
  font-size: 13px;
  line-height: 1.6;
}

.original-btn {
  align-self: center;
  min-width: 86px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: #1e293b;
  color: #dbeafe;
  cursor: pointer;
  font-weight: 800;
}

.original-btn:hover {
  background: #334155;

/* ==============================
   Toast
============================== */

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: #0f172a;
  border: 1px solid rgba(34, 211, 238, 0.6);
  color: #e0f2fe;

  z-index: 1000;

// ==============================
// 다크모드 / 화이트모드
// ==============================
function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  } else {
    document.body.classList.remove("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  }
}


// ==============================
// 로그인 정보 가져오기
// ==============================
function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||
      localStorage.getItem("userName"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}


// ==============================
// Header 불러오기
// ==============================
function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  if (headerArea.innerHTML.trim()) {
    setHeaderLoginState();
    bindCommonSearch();
    applyThemeMode();
    return;
  }

  fetch("/view/header.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("header.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}


// ==============================
// Footer 불러오기
// ==============================
function loadFooter() {

  if (!footerArea) return;

  if (footerArea.innerHTML.trim()) {
    return;
  }

  fetch("/view/footer.html?v=999")
    .then(function (res) {

      return res.text();

    .then(function (html) {

    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}


// ==============================
// Header 로그인 상태 처리
// ==============================
function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  if (!loginBtn || !joinBtn || !primaryUserBtn || !logoutBtn) return;

  const loginInfo = getLoginInfo();
  const token = loginInfo.token;
  const role = loginInfo.role;

  if (!token) {
    loginBtn.classList.remove("hidden");
    joinBtn.classList.remove("hidden");
    primaryUserBtn.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  loginBtn.classList.add("hidden");
  joinBtn.classList.add("hidden");
  primaryUserBtn.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");

  const isAdmin =
    role === "ADMIN" ||
    role === "SUPERADMIN" ||
    role === "admin" ||
    role === "superadmin" ||
    token === "admin-test-token";

  if (isAdmin) {
    primaryUserBtn.innerText = "관리자 페이지";
  } else {
    primaryUserBtn.innerText = "마이페이지";
  }
}


// ==============================
// 로그인 필요 페이지 이동
// ==============================
window.goLoginRequiredPage = function (targetUrl) {
  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
    return;

  location.href = targetUrl;
};


// ==============================
// 전역 클릭 이벤트
// fetch로 늦게 들어온 header도 작동
// ==============================
function bindGlobalClickEvents() {
  document.addEventListener("click", function (e) {
    const loginBtn = e.target.closest("#loginBtn");
    const joinBtn = e.target.closest("#joinBtn");
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");

    const heroTag = e.target.closest(".h-tag");
    const chip = e.target.closest(".chip");
    const topKeywordTitle = e.target.closest(".top-keyword-title");
    const actionBtn = e.target.closest(".action-btn");
    const newsFooterBtn = e.target.closest(".news-footer-btn");
    const detailBtn = e.target.closest(".detail-btn");

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (loginBtn) {
      e.preventDefault();

      return;
    }

    if (joinBtn) {

      return;

      const isAdmin =

        role === "SUPERADMIN" ||
        role === "admin" ||
        role === "superadmin" ||
        token === "admin-test-token";

      if (isAdmin) {
        location.href = "/view/admin_dashboard.html";
      } else {
        location.href = "/view/mypage_home.html";
      }

      return;
    }

    if (logoutBtn) {
      e.preventDefault();
      logout();
      return;
    }

    if (heroTag) {
      e.preventDefault();

      const keyword = heroTag.innerText.replace("#", "").trim();
      goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
      return;
    }

    if (chip) {
      e.preventDefault();

      const keyword = chip.innerText.trim();
      goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
      return;
    }

    if (topKeywordTitle) {
  e.preventDefault();

  const keyword = topKeywordTitle.innerText.trim();

  if (!keyword) return;

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
  );

  return;
}


    if (actionBtn) {
      e.preventDefault();

      const articleId = actionBtn.getAttribute("data-article-id");

// ==============================
// 검색어 자동완성
// ==============================
function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;

        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();

    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);

    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
}

async function fetchKeywordDetail(keyword) {
  try {
    const res = await axios.get(`/api/keywords/${encodeURIComponent(keyword)}`);
    keywordData = res.data;
    articles = res.data.articles || [];
    aiArticles = articles.map(a => ({
      article_id: a.article_id,
      title: a.title,
      summary: a.summary || a.desc || a.content || "요약 정보가 없습니다."
    }));
    visibleArticleCount = 5;
    renderAll();
  } catch (error) {
    console.error("데이터 로딩 실패:", error);
    showToast("데이터를 불러오지 못했습니다.");
  }
}

function renderAll() {
  renderKeywordHeader();
  renderSentimentDonut();
  buildPerspectiveData();
  renderArticles();
}

function renderKeywordHeader() {
  const badge = document.querySelector(".keyword-badge");
  const title = document.getElementById("keywordTitle");
  const desc = document.getElementById("keywordDesc");
  const summary = document.getElementById("coreSummary");
  const analysisCount = document.getElementById("analysisCount");
  const newsCount = document.getElementById("newsCount");
  const mainFlow = document.getElementById("mainFlow");

  if (badge) badge.textContent = keywordData.category;
  if (title) title.textContent = keywordData.keyword;
  if (desc) desc.textContent = `총 ${keywordData.pressCount || 0}개의 언론사 데이터 기반 분석 결과입니다.`;
  if (summary) summary.textContent = keywordData.summary;
  if (analysisCount) analysisCount.textContent = `${keywordData.aiCount || 0}건`;
  if (newsCount) newsCount.textContent = `${keywordData.newsCount || 0}건`;
  if (mainFlow) mainFlow.textContent = keywordData.flow;
}

function renderSentimentDonut() {
  const { positive, neutral, negative } = keywordData.sentiment;
  const donut = document.getElementById("sentimentDonut");
  document.getElementById("positiveLabel").textContent = `긍정 : ${positive}%`;
  document.getElementById("neutralLabel").textContent = `중립 : ${neutral}%`;
  document.getElementById("negativeLabel").textContent = `부정 : ${negative}%`;
  if (donut) {
    donut.style.background = `conic-gradient(#34d6cc 0 ${positive}%, #94a3b8 ${positive}% ${positive + neutral}%, #ff6578 ${positive + neutral}% 100%)`;
  }
}

function buildPerspectiveData() {
  perspectives = [
    { type: "긍정 관점", className: "positive", sentimentLabel: "긍정", sentimentPercent: keywordData.sentiment.positive || 0,
      articles: articles.filter(item => item.sentiment === "positive").slice(0, 4).map(item => ({ code: "P", press: item.press, title: item.title, article_id: item.article_id }))
    },
    { type: "중립 관점", className: "neutral", sentimentLabel: "중립", sentimentPercent: keywordData.sentiment.neutral || 0,
      articles: articles.filter(item => item.sentiment === "neutral").slice(0, 4).map(item => ({ code: "N", press: item.press, title: item.title, article_id: item.article_id }))
    },
    { type: "부정 관점", className: "negative", sentimentLabel: "부정", sentimentPercent: keywordData.sentiment.negative || 0,
      articles: articles.filter(item => item.sentiment === "negative").slice(0, 4).map(item => ({ code: "D", press: item.press, title: item.title, article_id: item.article_id }))
    }
  ];
  renderPerspectives();
}

function renderPerspectives() {
  const grid = document.getElementById("perspectiveGrid");
  if (!grid) return;
  grid.innerHTML = perspectives.map((item, index) => {
    const cardArticles = item.articles?.length ? item.articles : [{ code: "-", press: "언론사 없음", title: "제목 없음" }];
    const rollingArticles = cardArticles.length > 1 ? [...cardArticles, cardArticles[0]] : cardArticles;
    return `
      <div class="news-card ${item.className}">
        <div class="news-type ${item.className}">● ${item.type}</div>
        <div class="news-meta-wrap">
          <button class="meta-arrow" id="metaPrev${index}" onclick="movePressList(${index}, -1)">‹</button>
          <div class="news-meta" id="pressList${index}">
            ${cardArticles.map((article, articleIndex) => `
              <span class="meta-pill ${articleIndex === 0 ? "active " + item.className + "-active" : ""}"
                id="pressPill${index}_${articleIndex}" onclick="selectPerspectiveArticle(${index}, ${articleIndex})">
                ${article.code} ${article.press}
              </span>`).join("")}
          </div>
          <button class="meta-arrow" id="metaNext${index}" onclick="movePressList(${index}, 1)">›</button>
        </div>
        <div class="news-title-roller">
          <div class="news-title-track" id="titleTrack${index}">
            ${rollingArticles.map(article => `<div class="news-title-item" data-article-id="${article.article_id || ''}">${article.title}</div>`).join("")}
          </div>
        </div>
        <div class="score-bar"><div class="score-fill ${item.className}" style="width: ${item.sentimentPercent}%;"></div></div>
        <div class="score-row ${item.className}"><span>${item.sentimentLabel} ${item.sentimentPercent}%</span></div>
      </div>`;
  }).join("");
  checkPressArrow();
  startRolling();
}

// 4. [수정 전 상태 복구] 롤링 배너 로직
function startRolling() {
  rollingTimers.forEach(timer => clearInterval(timer));
  rollingTimers = [];
  const tracks = document.querySelectorAll(".news-title-track");
  tracks.forEach((track, cardIndex) => {
    const items = track.children.length;
    const realCount = items - 1;
    if (realCount <= 0) return;
    track.dataset.current = "0";
    const timer = setInterval(() => {
      let current = Number(track.dataset.current || 0);
      current++;
      track.style.transition = "transform 0.6s ease";
      track.style.transform = `translateY(-${46 * current}px)`;
      if (current === realCount) {
        updateActivePress(cardIndex, 0);
        setTimeout(() => {
          track.style.transition = "none";
          track.style.transform = "translateY(0)";
          track.dataset.current = "0";
        }, 650);
      } else {
        track.dataset.current = String(current);
        updateActivePress(cardIndex, current);
      }
    }, 2500);
    rollingTimers.push(timer);
  });
}

function selectPerspectiveArticle(cardIndex, articleIndex) {
  const track = document.getElementById(`titleTrack${cardIndex}`);
  if (!track) return;
  track.dataset.current = articleIndex;
  track.style.transition = "transform 0.4s ease";
  track.style.transform = `translateY(-${46 * articleIndex}px)`;
  updateActivePress(cardIndex, articleIndex);
}

function updateActivePress(cardIndex, articleIndex) {
  const cardType = perspectives[cardIndex].className;
  const list = document.getElementById(`pressList${cardIndex}`);
  const pills = document.querySelectorAll(`[id^="pressPill${cardIndex}_"]`);
  pills.forEach((pill, index) => {
    pill.classList.remove("active", "positive-active", "neutral-active", "negative-active");
    if (index === articleIndex) {
      pill.classList.add("active", `${cardType}-active`);
      if (list) {
        const targetLeft = pill.offsetLeft - list.offsetLeft - (list.clientWidth / 2) + (pill.clientWidth / 2);
        list.scrollTo({ left: targetLeft, behavior: "smooth" });
      }
    }
  });
}

function movePressList(cardIndex, direction) {
  const list = document.getElementById(`pressList${cardIndex}`);
  if (list) list.scrollLeft += direction * 100;
}

function checkPressArrow() {
  perspectives.forEach((item, index) => {
    const list = document.getElementById(`pressList${index}`);
    const prev = document.getElementById(`metaPrev${index}`);
    const next = document.getElementById(`metaNext${index}`);
    if (!list || !prev || !next) return;
    if (list.scrollWidth > list.clientWidth) {
      prev.classList.add("show");
      next.classList.add("show");
    } else {
      prev.classList.remove("show");
      next.classList.remove("show");
    }
  });
}

// 5. 기사 목록 및 탭
function renderArticles() {
  const list = document.getElementById("articleList");
  if (!list) return;

  const visible = articles.slice(0, visibleArticleCount);
  list.innerHTML = visible.length ? visible.map(a => `
    <article class="article-card" onclick="openArticleDetail('${a.article_id}')" style="cursor:pointer;">
      <div>
        <div class="article-source">${a.source || a.press || "언론사"}</div>
        <h3 class="article-title">${a.title}</h3>
        <p class="article-desc">${a.desc || "요약 정보가 없습니다."}</p>
      </div>
      <button class="original-btn">원문 보기</button>
    </article>`).join("") : "기사가 없습니다.";
}

// [Article Scope] 탭 렌더링
function renderAIArticles() {
  const list = document.getElementById("aiArticleList");
  if (!list) return;

  list.innerHTML = aiArticles.map(a => `
    <article class="article-card" onclick="openArticleDetail('${a.article_id}')" style="cursor:pointer;">
      <div>
        <div class="article-source">[ AI 분석 ]</div>
        <h3 class="article-title">${a.title}</h3>
        <p class="article-desc">${a.summary}</p>
      </div>
      <button class="original-btn">상세 보기</button>
    </article>`).join("");
}

/* ===== 3. 이동 함수 (확실히 정의) ===== */
function openArticleDetail(id) {
  if (!id) {
    showToast("기사 정보를 찾을 수 없습니다.");
    return;
  }

  // 상세 페이지로 article_id를 쿼리 스트링으로 들고 이동
  location.href = `/view/article_detail.html?article_id=${encodeURIComponent(id)}`;
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  if (!toast) return alert(msg);
  toast.textContent = msg; toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 2000);
}

// 6. 초기화
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const keyword = params.get("keyword") || "금리";
  fetchKeywordDetail(keyword);

  // 탭 바인딩
  document.querySelectorAll(".article-tab").forEach(tab => {
    tab.addEventListener("click", function() {
      const target = tab.dataset.tab;
      document.querySelectorAll(".article-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      if (target === "scope") {
        document.getElementById("articleList").classList.remove("hidden");
        document.getElementById("aiArticleList").classList.add("hidden");
      } else {
        document.getElementById("articleList").classList.add("hidden");
        document.getElementById("aiArticleList").classList.remove("hidden");
        renderAIArticles();
      }
    });
  });

  window.addEventListener("scroll", () => {
    if (window.scrollY + window.innerHeight >= document.body.offsetHeight - 200) {
      if (visibleArticleCount < articles.length) {
        visibleArticleCount += ARTICLE_LOAD_SIZE;
        renderArticles();
      }
    }
  });

  window.addEventListener("resize", checkPressArrow);

  // Perspective 클릭 이벤트 위임
  document.getElementById("perspectiveGrid").addEventListener("click", (e) => {
    const item = e.target.closest(".news-title-item");
    if (item && item.dataset.articleId) openArticleDetail(item.dataset.articleId);
  });
});

function reloadRandomKeyword() {
  document.body.style.opacity = "0.72";
  setTimeout(() => { location.href = "/view/keyword_detail.html"; }, 140);
}
