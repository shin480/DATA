<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>

<style>
/* ===== common.css ===== */
/* ==============================
   Common Utility Only
   메인 디자인 건드리지 않음
============================== */

.hidden {
  display: none !important;
}


/* ==============================
   Search Suggest Dropdown
   헤더 디자인은 main.css 기준
============================== */

.main-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-suggest-box {
  position: fixed;
  width: 260px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-top: 0;
  border-radius: 0 0 18px 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #00e5ff;
  font-weight: 900;
}


/* ==============================
   Footer
============================== */

.footer {
  border-top: 1px solid #111827;
  background: #070b1a;
  padding: 24px 0;
}

.footer-inner {
  width: 1440px;
  max-width: 100%;
  margin: 0 auto;
  padding: 0 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: #64748b;
  font-size: 12px;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  background-color: #ffffff;

  -webkit-mask-image: url("/view/img/data_favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;

  mask-image: url("/view/img/data_favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;

  flex-shrink: 0;
}

.footer-link {
  border: 0;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}


/* ==============================
   Footer Modal
============================== */

.footer-modal {
  position: fixed;
  inset: 0;
  background: rgba(2, 8, 23, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30000;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}


/* ==============================
   Responsive
============================== */

@media (max-width: 980px) {
  .footer-inner {
    padding: 0 24px;
    flex-wrap: wrap;
  }
}

@media (max-width: 640px) {
  .search-suggest-box {
    left: 18px !important;
    right: 18px !important;
    width: auto !important;
    max-width: none;
  }

  .footer-inner {
    padding: 0 18px;
  }
}

/* ===== main.css ===== */
/* [확실] 기본 스타일 */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050816; color: #e5e7eb; font-family: 'Pretendard', Arial, sans-serif; }
.page { width: 1440px; min-height: 100vh; margin: 0 auto; background: #050816; }

/* [확실] 헤더 */
.header {
    height: 72px; padding: 0 64px; display: flex; align-items: center; justify-content: space-between;
    background: #070b1a; border-bottom: 1px solid #111827;
}
.logo {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
}

.header-logo-full {
  height: 52px;
  width: auto;
  display: block;
  object-fit: contain;
}
.logo-mark {width: 34px;height: 34px;object-fit: contain;display: block;flex-shrink: 0;}
.nav { display: flex; align-items: center; gap: 30px; color: #94a3b8; font-size: 15px; }
.nav a { text-decoration: none; color: inherit; transition: color 0.2s; }
.nav a:hover { color: #00E5FF; }
.header-right { display: flex; align-items: center; gap: 12px; }
.search-box { width: 260px; height: 38px; border-radius: 999px; background: #0f172a; border: 1px solid #1e293b; padding: 0 16px; color: #94a3b8; }
.header-btn { height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid #334155; background: transparent; color: #cbd5e1; cursor: pointer; }

/* [확실] 히어로 섹션 */
.main { padding: 40px 64px 80px; }
.hero {
    height: 400px; border-radius: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.15), transparent 70%), #0f172a;
    border: 1px solid #1e293b; margin-bottom: 40px; position: relative;
}
.hero-badge { display: inline-block; padding: 8px 16px; border-radius: 999px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; font-size: 13px; font-weight: 700; margin-bottom: 24px; }
.hero h1 { font-size: 48px; line-height: 1.3; color: #fff; font-weight: 800; margin-bottom: 20px; }
.hero h1 span { color: #00E5FF; }
.hero p { color: #94a3b8; font-size: 16px; margin-bottom: 32px; }
.hero-tags { display: flex; gap: 12px; }
.h-tag { padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 14px; text-decoration: none; }

/* [확실] 감성 분석 & 지배적 여론 그리드 */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }
.card { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 40px; position: relative; }
.section-title-wrap span { color: #38bdf8; font-size: 13px; font-weight: 700; text-transform: uppercase; }
.section-title-wrap h2 { margin-top: 10px; font-size: 32px; color: #fff; font-weight: 800; }
.section-desc { font-size: 14px; color: #64748b; margin-top: 8px; }

.status-badge { display: inline-block; margin-top: 15px; padding: 6px 12px; border-radius: 8px; background: rgba(244, 114, 114, 0.15); color: #f47272; font-size: 12px; font-weight: 700; }

.gauge-container { display: flex; justify-content: space-between; margin: 40px 0; }
.gauge-item { text-align: center; }
.gauge-circle { width: 140px; height: 140px; border-radius: 50%; border: 8px solid #1e293b; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
.gauge-circle.pos { border-top-color: #00E5FF; border-right-color: #00E5FF; }
.gauge-circle.neg { border-color: #f47272; }
.gauge-circle.neu { border-top-color: #fbbf24; }
.gauge-circle .percent { font-size: 26px; font-weight: 800; color: #fff; }
.gauge-label { font-size: 12px; font-weight: 700; color: #64748b; }

.keyword-box { background: rgba(255,255,255,0.03); border-radius: 20px; padding: 24px; margin-top: 20px; }
.keyword-box-title { font-size: 13px; color: #64748b; margin-bottom: 16px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { padding: 8px 16px; border-radius: 999px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 13px; }

.opinion-card { background: rgba(255,255,255,0.03); border-radius: 24px; padding: 32px; margin-top: 25px; position: relative; min-height: 280px; }
.quote-icon { font-size: 32px; color: #38bdf8; margin-bottom: 20px; opacity: 0.5; }
.opinion-text { font-size: 20px; line-height: 1.6; color: #e2e8f0; font-weight: 500; }
.opinion-tags { position: absolute; bottom: 32px; left: 32px; display: flex; gap: 8px; }
.o-tag { padding: 6px 12px; border-radius: 6px; background: #1e293b; color: #94a3b8; font-size: 11px; }
.nav-btns { position: absolute; bottom: 32px; right: 32px; display: flex; gap: 12px; }
.nav-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; color: #94a3b8; cursor: pointer; }

/* [확실] 감성 비교 섹션 */
.sentiment-compare { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 40px; margin-bottom: 40px; }
.sentiment-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
.sentiment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.news-card { background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; min-height: 320px; }
.news-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.media-name { font-size: 15px; font-weight: 700; color: #f8fafc; }
.s-badge { padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; }
.s-badge.pos { background: rgba(0, 229, 255, 0.1); color: #00E5FF; }
.s-badge.neg { background: rgba(244, 114, 114, 0.1); color: #f47272; }
.s-badge.neu { background: rgba(148, 163, 184, 0.1); color: #94a3b8; }
.news-card h3 { font-size: 22px; line-height: 1.4; color: #fff; font-weight: 700; margin-bottom: 16px; word-break: keep-all; }
.news-card p { font-size: 14px; line-height: 1.6; color: #94a3b8; flex-grow: 1; margin-bottom: 24px; }
.action-btn { height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #cbd5e1; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

/* [확실] 관점 분석 섹션 */
.viewpoint-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 40px; margin-bottom: 40px; }
.view-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; max-height: 440px; overflow: hidden; transition: max-height .6s ease; margin-top: 24px; }
.view-grid.expanded { max-height: 2500px; }
.view-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; }
.view-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.view-icon-box { width: 44px; height: 44px; border-radius: 50%; background: #0f172a; border: 2px solid; display: grid; place-items: center; font-size: 20px; }
.view-title-group .vt { font-size: 14px; font-weight: 700; }
.view-title-group .vp { font-size: 24px; font-weight: 900; }
.view-bar-bg { height: 6px; background: #334155; border-radius: 999px; overflow: hidden; margin-bottom: 15px; }
.view-bar-fill { height: 100%; border-radius: 999px; transition: width 0.8s ease; }
.reason-label { font-size: 11px; color: #38bdf8; font-weight: 700; margin-bottom: 8px; }
.view-reason { color: #cbd5e1; font-size: 13px; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
.detail-btn { width: fit-content; padding: 0 12px; height: 36px; border-radius: 8px; background: transparent; border: 1px solid #334155; color: #94a3b8; font-size: 12px; cursor: pointer; }
.toggle-btn { width: 100%; height: 52px; margin-top: 28px; border-radius: 14px; border: 1px solid #1e293b; background: #111827; color: #38bdf8; font-weight: 600; font-size: 15px; cursor: pointer; }

/* 지금 뜨는 뉴스 */
.news-section { background: #0f172a; border: 1px solid #1e293b; border-radius: 28px; padding: 40px; margin-top: 40px; }
.news-header { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
.news-header h2 { font-size: 24px; color: #fff; font-weight: 800; }
.realtime-dot { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #94a3b8; }
.dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; }

.news-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 24px; }
.news-item-card { background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }

.news-badge { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; margin-bottom: 12px; padding: 4px 10px; border-radius: 6px; }
.badge-like { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
.badge-dislike { color: #f47272; background: rgba(244, 114, 114, 0.1); }

.news-main-row { display: flex; align-items: flex-start; gap: 12px; width: 100%; margin-bottom: 20px; }
.news-rank-circle { min-width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid #00E5FF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #00E5FF; }
.news-title { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.4; text-align: left; word-break: keep-all; }

.news-quote { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; flex-grow: 1; text-align: left; }

.reaction-row { display: flex; gap: 16px; margin-bottom: 20px; width: 100%; justify-content: flex-start; }
.react-item { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #94a3b8; }
.react-item.up { color: #3b82f6; }
.react-item.down { color: #ef4444; }

.news-footer-btn { width: 100%; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid #334155; color: #94a3b8; font-size: 13px; cursor: pointer; text-align: left; padding-left: 16px; }

/* 컬러 유틸리티 */
.c-teal { color: #2dd4bf; border-color: #2dd4bf; } .bg-teal { background: #2dd4bf; }
.c-purple { color: #a855f7; border-color: #a855f7; } .bg-purple { background: #a855f7; }
.c-blue { color: #3b82f6; border-color: #3b82f6; } .bg-blue { background: #3b82f6; }
.c-orange { color: #fb923c; border-color: #fb923c; } .bg-orange { background: #fb923c; }
.c-yellow { color: #facc15; border-color: #facc15; } .bg-yellow { background: #facc15; }

</style>
</head>

/* ===== common.js ===== */
// ==============================
// 공통 UI 로드
// ==============================
document.addEventListener("DOMContentLoaded", function () {
  loadHeader();

  bindGlobalClickEvents();
});


// ==============================
// 로그인 정보 가져오기
// ==============================
function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||
      localStorage.getItem("userName"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}


// ==============================
// Header 불러오기
// ==============================
function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  if (headerArea.innerHTML.trim()) {
    setHeaderLoginState();
    bindCommonSearch();
    return;
  }

  fetch("/view/header.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("header.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}


// ==============================
// Footer 불러오기
// ==============================
function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  if (footerArea.innerHTML.trim()) {
    return;
  }

  fetch("/view/footer.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("footer.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}


// ==============================
// Header 로그인 상태 처리
// ==============================
function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  if (!loginBtn || !joinBtn || !primaryUserBtn || !logoutBtn) return;

  const loginInfo = getLoginInfo();
  const token = loginInfo.token;
  const role = loginInfo.role;

  if (!token) {
    loginBtn.classList.remove("hidden");
    joinBtn.classList.remove("hidden");
    primaryUserBtn.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  loginBtn.classList.add("hidden");
  joinBtn.classList.add("hidden");
  primaryUserBtn.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");

  const isAdmin =
    role === "ADMIN" ||
    role === "SUPERADMIN" ||
    role === "admin" ||
    role === "superadmin" ||
    token === "admin-test-token";

  if (isAdmin) {
    primaryUserBtn.innerText = "관리자 페이지";
  } else {
    primaryUserBtn.innerText = "마이페이지";
  }
}


// ==============================
// 로그인 필요 페이지 이동
// ==============================
window.goLoginRequiredPage = function (targetUrl) {
  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
    return;
  }

  location.href = targetUrl;
};


// ==============================
// 전역 클릭 이벤트
// fetch로 늦게 들어온 header도 작동
// ==============================
function bindGlobalClickEvents() {
  document.addEventListener("click", function (e) {
    const loginBtn = e.target.closest("#loginBtn");
    const joinBtn = e.target.closest("#joinBtn");
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");

    const heroTag = e.target.closest(".h-tag");
    const chip = e.target.closest(".chip");
    const actionBtn = e.target.closest(".action-btn");
    const newsFooterBtn = e.target.closest(".news-footer-btn");
    const detailBtn = e.target.closest(".detail-btn");

    if (loginBtn) {
      e.preventDefault();
      location.href = "/view/login.html";
      return;
    }

    if (joinBtn) {
      e.preventDefault();
      location.href = "/view/terms.html";
      return;
    }

    if (primaryUserBtn) {
      e.preventDefault();

      const loginInfo = getLoginInfo();
      const role = loginInfo.role;
      const token = loginInfo.token;

      const isAdmin =
        role === "ADMIN" ||
        role === "SUPERADMIN" ||
        role === "admin" ||
        role === "superadmin" ||
        token === "admin-test-token";

      if (isAdmin) {
        location.href = "/view/admin_dashboard.html";
      } else {
        location.href = "/view/mypage_home.html";
      }

      return;
    }

    if (logoutBtn) {
      e.preventDefault();
      logout();
      return;
    }

    if (loginRequiredLink) {
      e.preventDefault();

      const targetUrl = loginRequiredLink.dataset.loginPage;
      goLoginRequiredPage(targetUrl);
      return;
    }

    if (heroTag) {
      e.preventDefault();

      const keyword = heroTag.innerText.replace("#", "").trim();
      goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
      return;
    }

    if (chip) {
      e.preventDefault();

      const keyword = chip.innerText.trim();
      goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
      return;
    }

    if (actionBtn) {
      e.preventDefault();
      goLoginRequiredPage("/view/article_detail.html");
      return;
    }

    if (newsFooterBtn) {
      e.preventDefault();
      goLoginRequiredPage("/view/article_detail.html");
      return;
    }

    if (detailBtn) {
      e.preventDefault();

      const title = detailBtn.dataset.title;
      const percent = detailBtn.dataset.percent;

      if (title) {
        localStorage.setItem("viewpoint_title", title);
      }

      if (percent) {
        localStorage.setItem("viewpoint_percent", percent);
      }

      goLoginRequiredPage("/view/viewpoint_detail.html");
    }
  });
}

const searchKeywordPool = [
  "금리",
  "기준금리",
  "대출",
  "가계부채",
  "물가",
  "환율",

  "소비심리",
  "금융시장"

function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");

  if (!input) return;

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  const results = searchKeywordPool
    .filter(function (item) {
      return item.includes(value);
    })
    .slice(0, 6);

  if (results.length === 0) {
    hideSearchSuggestions();
    return;
  }

  list.innerHTML = results.map(function (item) {
    return `
      <button
        class="search-suggest-item"
        type="button"
        data-suggest-keyword="${item}"
      >
        <span class="search-suggest-left">
          <span class="search-suggest-icon">⌕</span>
          <span class="search-suggest-keyword">${highlightKeyword(item, value)}</span>
        </span>

        <span class="search-suggest-arrow">↖</span>
      </button>
    `;
  }).join("");

  document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const keyword = btn.dataset.suggestKeyword;
      selectSearchSuggestion(keyword);
    });
  });

  positionSearchSuggestBox();
  suggestBox.classList.remove("hidden");
}

function positionSearchSuggestBox() {
  const input = document.getElementById("commonSearchInput");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!input || !suggestBox) return;

  const rect = input.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
}

/* [확실] 화면에 카드를 그리는 핵심 렌더링 함수 */
function renderViewGrid(data) {
    const viewGrid = document.getElementById("viewGrid");
    if (!viewGrid) return;

    let htmlContent = "";

    data.forEach(group => {
        group.items.forEach(item => {
            htmlContent += `
                <div class="view-card">
                    <div class="view-top">
                        <div class="view-icon-box c-${item.color}">${item.icon}</div>
                        <div class="view-title-group">
                            <div class="vt c-${item.color}">${item.title}</div>
                            <div class="vp c-${item.color}">${item.percent}%</div>
                        </div>
                    </div>
                    <div class="view-bar-bg">
                        <div class="view-bar-fill bg-${item.color}" style="width:${item.percent}%"></div>
                    </div>
                    <div class="reason-label">주요 근거</div>
                    <div class="view-reason">"${item.reason}"</div>
                    <button
                      class="detail-btn"
                      data-title="${item.title}"
                      data-percent="${item.percent}"
                    >
                      상세 보기 >
                    </button>
                </div>`;
        });

        // 5-4-5-4 그리드 정렬을 위한 스페이서 로직 유지
        if (group.items.length === 4) {
            htmlContent += `<div class="view-spacer" style="visibility:hidden;"></div>`;
        }
    });

    viewGrid.innerHTML = htmlContent;
}

/* [확실] 백엔드 데이터를 가져와서 groups와 병합하는 함수 */
async function loadAnalysisData() {
    try {
        // 백엔드 API 호출 (실제 FastAPI 주소로 변경하세요)
        // const { data: mlResults } = await axios.get("/api/v1/analysis");
        
        // 예시용 가짜 데이터 (서버에서 올 데이터 구조)
        const mockServerData = {
            "gov": { "percent": 0, "reason": "데이터를 불러오는 중입니다..." },
            "ind": { "percent": 20, "reason": "데이터를 불러오는 중입니다..." }
            // ... 나머지 id들도 서버에서 온다고 가정
        };

        // 기준 데이터(groups)를 깊은 복사하여 수치 업데이트
        const updatedData = JSON.parse(JSON.stringify(groups));
        
        updatedData.forEach(group => {
            group.items.forEach(item => {
                if (mockServerData[item.id]) {
                    item.percent = mockServerData[item.id].percent;
                    item.reason = mockServerData[item.id].reason;
                }
            });
        });

        // 화면 갱신
        renderViewGrid(updatedData);
        console.log("분석 데이터 로드 및 렌더링 완료 [확실]");

    } catch (err) {
        console.error("데이터 로드 에러:", err);
        // 에러 시 초기 템플릿(로딩중 표시)이라도 출력
        renderViewGrid(groups);
    }
}
