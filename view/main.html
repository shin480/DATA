<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DATA 다타 - AI 뉴스 인사이트</title>

<link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">
<link
  rel="preload"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>

<style>
/* =========================================================
   0. 기본 설정
========================================================= */
html {
  overflow-y: scroll;
}

html,
body {
  overflow-x: hidden;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.hidden {
  display: none !important;
}

body {
  background: #050816;
  color: #e5e7eb;
  font-family: "Pretendard", Arial, sans-serif;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 1300px;
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 72px;
  background: #050816;
}

.main {
  padding: 40px 64px 80px;
}


/* =========================================================
   1. 헤더
========================================================= */
.header {
  position: fixed;
  top: 0;
  left: 0;
  transform: none;
  z-index: 10000;

  width: 100%;
  height: 72px;
  padding: 0 56px;

  display: flex;
  align-items: center;

  background: #070b1a;
  border-bottom: 1px solid #111827;
}

.logo {
  width: 155px;
  height: 52px;
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  overflow: hidden;
}

.header-logo-full {
  height: 52px;
  width: auto;
  display: block;
  object-fit: contain;
}

.nav {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: 22px;
  color: #6b7280;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}

.nav a {
  text-decoration: none;
  color: inherit;
  transition: color 0.18s;
}

.nav a:hover {
  color: #00e5ff;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}


/* 검색창 */
.main-search-wrap {
  position: relative;
  width: 410px;
  height: 40px;
  border-radius: 999px;
  background: #070b1a;
  border: 1px solid #1f2937;
  display: flex;
  align-items: center;
  padding: 0 14px 0 20px;
}

.main-search-wrap:focus-within {
  border-color: #334155;
}

.search-box {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 15px;
  padding: 0;
}

.search-box::placeholder {
  color: #7c8493;
}

.search-icon-btn {
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: #8b95a7;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}

.search-icon-btn:hover {
  color: #00e5ff;
}


/* 테마 버튼 */
.theme-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #070b1a;
  color: #facc15;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-btn:hover {
  border-color: #334155;
}


/* 로그인 / 회원가입 버튼 */
.header-btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.header-btn.login {
  border: 1px solid #00cfe8;
  background: #00cfe8;
  color: #020617;
}

.header-btn.login:hover {
  filter: brightness(1.08);
}

.header-btn.join {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
}

.header-btn.join:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}


/* =========================================================
   2. 검색 자동완성
========================================================= */
.search-suggest-box {
  position: fixed;
  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #41bfe0;
  font-weight: 900;
}


/* =========================================================
   3. 히어로 섹션
========================================================= */
.hero {
  height: 400px;
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  background:
    radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.15), transparent 70%),
    #0f172a;

  border: 1px solid #1e293b;
  margin-bottom: 40px;
  position: relative;
}

.hero-badge {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: #38bdf8;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 24px;
}

.hero h1 {
  font-size: 48px;
  line-height: 1.3;
  color: #fff;
  font-weight: 800;
  margin-bottom: 20px;
}

.hero h1 span {
  color: #00e5ff;
}

.hero p {
  color: #94a3b8;
  font-size: 16px;
  margin-bottom: 32px;
}

.hero-tags {
  display: flex;
  gap: 12px;
}

.h-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  line-height: 1;
  padding: 8px 18px;

  font-family: "Pretendard", sans-serif;
  text-decoration: none;
  cursor: pointer;

  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #94a3b8;
  font-size: 14px;

  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
}

.h-tag:hover {
  color: #00e5ff;
  background: rgba(0, 229, 255, 0.14);
  border-color: rgba(0, 229, 255, 0.2);
}


/* =========================================================
   4. 상단 데이터 카드 공통
========================================================= */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 40px;
}

.card {
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 28px;
  padding: 40px;
  position: relative;
}

.section-title-wrap span {
  color: #38bdf8;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
}

.section-title-wrap h2 {
  margin-top: 10px;
  font-size: 32px;
  color: #fff;
  font-weight: 800;
}

.section-desc {
  font-size: 14px;
  color: #64748b;
  margin-top: 8px;
}


/* =========================================================
   5. 오늘의 핵심 키워드 카드
========================================================= */
.top-keyword-title {
  width: fit-content;
  cursor: pointer;
  transition: color 0.18s ease;
}

.top-keyword-title:hover {
  color: #00e5ff;
}

.status-badge {
  display: inline-block;
  margin-top: 15px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}

/* 긍정 여론 우세 = 민트 */
.status-badge.positive {
  background: rgba(0, 229, 255, 0.15);
  color: #00e5ff;
}

/* 부정 여론 우세 = 빨강 */
.status-badge.negative {
  background: rgba(244, 114, 114, 0.15);
  color: #f47272;
}

/* 중립 여론 우세 = 노랑 */
.status-badge.neutral {
  background: rgba(251, 191, 36, 0.15);
  color: #fbbf24;
}


/* 감성 게이지 */
.gauge-container {
  display: flex;
  justify-content: space-between;
  margin: 40px 0;
}

.gauge-item {
  text-align: center;
}

.gauge-circle {
  --percent: 0;

  width: 140px;
  height: 140px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 15px;
  position: relative;

  background:
    conic-gradient(
      var(--gauge-color) calc(var(--percent) * 1%),
      #1e293b 0
    );

  transition: background 0.18s ease;
}

.gauge-circle::before {
  content: "";
  position: absolute;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  background: #0f172a;
}

.gauge-circle .percent {
  position: relative;
  z-index: 2;
  font-size: 26px;
  font-weight: 800;
  color: #fff;
}

.gauge-circle.pos {
  --gauge-color: #00e5ff;
}

.gauge-circle.neg {
  --gauge-color: #f47272;
}

.gauge-circle.neu {
  --gauge-color: #fbbf24;
}

.gauge-label {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
}


/* 주요 키워드 */
.keyword-box {
  background: rgba(255,255,255,0.03);
  border-radius: 20px;
  padding: 24px;
  margin-top: 20px;
}

.keyword-box-title {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 16px;
}

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 8px 16px;
  border-radius: 999px;

  background: rgba(56, 189, 248, 0.1);
  color: #38bdf8;

  font-size: 13px;
  cursor: pointer;
  text-decoration: none;

  transition:
    color 0.18s ease,
    border-color 0.18s ease,
    background 0.18s ease;
}

.chip:hover {
  color: #00e5ff;
  background: rgba(0, 229, 255, 0.14);
}


/* =========================================================
   6. 오늘의 지배적 여론 카드
========================================================= */
.opinion-card {
  background: rgba(255,255,255,0.03);
  border-radius: 24px;
  padding: 32px;
  margin-top: 25px;
  position: relative;
  min-height: 380px;
}

.quote-icon {
  font-size: 45px;
  color: #38bdf8;
  margin-bottom: 20px;
  opacity: 0.5;
}

.opinion-text {
  font-size: 20px;
  line-height: 1.6;
  color: #e2e8f0;
  font-weight: 500;
}

.opinion-text {
  cursor: pointer;
  transition: color 0.18s ease;
}

.opinion-text:hover {
  color: #00e5ff;
}

body.light-mode .opinion-text:hover {
  color: #4cb7d3;
}

.opinion-tags {
  position: absolute;
  bottom: 32px;
  left: 32px;
  display: flex;
  gap: 8px;
}

.o-tag {
  padding: 6px 12px;
  border-radius: 6px;
  background: #1e293b;
  color: #94a3b8;
  font-size: 11px;
}

.nav-btns {
  position: absolute;
  bottom: 32px;
  right: 32px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid #334155;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #94a3b8;
  cursor: pointer;
}

.nav-btn:hover {
  border-color: #334155;
  background: rgba(255,255,255,0.06);
  color: #ffffff;
}

.opinion-page {
  min-width: 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  color: #f1f5f9;
}


/* =========================================================
   7. 감성 비교 섹션
========================================================= */
.sentiment-compare {
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 28px;
  padding: 40px;
  margin-bottom: 40px;
}

.sentiment-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 32px;
}

.sentiment-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.news-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 24px;
  padding: 32px;

  display: flex;
  flex-direction: column;
  min-height: 320px;
}

.news-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.media-name {
  font-size: 15px;
  font-weight: 700;
  color: #f8fafc;
}

.s-badge {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
}

.s-badge.pos {
  background: rgba(0, 229, 255, 0.1);
  color: #00e5ff;
}

.s-badge.neg {
  background: rgba(244, 114, 114, 0.1);
  color: #f47272;
}

.s-badge.neu {
  background: rgba(148, 163, 184, 0.1);
  color: #94a3b8;
}

.news-card h3 {
  font-size: 22px;
  line-height: 1.4;
  color: #fff;
  font-weight: 700;
  margin-bottom: 16px;
  word-break: keep-all;
}

.news-card p {
  font-size: 14px;
  line-height: 1.6;
  color: #94a3b8;
  flex-grow: 1;
  margin-bottom: 24px;
}

.action-btn {
  height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #cbd5e1;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.action-btn:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}


/* =========================================================
   8. 핵심 키워드 관점 분석 섹션
========================================================= */
.viewpoint-box {
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 28px;
  padding: 40px;
  margin-bottom: 40px;
}

.view-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;

  max-height: 440px;
  overflow: hidden;
  transition: max-height 0.18s ease;
  margin-top: 24px;
}

.view-grid.expanded {
  max-height: 2500px;
}

.view-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 20px;
  padding: 24px;

  display: flex;
  flex-direction: column;
}

.view-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.view-icon-box {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #0f172a;
  border: 2px solid;

  display: grid;
  place-items: center;
  font-size: 20px;
}

.view-icon-img {
  width: 22px;
  height: 22px;
  object-fit: contain;
  display: block;
}

.view-title-group .vt {
  font-size: 14px;
  font-weight: 700;
}

.view-title-group .vp {
  font-size: 24px;
  font-weight: 900;
}

.view-bar-bg {
  height: 6px;
  background: #334155;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 15px;
}

.view-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.18s ease;
}

.reason-label {
  font-size: 11px;
  color: #38bdf8;
  font-weight: 700;
  margin-bottom: 8px;
}

.view-reason {
  color: #cbd5e1;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 20px;
  flex-grow: 1;
}

.detail-btn {
  width: fit-content;
  height: 36px;
  padding: 0 12px;

  border-radius: 8px;
  background: transparent;
  border: 1px solid #334155;
  color: #94a3b8;

  font-size: 12px;
  cursor: pointer;
}

.detail-btn:hover {
  border-color: #334155;
  background: rgba(255,255,255,0.08);
  color: #ffffff;
}

.toggle-btn {
  width: 100%;
  height: 52px;
  margin-top: 28px;

  border-radius: 14px;
  border: 1px solid #1e293b;
  background: #111827;
  color: #38bdf8;

  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}

.toggle-btn:hover {
  border-color: #334155;
  background: rgba(255,255,255,0.06);
  color: #ffffff;
}

.small-text {
  font-size: 0.8em;
}


/* =========================================================
   9. 지금 뜨는 뉴스
========================================================= */
.news-section {
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 28px;
  padding: 40px;
  margin-top: 40px;
}

.news-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 30px;
}

.news-header h2 {
  font-size: 24px;
  color: #fff;
  font-weight: 800;
}

.realtime-dot {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #94a3b8;
}

.dot {
  width: 8px;
  height: 8px;
  background: #38bdf8;
  border-radius: 50%;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.news-item-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 24px;
  padding: 28px 20px;

  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
}

.news-badge {
  display: flex;
  align-items: center;
  gap: 4px;

  font-size: 11px;
  font-weight: 700;

  margin-bottom: 12px;
  padding: 4px 10px;
  border-radius: 6px;
}

.badge-like {
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.1);
}

.badge-dislike {
  color: #f47272;
  background: rgba(244, 114, 114, 0.1);
}

.badge-battle {
  background: rgba(203, 213, 225, 0.18);
  color: #cbd5e1;
  font-weight: 700;
  border: rgba(203, 213, 225, 0.35);
  backdrop-filter: blur(4px);
}

.news-main-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  margin-bottom: 20px;
}

.news-rank-circle {
  min-width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px solid #00e5ff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 800;
  color: #00e5ff;
}

.news-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  line-height: 1.4;
  text-align: left;
  word-break: keep-all;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;

  overflow: hidden;
  text-overflow: ellipsis;
}

.news-quote {
  font-size: 13px;
  color: #94a3b8;
  line-height: 1.6;
  margin-bottom: 24px;
  flex-grow: 1;
  text-align: left;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;

  overflow: hidden;
  text-overflow: ellipsis;
}

.reaction-row {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  width: 100%;
  justify-content: flex-start;
}

.react-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 600;
  color: #94a3b8;
}

.react-item.up {
  color: #3b82f6;
}

.react-item.down {
  color: #ef4444;
}

.news-footer-btn {

<script>
/* =========================================================
   1. 페이지 초기 공통 실행
========================================================= */
document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();
  bindGlobalClickEvents();
});


/* =========================================================
   2. 다크모드 / 라이트모드
========================================================= */
function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  } else {
    document.body.classList.remove("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  }
}


/* =========================================================
   3. 로그인 정보 / 로그인 상태 처리
========================================================= */
function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||

/* =========================================================
   6. 검색 자동완성
========================================================= */
function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(
    regex,
    `<span class="search-highlight">$1</span>`
  );
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;
        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();
    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);
    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
  );
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`
  );
}

let opinionList = [];
let opinionIndex = 0;

async function loadDominantOpinion() {
  try {
    const res = await axios.get("/api/main/dominant-opinions");

    opinionList = res.data.opinions || [];

    if (opinionList.length === 0) {
      opinionList = [
        {
          title: "분석할 여론 데이터가 아직 없습니다.",
          keyword: "데이터 없음",
          sentiment: "대기"
        }
      ];
    }

    opinionIndex = 0;
    renderOpinion();

  } catch (err) {
    console.error("오늘의 지배적 여론 로딩 실패:", err);

    opinionList = [
      {
        title: "여론 데이터를 불러오지 못했습니다.",
        keyword: "오류",
        sentiment: "대기"
      }
    ];

    renderOpinion();
  }
}

function renderOpinion() {
  const opinionText = document.querySelector(".opinion-text");
  const tags = document.querySelectorAll(".opinion-tags .o-tag");
  const pageText = document.querySelector(".opinion-page");

  if (!opinionText) return;

  const item = opinionList[opinionIndex];

  opinionText.innerText = item.title || "";
  opinionText.dataset.scopeId = item.scope_id || "";

  if (tags[0]) {
    tags[0].innerText = item.keyword || "";
  }

  if (tags[1]) {
    tags[1].innerText = convertSentimentText(item.sentiment);
  }

  if (pageText) {
    pageText.innerText = `${opinionIndex + 1} / ${opinionList.length}`;
  }
}

function convertSentimentText(sentiment) {
  if (sentiment === "positive") return "긍정";
  if (sentiment === "negative") return "부정";
  if (sentiment === "neutral") return "중립";

  return sentiment || "중립";
}

function prevOpinion() {
  if (opinionList.length === 0) return;

  opinionIndex--;

  if (opinionIndex < 0) {
    opinionIndex = opinionList.length - 1;
  }

  renderOpinion();
}

function nextOpinion() {
  if (opinionList.length === 0) return;

  opinionIndex++;

  if (opinionIndex >= opinionList.length) {
    opinionIndex = 0;
  }

  renderOpinion();
}

setInterval(function () {
  nextOpinion();
}, 5000);

/* 관점 카드 렌더링 */
function renderViewGrid(data) {
  const viewGrid = document.getElementById("viewGrid");

  if (!viewGrid) return;

  let htmlContent = "";

  data.forEach(group => {
    group.items.forEach(item => {
      const percent = Number(item.percent) || 0;
      const percentText = item.percent_label || (percent + "%");

      htmlContent += `
        <div class="view-card">

          <div class="view-top">
            <div class="view-icon-box c-${item.color}">
              <img src="${item.icon}" class="view-icon-img">
            </div>

            <div class="view-title-group">
              <div class="vt c-${item.color}">
                ${item.title}
              </div>

              <div class="vp c-${item.color}">
                ${percentText}
              </div>
            </div>
          </div>

          <div class="view-bar-bg">
            <div
              class="view-bar-fill bg-${item.color}"
              style="width:${percent}%"
            ></div>
          </div>

          <div class="reason-label">
            주요 근거
          </div>

          <div class="view-reason">
            "${item.reason}"
          </div>

          <button
            class="detail-btn"
            data-title="${item.title}"
            data-percent="${percent}"
          >
            상세 보기 >
          </button>

        </div>
      `;
    });

    if (group.items.length === 4) {
      htmlContent += `
        <div
          class="view-spacer"
          style="visibility:hidden;"
        ></div>
      `;
    }
  });

  viewGrid.innerHTML = htmlContent;

  requestAnimationFrame(() => {
    document.querySelectorAll(".view-bar-fill").forEach(bar => {
      const width = bar.style.width;
      bar.style.width = "0%";

      setTimeout(() => {
        bar.style.width = width;
      }, 50);
    });
  });
}


/* 메인 핵심 키워드 관점 분석 데이터 조회 */
async function loadAnalysisData() {
  try {
    const { data } = await axios.get("/api/main/viewpoint-analysis");

    currentViewpointKeyword = data.keyword || "";

    const serverMap = {};

    data.items.forEach(item => {
      serverMap[item.id] = {
        percent: item.percent,
        percent_label: item.percent_label,
        reason: item.reason
      };
    });

    const updatedData = JSON.parse(JSON.stringify(groups));

    updatedData.forEach(group => {
      group.items.forEach(item => {
        if (serverMap[item.id]) {
          item.percent = serverMap[item.id].percent;
          item.percent_label = serverMap[item.id].percent_label;
          item.reason = serverMap[item.id].reason;
        }
      });
    });

    renderViewGrid(updatedData);

  } catch (err) {
    console.error("핵심 키워드 관점 분석 로딩 실패:", err);
    renderViewGrid(groups);
  }
}


/* 관점 전체 보기 토글 */
function toggleView() {
  const grid = document.getElementById("viewGrid");
  const btn = document.getElementById("toggleBtn");

  if (!grid || !btn) return;

  grid.classList.toggle("expanded");

  btn.innerText = grid.classList.contains("expanded")
    ? "접기 ∧"
    : "전체 18개 관점 보기 ∨";
}


/* =========================================================
   11. 게이지 업데이트
========================================================= */
function updateGauge(selector, percent) {
  const gauge = document.querySelector(selector);

  if (!gauge) return;

  gauge.style.setProperty("--percent", percent);

  const text = gauge.querySelector(".percent");

  if (text) {
    text.innerText = `${percent}%`;
  }
}
