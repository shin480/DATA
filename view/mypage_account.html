<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DATA 다타 - 회원정보 관리</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <style>
    /* =========================================================
       0. 기본 설정
    ========================================================= */
    html {
      overflow-y: scroll;
    }

    html,
    body {
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .hidden {
      display: none !important;
    }

    body {
      background: #050816;
      color: #d9e7ff;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      padding-top: 72px;
      background: #050816;

      display: flex;
      flex-direction: column;
    }

    .layout {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex: 1;
      align-items: stretch;
    }

    /* =========================================================
       1. 사이드바
    ========================================================= */
    aside {
      width: 230px;
      background: #0b1020;
      padding-top: 45px;
      border-right: 1px solid #121a2d;
      flex-shrink: 0;
    }

    .side-title-wrap {
      padding: 0 24px 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid #2f3748;
    }

    .side-title {
      color: #6e7c98;
      font-size: 13px;
    }

    .side-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .side-menu li {
      height: 46px;
      display: flex;
      align-items: center;
      padding-left: 28px;
      color: #6f7d98;
      font-size: 14px;
      border-left: 4px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }

    .side-menu li:hover {
      background: #10192b;
    }

    .side-menu li.active {
      background: #132137;
      color: #42bfff;
      border-left-color: #24bfff;
      font-weight: 700;
    }

    /* =========================================================
       2. 회원정보 관리 본문
    ========================================================= */
    main {
      min-width: 0;
      flex: 1;
      padding: 42px 28px 80px;
    }

    .account-wrap {
      width: 430px;
      margin: 0 auto;
      padding-top: 15px;
    }

    .account-title {
      text-align: center;
      margin-bottom: 26px;
    }

    .account-title .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .account-brand-logo {
      height: 38px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .account-title h2 {
      font-size: 20px;
      color: #f1f6ff;
      margin-bottom: 8px;
    }

    .account-title p {
      color: #63728d;
      font-size: 12px;
    }

    .form-group {
      border-bottom: 1px solid #1a2540;
      padding: 10px 0;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #1a2540;
    }

    .form-row .form-group {
      border-bottom: none;
    }

    label {
      display: block;
      color: #5f789e;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .value {
      color: #dce8ff;
      font-size: 13px;
      padding-bottom: 2px;
    }

    .input {
      width: 100%;
      height: 42px;
      border: 1px solid #123450;
      border-radius: 10px;
      background: #071522;
      color: #dce8ff;
      padding: 0 14px;
      outline: none;
    }

    .input::placeholder {
      color: #52637c;
    }

    .input:focus {
      border-color: rgba(0, 229, 255, 0.72);
      box-shadow:
        0 0 0 1px rgba(0, 229, 255, 0.14),
        0 0 12px rgba(0, 229, 255, 0.16);
    }

    .error {
      color: #ff4e5f;
      font-size: 11px;
      margin-top: 8px;
      font-weight: 700;
    }

    .submit-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: #10c8f5;
      color: #00131f;
      font-weight: 800;
      margin-top: 18px;
      cursor: pointer;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
    }

    .delete-box {
      margin-top: 24px;
      border: 1px solid #5a1f22;
      background: #120b0b;
      border-radius: 12px;
      padding: 18px;
    }

    .delete-title {
      color: #ff4e5f;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .delete-desc {
      color: #7f5d5d;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .delete-btn {
      width: 100%;
      height: 38px;
      background: transparent;
      border: 1px solid #ff4e5f;
      color: #ff4e5f;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #251010;
    }

    /* =========================================================
       3. 헤더 - main.html과 통일
    ========================================================= */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      transform: none;
      z-index: 10000;

      width: 100%;
      height: 72px;
      padding: 0 56px;

      display: flex;
      align-items: center;

      background: #070b1a;
      border-bottom: 1px solid #111827;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      width: 155px;
      height: 52px;
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    .header-logo-full {
      height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-left: 22px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .nav a {
      text-decoration: none;
      color: inherit;
      transition: color 0.18s;
    }

    .nav a:hover {
      color: #00e5ff;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-search-wrap {
      position: relative;
      width: 370px;
      height: 40px;
      border-radius: 999px;
      background: #070b1a;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      padding: 0 14px 0 20px;
    }

    .main-search-wrap:focus-within {
      border-color: rgba(0, 229, 255, 0.85);
      box-shadow:
        0 0 0 1px rgba(0, 229, 255, 0.18),
        0 0 14px rgba(0, 229, 255, 0.32),
        0 0 28px rgba(0, 229, 255, 0.14);
    }

    .search-box {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 15px;
      padding: 0;
    }

    .search-box::placeholder {
      color: #7c8493;
    }

    .search-icon-btn {
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      color: #8b95a7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    .search-icon-btn:hover {
      color: #00e5ff;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      background: #070b1a;
      color: #facc15;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-btn:hover {
      border-color: #334155;
    }

    .header-btn {
      height: 40px;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .header-btn.login {
      border: 1px solid #00cfe8;
      background: #00cfe8;
      color: #020617;
    }

    .header-btn.login:hover {
      filter: brightness(1.08);
    }

    .header-btn.join {
      border: 1px solid #475569;
      background: transparent;
      color: #cbd5e1;
    }

    .header-btn.join:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .header-user-name {
      display: inline-flex;
      align-items: center;
      height: 40px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      margin-left: 2px;
      margin-right: 2px;
    }

    /* =========================================================
       4. 검색 자동완성 - main.html과 통일
    ========================================================= */
    .search-suggest-box {
      position: fixed;
      width: 410px;
      max-width: 80vw;
      padding: 10px 0 12px;
      border: 1px solid #1e293b;
      border-radius: 18px;
      background: #050b1c;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      z-index: 20000;
      overflow: hidden;
    }

    .search-suggest-list {
      display: flex;
      flex-direction: column;
    }

    .search-suggest-item {
      width: 100%;
      height: 38px;
      padding: 0 16px;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font-size: 15px;
      text-align: left;
    }

    .search-suggest-item:hover {
      background: rgba(56, 189, 248, 0.1);
      color: #ffffff;
    }

    .search-suggest-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .search-suggest-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #94a3b8;
      color: #020817;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .search-suggest-keyword {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-suggest-arrow {
      color: #94a3b8;
      font-size: 18px;
      flex-shrink: 0;
    }

    .search-highlight {
      color: #41bfe0;
      font-weight: 900;
    }

    /* =========================================================
       5. Footer - main.html과 통일
    ========================================================= */
    #footer {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      flex-shrink: 0;
    }

    .footer {
      width: 100%;
      background: #020617;
      color: #fff;
      box-sizing: border-box;
    }

    .footer-inner {
      width: 100%;
      min-height: 88px;
      padding: 0 70px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .footer-logo-white {
      width: 34px;
      height: 34px;
      background-color: #ffffff;

      -webkit-mask-image: url("/view/img/favicon.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/view/img/favicon.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      flex-shrink: 0;
    }

    .footer-link {
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      text-decoration: none;
    }

    .footer-link:hover {
      color: #00e5ff;
    }

    .footer-divider {
      width: 1px;
      height: 12px;
      background: #334155;
    }

    .footer-copy {
      margin: 0;
      color: #64748b;
    }

    .footer-modal {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 8, 23, 0.75);
    }

    .footer-modal.hidden {
      display: none !important;
    }

    .footer-modal-box {
      width: 520px;
      max-width: calc(100% - 32px);
      max-height: 70vh;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
    }

    .footer-modal-content {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }

    .footer-modal-content h3 {
      margin: 0 0 16px;
      color: #f8fafc;
    }

    .footer-modal-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #020617;
      font-weight: 900;
      cursor: pointer;
    }

    /* =========================================================
       6. 커스텀 알림 / 확인 모달
    ========================================================= */
    .custom-alert {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
    }

    .custom-alert.hidden {
      display: none !important;
    }

    .custom-alert-content {
      width: 320px;
      padding: 24px;
      border-radius: 16px;
      background: #1f2330;
      text-align: center;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .custom-alert-message {
      font-size: 16px;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .custom-alert-error {
      display: none;
      color: #ff4d4d;
      font-size: 14px;
      margin-bottom: 18px;
      font-weight: 700;
      white-space: pre-line;
    }

    .custom-alert-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .custom-alert-btn {
      width: 140px;
      min-height: 40px;
      border: none;
      padding: 10px 28px;
      border-radius: 999px;
      background: #00cfff;
      color: #001018;
      font-weight: 800;
      cursor: pointer;
    }

    .custom-alert-btn.secondary {
      background: #334155;
      color: #fff;
    }

    /* =========================================================
       7. Light Mode
    ========================================================= */
    body.light-mode {
      background: #edf2ee;
      color: #0f172a;
    }

    body.light-mode .page {
      background: #edf2ee;
    }

    body.light-mode .header {
      background: #f1f6f2;
      border-bottom: 1px solid #d5ddd6;
      box-shadow: none;
      backdrop-filter: none;
    }

    body.light-mode .nav {
      color: #66756d;
    }

    body.light-mode .nav a:hover {
      color: #4cb7d3;
    }

    body.light-mode .main-search-wrap {
      background: #f7faf7;
      border: 1px solid #d8e1d9;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    body.light-mode .main-search-wrap:focus-within {
      border-color: rgba(0, 207, 232, 0.45);
      box-shadow:
        0 0 0 4px rgba(0, 207, 232, 0.08),
        inset 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    body.light-mode .search-box {
      color: #41bfe0;
    }

    body.light-mode .search-box::placeholder {
      color: #8b9a91;
    }

    body.light-mode .search-icon-btn {
      color: #708177;
    }

    body.light-mode .search-icon-btn:hover {
      color: #4cb7d3;
    }

    body.light-mode .theme-btn {
      background: #f7faf7;
      border: 1px solid #d7dfd8;
      color: #4b5563;
    }

    body.light-mode .theme-btn:hover {
      border-color: #4cb7d3;
      background: #ffffff;
    }

    body.light-mode .header-btn.join {
      background: #f7faf7;
      border: 1px solid #cfd8d0;
      color: #55635c;
    }

    body.light-mode .header-btn.join:hover {
      border-color: #4cb7d3;
      color: #4cb7d3;
      background: #ffffff;
    }

    body.light-mode .header-btn.login {
      background: #00e5ff;
      border-color: #00e5ff;
      color: #06262b;
      box-shadow: 0 4px 14px rgba(0, 207, 232, 0.08);
    }

    body.light-mode .header-btn.login:hover {
      filter: brightness(1.04);
    }

    body.light-mode .header-user-name {
      color: #55635c;
    }

    body.light-mode aside {
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
    }

    body.light-mode .side-title {
      color: #64748b;
    }

    body.light-mode .side-title-wrap {
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .side-menu li {
      color: #64748b;
    }

    body.light-mode .side-menu li:hover {
      background: #f1f5f9;
    }

    body.light-mode .side-menu li.active {
      background: #e0f7ff;
      color: #0284c7;
      border-left-color: #00cfe8;
    }

    body.light-mode .account-title .brand {
      color: #41bfe0;
    }

    body.light-mode .account-title h2,
    body.light-mode .value {
      color: #0f172a;
    }

    body.light-mode .account-title p,
    body.light-mode label {
      color: #64748b;
    }

    body.light-mode .form-group,
    body.light-mode .form-row {
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .input {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }

    body.light-mode .input::placeholder {
      color: #94a3b8;
    }

    body.light-mode .input:focus {
      border-color: rgba(0, 207, 232, 0.45);
      box-shadow: 0 0 0 4px rgba(0, 207, 232, 0.08);
    }

    body.light-mode .submit-btn {
      color: #00131f;
      background: #41bfe0;
    }

    body.light-mode .delete-box {
      background: #fff7f7;
      border-color: #fecaca;
    }

    body.light-mode .delete-desc {
      color: #991b1b;
    }

    body.light-mode .search-suggest-box {
      background: #f8fbf8;
      border: 1px solid #d7dfd8;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    body.light-mode .search-suggest-item {
      color: #3f4c45;
    }

    body.light-mode .search-suggest-item:hover {
      background: #ebf8fb;
      color: #4cb7d3;
    }

    body.light-mode .search-suggest-icon {
      background: #dfe7e0;
      color: #607066;
    }

    body.light-mode .search-suggest-arrow {
      color: #839188;
    }

    body.light-mode .footer {
      background: linear-gradient(
        180deg,
        #eef4ef 0%,
        #e7efe8 100%
      );
      border-top: 1px solid #d8e0d9;
    }

    body.light-mode .footer-link {
      color: #607066;
    }

    body.light-mode .footer-link:hover {
      color: #4cb7d3;
    }

    body.light-mode .footer-copy {
      color: #7d8b83;
    }

    body.light-mode .footer-divider {
      background: #cfd8d0;
    }

    body.light-mode .footer-logo-white {
      background-color: #111827;
    }

    body.light-mode .footer-modal {
      background: rgba(110, 128, 116, 0.18);
      backdrop-filter: blur(4px);
    }

    body.light-mode .footer-modal-box {
      background: #f8fbf8;
      border: 1px solid #d9e2da;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }

    body.light-mode .footer-modal-content {
      color: #4b5563;
    }

    body.light-mode .footer-modal-content h3 {
      color: #1f2937;
    }

    body.light-mode .footer-modal-btn {
      background: #4cb7d3;
      color: #06262b;
    }

    body.light-mode .custom-alert-content {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }

    body.light-mode .custom-alert-message {
      color: #0f172a;
    }

    body.light-mode .custom-alert-error {
      color: #ef4444;
    }

    body.light-mode .custom-alert-btn {
      background: #00cfe8;
      color: #020617;
    }

    body.light-mode .custom-alert-btn.secondary {
      background: #64748b;
      color: #ffffff;
    }

    /* =========================================================
       8. Responsive
    ========================================================= */
    @media (max-width: 980px) {
      .footer-inner {
        padding: 0 24px;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 640px) {
      .search-suggest-box {
        left: 18px !important;
        right: 18px !important;
        width: auto !important;
        max-width: none;
      }

      .footer-inner {
        padding: 0 18px;
      }

      .account-wrap {
        width: 100%;
      }

      main {
        padding-left: 18px;
        padding-right: 18px;
      }
    }

    /* ==============================
       Mobile LNB Hamburger
    ============================== */
    @media (min-width: 769px) {
      .mobile-lnb-bar    { display: none; }
      .mobile-menu-dropdown { display: none; }
    }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      aside   { display: none !important; }

      .mobile-lnb-bar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        padding: 0 18px;
        height: 48px;
        background: #0b1020;
        border-bottom: 1px solid #1a2540;
        position: sticky;
        top: 72px;
        z-index: 200;
      }
      .mobile-lnb-title {
        font-size: 13px;
        color: #6e7c98;
        font-weight: 700;
      }
      .hamburger-btn {
        width: 36px; height: 36px;
        border: 0; background: transparent; cursor: pointer;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 5px; border-radius: 8px; transition: background 0.2s;
      }
      .hamburger-btn:hover { background: #132137; }
      .hamburger-btn span {
        display: block; width: 20px; height: 2px;
        background: #6e7c98; border-radius: 2px;
        transition: transform 0.25s, opacity 0.25s;
      }
      .hamburger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .hamburger-btn.open span:nth-child(2) { opacity: 0; }
      .hamburger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      .mobile-menu-dropdown {
        display: none;
        background: #0b1020;
        border-bottom: 1px solid #1a2540;
        position: sticky;
        top: 120px;
        z-index: 199;
      }
      .mobile-menu-dropdown.open {
        display: block;
        animation: mobileMenuDown 0.22s ease;
      }
      @keyframes mobileMenuDown {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .mobile-menu-dropdown ul { list-style: none; padding: 8px 0; margin: 0; }
      .mobile-menu-dropdown li {
        height: 46px; display: flex; align-items: center;
        padding-left: 24px; color: #6f7d98; font-size: 14px;
        border-left: 4px solid transparent; cursor: pointer;
        transition: background 0.15s;
      }
      .mobile-menu-dropdown li:hover { background: #10192b; }
      .mobile-menu-dropdown li.active {
        background: #132137; color: #42bfff;
        border-left-color: #24bfff; font-weight: 700;
      }
      main { padding: 24px 16px 60px; }
    }

    body.light-mode .mobile-lnb-bar { background: #ffffff; border-color: #e2e8f0; }
    body.light-mode .mobile-menu-dropdown { background: #ffffff; border-color: #e2e8f0; }
    body.light-mode .mobile-lnb-title { color: #64748b; }
    body.light-mode .hamburger-btn span { background: #334155; }
    body.light-mode .hamburger-btn:hover { background: #e2e8f0; }
    body.light-mode .hamburger-btn.open span { background: #0f172a; }
    body.light-mode .mobile-menu-dropdown li { color: #64748b; }
    body.light-mode .mobile-menu-dropdown li:hover { background: #f1f5f9; }
    body.light-mode .mobile-menu-dropdown li.active {
      background: #e0f7ff; color: #0284c7; border-left-color: #00cfe8;
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>
<div class="page">
  <div id="header"></div>

  <!-- 모바일 LNB -->
  <div class="mobile-lnb-bar">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-lnb-title">마이페이지</span>
  </div>
  <div class="mobile-menu-dropdown" id="mobileMenuDropdown">
    <ul>
      <li onclick="location.href='/view/mypage_home.html'">마이페이지 홈</li>
      <li class="active">회원정보 관리 &amp; 탈퇴</li>
    </ul>
  </div>

  <div class="layout">
    <aside>
      <div class="side-title-wrap">
        <div class="side-title">마이페이지</div>
      </div>

      <ul class="side-menu">
        <li onclick="location.href='/view/mypage_home.html'">마이페이지 홈</li>
        <li class="active" onclick="location.href='/view/mypage_account.html'">회원정보 관리 & 탈퇴</li>
      </ul>
    </aside>

    <main>
      <div class="account-wrap">
        <div class="account-title">
          <div class="brand">
            <img
              class="account-brand-logo"
              src="/view/img/logo.png"
              alt="DATA 로고"
            >
          </div>
          <h2>회원정보 관리</h2>
          <p>정보를 수정하고 계정 비밀번호를 관리하세요</p>
        </div>

        <div class="form-group">
          <label>Name</label>
          <div class="value" id="userName"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Birth Date</label>
            <div class="value" id="userBirth"></div>
          </div>

          <div class="form-group">
            <label>Gender</label>
            <div class="value" id="userGender"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="value" id="userEmail"></div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            class="input"
            type="password"
            id="password1"
            placeholder="새 비밀번호 (변경 시에만 입력)"
            maxlength="20"
            oninput="validatePasswordInput(this); checkPasswordMatch();"
            onkeydown="handleEnter(event)"
          />
        </div>

        <div class="form-group">
          <input
            class="input"
            type="password"
            id="passwordCheck"
            placeholder="비밀번호 확인"
            maxlength="20"
            oninput="validatePasswordInput(this); checkPasswordMatch();"
            onkeydown="handleEnter(event)"
          />
          <div class="error" id="passwordError">* 비밀번호가 일치하지 않습니다.</div>
        </div>

        <button class="submit-btn" onclick="updateUserInfo()">회원정보 수정</button>

        <div class="delete-box">
          <div class="delete-title">회원 탈퇴</div>
          <div class="delete-desc">
            탈퇴 시 모든 개인정보 및 활동 데이터가 삭제되며 복구가 불가능합니다.<br>
            탈퇴 처리는 즉시 반영되며, 동일 이메일로 재가입 시 기존 데이터는 복원되지 않습니다.
          </div>
          <button class="delete-btn" onclick="deleteUser()">회원 탈퇴하기</button>
        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>
</div>

<div id="customAlert" class="custom-alert hidden">
  <div class="custom-alert-content">
    <div id="customAlertMsg" class="custom-alert-message"></div>
    <div id="customAlertError" class="custom-alert-error"></div>

    <div class="custom-alert-actions">
      <button id="customAlertBtn" class="custom-alert-btn">확인</button>
      <button id="customAlertNo" class="custom-alert-btn secondary hidden">취소</button>
    </div>
  </div>
</div>

<script>
  function loadUserInfo() {
    const name = sessionStorage.getItem("user_name") || localStorage.getItem("user_name");
    const email =
      sessionStorage.getItem("user_id") ||
      sessionStorage.getItem("email") ||
      localStorage.getItem("user_id") ||
      localStorage.getItem("email");

    const birth =
      sessionStorage.getItem("user_birth") ||
      localStorage.getItem("user_birth") ||
      "정보 없음";

    const gender =
      sessionStorage.getItem("user_gender") ||
      localStorage.getItem("user_gender") ||
      "정보 없음";

    const userNameEl = document.getElementById("userName");
    const userBirthEl = document.getElementById("userBirth");
    const userGenderEl = document.getElementById("userGender");
    const userEmailEl = document.getElementById("userEmail");

    if (userNameEl) userNameEl.innerText = name || "미인증 사용자";
    if (userBirthEl) userBirthEl.innerText = birth;
    if (userGenderEl) userGenderEl.innerText = gender;
    if (userEmailEl) userEmailEl.innerText = email || "이메일 정보 없음";
  }

  function validatePasswordInput(input) {
    input.value = input.value
      .replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, "")
      .replace(/\s/g, "");

    if (input.value.length > 20) {
      input.value = input.value.slice(0, 20);
    }
  }

  function checkPasswordMatch() {
    const pw1 = document.getElementById("password1")?.value || "";
    const pw2 = document.getElementById("passwordCheck")?.value || "";
    const error = document.getElementById("passwordError");

    if (!error) return;

    if (pw1 === "" && pw2 === "") {
      error.style.display = "none";
      return;
    }

    if (pw2 === "") {
      error.style.display = "none";
      return;
    }

    error.style.display = pw1 !== pw2 ? "block" : "none";
  }

  function bindCommonSearch() {
    const input = document.getElementById("commonSearchInput");
    const searchBtn = document.getElementById("commonSearchBtn");

    if (!input) return;

    if (searchBtn) {
      searchBtn.addEventListener("click", function () {
        moveSearch(input.value);
      });
    }

    input.addEventListener("input", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("focus", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        moveSearch(input.value);
      }

      if (e.key === "Escape") {
        hideSearchSuggestions();
      }
    });

    document.addEventListener("click", function (e) {
      const searchWrap = document.querySelector(".main-search-wrap");

      if (!searchWrap) return;

      if (!searchWrap.contains(e.target)) {
        hideSearchSuggestions();
      }
    });

    window.addEventListener("resize", positionSearchSuggestBox);
    window.addEventListener("scroll", positionSearchSuggestBox);
  }

  function highlightKeyword(text, keyword) {
    if (!keyword) return text;

    const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(`(${escapedKeyword})`, "gi");

    return text.replace(regex, `<span class="search-highlight">$1</span>`);
  }

  async function renderSearchSuggestions(keyword) {
    const list = document.getElementById("searchSuggestList");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!list || !suggestBox) return;

    const value = keyword.trim();

    if (!value) {
      hideSearchSuggestions();
      return;
    }

    try {
      const res = await axios.get(`/api/search/suggest?q=${encodeURIComponent(value)}`);
      const results = res.data || [];

      if (results.length === 0) {
        hideSearchSuggestions();
        return;
      }

      list.innerHTML = results.map(function (item) {
        return `
          <button
            class="search-suggest-item"
            type="button"
            data-suggest-keyword="${item}"
          >
            <span class="search-suggest-left">
              <span class="search-suggest-icon">⌕</span>
              <span class="search-suggest-keyword">
                ${highlightKeyword(item, value)}
              </span>
            </span>
            <span class="search-suggest-arrow">↖</span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectSearchSuggestion(btn.dataset.suggestKeyword);
        });
      });

      positionSearchSuggestBox();
      suggestBox.classList.remove("hidden");
    } catch (error) {
      console.error("검색 자동완성 실패:", error);
      hideSearchSuggestions();
    }
  }

  function positionSearchSuggestBox() {
    const searchWrap = document.querySelector(".main-search-wrap");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!searchWrap || !suggestBox) return;

    const rect = searchWrap.getBoundingClientRect();

    suggestBox.style.top = `${rect.bottom + 4}px`;
    suggestBox.style.left = `${rect.left}px`;
    suggestBox.style.width = `${rect.width}px`;
  }

  function hideSearchSuggestions() {
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!suggestBox) return;

    suggestBox.classList.add("hidden");
  }

  function selectSearchSuggestion(keyword) {
    const input = document.getElementById("commonSearchInput");

    if (input) {
      input.value = keyword;
    }

    hideSearchSuggestions();
    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
  }

  function moveSearch(keyword) {
    const value = keyword.trim();

    if (!value) return;

    hideSearchSuggestions();
    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
  }

  function goLoginRequiredPage(targetUrl) {
    location.href = targetUrl;
  }

  async function updateUserInfo() {
    const pw1 = document.getElementById("password1")?.value || "";
    const pw2 = document.getElementById("passwordCheck")?.value || "";

    if (pw1 === "" && pw2 === "") {
      showCustomAlert("변경 사항이 없습니다.");
      return;
    }

    if (pw1 !== "" && pw1.length < 8) {
      showCustomAlert("비밀번호는 8자 이상이어야 합니다.");
      return;
    }

    if (pw1 === "" && pw2 !== "") {
      showCustomAlert("새 비밀번호를 입력해주세요.");
      return;
    }

    if (pw1 !== "" && pw2 === "") {
      showCustomAlert("비밀번호 확인을 입력해주세요.");
      return;
    }

    if (pw1 !== pw2) {
      showCustomAlert("비밀번호가 일치하지 않습니다.");
      return;
    }

    const email =
      sessionStorage.getItem("user_id") ||
      localStorage.getItem("user_id");

    if (!email) {
      showCustomAlert("로그인 정보가 없습니다. 다시 로그인해주세요.");
      location.href = "/view/login.html";
      return;
    }

    try {
      const response = await axios.post("/update_password", {
        email: email,
        new_pw: pw1
      });

      if (response.data.success) {
        const pw1El = document.getElementById("password1");
        const pw2El = document.getElementById("passwordCheck");
        const passwordError = document.getElementById("passwordError");

        if (pw1El) pw1El.value = "";
        if (pw2El) pw2El.value = "";
        if (passwordError) passwordError.style.display = "none";

        showCustomAlert("회원정보 수정이 완료되었습니다.");
      } else {
        showCustomAlert("실패: " + response.data.message);
      }
    } catch (err) {
      console.error("비밀번호 변경 중 에러:", err);
      showCustomAlert("서버 통신 중 오류가 발생했습니다.");
    }
  }

  async function deleteUser() {
    const confirmDelete = await showCustomConfirm(
      "정말 회원 탈퇴하시겠습니까?\n탈퇴 시 모든 정보가 삭제됩니다."
    );

    if (!confirmDelete) return;

    const user_id =
      sessionStorage.getItem("user_id") ||
      localStorage.getItem("user_id");

    if (!user_id) {
      showCustomAlert("로그인 정보가 없습니다. 다시 로그인해주세요.");
      location.href = "/view/login.html";
      return;
    }

    try {
      const response = await axios.post("/delete_account", {
        user_id: user_id
      });

      if (response.data.success) {
        showCustomAlert(response.data.message);

        sessionStorage.clear();
        localStorage.clear();

        setTimeout(() => {
          location.href = "/view/main.html";
        }, 250);
      } else {
        showCustomAlert("탈퇴 실패: " + response.data.message);
      }
    } catch (err) {
      console.error("탈퇴 중 에러 발생:", err);
      showCustomAlert("서버와 통신 중 오류가 발생했습니다. 다시 시도해주세요.");
    }
  }

  function loadHeader() {
    const headerArea = document.getElementById("header");

    if (!headerArea) return;

    if (headerArea.innerHTML.trim()) {
      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
      return;
    }

    fetch("/view/header.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("header.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        headerArea.innerHTML = html;

        setHeaderLoginState();
        bindCommonSearch();
        applyThemeMode();
      })
      .catch(function (err) {
        console.error("header 로드 실패:", err);
      });
  }

  function setHeaderLoginState() {
    const loginBtn = document.getElementById("loginBtn");
    const joinBtn = document.getElementById("joinBtn");
    const primaryUserBtn = document.getElementById("primaryUserBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const headerUserName = document.getElementById("headerUserName");

    if (!primaryUserBtn || !logoutBtn) return;

    if (loginBtn) loginBtn.classList.add("hidden");
    if (joinBtn) joinBtn.classList.add("hidden");

    primaryUserBtn.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    primaryUserBtn.innerText = "마이페이지";

    const userName =
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||
      localStorage.getItem("userName");

    if (headerUserName) {
      if (userName) {
        headerUserName.textContent = `${userName}님`;
        headerUserName.classList.remove("hidden");
      } else {
        headerUserName.textContent = "";
        headerUserName.classList.add("hidden");
      }
    }
  }

  function loadFooter() {
    const footerArea = document.getElementById("footer");

    if (!footerArea) return;

    if (footerArea.innerHTML.trim()) return;

    fetch("/view/footer.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("footer.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        footerArea.innerHTML = html;
      })
      .catch(function (err) {
        console.error("footer 로드 실패:", err);
      });
  }

  function applyThemeMode() {
    const savedTheme = localStorage.getItem("theme_mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (savedTheme === "light") {
      document.body.classList.add("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    } else {
      document.body.classList.remove("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    }
  }

  function toggleThemeMode() {
    const isLight = document.body.classList.contains("light-mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (isLight) {
      document.body.classList.remove("light-mode");
      localStorage.setItem("theme_mode", "dark");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    } else {
      document.body.classList.add("light-mode");
      localStorage.setItem("theme_mode", "light");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    }
  }

  window.openFooterTermsModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>이용약관</h3>
      <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
      <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
      <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
    `;

    modal.classList.remove("hidden");
  };

  window.openFooterPrivacyModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>개인정보처리방침</h3>
      <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
      <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
      <p>개인정보 관련 문의: data260417@gmail.com</p>
    `;

    modal.classList.remove("hidden");
  };

  window.closeFooterModal = function () {
    const modal = document.getElementById("footerModal");

    if (!modal) return;

    modal.classList.add("hidden");
  };

  document.addEventListener("click", async function (e) {
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");

    const footerTermsBtn = e.target.closest("#footerTermsBtn");
    const footerPrivacyBtn = e.target.closest("#footerPrivacyBtn");
    const footerModalCloseBtn = e.target.closest("#footerModalCloseBtn");

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (primaryUserBtn) {
      location.href = "/view/mypage_home.html";
      return;
    }

    if (logoutBtn) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_role");
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("userName");

      sessionStorage.removeItem("access_token");
      sessionStorage.removeItem("user_name");
      sessionStorage.removeItem("user_role");
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("userName");

      try {
        await axios.post("/logout");
      } catch (err) {
        console.error("로그아웃 실패:", err);
      }

      location.href = "/view/main.html";
      return;
    }

    if (loginRequiredLink) {
      const targetUrl = loginRequiredLink.dataset.loginPage;
      location.href = targetUrl;
      return;
    }

    if (footerTermsBtn) {
      openFooterTermsModal();
      return;
    }

    if (footerPrivacyBtn) {
      openFooterPrivacyModal();
      return;
    }

    if (footerModalCloseBtn) {
      closeFooterModal();
    }
  });

  document.addEventListener("DOMContentLoaded", async function () {
    try {
      const { data } = await axios.post("/pw_check_time");

      if (!data.is_authenticated) {
        location.replace("/view/mypage_home.html");
        return;
      }
    } catch (err) {
      console.error("인증 상태 확인 에러:", err);
      location.replace("/view/mypage_home.html");
      return;
    }

    applyThemeMode();
    loadUserInfo();
    loadHeader();
    loadFooter();

    const passwordError = document.getElementById("passwordError");

    if (passwordError) {
      passwordError.style.display = "none";
    }
  });

  function handleEnter(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      updateUserInfo();
    }
  }

  function resetCustomAlertButtons() {
    const yesBtn = document.getElementById("customAlertBtn");
    const noBtn = document.getElementById("customAlertNo");

    if (yesBtn) yesBtn.classList.remove("hidden");
    if (noBtn) noBtn.classList.add("hidden");
  }

  function showCustomAlert(message, error = "") {
    const modal = document.getElementById("customAlert");
    const msg = document.getElementById("customAlertMsg");
    const err = document.getElementById("customAlertError");
    const btn = document.getElementById("customAlertBtn");

    if (!modal || !msg || !err || !btn) return;

    resetCustomAlertButtons();

    msg.innerText = message;
    err.innerText = error;

    if (error) {
      err.style.display = "block";
    } else {
      err.style.display = "none";
    }

    modal.classList.remove("hidden");

    btn.onclick = function () {
      modal.classList.add("hidden");
    };
  }

  function closeCustomAlert() {
    const modal = document.getElementById("customAlert");

    if (!modal) return;

    modal.classList.add("hidden");
  }

  document.addEventListener("click", function (e) {
    const modal = document.getElementById("customAlert");

    if (!modal || modal.classList.contains("hidden")) return;

    const content = modal.querySelector(".custom-alert-content");

    if (content && !content.contains(e.target)) {
      closeCustomAlert();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeCustomAlert();
    }
  });

  function showCustomConfirm(message) {
    return new Promise((resolve) => {
      const modal = document.getElementById("customAlert");
      const msg = document.getElementById("customAlertMsg");
      const err = document.getElementById("customAlertError");
      const yesBtn = document.getElementById("customAlertBtn");
      const noBtn = document.getElementById("customAlertNo");

      if (!modal || !msg || !err || !yesBtn || !noBtn) {
        resolve(false);
        return;
      }

      msg.innerText = message;
      err.innerText = "";
      err.style.display = "none";

      yesBtn.classList.remove("hidden");
      noBtn.classList.remove("hidden");

      modal.classList.remove("hidden");

      yesBtn.onclick = () => {
        modal.classList.add("hidden");
        noBtn.classList.add("hidden");
        resolve(true);
      };

      noBtn.onclick = () => {
        modal.classList.add("hidden");
        noBtn.classList.add("hidden");
        resolve(false);
      };
    });
  }

  /* ── 모바일 햄버거 ── */
  window.closeMobileMenu = function() {
    var btn = document.getElementById("hamburgerBtn");
    var dd  = document.getElementById("mobileMenuDropdown");
    if (!dd) return;
    dd.classList.remove("open");
    if (btn) { btn.classList.remove("open"); btn.setAttribute("aria-expanded","false"); }
  };

  function initHamburger() {
    var btn = document.getElementById("hamburgerBtn");
    var dd  = document.getElementById("mobileMenuDropdown");
    if (!btn || !dd || btn.dataset.init) return;
    btn.dataset.init = "1";
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      if (dd.classList.contains("open")) { window.closeMobileMenu(); }
      else { dd.classList.add("open"); btn.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
    });
    document.addEventListener("click", function(e) {
      if (dd.classList.contains("open") &&
          !dd.contains(e.target) && !btn.contains(e.target)) {
        window.closeMobileMenu();
      }
    });
  }
  initHamburger();
  document.addEventListener("DOMContentLoaded", initHamburger);

</script>
</body>
</html>
