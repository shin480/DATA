<script>

function loadUserInfo() {
  // 1. 세션 저장소에서 로그인 시 저장했던 정보를 가져옵니다.
  const name = sessionStorage.getItem("user_name");
  const email = sessionStorage.getItem("user_id") || sessionStorage.getItem("email"); // 로그인 시 저장한 키값 확인
  const role = sessionStorage.getItem("user_role");
  const birth = sessionStorage.getItem("user_birth") || "정보 없음";
  const gender = sessionStorage.getItem("user_gender") || "정보 없음";

  // 2. 화면에 데이터 뿌리기
  // 존재 여부를 체크해서 에러를 방지합니다.
  if(document.getElementById("userName")) document.getElementById("userName").innerText = name || "미인증 사용자";
  if(document.getElementById("userBirth")) document.getElementById("userBirth").innerText = birth;
  if(document.getElementById("userGender")) document.getElementById("userGender").innerText = gender;
  if(document.getElementById("userEmail")) document.getElementById("userEmail").innerText = email || "이메일 정보 없음";
}

function validatePasswordInput(input) {
  input.value = input.value
    .replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, "")
    .replace(/\s/g, "");

  if (input.value.length > 20) {
    input.value = input.value.slice(0, 20);
  }
}

function checkPasswordMatch() {
  const pw1 = document.getElementById("password1").value;
  const pw2 = document.getElementById("passwordCheck").value;
  const error = document.getElementById("passwordError");

  if (pw1 === "" && pw2 === "") {
    error.style.display = "none";
    return;
  }

  if (pw2 === "") {
    error.style.display = "none";
    return;
  }

  if (pw1 !== pw2) {
    error.style.display = "block";
  } else {
    error.style.display = "none";
  }
}

/* 회원 정보 수정 */
async function updateUserInfo() {
  const pw1 = document.getElementById("password1").value;
  const pw2 = document.getElementById("passwordCheck").value;

  /* 수정사항 없음 */
  if (pw1 === "" && pw2 === "") {
    alert("변경 사항이 없습니다.");
    return;
  }

  /* 비밀번호 8자 미만 */
  if (pw1 !== "" && pw1.length < 8) {
    alert("비밀번호는 8자 이상이어야 합니다.");
    return;
  }

  /* 확인 비밀번호만 입력한 경우 */
  if (pw1 === "" && pw2 !== "") {
    alert("새 비밀번호를 입력해주세요.");
    return;
  }

  /* 새 비밀번호만 입력한 경우 */
  if (pw1 !== "" && pw2 === "") {
    alert("비밀번호 확인을 입력해주세요.");
    return;
  }

  /* 비밀번호 불일치 */
  if (pw1 !== pw2) {
    alert("비밀번호가 일치하지 않습니다.");
    return;
  }

  /* 비밀번호 변경 */
  // 세션에서 현재 사용자의 이메일(ID) 가져오기
  const email = sessionStorage.getItem("user_id");

  try {
    // 백엔드로 비밀번호 변경 요청 전송
    const response = await axios.post("/update_password", {
      email: email,
      new_pw: pw1
    });

    if (response.data.success) {
      // 입력칸 초기화
      document.getElementById("password1").value = "";
      document.getElementById("passwordCheck").value = "";
      document.getElementById("passwordError").style.display = "none";
      alert("회원정보 수정이 완료되었습니다.");
    } else {
      alert("실패: " + response.data.message);
    }
  } catch (err) {
    console.error("비밀번호 변경 중 에러:", err);
    alert("서버 통신 중 오류가 발생했습니다.");
  }

  

  document.getElementById("password1").value = "";
  document.getElementById("passwordCheck").value = "";
  document.getElementById("passwordError").style.display = "none";
}

/* 회원 탈퇴 */
async function deleteUser() {
  const confirmDelete = confirm(
    "정말 회원 탈퇴하시겠습니까?\n탈퇴 시 모든 회원 정보와 활동 내역이 삭제됩니다."
  );

  if (!confirmDelete) {
    return;
  }

  // 1. sessionStorage에 저장된 user_id(이메일)를 가져옴
  const user_id = sessionStorage.getItem("user_id");

  try {
    // 2. 백엔드 탈퇴 엔드포인트로 데이터 전송
    // 백엔드 deleteaccount.py의 info.get("email")과 키값을 맞춥니다.
    const response = await axios.post("/delete_account", {
      "user_id": user_id
    });

    if (response.data.success) {
      alert(response.data.message);
      
      // 3. 로그아웃 처리: 브라우저 저장소 싹 비우기
      sessionStorage.clear();
      localStorage.clear();

      // 4. 메인화면으로 이동
      location.href = "./main.html";
    } else {
      alert("탈퇴 실패: " + response.data.message);
    }
  } catch (err) {
    console.error("탈퇴 중 에러 발생:", err);
    alert("서버와 통신 중 오류가 발생했습니다. 다시 시도해주세요.");
  }
  
}

function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  if (footerArea.innerHTML.trim()) {
    return;
  }

  fetch("/view/footer.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("footer.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}

window.onload = function () {
  loadUserInfo();
  loadFooter();
  document.getElementById("passwordError").style.display = "none";

    <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>

    <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
    <p>개인정보 관련 문의: data260417@gmail.com</p>

/* =========================

========================= */

document.addEventListener("click", function (e) {

  const primaryUserBtn = e.target.closest("#primaryUserBtn");
  const logoutBtn = e.target.closest("#logoutBtn");

  const loginRequiredLink = e.target.closest("[data-login-page]");

  const footerTermsBtn = e.target.closest("#footerTermsBtn");
  const footerPrivacyBtn = e.target.closest("#footerPrivacyBtn");
  const footerModalCloseBtn = e.target.closest("#footerModalCloseBtn");

  /* 마이페이지 */
  if (primaryUserBtn) {
    location.href = "/view/mypage_home.html";
    return;
  }

  /* 로그아웃 */
  if (logoutBtn) {

    localStorage.clear();
    sessionStorage.clear();

    location.href = "/view/main.html";
    return;
  }

  /* 헤더 링크 */
  if (loginRequiredLink) {

    const targetUrl = loginRequiredLink.dataset.loginPage;
    location.href = targetUrl;

    return;
  }

  /* 이용약관 */
  if (footerTermsBtn) {

    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");
