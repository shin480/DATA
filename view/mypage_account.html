<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DATA 다타 - 회원정보 관리</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <style>

    html {
  overflow-y: scroll;
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    body {
      background: #050916;
      color: #d9e7ff;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
    }

    .page {
      width: 100%;
      margin: 0 auto;
      padding-top: 72px;
      background: #050816;

      display: flex;
      flex-direction: column;

      min-height: 100vh;
    }

.layout {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex: 1;
  align-items: stretch;
}

    aside {
      width: 230px;
      background: #0b1020;
      padding-top: 45px;
      border-right: 1px solid #121a2d;
    }

    .side-title-wrap {
      padding: 0 24px 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid #2f3748;
    }

    .side-title {
      color: #6e7c98;
      font-size: 13px;
    }

    .side-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .side-menu li {
      height: 46px;
      display: flex;
      align-items: center;
      padding-left: 28px;
      color: #6f7d98;
      font-size: 14px;
      border-left: 4px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }

    .side-menu li:hover {
      background: #10192b;
    }

    .side-menu li.active {
      background: #132137;
      color: #42bfff;
      border-left-color: #24bfff;
      font-weight: 700;
    }

    main {
    min-width: 0;
      flex: 1;
      padding: 42px 28px 80px;
    }

    .account-wrap {
      width: 430px;
      margin: 0 auto;
      padding-top: 15px;
    }

    .account-title {
      text-align: center;
      margin-bottom: 26px;
    }

    .account-title .brand {
      color: #10d9ff;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .account-title h2 {
      font-size: 20px;
      color: #f1f6ff;
      margin-bottom: 8px;
    }

    .account-title p {
      color: #63728d;
      font-size: 12px;
    }

    .form-group {
      border-bottom: 1px solid #1a2540;
      padding: 10px 0;

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;

    }

    .form-row .form-group {
      border-bottom: none;
    }

    label {
      display: block;

    .value {

    .input {
      width: 100%;

      background: #071522;

      padding: 0 14px;

    }

    .error {

    .submit-btn {

      color: #00131f;
      font-weight: 800;
      margin-top: 18px;

    }

    .submit-btn:hover {

    }

    .delete-box {
      margin-top: 24px;

    .delete-title {

    .delete-desc {

    }

    .delete-btn {

    /* ===== HEADER ===== */

    .header {

}

    .logo {

    .main-search-wrap {

    .search-box {

    .search-icon-btn:hover {

    .theme-btn {

      border-radius: 18px;
      background: #050b1c;

      z-index: 20000;
      overflow: hidden;
    }

    .search-suggest-list {
      display: flex;
      flex-direction: column;
    }

    .search-suggest-item {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;

      color: #dbeafe;

    .search-suggest-item:hover {

      gap: 10px;
    }

    .search-suggest-keyword {

    }

    .search-highlight {

      font-weight: 700;

#footer {

/* ==============================
   Footer Modal
============================== */

/* 모달은 화면 중앙 고정 */
.footer-modal {
  position: fixed;
  inset: 0;
  z-index: 30000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(2, 8, 23, 0.75);
}

.footer-modal.hidden {
  display: none !important;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;

}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}

/* ==============================
   Responsive
============================== */

  .footer-inner {
    padding: 0 24px;

@media (max-width: 640px) {

    right: 18px !important;

    max-width: none;
  }

  .footer-inner {
    padding: 0 18px;
  }
  }

<body>
<div class="page">

  <div id="header"></div>

  <div class="layout">
    <aside>
      <div class="side-title-wrap">
        <div class="side-title">마이페이지</div>
      </div>

      <ul class="side-menu">
        <li onclick="location.href='/view/mypage_home.html'">마이페이지 홈</li>
        <li class="active" onclick="location.href='/view/mypage_account.html'">회원정보 관리 & 탈퇴</li>
      </ul>
    </aside>

    <main>
      <div class="account-wrap">
        <div class="account-title">
          <div class="brand">DATA</div>
          <h2>회원정보 관리</h2>
          <p>정보를 수정하고 계정 비밀번호를 관리하세요</p>
        </div>

        <div class="form-group">
          <label>Name</label>
          <div class="value" id="userName"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Birth Date</label>
            <div class="value" id="userBirth"></div>
          </div>

          <div class="form-group">
            <label>Gender</label>
            <div class="value" id="userGender"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="value" id="userEmail"></div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            class="input"
            type="password"
            id="password1"
            placeholder="새 비밀번호 (변경 시에만 입력)"
            maxlength="20"
            oninput="validatePasswordInput(this); checkPasswordMatch();"
            onkeydown="handleEnter(event)"
          />
        </div>

        <div class="form-group">
          <input
            class="input"
            type="password"
            id="passwordCheck"
            placeholder="비밀번호 확인"
            maxlength="20"
            oninput="validatePasswordInput(this); checkPasswordMatch();"
            onkeydown="handleEnter(event)"
          />
          <div class="error" id="passwordError">* 비밀번호가 일치하지 않습니다.</div>
        </div>

        <button class="submit-btn" onclick="updateUserInfo()">회원정보 수정</button>

        <div class="delete-box">
          <div class="delete-title">회원 탈퇴</div>
          <div class="delete-desc">
            탈퇴 시 모든 개인정보 및 활동 데이터가 삭제되며 복구가 불가능합니다.<br>
            탈퇴 처리는 즉시 반영되며, 동일 이메일로 재가입 시 기존 데이터는 복원되지 않습니다.
          </div>
          <button class="delete-btn" onclick="deleteUser()">회원 탈퇴하기</button>
        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>

</div>

<div id="customAlert" class="custom-alert hidden">
  <div class="custom-alert-content">
    <div id="customAlertMsg" class="custom-alert-message"></div>
    <div id="customAlertError" class="custom-alert-error"></div>
    <button id="customAlertBtn" class="custom-alert-btn">확인</button>
    <button id="customAlertNo" class="custom-alert-btn" style="background:#334155; color:#fff; margin-top:8px;">취소</button>
  </div>
</div>

<script>

  let isConfirmMode = false;

  function loadUserInfo() {
    const name = sessionStorage.getItem("user_name");
    const email = sessionStorage.getItem("user_id") || sessionStorage.getItem("email");
    const birth = sessionStorage.getItem("user_birth") || "정보 없음";
    const gender = sessionStorage.getItem("user_gender") || "정보 없음";

    if (document.getElementById("userName")) {
      document.getElementById("userName").innerText = name || "미인증 사용자";
    }

    if (document.getElementById("userBirth")) {
      document.getElementById("userBirth").innerText = birth;
    }

    if (document.getElementById("userGender")) {
      document.getElementById("userGender").innerText = gender;
    }

    if (document.getElementById("userEmail")) {
      document.getElementById("userEmail").innerText = email || "이메일 정보 없음";
    }
  }

  function validatePasswordInput(input) {
    input.value = input.value
      .replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, "")
      .replace(/\s/g, "");

    if (input.value.length > 20) {
      input.value = input.value.slice(0, 20);
    }
  }

  function checkPasswordMatch() {
    const pw1 = document.getElementById("password1").value;
    const pw2 = document.getElementById("passwordCheck").value;
    const error = document.getElementById("passwordError");

    if (!error) return;

    if (pw1 === "" && pw2 === "") {
      error.style.display = "none";
      return;
    }

    if (pw2 === "") {
      error.style.display = "none";
      return;
    }

    error.style.display = pw1 !== pw2 ? "block" : "none";
  }

  function bindCommonSearch() {
    const input = document.getElementById("commonSearchInput");
    const searchBtn = document.getElementById("commonSearchBtn");

    if (!input) return;

    if (searchBtn) {
      searchBtn.addEventListener("click", function () {
        moveSearch(input.value);
      });
    }

    input.addEventListener("input", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("focus", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        moveSearch(input.value);
      }

      if (e.key === "Escape") {
        hideSearchSuggestions();
      }
    });

    document.addEventListener("click", function (e) {
      const searchWrap = document.querySelector(".main-search-wrap");

      if (!searchWrap) return;

      if (!searchWrap.contains(e.target)) {
        hideSearchSuggestions();
      }
    });

    window.addEventListener("resize", positionSearchSuggestBox);
    window.addEventListener("scroll", positionSearchSuggestBox);
  }

  function highlightKeyword(text, keyword) {
    if (!keyword) return text;

    const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(`(${escapedKeyword})`, "gi");

    return text.replace(regex, `<span class="search-highlight">$1</span>`);
  }

  async function renderSearchSuggestions(keyword) {
    const list = document.getElementById("searchSuggestList");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!list || !suggestBox) return;

    const value = keyword.trim();

    if (!value) {
      hideSearchSuggestions();
      return;
    }

    try {
      const res = await axios.get(
        `/api/search/suggest?q=${encodeURIComponent(value)}`
      );

      const results = res.data || [];

      if (results.length === 0) {
        hideSearchSuggestions();
        return;
      }

      list.innerHTML = results.map(function (item) {
        return `
          <button
            class="search-suggest-item"
            type="button"
            data-suggest-keyword="${item}"
          >
            <span class="search-suggest-left">
              <span class="search-suggest-icon">⌕</span>

              <span class="search-suggest-keyword">
                ${highlightKeyword(item, value)}
              </span>
            </span>

            <span class="search-suggest-arrow">↖</span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const keyword = btn.dataset.suggestKeyword;
          selectSearchSuggestion(keyword);
        });
      });

      positionSearchSuggestBox();
      suggestBox.classList.remove("hidden");

    } catch (error) {
      console.error("검색 자동완성 실패:", error);
      hideSearchSuggestions();
    }
  }

  function positionSearchSuggestBox() {
    const searchWrap = document.querySelector(".main-search-wrap");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!searchWrap || !suggestBox) return;

    const rect = searchWrap.getBoundingClientRect();

    suggestBox.style.top = `${rect.bottom + 4}px`;
    suggestBox.style.left = `${rect.left}px`;
    suggestBox.style.width = `${rect.width}px`;
  }

  function hideSearchSuggestions() {
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!suggestBox) return;

    suggestBox.classList.add("hidden");
  }

  function selectSearchSuggestion(keyword) {
    const input = document.getElementById("commonSearchInput");

    if (input) {
      input.value = keyword;
    }

    hideSearchSuggestions();

    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
  }

  function moveSearch(keyword) {
    const value = keyword.trim();

    if (!value) return;

    hideSearchSuggestions();

    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
  }

  function goLoginRequiredPage(targetUrl) {
    location.href = targetUrl;
  }

  async function updateUserInfo() {
    const pw1 = document.getElementById("password1").value;
    const pw2 = document.getElementById("passwordCheck").value;

    if (pw1 === "" && pw2 === "") {
      showCustomAlert("변경 사항이 없습니다.");
      return;
    }

    if (pw1 !== "" && pw1.length < 8) {
      showCustomAlert("비밀번호는 8자 이상이어야 합니다.");
      return;
    }

    if (pw1 === "" && pw2 !== "") {
      showCustomAlert("새 비밀번호를 입력해주세요.");
      return;
    }

    if (pw1 !== "" && pw2 === "") {
      showCustomAlert("비밀번호 확인을 입력해주세요.");
      return;
    }

    if (pw1 !== pw2) {
      showCustomAlert("비밀번호가 일치하지 않습니다.");
      return;
    }

    const email = sessionStorage.getItem("user_id");

    if (!email) {
      showCustomAlert("로그인 정보가 없습니다. 다시 로그인해주세요.");
      location.href = "/view/login.html";
      return;
    }

    try {
      const response = await axios.post("/update_password", {
        email: email,
        new_pw: pw1
      });

      if (response.data.success) {
        document.getElementById("password1").value = "";
        document.getElementById("passwordCheck").value = "";
        document.getElementById("passwordError").style.display = "none";

        showCustomAlert("회원정보 수정이 완료되었습니다.");
      } else {
        showCustomAlert("실패: " + response.data.message);
      }
    } catch (err) {
      console.error("비밀번호 변경 중 에러:", err);
      showCustomAlert("서버 통신 중 오류가 발생했습니다.");
    }
  }

async function deleteUser() {
  const confirmDelete = await showCustomConfirm(
    "정말 회원 탈퇴하시겠습니까?\n탈퇴 시 모든 정보가 삭제됩니다."
  );

  if (!confirmDelete) return;

    const user_id = sessionStorage.getItem("user_id");

    if (!user_id) {
      showCustomAlert("로그인 정보가 없습니다. 다시 로그인해주세요.");
      location.href = "/view/login.html";
      return;
    }

    try {
      const response = await axios.post("/delete_account", {
        user_id: user_id
      });

      if (response.data.success) {
        showCustomAlert(response.data.message);

        sessionStorage.clear();
        localStorage.clear();

        location.href = "/view/main.html";
      } else {
        showCustomAlert("탈퇴 실패: " + response.data.message);
      }
    } catch (err) {
      console.error("탈퇴 중 에러 발생:", err);
      showCustomAlert("서버와 통신 중 오류가 발생했습니다. 다시 시도해주세요.");
    }
  }

  function loadHeader() {
    const headerArea = document.getElementById("header");

    if (!headerArea) return;

    if (headerArea.innerHTML.trim()) {
      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
      return;
    }

    fetch("/view/header.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("header.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        headerArea.innerHTML = html;

        setHeaderLoginState();
        bindCommonSearch();
        applyThemeMode();
      })
      .catch(function (err) {
        console.error("header 로드 실패:", err);
      });
  }

  function setHeaderLoginState() {
    const loginBtn = document.getElementById("loginBtn");
    const joinBtn = document.getElementById("joinBtn");
    const primaryUserBtn = document.getElementById("primaryUserBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (!primaryUserBtn || !logoutBtn) return;

    if (loginBtn) loginBtn.classList.add("hidden");
    if (joinBtn) joinBtn.classList.add("hidden");

    primaryUserBtn.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    primaryUserBtn.innerText = "마이페이지";
  }

  function loadFooter() {
    const footerArea = document.getElementById("footer");

    if (!footerArea) return;

    if (footerArea.innerHTML.trim()) {
      return;
    }

    fetch("/view/footer.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("footer.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        footerArea.innerHTML = html;
      })
      .catch(function (err) {
        console.error("footer 로드 실패:", err);
      });
  }

  function applyThemeMode() {
    const savedTheme = localStorage.getItem("theme_mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (savedTheme === "light") {
      document.body.classList.add("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    } else {
      document.body.classList.remove("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    }
  }

  function toggleThemeMode() {
    const isLight = document.body.classList.contains("light-mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (isLight) {
      document.body.classList.remove("light-mode");
      localStorage.setItem("theme_mode", "dark");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    } else {
      document.body.classList.add("light-mode");
      localStorage.setItem("theme_mode", "light");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    }
  }

  window.openFooterTermsModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>이용약관</h3>
      <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
      <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
      <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
    `;

    modal.classList.remove("hidden");
  };

  window.openFooterPrivacyModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>개인정보처리방침</h3>
      <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
      <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
      <p>개인정보 관련 문의: data260417@gmail.com</p>
    `;

    modal.classList.remove("hidden");
  };

  window.closeFooterModal = function () {
    const modal = document.getElementById("footerModal");

    if (!modal) return;

    modal.classList.add("hidden");
  };

  document.addEventListener("click", async function (e) {
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");

    const footerTermsBtn = e.target.closest("#footerTermsBtn");
    const footerPrivacyBtn = e.target.closest("#footerPrivacyBtn");
    const footerModalCloseBtn = e.target.closest("#footerModalCloseBtn");

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (primaryUserBtn) {
      location.href = "/view/mypage_home.html";
      return;
    }

    if (logoutBtn) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_role");
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("userName");

      sessionStorage.removeItem("access_token");
      sessionStorage.removeItem("user_name");
      sessionStorage.removeItem("user_role");
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("userName");

      try {
        await axios.post("/logout");
      } catch (e) {
        console.error("로그아웃 실패:", e);
      }

      location.href = "/view/main.html";
      return;
    }

    if (loginRequiredLink) {
      const targetUrl = loginRequiredLink.dataset.loginPage;
      location.href = targetUrl;
      return;
    }

    if (footerTermsBtn) {
      openFooterTermsModal();
      return;
    }

    if (footerPrivacyBtn) {
      openFooterPrivacyModal();
      return;
    }

    if (footerModalCloseBtn) {
      closeFooterModal();
      return;
    }
  });

  document.addEventListener("DOMContentLoaded", async function () {

    // 인증한지 10분 안쪽이면 정상 진입
    try {
      const { data } = await axios.post("/pw_check_time");

      if (!data.is_authenticated) {
        location.replace("/view/mypage_home.html");
        return;
      }

    } catch (err) {
      console.error("인증 상태 확인 에러:", err);
      location.replace("/view/mypage_home.html");
      return;
    }

    applyThemeMode();
    loadUserInfo();
    loadHeader();
    loadFooter();

    const passwordError = document.getElementById("passwordError");

    if (passwordError) {
      passwordError.style.display = "none";
    }
  });

  function handleEnter(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    updateUserInfo();
  }
}

function showCustomAlert(message, error = "") {
  const modal = document.getElementById("customAlert");
  const msg = document.getElementById("customAlertMsg");
  const err = document.getElementById("customAlertError");
  const btn = document.getElementById("customAlertBtn");

  msg.innerText = message;
  err.innerText = error;

  modal.classList.remove("hidden");

  btn.onclick = function () {
    modal.classList.add("hidden");
  };
}

document.addEventListener("click", function (e) {
  const modal = document.getElementById("customAlert");

  if (!modal || modal.classList.contains("hidden")) return;

  const content = modal.querySelector(".custom-alert-content");

  // 배경 클릭이면 닫기
  if (!content.contains(e.target)) {
    closeCustomAlert();
  }
});

  document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    const modal = document.getElementById("customAlert");
    if (modal) modal.classList.add("hidden");
  }
});

function showCustomConfirm(message) {
  return new Promise((resolve) => {
    const modal = document.getElementById("customAlert");
    const msg = document.getElementById("customAlertMsg");
    const yesBtn = document.getElementById("customAlertBtn");
    const noBtn = document.getElementById("customAlertNo");

    msg.innerText = message;
    modal.classList.remove("hidden");

    yesBtn.onclick = () => {
      modal.classList.add("hidden");
      resolve(true);
    };

    noBtn.onclick = () => {
      modal.classList.add("hidden");
      resolve(false);
    };
  });
}
