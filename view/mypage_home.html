<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DATA 다타 - 마이페이지</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    body {
      background: #050916;
      color: #d9e7ff;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
    }

    .page {
      width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      padding-top: 72px;
      background: #050816;

      display: flex;
      flex-direction: column;
    }

    .layout {
      width: 1240px;
      margin: 0 auto;
      display: flex;

      flex: 1;
    }

    aside {
      width: 230px;
      background: #0b1020;
      padding-top: 45px;
      border-right: 1px solid #121a2d;
    }

    .side-title-wrap {
      padding: 0 24px 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid #2f3748;
    }

    .side-title {
      color: #6e7c98;
      font-size: 13px;
    }

    .side-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .side-menu li {
      height: 46px;
      display: flex;
      align-items: center;
      padding-left: 28px;
      color: #6f7d98;
      font-size: 14px;
      border-left: 4px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }

    .side-menu li:hover {
      background: #10192b;
    }

    .side-menu li.active {
      background: #132137;
      color: #42bfff;
      border-left-color: #24bfff;
      font-weight: 700;
    }

    main {
      flex: 1;
      padding: 42px 28px 80px;
    }

    section {
      margin-bottom: 38px;
    }

    .section-head {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 18px;
      color: #f1f6ff;
    }

    .badge {
      margin-left: 10px;
      background: #132a4b;
      color: #70baff;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .hint {
      margin-left: auto;
      color: #53637f;
      font-size: 12px;
    }

    .news-list {
      border-top: 1px solid #1a2540;
      border-bottom: 1px solid #1a2540;
    }

    .news-item {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #101a30;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      border-radius: 8px;
    }

    .news-item:hover {
      background: #111a33;
    }

    .news-item:active {
      transform: scale(0.99);
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .num {
      color: #3a4d6f;
      font-size: 13px;
      text-align: center;
    }

    .title {
      color: #dce8ff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .desc {
      color: #566985;
      font-size: 12px;
      line-height: 1.5;
    }

    .category {
      color: #16d9ff;
      border: 1px solid #0c6e8a;
      background: #06202f;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .dots {
      text-align: center;
      margin-top: 16px;
    }

    .dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1e2a43;
      margin: 0 4px;
      cursor: pointer;
      transition: 0.2s;
    }

    .dots span:hover {
      background: #42bfff;
      transform: scale(1.15);
    }

    .dots span.active {
      background: #4aaeff;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: #090f20;
      border: 1px solid #1a2540;
      border-radius: 12px;
      padding: 18px 18px 12px;
      min-height: 500px;
      max-height: 500px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 800;
      font-size: 14px;
    }

    .like {
      color: #3498ff;
    }

    .dislike {
      color: #ff4e5f;
    }

    .count {
      color: #566985;
      font-size: 12px;
    }

    .mini-news {
      display: flex;
      justify-content: space-between;
      padding: 9px 10px;
      border-bottom: 1px solid #121c31;
      font-size: 13px;
      color: #b8c8e6;
      cursor: pointer;
      transition: background 0.2s ease;
      border-radius: 6px;
    }

    .mini-news:hover {
      background: #131d36;
      color: #42bfff;
    }

    .mini-news:hover .date {
      color: #70baff;
    }

    .mini-news span:first-child {
      width: 82%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mini-news:last-child {
      border-bottom: none;
    }

    .date {
      color: #4f607b;
      font-size: 12px;
    }

    .pagination {
      text-align: center;
      margin-top: 28px;
      color: #52627d;
      font-size: 12px;
    }

    .pagination span,
    .pagination b {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
      font-size: 13px;
      color: #5c6b89;
      text-decoration: none;
    }

    .pagination span:hover {
      background: #10192b;
      color: #42bfff;
    }

    .pagination b {
      background: #132a4b;
      color: #5fb7ff;
      font-weight: 700;
    }

    .ad-box {
      margin-top: 40px;
      min-height: 64px;
      border: 1px dashed #1c2b47;
      border-radius: 12px;
      background: #0b1220;
      color: #3f4f6b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }

    .ad-box.active {
      border: none;
      background: linear-gradient(90deg, #0ea5ff, #2563ff);
      color: #ffffff;
      justify-content: space-between;
      padding: 18px 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .notice-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .notice-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .notice-title {
      font-size: 15px;
    }

    .notice-arrow {
      font-size: 20px;
    }

    /* ===== HEADER ===== */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      transform: none;
      z-index: 10000;

      width: 100%;
      height: 72px;
      padding: 0 56px;

      display: flex;
      align-items: center;

      background: #070b1a;
      border-bottom: 1px solid #111827;
    }

    .logo {
      width: 155px;
      height: 52px;
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    .header-logo-full {
      height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-left: 22px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .nav a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
    }

    .nav a:hover {
      color: #00e5ff;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-search-wrap {
      position: relative;
      width: 410px;
      height: 40px;
      border-radius: 999px;
      background: #070b1a;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      padding: 0 14px 0 20px;
    }

    .search-box {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 15px;
      padding: 0;
    }

    .search-box::placeholder {
      color: #7c8493;
    }

    .main-search-wrap:focus-within {
      border-color: #334155;
    }

    .search-icon-btn {
      width: 24px;
      height: 24px;
      border: 0;
      background: transparent;
      color: #8b95a7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    .search-icon-btn:hover {
      color: #00e5ff;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      background: #070b1a;
      color: #facc15;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-btn:hover {
      border-color: #334155;
    }

    .header-btn {
      height: 40px;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .header-btn.login {
      border: 1px solid #00cfe8;
      background: #00cfe8;
      color: #020617;
    }

    .header-btn.login:hover {
      filter: brightness(1.08);
    }

    .header-btn.join {
      border: 1px solid #475569;
      background: transparent;
      color: #cbd5e1;
    }

    .header-btn.join:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .search-suggest-box {
      position: fixed;
      width: 410px;
      max-width: 80vw;
      padding: 10px 0 12px;
      border: 1px solid #1e293b;
      border-radius: 18px;
      background: #050b1c;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      z-index: 20000;
      overflow: hidden;
    }

    .search-suggest-list {
      display: flex;
      flex-direction: column;
    }

    .search-suggest-item {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      cursor: pointer;
      color: #dbeafe;
      transition: 0.2s;
    }

    .search-suggest-item:hover {
      background: #0f172a;
    }

    .search-suggest-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-suggest-icon {
      color: #38bdf8;
      font-size: 13px;
    }

    .search-suggest-keyword {
      font-size: 14px;
    }

    .search-suggest-arrow {
      color: #64748b;
      font-size: 12px;
    }

    .search-highlight {
      color: #00e5ff;
      font-weight: 700;
    }

/* ===== FOOTER ===== */

/* .page는 1440px 그대로 두고, footer만 화면 전체 폭으로 빼기 */
#footer {
  width: 100vw;
  margin-left: calc((1440px - 100vw) / 2);
  flex-shrink: 0;
}

.footer {
  width: 100%;
  min-height: 88px;
  background: #020617;
  color: #fff;
  box-sizing: border-box;
}

.footer-inner {
  width: 100%;
  min-height: 88px;
  padding: 0 70px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  gap: 22px;

  color: #64748b;
  font-size: 12px;
}

    .footer-logo-white {
      width: 34px;
      height: 34px;
      background-color: #ffffff;

      -webkit-mask-image: url("/view/img/favicon.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/view/img/favicon.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      flex-shrink: 0;
    }

    .footer-link {
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
    }

    .footer-link:hover {
      color: #00e5ff;
    }

    .footer-divider {
      width: 1px;
      height: 12px;
      background: #334155;
    }

    .footer-copy {
      margin: 0;
      color: #64748b;
    }

    /* ==============================
       Footer Modal
    ============================== */

    .footer-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30000;
    }

    .footer-modal.hidden {
      display: none !important;
    }

    .footer-modal-box {
      width: 520px;
      max-width: calc(100% - 32px);
      max-height: 70vh;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
    }

    .footer-modal-content {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }

    .footer-modal-content h3 {
      margin: 0 0 16px;
      color: #f8fafc;
    }

    .footer-modal-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #020617;
      font-weight: 900;
      cursor: pointer;
    }

    /* ===== PW MODAL ===== */

    .pw-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    .pw-modal.hidden {
      display: none !important;
    }

    .pw-modal-box {
      width: 520px;
      background: #1b2133;
      border-radius: 28px;
      padding: 28px 36px 34px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    }

    .pw-input {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1px solid #00d2ff;
      background: #031224;
      padding: 0 18px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .pw-input::placeholder {
      color: #5d6b86;
    }

    .pw-modal-btns {
      display: flex;
      justify-content: center;
      gap: 56px;
      margin-top: 24px;
    }

    .pw-confirm-btn,
    .pw-cancel-btn {
      width: 130px;
      height: 42px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .pw-confirm-btn {
      border: 1px solid #00d2ff;
      background: transparent;
      color: #00d2ff;
    }

    .pw-cancel-btn {
      border: 1px solid #44506a;
      background: transparent;
      color: #73829d;
    }

    /* ==============================
       Light Mode
    ============================== */

    body.light-mode {
      background: #f8fafc;
      color: #0f172a;
    }

    body.light-mode .page {
      background: #f8fafc;
    }

    body.light-mode .header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .nav {
      color: #64748b;
    }

    body.light-mode .nav a:hover {
      color: #0284c7;
    }

    body.light-mode .main-search-wrap {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    body.light-mode .search-box {
      color: #0f172a;
    }

    body.light-mode .search-box::placeholder {
      color: #94a3b8;
    }

    body.light-mode .search-icon-btn {
      color: #64748b;
    }

    body.light-mode .theme-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.light-mode .header-btn.join {
      background: #ffffff;
      border-color: #94a3b8;
      color: #334155;
    }

    body.light-mode .header-btn.login {
      background: #00cfe8;
      border-color: #00cfe8;
      color: #020617;
    }

    body.light-mode aside {
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
    }

    body.light-mode .side-title {
      color: #64748b;
    }

    body.light-mode .side-title-wrap {
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .side-menu li {
      color: #64748b;
    }

    body.light-mode .side-menu li:hover {
      background: #f1f5f9;
    }

    body.light-mode .side-menu li.active {
      background: #e0f7ff;
      color: #0284c7;
      border-left-color: #00cfe8;
    }

    body.light-mode h2,
    body.light-mode .title,
    body.light-mode .card-head,
    body.light-mode .article-title {
      color: #0f172a;
    }

    body.light-mode .desc,
    body.light-mode .hint,
    body.light-mode .date,
    body.light-mode .count {
      color: #64748b;
    }

    body.light-mode .news-list {
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .news-item {
      border-bottom: 1px solid #e2e8f0;
    }

    body.light-mode .news-item:hover {
      background: #f1f5f9;
    }

    body.light-mode .card,
    body.light-mode .ad-box {
      background: #ffffff;
      border-color: #e2e8f0;
    }

    body.light-mode .mini-news {
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
    }

    body.light-mode .mini-news:hover {
      background: #f1f5f9;
      color: #0284c7;
    }

    body.light-mode .search-suggest-box {
      background: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
    }

    body.light-mode .search-suggest-item {
      color: #334155;
    }

    body.light-mode .search-suggest-item:hover {
      background: #e0f7ff;
      color: #0284c7;
    }

    body.light-mode .footer {
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    body.light-mode .footer-logo-white {
      background-color: #020617;
    }

    body.light-mode .footer-link {
      color: #475569;
    }

    body.light-mode .footer-link:hover {
      color: #0284c7;
    }

    body.light-mode .footer-copy {
      color: #64748b;
    }

    body.light-mode .footer-modal-box,
    body.light-mode .pw-modal-box {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    body.light-mode .footer-modal-content {
      color: #334155;
    }

    body.light-mode .footer-modal-content h3 {
      color: #0f172a;
    }

    body.light-mode .pw-input {
      background: #f8fafc;
      color: #0f172a;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

  function selectMenu(element, pageType) {
    document.querySelectorAll(".side-menu li").forEach(li => {
      li.classList.remove("active");
    });

    element.classList.add("active");

    if (pageType === "home") {
      window.location.href = "mypage_home.html";
    }

    if (pageType === "account") {
      window.location.href = "mypage_account.html";
    }
  }

  function bindCommonSearch() {
    const input = document.getElementById("commonSearchInput");
    const searchBtn = document.getElementById("commonSearchBtn");

    if (!input) return;

    if (searchBtn) {
      searchBtn.addEventListener("click", function () {
        moveSearch(input.value);
      });
    }

    input.addEventListener("input", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("focus", function () {
      renderSearchSuggestions(input.value);
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        moveSearch(input.value);
      }

      if (e.key === "Escape") {
        hideSearchSuggestions();
      }
    });

    document.addEventListener("click", function (e) {
      const searchWrap = document.querySelector(".main-search-wrap");

      if (!searchWrap) return;

      if (!searchWrap.contains(e.target)) {
        hideSearchSuggestions();
      }
    });

    window.addEventListener("resize", positionSearchSuggestBox);
    window.addEventListener("scroll", positionSearchSuggestBox);
  }

  function highlightKeyword(text, keyword) {
    if (!keyword) return text;

    const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(`(${escapedKeyword})`, "gi");

    return text.replace(regex, `<span class="search-highlight">$1</span>`);
  }

  async function renderSearchSuggestions(keyword) {
    const list = document.getElementById("searchSuggestList");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!list || !suggestBox) return;

    const value = keyword.trim();

    if (!value) {
      hideSearchSuggestions();
      return;
    }

    try {
      const res = await axios.get(
        `/api/search/suggest?q=${encodeURIComponent(value)}`
      );

      const results = res.data || [];

      if (results.length === 0) {
        hideSearchSuggestions();
        return;
      }

      list.innerHTML = results.map(function (item) {
        return `
          <button
            class="search-suggest-item"
            type="button"
            data-suggest-keyword="${item}"
          >
            <span class="search-suggest-left">
              <span class="search-suggest-icon">⌕</span>

              <span class="search-suggest-keyword">
                ${highlightKeyword(item, value)}
              </span>
            </span>

            <span class="search-suggest-arrow">↖</span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const keyword = btn.dataset.suggestKeyword;

          selectSearchSuggestion(keyword);
        });
      });

      positionSearchSuggestBox();

      suggestBox.classList.remove("hidden");

    } catch (error) {
      console.error("검색 자동완성 실패:", error);

      hideSearchSuggestions();
    }
  }

  function positionSearchSuggestBox() {
    const searchWrap = document.querySelector(".main-search-wrap");
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!searchWrap || !suggestBox) return;

    const rect = searchWrap.getBoundingClientRect();

    suggestBox.style.top = `${rect.bottom + 4}px`;
    suggestBox.style.left = `${rect.left}px`;
    suggestBox.style.width = `${rect.width}px`;
  }

  function hideSearchSuggestions() {
    const suggestBox = document.getElementById("searchSuggestBox");

    if (!suggestBox) return;

    suggestBox.classList.add("hidden");
  }

  function selectSearchSuggestion(keyword) {
    const input = document.getElementById("commonSearchInput");

    if (input) {
      input.value = keyword;
    }

    hideSearchSuggestions();

    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`);
  }

  function moveSearch(keyword) {
    const value = keyword.trim();

    if (!value) return;

    hideSearchSuggestions();

    goLoginRequiredPage(`/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`);
  }

  const pageSize = 10;

function moveNewsDetail(articleId) {
  if (!articleId) return;
  location.href = `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;
}

function formatDate(dateStr) {
  if (!dateStr) return "";

  const date = new Date(dateStr);
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");

  return `${mm}.${dd}`;
}

function renderMiniNewsFromServer(selector, list) {
  const rows = document.querySelectorAll(selector + " .mini-news");

  rows.forEach((row, index) => {
    const item = list[index];
    const titleEl = row.querySelector("span:first-child");
    const dateEl = row.querySelector(".date");

    if (item) {
      titleEl.textContent = item.title || "제목 없음";
      dateEl.textContent = formatDate(item.created_at || item.date);
      row.onclick = () => moveNewsDetail(item.article_id);
    } else {
      titleEl.textContent = "";
      dateEl.textContent = "";
      row.onclick = null;
    }
  });
}

function renderReactionPagination(targetId, totalCount, currentPage, type) {
  const totalPage = Math.ceil(totalCount / pageSize);
  const el = document.getElementById(targetId);

  if (!el || totalPage <= 1) {
    if (el) el.innerHTML = "";
    return;
  }

  let html = "";

  html += `<span onclick="loadReactionNews('${type}', 1)"><<</span> `;
  html += `<span onclick="loadReactionNews('${type}', ${Math.max(1, currentPage - 1)})"><</span> `;

  for (let i = 1; i <= totalPage; i++) {
    html += i === currentPage
      ? `<b>${i}</b> `
      : `<span onclick="loadReactionNews('${type}', ${i})">${i}</span> `;
  }

  html += `<span onclick="loadReactionNews('${type}', ${Math.min(totalPage, currentPage + 1)})">></span> `;
  html += `<span onclick="loadReactionNews('${type}', ${totalPage})">>></span>`;

  el.innerHTML = html;
}

async function loadReactionNews(type, page = 1) {
  try {
    const { data } = await axios.get("/api/mypage/reactions", {
      params: { type, page, size: pageSize }
    });

    const isLike = type === "like";

    const selector = isLike
      ? ".cards .card:first-child"
      : ".cards .card:last-child";

    const paginationId = isLike
      ? "likePagination"
      : "dislikePagination";

    const countEl = isLike
      ? document.querySelector(".like").nextElementSibling
      : document.querySelector(".dislike").nextElementSibling;

    countEl.innerText = `총 ${data.total_count || 0}건`;

    renderMiniNewsFromServer(selector, data.articles || []);
    renderReactionPagination(paginationId, data.total_count || 0, page, type);

  } catch (err) {
    console.error("선호/비선호 뉴스 로드 실패:", err);
  }
}

function loadLikePage(page = 1) {
  loadReactionNews("like", page);
}

function loadDislikePage(page = 1) {
  loadReactionNews("dislike", page);
}

async function loadViewedNews(page = 1) {
  try {
    const { data } = await axios.get("/api/mypage/viewed-news", {
      params: {
        page,
        size: 10
      }
    });

    const newsList = document.querySelector(".news-list");

    if (!newsList) return;

    newsList.innerHTML = "";

    const articles = data.articles || [];

    articles.forEach((item, index) => {
      newsList.innerHTML += `
        <div class="news-item"
             onclick="moveNewsDetail('${item.article_id}')">

          <div class="num">
            ${String(index + 1).padStart(2, "0")}
          </div>

          <div>
            <div class="title">
              ${item.title || "제목 없음"}
            </div>

            <div class="desc">
              ${item.description || ""}
            </div>
          </div>

          <span class="category">
            ${item.category || "경제"}
          </span>
        </div>
      `;
    });

    const badge = document.querySelector(".badge");

    if (badge) {
      badge.innerText = `${data.total_count || 0}개`;
    }

    renderViewedPagination(
      data.total_count || 0,
      page
    );

  } catch (err) {
    console.error("내가 본 뉴스 로딩 실패:", err);
  }
}

function renderViewedPagination(totalCount, currentPage) {
  const dots = document.querySelector(".dots");

  if (!dots) return;

  const totalPage = Math.ceil(totalCount / 10);

  let html = "";

  for (let i = 1; i <= totalPage; i++) {
    html += `
      <span
        class="dot ${i === currentPage ? "active" : ""}"
        onclick="loadViewedNews(${i})">
      </span>
    `;
  }

  dots.innerHTML = html;
}

  async function pwconfirm() {
    const password = document.getElementById("pwInput").value.trim();

    try {
      const { data } = await axios.post("/pw_check", {

      if (data.success) {
        alert("본인 인증에 성공하였습니다.");
        location.href = "/view/mypage_account.html";
      } else {
        alert("실패: " + data.message);

      alert("서버 통신 중 오류가 발생했습니다.");
    }

  function loadHeader() {
    const headerArea = document.getElementById("header");

    if (!headerArea) return;

    if (headerArea.innerHTML.trim()) {
      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
      return;
    }

    fetch("/view/header.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("header.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        headerArea.innerHTML = html;

        setHeaderLoginState();
        bindCommonSearch();
        applyThemeMode();
      })
      .catch(function (err) {
        console.error("header 로드 실패:", err);
      });
  }

  function setHeaderLoginState() {
    const loginBtn = document.getElementById("loginBtn");
    const joinBtn = document.getElementById("joinBtn");
    const primaryUserBtn = document.getElementById("primaryUserBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    if (!primaryUserBtn || !logoutBtn) return;

    if (loginBtn) loginBtn.classList.add("hidden");
    if (joinBtn) joinBtn.classList.add("hidden");

    primaryUserBtn.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    primaryUserBtn.innerText = "마이페이지";
  }

  function applyThemeMode() {
    const savedTheme = localStorage.getItem("theme_mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (savedTheme === "light") {
      document.body.classList.add("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    } else {
      document.body.classList.remove("light-mode");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    }
  }

  function toggleThemeMode() {
    const isLight = document.body.classList.contains("light-mode");
    const themeBtn = document.getElementById("themeToggleBtn");

    if (isLight) {
      document.body.classList.remove("light-mode");
      localStorage.setItem("theme_mode", "dark");

      if (themeBtn) {
        themeBtn.innerText = "🌙";
      }
    } else {
      document.body.classList.add("light-mode");
      localStorage.setItem("theme_mode", "light");

      if (themeBtn) {
        themeBtn.innerText = "☀️";
      }
    }
  }

  function goLoginRequiredPage(targetUrl) {
    location.href = targetUrl;
  }

  function loadFooter() {
    const footerArea = document.getElementById("footer");

    if (!footerArea) return;

    if (footerArea.innerHTML.trim()) {
      return;

      .then(function (res) {
        if (!res.ok) {

        return res.text();

  document.addEventListener("click", function (e) {
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");
    const accountPageBtn = e.target.closest("#accountPageBtn");
    const pwCancelBtn = e.target.closest("#pwCancelBtn");

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (accountPageBtn) {
      (async () => {
        try {
          const { data } = await axios.post("/pw_check_time");

          if (data.is_authenticated) {
            location.href = "/view/mypage_account.html";
          } else {
            const modal = document.getElementById("pwModal");
            const input = document.getElementById("pwInput");

            modal.classList.remove("hidden");

            setTimeout(() => {
              input.focus();
            }, 50);
          }
        } catch (err) {
          console.error("인증 상태 확인 에러:", err);
          alert("서버 통신 중 오류가 발생했습니다.");
        }
      })();

      return;
    }

    if (pwCancelBtn) {
      document.getElementById("pwModal").classList.add("hidden");
      document.getElementById("pwInput").value = "";
      return;
    }

    if (primaryUserBtn) {
      location.href = "/view/mypage_home.html";
      return;
    }

    if (logoutBtn) {
      localStorage.removeItem("access_token");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_role");
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      localStorage.removeItem("userName");

      sessionStorage.removeItem("access_token");
      sessionStorage.removeItem("user_name");
      sessionStorage.removeItem("user_role");
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("userName");

      axios.post("/logout");

      location.href = "/view/main.html";
      return;
    }

    if (loginRequiredLink) {
      const targetUrl = loginRequiredLink.dataset.loginPage;
      location.href = targetUrl;
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    applyThemeMode();

    loadLikePage(1);
