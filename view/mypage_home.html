<head>
  <meta charset="UTF-8" />
  <title>DATA 다타 - 마이페이지</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .hidden {
      display: none !important;
    }

    body {
      background: #050916;
      color: #d9e7ff;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
    }

    .layout {
      width: 1240px;
      margin: 0 auto;
      display: flex;
      min-height: calc(100vh - 74px);
    }

    aside {
      width: 230px;
      background: #0b1020;
      padding-top: 45px;
      border-right: 1px solid #121a2d;
    }

    .side-title {
      color: #6e7c98;
      font-size: 13px;
      margin: 0 5px 0;
    }

    .side-title-wrap{
        padding: 0 24px 14px;
        margin-bottom: 18px;
        border-bottom: 1px solid #2f3748; /* 회색 선 */
    }

    .side-title{
        color: #6e7c98;
        font-size: 13px;
    }

    .side-menu {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .side-menu li {
        height: 46px;
        display: flex;
        align-items: center;
        padding-left: 28px;
        color: #6f7d98;
        font-size: 14px;
        border-left: 4px solid transparent;
        cursor: pointer;
        transition: 0.2s;
    }

    .side-menu li:hover {
       background: #10192b; 
    }

    /* 선택된 메뉴 */
    .side-menu li.active {
        background: #132137;
        color: #42bfff;
        border-left-color: #24bfff;
        font-weight: 700;
    }

    main {
      flex: 1;
      padding: 42px 28px 80px;
    }

    section {
      margin-bottom: 38px;
    }

    .section-head {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 18px;
      color: #f1f6ff;
    }

    .badge {
      margin-left: 10px;
      background: #132a4b;
      color: #70baff;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
    }

    .hint {
      margin-left: auto;
      color: #53637f;
      font-size: 12px;
    }

    .news-list {
      border-top: 1px solid #1a2540;
      border-bottom: 1px solid #1a2540;
    }

    .news-item {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #101a30;
      align-items: center;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .num {
      color: #3a4d6f;
      font-size: 13px;
      text-align: center;
    }

    .title {
      color: #dce8ff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .desc {
      color: #566985;
      font-size: 12px;
      line-height: 1.5;
    }

    .category {
      color: #16d9ff;
      border: 1px solid #0c6e8a;
      background: #06202f;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .dots {
        text-align: center;
        margin-top: 16px;
    }

    .dots span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1e2a43;
        margin: 0 4px;
        cursor: pointer;          /* 손가락 모양 */
        transition: 0.2s;
    }

    .dots span:hover {
        background: #42bfff;
        transform: scale(1.15);
    }

    .dots span.active {
        background: #4aaeff;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: #090f20;
      border: 1px solid #1a2540;
      border-radius: 12px;
      padding: 18px 18px 12px;
      min-height: 350px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 800;
      font-size: 14px;
    }

    .like {
      color: #3498ff;
    }

    .dislike {
      color: #ff4e5f;
    }

    .count {
      color: #566985;
      font-size: 12px;
    }

    .mini-news {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #121c31;
      font-size: 13px;
      color: #b8c8e6;
    }

    .mini-news span:first-child {
      width: 82%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .date {
      color: #4f607b;
      font-size: 12px;
    }

    .pagination {
      text-align: center;
      margin-top: 28px;
      color: #52627d;
      font-size: 12px;
    }

    /* 좋아요 / 싫어요 페이지네이션 클릭 영역 */
    .pagination span,
    .pagination b {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        margin: 0 3px;
        border-radius: 6px;
        cursor: pointer;          /* 마우스 손가락 모양 */
        user-select: none;
        transition: 0.2s;
    }

    /* hover */
    .pagination span:hover {
        background: #10192b;
        color: #42bfff;
    }

    /* 현재 페이지 */
    .pagination b {
        background: #132a4b;
        color: #5fb7ff;
        font-weight: 700;
    }

    .ad-box {
      margin-top: 40px;
      min-height: 64px;
      border: 1px dashed #1c2b47;
      border-radius: 12px;
      background: #0b1220;
      color: #3f4f6b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }

    /* 관리자 공지 등록 시 */
    .ad-box.active{
        border: none;
        background: linear-gradient(90deg,#0ea5ff,#2563ff);
        color: #ffffff;
        justify-content: space-between;
        padding: 18px 24px;
        font-weight: 700;
        cursor: pointer;
    }

    .notice-left{
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .notice-badge{
        background: rgba(255,255,255,0.18);

        font-size: 12px;
    }

    .notice-title{

    }

    .notice-arrow{

    }

    .bottom-btn {
      text-align: center;
      margin-top: 20px;
    }

    .bottom-btn button {
      background: #052838;
      color: #12d9ff;
      border: 1px solid #064f67;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
    }

function selectMenu(element, pageType) {
  document.querySelectorAll('.side-menu li').forEach(li => {
    li.classList.remove('active');
  });

  element.classList.add('active');

  if (pageType === "home") {
    window.location.href = "mypage_home.html";
  }

  if (pageType === "account") {
    window.location.href = "mypage_account.html";
  }
}

function showPage(page) {
  const newsList = document.querySelector(".news-list");
  const dots = document.querySelectorAll(".dot");

  newsList.innerHTML = "";

  newsPages[page - 1].forEach(item => {
    newsList.innerHTML += `
      <div class="news-item">
        <div class="num">${item.num}</div>
        <div>
          <div class="title">${item.title}</div>
          <div class="desc">${item.desc}</div>
        </div>
        <span class="category">${item.category}</span>
      </div>
    `;
  });

  dots.forEach(dot => dot.classList.remove("active"));
  if (dots[page - 1]) dots[page - 1].classList.add("active");
}

/* =========================
   좋아요 / 싫어요 카드 내용 출력
========================= */
function renderMiniNews(selector, list, page = 1) {
  const pageSize = 10;
  const start = (page - 1) * pageSize;
  const rows = document.querySelectorAll(selector + " .mini-news");

  rows.forEach((row, index) => {
    const item = list[start + index];

    if (item) {
      row.children[0].innerText = item;
      row.children[1].innerText = "04." + String(index + 1).padStart(2, '0');
    } else {
      row.children[0].innerText = "";
      row.children[1].innerText = "";
    }
  });
}

/* =========================
   페이지네이션 생성
========================= */
function renderPagination(targetId, totalCount, currentPage, callbackName) {
  const pageSize = 10;
  const totalPage = Math.ceil(totalCount / pageSize);
  const el = document.getElementById(targetId);

  let html = "";

  html += `<span onclick="${callbackName}(1)"><<</span> `;
  html += `<span onclick="${callbackName}(${Math.max(1,currentPage-1)})"><</span> `;

  for (let i = 1; i <= totalPage; i++) {
    if (i === currentPage) {
      html += `<b>${i}</b> `;
    } else {
      html += `<span onclick="${callbackName}(${i})">${i}</span> `;
    }
  }

  html += `<span onclick="${callbackName}(${Math.min(totalPage,currentPage+1)})">></span> `;
  html += `<span onclick="${callbackName}(${totalPage})">>></span>`;

  el.innerHTML = html;
}
