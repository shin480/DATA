<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공지사항 상세 | DATA 다타</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: #050916;
      color: #d9e7ff;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(14, 165, 255, 0.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(37, 99, 255, 0.12), transparent 38%),
        #050916;
    }

    .notice-detail-wrap {
      width: 980px;
      min-height: calc(100vh - 88px);
      margin: 0 auto;
      padding: 64px 0 90px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 46px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .notice-logo-img {
      height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .back-btn {
      border: 1px solid #1f2937;
      background: rgba(7, 11, 26, 0.82);
      color: #94a3b8;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: 0.2s;
    }

    .back-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
      background: rgba(15, 23, 42, 0.9);
    }

    .detail-label {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .detail-panel {
      border: 1px solid #17223a;
      border-radius: 18px;
      background: rgba(5, 11, 28, 0.78);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .detail-head {
      padding: 34px 38px 28px;
      border-bottom: 1px solid #17223a;
      background: rgba(15, 23, 42, 0.48);
    }

    .detail-title {
      color: #f8fafc;
      font-size: 28px;
      line-height: 1.35;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #64748b;
      font-size: 13px;
    }

    .meta-badge {
      color: #38bdf8;
      font-weight: 900;
    }

    .detail-body {
      min-height: 260px;
      padding: 38px;
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.9;
    }

    .detail-body p {
      margin-bottom: 14px;
    }

    .notice-link-box {
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid #1f2a44;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.58);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .notice-link-text {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.6;
    }

    .notice-link-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 999px;
      background: #00e5ff;
      color: #020617;
      padding: 11px 18px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .notice-link-btn:hover {
      filter: brightness(1.08);
    }

    .detail-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 26px 38px 34px;
      border-top: 1px solid #17223a;
    }

    .list-btn {
      border: 1px solid #334155;
      background: transparent;
      color: #cbd5e1;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .list-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .notice-empty {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
      text-align: center;
      line-height: 1.7;
      border: 1px solid #17223a;
      border-radius: 18px;
      background: rgba(5, 11, 28, 0.78);
    }

    .notice-content-text {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.9;
      white-space: normal;
      word-break: keep-all;
    }

    /* ===== FOOTER ===== */

    #footer {
      width: 100%;
      flex-shrink: 0;
    }

    .footer {
      width: 100%;
      min-height: 88px;
      background: #020617;
      color: #fff;
      box-sizing: border-box;
    }

    .footer-inner {
      width: 100%;
      min-height: 88px;
      padding: 0 70px;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      gap: 22px;

      color: #64748b;
      font-size: 12px;
    }

    .footer-logo-white {
      width: 34px;
      height: 34px;
      background-color: #ffffff;

      -webkit-mask-image: url("/view/img/favicon.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("/view/img/favicon.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;

      flex-shrink: 0;
    }

    .footer-link {
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
      text-decoration: none;
    }

    .footer-link:hover {
      color: #00e5ff;
    }

    .footer-divider {
      width: 1px;
      height: 12px;
      background: #334155;
    }

    .footer-copy {
      margin: 0;
      color: #64748b;
    }

    /* ===== FOOTER MODAL ===== */

    .footer-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30000;
    }

    .footer-modal.hidden {
      display: none !important;
    }

    .footer-modal-box {
      width: 520px;
      max-width: calc(100% - 32px);
      max-height: 70vh;
      overflow-y: auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
    }

    .footer-modal-content {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }

    .footer-modal-content h3 {
      margin: 0 0 16px;
      color: #f8fafc;
    }

    .footer-modal-content p {
      margin-bottom: 10px;
    }

    .footer-modal-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #020617;
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width: 1100px) {
      .notice-detail-wrap {
        width: calc(100% - 40px);
      }
    }

    @media (max-width: 720px) {
      .notice-detail-wrap {
        width: calc(100% - 28px);
        padding-top: 36px;
      }

      .detail-head,
      .detail-body,
      .detail-actions {
        padding-left: 22px;
        padding-right: 22px;
      }

      .detail-title {
        font-size: 23px;
      }

      .notice-link-box {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
<div class="page">
  <main class="notice-detail-wrap">
    <div class="top-bar">
      <a href="/view/main.html" class="logo-area">
        <img src="/view/img/header_logo.png" alt="DATA 다타 로고" class="notice-logo-img">
      </a>

      <button class="back-btn" type="button" onclick="history.back()">
        ← 이전 페이지로
      </button>
    </div>

    <span class="detail-label">NOTICE DETAIL</span>

    <section id="noticeDetailArea">
      <div class="notice-empty">
        공지사항을 불러오는 중입니다.
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <div class="footer-modal hidden" id="footerModal">
    <div class="footer-modal-box">
      <div class="footer-modal-content" id="footerModalContent"></div>

      <button class="footer-modal-btn" type="button" onclick="closeFooterModal()">
        확인
      </button>
    </div>
  </div>
</div>

<script>
  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  async function loadNoticeDetail() {
    const area = document.getElementById("noticeDetailArea");
    const bannerId = getQueryParam("banner_id");

    if (!area) return;

    if (!bannerId) {
      area.innerHTML = `
        <div class="notice-empty">
          잘못된 접근입니다.<br>
          공지사항 목록에서 다시 선택해주세요.
        </div>
      `;
      return;
    }

    try {
      const { data } = await axios.get("/api/banner/active-list");

      const banners = data.banners || [];

      const notice = banners.find(function (item) {
        return String(item.banner_id) === String(bannerId)
          && item.banner_type === "notice";
      });

      if (!notice) {
        area.innerHTML = `
          <div class="notice-empty">
            공지사항을 찾을 수 없습니다.<br>
            이미 종료되었거나 비활성화된 공지일 수 있습니다.
          </div>
        `;
        return;
      }

      renderNoticeDetail(notice);

    } catch (err) {
      console.error("공지사항 상세 로드 실패:", err);

      area.innerHTML = `
        <div class="notice-empty">
          공지사항을 불러오지 못했습니다.<br>
          잠시 후 다시 시도해주세요.
        </div>
      `;
    }
  }

  function renderNoticeDetail(notice) {
    const area = document.getElementById("noticeDetailArea");

    if (!area) return;

    const dateText = formatDate(notice.created_at || notice.start_at);
    const title = notice.title || "제목 없음";
    const content = notice.content || "등록된 상세 내용이 없습니다.";

    area.innerHTML = `
      <article class="detail-panel">
        <div class="detail-head">
          <h1 class="detail-title">
            ${escapeHtml(title)}
          </h1>

          <div class="detail-meta">
            <span class="meta-badge">등록일</span>
            <span>${dateText}</span>
          </div>
        </div>

        <div class="detail-body">
          <div class="notice-content-text">
            ${escapeHtml(content).replaceAll("\n", "<br>")}
          </div>
        </div>

        <div class="detail-actions">
          <button class="list-btn" type="button" onclick="location.href='/view/notice_list.html'">
            목록으로
          </button>
        </div>
      </article>
    `;
  }

  function openNoticeLink(url) {
    if (!url) return;

    let targetUrl = url;

    if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
      targetUrl = "https://" + targetUrl;
    }

    window.open(targetUrl, "_blank");
  }

  function formatDate(dateStr) {
    if (!dateStr) return "-";

    const date = new Date(dateStr);

    if (isNaN(date.getTime())) return "-";

    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");

    return `${yyyy}.${mm}.${dd}`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(value) {
    return String(value)
      .replaceAll("\\", "\\\\")
      .replaceAll("'", "\\'")
      .replaceAll('"', "&quot;");
  }

  function loadFooter() {
    const footerArea = document.getElementById("footer");

    if (!footerArea) return;

    fetch("/view/footer.html?v=999")
      .then(function (res) {
        if (!res.ok) {
          throw new Error("footer.html 경로 오류");
        }

        return res.text();
      })
      .then(function (html) {
        footerArea.innerHTML = html;
      })
      .catch(function (err) {
        console.error("footer 로드 실패:", err);
      });
  }

  window.openFooterTermsModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>이용약관</h3>
      <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
      <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
      <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
    `;

    modal.classList.remove("hidden");
  };

  window.openFooterPrivacyModal = function () {
    const modal = document.getElementById("footerModal");
    const content = document.getElementById("footerModalContent");

    if (!modal || !content) return;

    content.innerHTML = `
      <h3>개인정보처리방침</h3>
      <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
      <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
      <p>개인정보 관련 문의: data260417@gmail.com</p>
    `;

    modal.classList.remove("hidden");
  };

  window.closeFooterModal = function () {
    const modal = document.getElementById("footerModal");

    if (!modal) return;

    modal.classList.add("hidden");
  };

  document.addEventListener("click", function (e) {
    const modal = document.getElementById("footerModal");

    if (!modal) return;

    if (e.target === modal) {
      modal.classList.add("hidden");
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;

    const modal = document.getElementById("footerModal");

    if (!modal) return;

    modal.classList.add("hidden");
  });

  document.addEventListener("DOMContentLoaded", function () {
    loadNoticeDetail();
    loadFooter();
  });
</script>
</body>
</html>
