<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공지사항 | DATA 다타</title>
  <link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: #050916;
      color: #d9e7ff;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(14, 165, 255, 0.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(37, 99, 255, 0.12), transparent 38%),
        #050916;
    }

    .notice-wrap {
      width: 980px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 64px 0 90px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 46px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .notice-logo-img {
      height: 52px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .back-btn {
      border: 1px solid #1f2937;
      background: rgba(7, 11, 26, 0.82);
      color: #94a3b8;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: 0.2s;
    }

    .back-btn:hover {
      border-color: #00e5ff;
      color: #00e5ff;
      background: rgba(15, 23, 42, 0.9);
    }

    .notice-head {
      margin-bottom: 34px;
    }

    .notice-label {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .notice-head h1 {
      color: #f8fafc;
      font-size: 34px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .notice-head p {
      color: #7c8aa5;
      font-size: 15px;
      line-height: 1.7;
    }

    .notice-panel {
      border: 1px solid #17223a;
      border-radius: 18px;
      background: rgba(5, 11, 28, 0.78);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .notice-table-head {
      display: grid;
      grid-template-columns: 90px 1fr 150px;
      align-items: center;
      min-height: 52px;
      padding: 0 24px;
      background: rgba(15, 23, 42, 0.78);
      border-bottom: 1px solid #17223a;
      color: #64748b;
      font-size: 12px;
      font-weight: 900;
    }

    .notice-list {
      width: 100%;
    }

    .notice-item {
      display: grid;
      grid-template-columns: 90px 1fr 150px;
      align-items: center;
      min-height: 74px;
      padding: 0 24px;
      border-bottom: 1px solid #111c31;
      cursor: pointer;
      transition: 0.2s;
    }

    .notice-item:last-child {
      border-bottom: none;
    }

    .notice-item:hover {
      background: rgba(15, 23, 42, 0.88);
    }

    .notice-no {
      color: #38bdf8;
      font-size: 13px;
      font-weight: 900;
    }

    .notice-title {
      min-width: 0;
      color: #dce8ff;
      font-size: 15px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding-right: 20px;
    }

    .notice-date {
      color: #64748b;
      font-size: 13px;
      text-align: right;
    }

    .notice-empty {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
      text-align: center;
      line-height: 1.7;
    }

    .notice-loading {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
    }

    .bottom-guide {
      margin-top: 22px;
      color: #52627d;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 1100px) {
      .notice-wrap {
        width: calc(100% - 40px);
      }
    }

    @media (max-width: 720px) {
      .notice-wrap {
        width: calc(100% - 28px);
        padding-top: 36px;
      }

      .top-bar {
        margin-bottom: 34px;
      }

      .notice-head h1 {
        font-size: 28px;
      }

      .notice-table-head {
        display: none;
      }

      .notice-item {
        grid-template-columns: 54px 1fr;
        grid-template-areas:
          "no title"
          "no date";
        gap: 4px 10px;
        min-height: 82px;
        padding: 16px 18px;
      }

      .notice-no {
        grid-area: no;
      }

      .notice-title {
        grid-area: title;
        padding-right: 0;
      }

      .notice-date {
        grid-area: date;
        text-align: left;
        font-size: 12px;
      }
    }

.notice-pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 26px 0 28px;
  border-top: 1px solid #111c31;
}

.notice-page-btn {
  min-width: 36px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid #1f2a44;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.78);
  color: #94a3b8;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
}

.notice-page-btn:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}

.notice-page-btn.active {
  background: #00e5ff;
  border-color: #00e5ff;
  color: #020617;
}

.notice-page-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.notice-page-btn:disabled:hover {
  border-color: #1f2a44;
  color: #94a3b8;
}

.notice-page-move {
  min-width: 58px;
}

/* ===== FOOTER ===== */

#footer {
  width: 100%;
  flex-shrink: 0;
}

.footer {
  width: 100%;
  min-height: 88px;
  background: #020617;
  color: #fff;
  box-sizing: border-box;
}

.footer-inner {
  width: 100%;
  min-height: 88px;
  padding: 0 70px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  gap: 22px;

  color: #64748b;
  font-size: 12px;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  background-color: #ffffff;

  -webkit-mask-image: url("/view/img/favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;

  mask-image: url("/view/img/favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;

  flex-shrink: 0;
}

.footer-link {
  border: 0;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
  text-decoration: none;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}

/* ===== FOOTER MODAL ===== */

.footer-modal {
  position: fixed;
  inset: 0;
  background: rgba(2, 8, 23, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30000;
}

.footer-modal.hidden {
  display: none !important;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-content p {
  margin-bottom: 10px;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}

.footer-modal-btn:hover {
  filter: brightness(1.08);
}
  </style>
</head>

<body>
<div class="page">
  <main class="notice-wrap">
    <div class="top-bar">
      <a href="/view/main.html" class="logo-area">
        <img src="/view/img/header_logo.png" alt="DATA 다타 로고" class="notice-logo-img">
      </a>

      <button class="back-btn" type="button" onclick="history.back()">
        ← 이전 페이지로
      </button>
    </div>

    <section class="notice-head">
      <span class="notice-label">NOTICE</span>
      <h1>공지사항</h1>
      <p>
        DATA 다타의 주요 안내사항을 확인할 수 있습니다.
      </p>
    </section>

    <section class="notice-panel">
      <div class="notice-table-head">
        <div>번호</div>
        <div>제목</div>
        <div style="text-align: right;">등록일</div>
      </div>

      <div id="noticeListArea">
        <div class="notice-loading">공지사항을 불러오는 중입니다.</div>
      </div>
    </section>

    <p class="bottom-guide">
      공지사항을 클릭하면 연결된 안내 페이지로 이동합니다.
    </p>
  </main>
  <div id="footer"></div>
    <div class="footer-modal hidden" id="footerModal">
    <div class="footer-modal-box">
      <div class="footer-modal-content" id="footerModalContent"></div>

      <button class="footer-modal-btn" type="button" onclick="closeFooterModal()">
        확인
      </button>
    </div>
  </div>
</div>

<script>
  let noticeList = [];
  let currentNoticePage = 1;
  const noticePageSize = 10;

  async function loadNoticeList() {
    const area = document.getElementById("noticeListArea");

    if (!area) return;

    try {
      const { data } = await axios.get("/api/banner/active-list");

      const banners = data.banners || [];

      const notices = banners.filter(function (item) {
        return item.banner_type === "notice";
      });

      if (notices.length === 0) {
        area.innerHTML = `
          <div class="notice-empty">
            등록된 공지사항이 없습니다.
          </div>
        `;
        return;
      }

        noticeList = notices;
        currentNoticePage = 1;

        renderNoticePage();

    } catch (err) {
      console.error("공지사항 목록 로드 실패:", err);

      area.innerHTML = `
        <div class="notice-empty">
          공지사항을 불러오지 못했습니다.<br>
          잠시 후 다시 시도해주세요.
        </div>
      `;
    }
  }

  function renderNoticePage() {
    const area = document.getElementById("noticeListArea");

    if (!area) return;

    const totalPage = Math.ceil(noticeList.length / noticePageSize);
    const startIndex = (currentNoticePage - 1) * noticePageSize;
    const endIndex = startIndex + noticePageSize;
    const pageItems = noticeList.slice(startIndex, endIndex);

    area.innerHTML = `
      <div class="notice-list">
        ${pageItems.map(function (item, index) {
          const realIndex = startIndex + index;
          const noticeNo = noticeList.length - realIndex;

          return `
            <div
              class="notice-item"
              onclick="moveNoticeDetail('${item.banner_id}')"
            >
              <div class="notice-no">
                ${item.is_pinned ? "공지" : String(noticeNo).padStart(2, "0")}
              </div>

              <div class="notice-title">
                ${escapeHtml(item.title || "제목 없음")}
              </div>

              <div class="notice-date">
                ${formatDate(item.created_at || item.start_at)}
              </div>
            </div>
          `;
        }).join("")}
      </div>

      ${renderNoticePagination(totalPage)}
    `;
  }

  function renderNoticePagination(totalPage) {
    if (totalPage <= 1) return "";

    let pageButtons = "";

    for (let i = 1; i <= totalPage; i++) {
      pageButtons += `
        <button
          type="button"
          class="notice-page-btn ${i === currentNoticePage ? "active" : ""}"
          onclick="changeNoticePage(${i})"
        >
          ${i}
        </button>
      `;
    }

    return `
      <div class="notice-pagination">
        <button
          type="button"
          class="notice-page-btn notice-page-move"
          onclick="changeNoticePage(${currentNoticePage - 1})"
          ${currentNoticePage === 1 ? "disabled" : ""}
        >
          이전
        </button>

        ${pageButtons}

        <button
          type="button"
          class="notice-page-btn notice-page-move"
          onclick="changeNoticePage(${currentNoticePage + 1})"
          ${currentNoticePage === totalPage ? "disabled" : ""}
        >
          다음
        </button>
      </div>
    `;
  }

  function changeNoticePage(page) {
    const totalPage = Math.ceil(noticeList.length / noticePageSize);

    if (page < 1 || page > totalPage) return;

    currentNoticePage = page;
    renderNoticePage();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function moveNoticeDetail(bannerId) {
    if (!bannerId) return;

    location.href = `/view/notice_detail.html?banner_id=${encodeURIComponent(bannerId)}`;
  }

  function formatDate(dateStr) {
    if (!dateStr) return "-";

    const date = new Date(dateStr);

    if (isNaN(date.getTime())) return "-";

    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");

    return `${yyyy}.${mm}.${dd}`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(value) {
    return String(value)
      .replaceAll("\\", "\\\\")
      .replaceAll("'", "\\'")
      .replaceAll('"', "&quot;");
  }


function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  fetch("/view/footer.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("footer.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}

window.openFooterTermsModal = function () {
  const modal = document.getElementById("footerModal");
  const content = document.getElementById("footerModalContent");

  if (!modal || !content) return;

  content.innerHTML = `
    <h3>이용약관</h3>
    <p>DATA 다타는 뉴스 데이터를 기반으로 키워드, 감성, 관점 분석 정보를 제공하는 서비스입니다.</p>
    <p>이용자는 서비스를 부정한 목적으로 이용할 수 없으며, 제공되는 정보는 참고용으로 활용해야 합니다.</p>
    <p>서비스에서 제공되는 분석 결과는 참고용 정보이며, 투자·정책·법률 판단의 최종 근거로 사용해서는 안 됩니다.</p>
  `;

  modal.classList.remove("hidden");
};

window.openFooterPrivacyModal = function () {
  const modal = document.getElementById("footerModal");
  const content = document.getElementById("footerModalContent");

  if (!modal || !content) return;

  content.innerHTML = `
    <h3>개인정보처리방침</h3>
    <p>DATA 다타는 회원가입 및 서비스 제공을 위해 이메일, 비밀번호, 이름, 생년월일, 성별 등의 개인정보를 수집할 수 있습니다.</p>
    <p>수집된 개인정보는 회원 식별, 서비스 제공, 이용 기록 관리, 사용자 맞춤형 서비스 제공 목적 외에는 사용하지 않습니다.</p>
    <p>개인정보 관련 문의: data260417@gmail.com</p>
  `;

  modal.classList.remove("hidden");
};

window.closeFooterModal = function () {
  const modal = document.getElementById("footerModal");

  if (!modal) return;

  modal.classList.add("hidden");
};

document.addEventListener("click", function (e) {
  const modal = document.getElementById("footerModal");

  if (!modal) return;

  if (e.target === modal) {
    modal.classList.add("hidden");
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;

  const modal = document.getElementById("footerModal");

  if (!modal) return;

  modal.classList.add("hidden");
});

  document.addEventListener("DOMContentLoaded", function () {
    loadNoticeList();
    loadFooter();
  });
</script>
</body>
</html>
