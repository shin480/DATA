<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA 회원가입</title>

    <style>
        :root {
            --bg-color: #020617;
            --card-color: #0F172A;
            --input-bg: #020617;
            --cyan-point: #00E5FF;
            --text-main: #FFFFFF;
            --text-sub: #8B949E;
            --error-red: #F43F5E;
            --border: 1px solid #30363D;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .join-card {
            background-color: var(--card-color);
            width: 100%;
            max-width: 480px;
            max-height: 1000px;
            padding: 24px 40px;
            border-radius: 24px;
            border: var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* ===== 로고 ===== */

        .logo-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            text-decoration: none;
        }

        .main-logo {
            width: 72px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 auto;
            text-decoration: none;
        }

        .subtitle {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .desc {
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1.45;
            margin-bottom: 22px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
            position: relative;
        }

        .row-group {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 12px;
            margin-bottom: 2px;
        }

        .label {
            display: block;
            color: var(--cyan-point);
            font-size: 9px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            height: 42px;
            padding: 0px 14px;
            background-color: var(--input-bg);
            border: var(--border);
            border-radius: var(--border-radius);
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--cyan-point);
        }

        .email-input-wrap {
            display: flex;
            gap: 10px;
        }

        .btn {
            height: 42px;
            padding: 0 16px;
            border-radius: var(--border-radius);
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #emailActionBtn,
        #btnVerifyCert {
            min-width: 110px;
        }

        .btn-cyan {
            background-color: var(--cyan-point);
            color: #000;
        }

        .btn-timer {
            background-color: #1E293B;
            color: var(--error-red);
            cursor: not-allowed;
            border: 1px solid #30363D;
        }

        .btn-resend {
            background-color: #1E293B;
            color: var(--cyan-point);
            border: 1px solid var(--cyan-point);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--cyan-point);
            color: #000;
            font-size: 14px;
            font-weight: bold;
            margin-top: 6px;
            height: 48px;
        }

        .status-msg {
            font-size: 11px;
            font-weight: 500;
            display: none;
        }

        .status-msg.error {
            color: var(--error-red);
        }

        .status-msg.success {
            color: #22C55E;
        }

        .footer-link {
            color: var(--text-sub);
            font-size: 13px;
            margin-top: 30px;
            display: block;
            text-decoration: none;
        }

        .footer-link strong {
            color: var(--cyan-point);
        }

        /* ===== 커스텀 모달 ===== */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card-color);
            border: var(--border);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-text {
            margin-bottom: 25px;
            line-height: 1.5;
            font-size: 15px;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <div class="join-card">

        <!-- 로고 -->
        <a href="./main.html" class="logo-area">
            <img src="./img/logo.png" alt="DATA 로고" class="main-logo">
        </a>

        <div class="subtitle">새로운 계정 만들기</div>

        <p class="desc">
            당신의 데이터를 가치 있게 만드는 첫 걸음
        </p>

        <form id="joinForm" onsubmit="event.preventDefault(); create_account();">

            <div class="form-group">
                <label class="label">Name</label>

                <input
                    type="text"
                    placeholder="성함을 입력해주세요"
                    required
                >
            </div>

            <div class="row-group">

                <div class="form-group">
                    <label class="label">Birth Date</label>

                    <input
                        type="text"
                        placeholder="YYYYMMDD"
                        required
                        maxlength="8"
                    >
                </div>

                <div class="form-group">
                    <label class="label">Gender</label>

                    <select required>
                        <option value="" disabled selected>
                            선택하세요
                        </option>

                        <option value="male">남성</option>
                        <option value="female">여성</option>
                        <option value="other">공개안함</option>
                    </select>
                </div>

            </div>

            <div class="form-group">

                <label class="label">Email Address</label>

                <div class="email-input-wrap">

                    <input
                        type="email"
                        id="userEmail"
                        placeholder="admin@data.com"
                        required
                    >

                    <button
                        type="button"
                        class="btn btn-cyan"
                        id="emailActionBtn"
                    >
                        인증번호 받기
                    </button>

                </div>

                <div class="status-msg error" id="emailError">
                    ⚠️ 이미 가입된 이메일입니다!
                </div>

                <div id="certInputArea" style="display: none; margin-top: 10px;">

                    <div class="email-input-wrap">

                        <input
                            type="text"
                            id="certNum"
                            placeholder="인증번호 입력"
                        >

                        <button
                            type="button"
                            class="btn btn-cyan"
                            id="btnVerifyCert"
                        >
                            확인
                        </button>

                    </div>

                </div>

                <div class="status-msg success" id="emailSuccess">
                    ✔️ 이메일 인증완료
                </div>

            </div>

            <div class="form-group">

                <label class="label">Password</label>

                <input
                    type="password"
                    id="userPw"
                    placeholder="8자 이상의 비밀번호"
                    required
                    minlength="8"
                >

            </div>

            <div class="form-group">

                <input
                    type="password"
                    id="userPwCheck"
                    placeholder="비밀번호 재확인"
                    required
                >

                <div class="status-msg error" id="pwMatchError">
                    ⚠️ 비밀번호가 일치하지 않습니다.
                </div>

            </div>

            <button type="submit" class="btn btn-submit">
                계정 생성하기
            </button>

        </form>

        <a href="./login.html" class="footer-link">
            이미 계정이 있으신가요?
            <strong>로그인</strong>
        </a>

    </div>

    <!-- 모달 -->

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal-content" id="modalContent">

            <div class="modal-text" id="modalMessage">
                메시지 내용
            </div>

            <button
                class="btn btn-cyan modal-btn"
                id="modalCloseBtn"
            >
                확인
            </button>

        </div>

    </div>

    <script>

        const emailActionBtn =
            document.getElementById('emailActionBtn');

        const userEmailInput =
            document.getElementById('userEmail');

        const certInputArea =
            document.getElementById('certInputArea');

        const emailError =
            document.getElementById('emailError');

        const emailSuccess =
            document.getElementById('emailSuccess');

        const btnVerifyCert =
            document.getElementById('btnVerifyCert');

        const modalOverlay =
            document.getElementById('modalOverlay');

        const modalMessage =
            document.getElementById('modalMessage');

        const modalCloseBtn =
            document.getElementById('modalCloseBtn');

        let timerInterval;
        let timeLeft = 180;

        function showModal(msg) {

            modalMessage.innerText = msg;

            modalOverlay.style.display = 'flex';
        }

        function resetEmailButton() {
            emailActionBtn.disabled = false;
            emailActionBtn.textContent = "인증번호 받기";
            emailActionBtn.classList.remove('btn-timer', 'btn-resend');
            emailActionBtn.classList.add('btn-cyan');
        }

        modalCloseBtn.addEventListener('click', () => {

            modalOverlay.style.display = 'none';
        });

        function updateButtonTimer() {

            emailActionBtn.disabled = true;
            document.getElementById('certNum').value = "";
            document.getElementById('certNum').disabled = false;
            btnVerifyCert.disabled = false; // 추가

            emailActionBtn.classList.remove(
                'btn-cyan',
                'btn-resend'
            );

            emailActionBtn.classList.add('btn-timer');

            timeLeft = 180;

            certInputArea.style.display = 'block';

            if (timerInterval)
                clearInterval(timerInterval);

            timerInterval = setInterval(() => {

                let min =
                    Math.floor(timeLeft / 60);

                let sec =
                    timeLeft % 60;

                emailActionBtn.textContent =
                    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                if (timeLeft <= 0) {

                    clearInterval(timerInterval);

                    switchToResendMode();
                }

                timeLeft--;

            }, 1000);
        }

        function switchToResendMode() {

            resetEmailButton();

            clearInterval(timerInterval);

            emailActionBtn.textContent = "↺ 재발송";

            emailActionBtn.classList.remove('btn-timer');

            emailActionBtn.classList.add('btn-resend');
            document.getElementById('certNum').disabled = true;
            btnVerifyCert.disabled = true;

            certInputArea.style.display = 'none';
            document.getElementById('certNum').value = "";
        }

        function incorrectResendMode() {

            resetEmailButton();

            clearInterval(timerInterval);

            emailActionBtn.textContent = "↺ 재발송";

            emailActionBtn.classList.remove('btn-timer');

            emailActionBtn.classList.add('btn-resend');

            certInputArea.style.display = 'none';
        }

        emailActionBtn.addEventListener('click', () => {

            if (!userEmailInput.value){
                return showModal('이메일을 입력해주세요.');
            }
                

            const emailRegex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(userEmailInput.value)) {

                return showModal('올바른 이메일 형식을 입력해주세요.');
            }


            emailActionBtn.disabled = true;
            emailActionBtn.textContent = "발송 중...";
            emailActionBtn.classList.remove('btn-resend', 'btn-timer');
            emailActionBtn.classList.add('btn-cyan');

            
            const params = {
                "email": userEmailInput.value
            };



            axios.post('/send_cert', params)

            .then(({data}) => {

                if (data.duplicate) {

                    emailError.style.display = 'block';

                    resetEmailButton();

                    return;
                }

                emailError.style.display = 'none';

                if (data.success) {

                    showModal('인증번호가 발송되었습니다.');

                    updateButtonTimer();

                } else {

                    showModal(data.message);

                    resetEmailButton();
                }

            })

            .catch(err => {

                showModal('서버 통신 중 오류가 발생했습니다.');

                resetEmailButton();
            });

        });

        btnVerifyCert.addEventListener('click', () => {

            const code =
                document.getElementById('certNum').value;

            const params = {
                "code": code,
                "email": userEmailInput.value
            };

            axios.post('/verify_cert', params)

            .then(({data}) => {

                if (data.success) {

                    clearInterval(timerInterval);

                    certInputArea.style.display = 'none';

                    emailSuccess.style.display = 'block';

                    emailActionBtn.disabled = true;

                    emailActionBtn.textContent = "인증 완료";

                    emailActionBtn.classList.remove(
                        'btn-timer',
                        'btn-resend'
                    );

                    emailActionBtn.classList.add('btn-cyan');

                    userEmailInput.readOnly = true;

                    return;
                }

                const errorMsg = data.message || '인증번호가 일치하지 않습니다.';
                showModal(errorMsg);

                incorrectResendMode();

            })

            .catch(err => {

                showModal('서버 통신 중 오류가 발생했습니다.');

                resetEmailButton();
            });

        });

        const pw =
            document.getElementById('userPw');

        const pwCheck =
            document.getElementById('userPwCheck');

        const pwError =
            document.getElementById('pwMatchError');

        [pw, pwCheck].forEach(el =>

            el.addEventListener('input', () => {

                pwError.style.display =
                    (
                        pw.value &&
                        pwCheck.value &&
                        pw.value !== pwCheck.value
                    )
                    ? 'block'
                    : 'none';
            })
        );

        async function create_account() {

            if (emailSuccess.style.display !== 'block') {

                showModal('이메일 인증을 완료해주세요.');

                return;
            }

            if (pw.value !== pwCheck.value) {

                showModal('비밀번호가 일치하지 않습니다.');

                return;
            }

            const params = {

                "name":
                    document.querySelector(
                        'input[placeholder="성함을 입력해주세요"]'
                    ).value,

                "birth":
                    document.querySelector(
                        'input[placeholder="YYYYMMDD"]'
                    ).value,

                "gender":
                    document.querySelector('select').value,

                "email":
                    userEmailInput.value,

                "pw":
                    pw.value
            };

            try {

                const { data } =
                    await axios.post("/regist", params);

                if (data.success) {

                    showModal('회원가입이 완료되었습니다!');

                    setTimeout(() => {

                        location.href = './login.html';

                    }, 1500);

                } else {

                    if (data.message.includes("약관")) {

                        showModal(
                            '약관 동의 정보가 만료되었거나 누락되었습니다. 약관 페이지로 이동합니다.'
                        );

                        setTimeout(() => {

                            location.href = './terms.html';

                        }, 1500);

                    } else {

                        showModal(data.message);
                    }
                }

            } catch (err) {

                console.error(err);

                showModal(
                    '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.'
                );
            }
        }

    </script>

</body>
</html>
