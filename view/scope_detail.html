<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>DATA 다타 - 스콥 상세</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#050916;
  color:#dce8ff;
  font-family:"Pretendard","Noto Sans KR",sans-serif;
}

header{
  height:74px;
  border-bottom:1px solid #111a2f;
  background:#070b1a;
  display:flex;
  align-items:center;
  padding:0 38px;
}

.logo{
  color:#14d9ff;
  font-size:30px;
  font-weight:800;
  margin-right:70px;
}

nav a{
  color:#7d8ca8;
  text-decoration:none;
  margin-right:38px;
  font-size:17px;
  font-weight:600;
}

.header-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:14px;
}

.search{
  width:260px;
  height:34px;
  border:1px solid #1a2742;
  border-radius:20px;
  background:#050916;
  color:#7d8ca8;
  padding:0 18px;
}

.btn{
  border:none;
  border-radius:8px;
  padding:10px 16px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
}

.btn-cyan{
  background:#10d9ff;
  color:#00131f;
}

.btn-dark{
  background:transparent;
  color:#b8c8e6;
  border:1px solid #253452;
}

.wrap{
  width:1040px;
  margin:0 auto;
  padding:34px 0 100px;
}

.breadcrumb{
  color:#53637f;
  font-size:12px;
  margin-bottom:22px;
}

.top-area{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:18px;
  margin-bottom:24px;
}

.scope-box,
.stat-box{
  background:#0b1223;
  border:1px solid #16223b;
  border-radius:14px;
  padding:24px;
}

.scope-label{
  color:#16d9ff;
  font-size:12px;
  font-weight:800;
  margin-bottom:12px;
}

.scope-title{
  color:#f1f6ff;
  font-size:24px;
  font-weight:900;
  margin-bottom:16px;
  line-height:1.4;
}

.scope-summary{
  border-left:3px solid #14d9ff;
  padding-left:14px;
  color:#8fa0bd;
  font-size:14px;
  line-height:1.7;
  margin-bottom:22px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.keyword-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.keyword{
  background:#073044;
  color:#16d9ff;
  border:1px solid #0c6e8a;
  border-radius:18px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
}

.keyword.main{
  background:#0b3d55;
  border-color:#16d9ff;
  color:#ffffff;
}

.stat-title{
  color:#7f8ea9;
  font-size:12px;
  font-weight:800;
  text-align:center;
  margin-bottom:16px;
}

.sentiment-row{
  display:grid;
  grid-template-columns:55px 1fr 40px;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  font-size:12px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:6px;
}

.positive-dot{background:#13d77b}
.neutral-dot{background:#f0b83a}
.negative-dot{background:#ff4e5f}

.bar{
  height:6px;
  background:#1a2540;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  border-radius:10px;
}

.fill.positive{background:#13d77b}
.fill.neutral{background:#f0b83a}
.fill.negative{background:#ff4e5f}

.viewpoints{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  margin:18px 0;
}

.viewpoint{
  border:1px solid #2a3854;
  color:#9fb0ca;
  border-radius:16px;
  padding:6px 10px;
  font-size:12px;
}

.meta-info{
  border-top:1px solid #17223a;
  padding-top:14px;
  font-size:12px;
  color:#7f8ea9;
}

.meta-line{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}

.news-columns{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
}

.column-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:800;
  margin-bottom:12px;
}

.column-head.positive{color:#13d77b}
.column-head.neutral{color:#f0b83a}
.column-head.negative{color:#ff4e5f}

.news-card{
  background:#0b1223;
  border:1px solid #16223b;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
  cursor:pointer;
  transition:.2s;
  position:relative;
  overflow:hidden;
}

.news-card:hover{
  transform:translateY(-2px);
  border-color:#2f6dff;
}

.news-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:100%;
}

.news-card.positive::before{background:#13d77b}
.news-card.neutral::before{background:#f0b83a}
.news-card.negative::before{background:#ff4e5f}

.card-meta{
  display:flex;
  justify-content:space-between;
  color:#63728d;
  font-size:11px;
  margin-bottom:12px;
}

.press{
  font-weight:800;
}

.card-title{
  color:#f1f6ff;
  font-size:14px;
  font-weight:800;
  line-height:1.5;
  margin-bottom:12px;
}

.card-summary{
  color:#8fa0bd;
  font-size:12px;
  line-height:1.6;
  margin-bottom:12px;
}

.tag-list{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.card-tag{
  background:#151d31;
  color:#8fa0bd;
  border-radius:5px;
  padding:5px 7px;
  font-size:11px;
}

.card-with-img .title-row{
  display:grid;
  grid-template-columns:1fr 78px;
  gap:10px;
  align-items:start;
}

.thumb{
  width:78px;
  height:58px;
  border-radius:8px;
  background:#1a2540;
  object-fit:cover;
}

.empty-state{
  height:250px;
  border:1px dashed #253452;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#6f7d98;
  font-size:13px;
  text-align:center;
}

.empty-icon{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid #53637f;
  margin-bottom:14px;
}

.empty-title{
  color:#dce8ff;
  font-weight:800;
  margin-bottom:8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">DATA 다타</div>

  <nav>
    <a href="#">뉴스흐름</a>
    <a href="#">키워드</a>
    <a href="#">뉴스</a>
  </nav>

  <div class="header-right">
    <input class="search" placeholder="예: 금리, 취업, 전세, 반도체" />
    <button class="btn btn-cyan">마이페이지</button>
    <button class="btn btn-dark">로그아웃</button>
  </div>
</header>

<div class="wrap">
  <div class="breadcrumb">AI 뉴스 분석  > <span id="breadcrumbTitle"></span></div>

  <div class="top-area">
    <section class="scope-box">
      <div class="scope-label">AI 뉴스 분석</div>
      <h1 class="scope-title" id="scopeTitle"></h1>
      <p class="scope-summary" id="scopeSummary"></p>
      <div class="keyword-list" id="keywordList"></div>
    </section>

    <aside class="stat-box">
      <div class="stat-title">감성 분포</div>
      <div id="sentimentArea"></div>

      <div class="stat-title" style="margin-top:22px;">관점 상위 4개</div>
      <div class="viewpoints" id="viewpointArea"></div>

      <div class="meta-info">
        <div class="meta-line">
          <span>관련 기사</span>
          <strong id="articleCount"></strong>
        </div>
        <div class="meta-line">
          <span>마지막 업데이트</span>
          <strong id="lastUpdated"></strong>
        </div>
      </div>
    </aside>
  </div>

  <section class="news-columns">
    <div>
      <div class="column-head positive">
        <span><span class="dot positive-dot"></span>긍정</span>
        <span id="positiveCount"></span>
      </div>
      <div id="positiveList"></div>
    </div>

    <div>
      <div class="column-head neutral">
        <span><span class="dot neutral-dot"></span>중립</span>
        <span id="neutralCount"></span>
      </div>
      <div id="neutralList"></div>
    </div>

    <div>
      <div class="column-head negative">
        <span><span class="dot negative-dot"></span>부정</span>
        <span id="negativeCount"></span>
      </div>
      <div id="negativeList"></div>
    </div>
  </section>
</div>

<script>
/* 서버 연결 전 임시 데이터 */
const scopeData = {
  title: "삼성전자 반도체 수출 목표 상향 조정",
  summary:
    "삼성전자가 2분기 반도체 수출 목표를 기존 대비 15% 상향 조정했다고 밝혔다. 글로벌 AI 수요 확대에 따른 HBM 공급 증가가 주요 원인으로 분석된다.",
  keywords: ["삼성전자", "반도체", "HBM", "수출", "AI 수요"],

  sentimentDist: {
    positive: 55,
    neutral: 30,
    negative: 15
  },

  viewpoints: [
    { name: "정책 요인", percent: 20 },
    { name: "결과 분석", percent: 40 },
    { name: "대응 분석", percent: 25 },
    { name: "시장 동향", percent: 15 }
  ],

  articleCount: 14,
  lastUpdated: "12:47",

  articles: [
    {
      sentiment: "positive",
      press: "한국경제",
      time: "09:30",
      title: "삼성전자, 2분기 반도체 수출 목표 15% 상향... HBM 호조 효과",
      summary: "AI 수요 확대로 HBM 물량이 급증하며 수출 목표 상향 조정에 나섰다.",
      keywords: ["삼성전자", "HBM", "수출"],
      url: "news_detail.html"
    },
    {
      sentiment: "positive",
      press: "한국경제",
      time: "09:32",
      title: "삼성전자, 2분기 반도체 수출 목표 15% 상향... HBM 호조",
      summary: "AI 서버와 데이터센터 수요가 반도체 실적 개선 기대를 키우고 있다.",
      keywords: ["반도체", "HBM", "수출"],
      url: "news_detail.html"
    },
    {
      sentiment: "neutral",
      press: "이데일리",
      time: "09:55",
      title: "삼성전자 수출 목표 상향, 배경과 시장 반응 점검",
      summary: "이번 상향 조정의 구체적 수치와 업계 반응을 중립적으로 정리했다.",
      keywords: ["수출전망", "반도체"],
      url: "news_detail.html"
    },
    {
      sentiment: "neutral",
      press: "이데일리",
      time: "09:56",
      title: "삼성전자 수출 목표 상향, 글로벌 시장 반응 엇갈림",
      summary: "주요 증권가에서는 긍정적 전망과 신중론이 함께 나오고 있다.",
      keywords: ["시장반응", "전망"],
      url: "news_detail.html"
    },
    {
      sentiment: "negative",
      press: "뉴스1",
      time: "12:01",
      title: "반도체 업황 점검... HBM 중심 실적 개선 여부는",
      summary: "수출 목표 달성 가능성을 두고 공급망과 가격 변동성 우려가 제기된다.",
      keywords: ["업황", "실적전망"],
      url: "news_detail.html"
    }
  ]
};

const sentimentNames = {
  positive: "긍정",
  neutral: "중립",
  negative: "부정"
};

const sentimentClass = {
  positive: "positive",
  neutral: "neutral",
  negative: "negative"
};

function loadScopeInfo() {
  document.getElementById("scopeTitle").innerText = scopeData.title;
  document.getElementById("scopeSummary").innerText = scopeData.summary;
  document.getElementById("breadcrumbTitle").innerText = scopeData.title;

  const keywordList = document.getElementById("keywordList");
  keywordList.innerHTML = "";

  scopeData.keywords.slice(0, 5).forEach((keyword, index) => {
    keywordList.innerHTML += `
      <span class="keyword ${index === 0 ? "main" : ""}">
        ${keyword}
      </span>
    `;
  });

  document.getElementById("articleCount").innerText =
    scopeData.articleCount + "건";

  document.getElementById("lastUpdated").innerText =
    scopeData.lastUpdated;
}

function loadSentimentDist() {
  const area = document.getElementById("sentimentArea");
  area.innerHTML = "";

  const rows = [
    ["positive", "긍정"],
    ["neutral", "중립"],
    ["negative", "부정"]
  ];

  rows.forEach(([key, label]) => {
    const value = scopeData.sentimentDist[key];

    area.innerHTML += `
      <div class="sentiment-row">
        <div>
          <span class="dot ${key}-dot"></span>${label}
        </div>

        <div class="bar">
          <div class="fill ${key}" style="width:${value}%"></div>
        </div>

        <div>${value}%</div>
      </div>
    `;
  });
}

function loadViewpoints() {
  const area = document.getElementById("viewpointArea");
  area.innerHTML = "";

  scopeData.viewpoints.slice(0, 4).forEach(item => {
    area.innerHTML += `
      <span class="viewpoint">${item.name} ${item.percent}%</span>
    `;
  });
}

function loadArticleColumns() {
  const positive = scopeData.articles.filter(a => a.sentiment === "positive");
  const neutral = scopeData.articles.filter(a => a.sentiment === "neutral");
  const negative = scopeData.articles.filter(a => a.sentiment === "negative");

  document.getElementById("positiveCount").innerText = positive.length + "건";
  document.getElementById("neutralCount").innerText = neutral.length + "건";
  document.getElementById("negativeCount").innerText = negative.length + "건";

  renderArticleList("positiveList", positive, "positive");
  renderArticleList("neutralList", neutral, "neutral");
  renderArticleList("negativeList", negative, "negative");
}

function renderArticleList(targetId, articles, sentiment) {
  const target = document.getElementById(targetId);
  target.innerHTML = "";

  if (articles.length === 0) {
    target.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"></div>
        <div class="empty-title">${sentimentNames[sentiment]} 기사가 없습니다</div>
        <div>현재 분석 기준상 ${sentimentNames[sentiment]} 감성 기사가 없습니다</div>
      </div>
    `;
    return;
  }

  articles.forEach(article => {
    const tags = article.keywords
      .map(tag => `<span class="card-tag">${tag}</span>`)
      .join("");

    target.innerHTML += `
      <article class="news-card ${sentimentClass[article.sentiment]}"
               onclick="location.href='${article.url}'">

        <div class="card-meta">
          <span class="press">
            <span class="dot ${article.sentiment}-dot"></span>
            ${article.press}
          </span>
          <span>${article.time}</span>
        </div>

        <div class="card-title">${article.title}</div>

        <div class="card-summary">${article.summary}</div>

        <div class="tag-list">
          ${tags}
        </div>
      </article>
    `;
  });
}

window.onload = function() {
  loadScopeInfo();
  loadSentimentDist();
  loadViewpoints();
  loadArticleColumns();
};
</script>

</body>
</html>
