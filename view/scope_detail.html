<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATA 다타 - 스콥 상세</title>

<link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

<style>
/* ==============================
   Common Utility Only
============================== */

.hidden {
  display: none !important;
}

/* ==============================
   기본
============================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  overflow-x: hidden;
}

body {
  background: #050816;
  color: #e5e7eb;
  font-family: "Pretendard", Arial, sans-serif;
}

.page {
  width: 1440px;
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 72px;
  background: #050816;

  display: flex;
  flex-direction: column;
}

.back-btn {
  display: inline-block;
  margin-bottom: 26px;
  color: #3b82a0;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.back-btn:hover {
  color: #00e5ff;
}

body.light-mode .back-btn {
  color: #64748b !important;
}

body.light-mode .back-btn:hover,
body.light-mode .article-category {
  color: #06b6d4 !important;
}

/* ==============================
   Header
   main.html 기준 통일
============================== */

.header {
  position: fixed;
  top: 0;
  left: 0;
  transform: none;
  z-index: 10000;

  width: 100%;
  height: 72px;
  padding: 0 56px;

  display: flex;
  align-items: center;

  background: #070b1a;
  border-bottom: 1px solid #111827;
}

.logo {
  width: 155px;
  height: 52px;
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  overflow: hidden;
}

.header-logo-full {
  height: 52px;
  width: auto;
  display: block;
  object-fit: contain;
}

.nav {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: 22px;
  color: #6b7280;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}

.nav a {
  position: relative;
  text-decoration: none;
  color: inherit;
  transition: color 0.18s;
}

.nav a:hover {
  color: #00e5ff;
}

.nav a.active {
  color: #00e5ff !important;
  font-weight: 900 !important;
}

.nav a.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -26px;
  height: 3px;
  border-radius: 999px;
  background: #00e5ff;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.65);
}

body.light-mode .nav a.active {
  color: #41BFE0 !important;
}

body.light-mode .nav a.active::after {
  background: #41BFE0;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.main-search-wrap {
  position: relative;
  width: 370px;
  height: 40px;
  border-radius: 999px;
  background: #070b1a;
  border: 1px solid #1f2937;
  display: flex;
  align-items: center;
  padding: 0 14px 0 20px;
}

.search-box {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 15px;
  padding: 0;
}

.search-box::placeholder {
  color: #7c8493;
}

.main-search-wrap:focus-within {
  border-color: #334155;
}

.search-icon-btn {
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: #8b95a7;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}

.search-icon-btn:hover {
  color: #00e5ff;
}

.theme-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #070b1a;
  color: #facc15;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-btn:hover {
  border-color: #334155;
}

.header-btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.header-btn.login {
  border: 1px solid #00cfe8;
  background: #00cfe8;
  color: #020617;
}

.header-btn.login:hover {
  filter: brightness(1.08);
}

.header-btn.join {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
}

.header-btn.join:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}

.header-user-name {
  display: inline-flex;
  align-items: center;
  height: 40px;

  color: #cbd5e1;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;

  margin-left: 2px;
  margin-right: 2px;
}

/* ==============================
   Search Suggest Dropdown
============================== */

.search-suggest-box {
  position: fixed;
  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #41bfe0;
  font-weight: 900;
}

/* ==============================
   Footer
============================== */

#footer {
  width: 100vw;
  margin-top: auto; /* 푸터를 페이지 최하단으로 밀기 */
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  overflow: visible;
  flex-shrink: 0;
}

.footer {
  width: 100%;
  background: #020617;
  color: #fff;
  box-sizing: border-box;
}

.footer-inner {
  width: 100%;
  min-height: 88px;
  padding: 0 70px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  gap: 22px;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  background-color: #ffffff;

  -webkit-mask-image: url("/view/img/favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;

  mask-image: url("/view/img/favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;

  flex-shrink: 0;
}

.footer-link {
  border: 0;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
  text-decoration: none;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}

/* ==============================
   Footer Modal
============================== */

.footer-modal {
  position: fixed;
  inset: 0;
  z-index: 30000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(2, 8, 23, 0.75);
}

.footer-modal.hidden {
  display: none !important;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}

/* ==============================
   scope_detail 본문 CSS
============================== */

.scope-detail-page {
  flex: 1;
}

.wrap {
  width: 1040px;
  margin: 0 auto;
  padding: 34px 0 80px;
}

.breadcrumb {
  color: #53637f;
  font-size: 12px;
  margin-bottom: 22px;
}

.top-area {
  display: grid;
  grid-template-columns: 1.9fr 1fr;
  gap: 20px;
  align-items: start;
  margin-bottom: 30px;
}

.scope-box,
.stat-box {
  background: #0b1223;
  border: 1px solid #16223b;
  border-radius: 14px;
  height: 100%;
}

.scope-box {
  min-height: 270px;
  padding: 30px 32px;

  display: flex;
  flex-direction: column;
}

.stat-box {
  padding: 22px 24px;
}

.scope-label {
  color: #16d9ff;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
}

.scope-title {
  color: #f1f6ff;
  font-size: 27px;
  font-weight: 900;
  margin-bottom: 18px;
  line-height: 1.42;
}

.scope-summary {
  position: relative;

  padding-left: 18px;
  color: #8fa0bd;
  font-size: 15px;
  line-height: 1.75;
  margin-bottom: 26px;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.scope-summary::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;

  width: 4px;
  height: 100%;

  border-radius: 999px;

  background: linear-gradient(
    to bottom,
    rgba(20, 217, 255, 0) 0%,
    rgba(20, 217, 255, 0.14) 14%,
    rgba(20, 217, 255, 0.85) 50%,
    rgba(20, 217, 255, 0.14) 86%,
    rgba(20, 217, 255, 0) 100%
  );
}

.keyword-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;

  margin-top: auto;
}

.keyword-list span {
  display: inline-flex;
  align-items: center;
  line-height: 1;
}

.keyword {
  background: #073044;
  color: #16d9ff;
  border: 1px solid #0c6e8a;
  border-radius: 999px;

  padding: 10px 16px;

  font-size: 13px;
  font-weight: 350;

  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.keyword.main {
  background: #0b3d55;
  border-color: #16d9ff;
  color: #16d9ff;

  font-weight: 800;

  cursor: pointer;
  transition:
    transform 0.18s ease,
    background 0.18s ease,
    color 0.18s ease,
    box-shadow 0.18s ease;
}

.stat-title {
  color: #7f8ea9;
  font-size: 12px;
  font-weight: 400;
  text-align: center;
  margin-bottom: 16px;
}

.sentiment-row {
  display: grid;
  grid-template-columns: 55px 1fr 40px;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 12px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
}

.positive-dot { background: #34d6cc; }
.neutral-dot { background: #f0b83a; }
.negative-dot { background: #ff6578; }

.bar {
  height: 6px;
  background: #1a2540;
  border-radius: 10px;
  overflow: hidden;
}

.fill {
  height: 100%;
  border-radius: 10px;
}

.fill.positive { background: #34d6cc; }
.fill.neutral { background: #f0b83a; }
.fill.negative { background: #ff6578; }

/* ==============================
   관점 상위 4개 - 정보 라벨
============================== */

.viewpoints {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 8px;
  margin-top: 10px;

  flex-wrap: nowrap;
}

.viewpoint {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  min-height: 28px;
  padding: 5px 10px;

  border-radius: 999px;

  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(120, 140, 180, 0.18);

  color: #9fb0ca;

  font-size: 11px;
  font-weight: 500;
  letter-spacing: -0.02em;

  white-space: nowrap;
  flex-shrink: 1;

  cursor: default;
}

.meta-info {
  width: 100%;
  max-width: 340px;
  margin: 18px auto 0;
  border-top: 1px solid #17223a;
  padding-top: 14px;

  font-size: 12px;
  color: #7f8ea9;
}

.meta-line {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-top: 8px;
}

.meta-line span {
  font-weight: 500;
}

.meta-line strong {
  color: #8fa0bd;
  font-weight: 600;
}

.news-columns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
}

.column-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 12px;
}

.column-head.positive { color: #3DB87A; }
.column-head.neutral { color: #F2B648; }
.column-head.negative { color: #E05A5A; }

.news-card {
  background: #0b1223;
  border: 1px solid #16223b;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: 0.18s;
  position: relative;
  overflow: hidden;

  height: 195px;
  display: flex;
  flex-direction: column;
}

.news-card:hover {
  transform: translateY(-2px);
  border-color: #2f6dff;
}

.news-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 4px;
  opacity: 0.95;
  height: 100%;
}

.news-card.positive::before {
  background: linear-gradient(
    to bottom,
rgba(52, 214, 204, 0) 0%,
rgba(52, 214, 204, 0.08) 15%,
rgba(52, 214, 204, 0.3) 50%,
rgba(52, 214, 204, 0.08) 85%,
rgba(52, 214, 204, 0) 100%
  );
}

.news-card.neutral::before {
  background: linear-gradient(
    to bottom,
    rgba(240, 184, 58, 0) 0%,
    rgba(240, 184, 58, 0.08) 15%,
    rgba(240, 184, 58, 0.3) 50%,
    rgba(240, 184, 58, 0.08) 85%,
    rgba(240, 184, 58, 0) 100%
  );
}

.news-card.negative::before {
  background: linear-gradient(
    to bottom,
rgba(255, 101, 120, 0) 0%,
rgba(255, 101, 120, 0.08) 15%,
rgba(255, 101, 120, 0.3) 50%,
rgba(255, 101, 120, 0.08) 85%,
rgba(255, 101, 120, 0) 100%
  );
}

.card-meta {
  display: flex;
  justify-content: space-between;
  color: #63728d;
  font-size: 11px;
  margin-bottom: 12px;
}

.press {
  font-weight: 800;
}

.card-title {
  color: #f1f6ff;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.5;
  margin-bottom: 12px;
}

.card-summary {
  color: #8fa0bd;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 12px;
}

.tag-list {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.card-tag {
  background: #151d31;
  color: #8fa0bd;
  border-radius: 5px;
  padding: 5px 7px;
  font-size: 11px;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.empty-state {
  height: 250px;
  border: 1px dashed #253452;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #6f7d98;
  font-size: 13px;
  text-align: center;
}

.empty-icon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #53637f;
  margin-bottom: 14px;
}

.empty-title {
  color: #dce8ff;
  font-weight: 800;
  margin-bottom: 8px;
}

span.card-tag {
  cursor: pointer;
  transition:
    transform 0.18s ease,
    background 0.18s ease,
    color 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

span.card-tag:hover {
  transform: translateY(-2px);

  background: rgba(76, 183, 211, 0.10);
  color: #4CB7D3;

  border-color: rgba(76, 183, 211, 0.35);

  box-shadow:
    0 4px 14px rgba(76, 183, 211, 0.14);
}

body.light-mode span.card-tag:hover {
  background: rgba(65, 191, 224, 0.10);
  color: #41BFE0;

  border-color: rgba(65, 191, 224, 0.28);

  box-shadow:
    0 4px 12px rgba(65, 191, 224, 0.12);
}

/* ==============================
   Light Mode - Sage Premium Theme
============================== */

body.light-mode .scope-label {
  color: #41bfe0;
}

body.light-mode {
  background: #edf2ee;
  color: #1f2937;
}

body.light-mode .page {
  background: #edf2ee;
}

/* Header */

body.light-mode .header {
  background: #f1f6f2;
  border-bottom: 1px solid #d5ddd6;
  box-shadow: none;
  backdrop-filter: none;
}

body.light-mode .nav {
  color: #66756d;
}

body.light-mode .nav a:hover {

}

  border: 1px solid #d7dfd8;

  border: 1px solid #cfd8d0;

  border-color: #4cb7d3;

  background: #00e5ff;
  border-color: #00e5ff;
  color: #06262b;
  box-shadow: 0 4px 14px rgba(0, 207, 232, 0.08);
}

body.light-mode .header-btn.login:hover {
  filter: brightness(1.04);
}

body.light-mode .header-user-name {
  color: #55635c;
}

/* 자동완성 */

  border: 1px solid #d7dfd8;

}

body.light-mode .search-suggest-item {
  color: #3f4c45;
}

body.light-mode .search-suggest-item:hover {
  background: #ebf8fb;
  color: #00cfe8;
}

body.light-mode .search-suggest-icon {
  background: #dfe7e0;
  color: #607066;
}

body.light-mode .search-suggest-arrow {

}

/* Footer */

body.light-mode .footer {
  background: #eef3ee;
  border-top: 1px solid #d8e0d9;
}

body.light-mode .footer-inner {
  color: #6f7d75;
}

body.light-mode .footer-link {
  color: #607066;
}

body.light-mode .footer-link:hover {
  color: #00cfe8;
}

body.light-mode .footer-copy {
  color: #7d8b83;
}

body.light-mode .footer-divider {
  background: #cfd8d0;
}

body.light-mode .footer-logo-white {
  background-color: #111827;
}

/* Footer Modal */

body.light-mode .footer-modal {
  background: rgba(110, 128, 116, 0.18);
  backdrop-filter: blur(4px);
}

body.light-mode .footer-modal-box {
  background: #f8fbf8;
  border: 1px solid #d9e2da;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
}

<body>
<div class="page">

          <span><span class="dot neutral-dot"></span>중립</span>
          <span id="neutralCount"></span>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();
  moveFooterOutsideMain();
  bindGlobalClickEvents();

  fetchScopeData();

  window.addEventListener("scroll", handleColumnInfiniteScroll);
});

function moveFooterOutsideMain() {
  const footer = document.getElementById("footer");
  const page = document.querySelector(".page");

  if (!footer || !page) return;

  if (footer.parentElement !== page) {
    page.appendChild(footer);
  }
}

function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  } else {
    document.body.classList.remove("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  }
}

function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||
      localStorage.getItem("userName"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}

function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  if (headerArea.innerHTML.trim()) {
    setHeaderLoginState();
    bindCommonSearch();
    applyThemeMode();
    activateCurrentHeaderMenu();
    return;
  }

  fetch("/view/header.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("header.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();

      activateCurrentHeaderMenu();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}

function activateCurrentHeaderMenu() {
  const currentFile = window.location.pathname.split("/").pop();

  const navLinks = document.querySelectorAll(".nav a");

  navLinks.forEach(function (link) {
    const targetPath = link.dataset.loginPage;
    if (!targetPath) return;

    const targetFile = targetPath.split("/").pop();

    link.classList.remove("active");

    if (currentFile === targetFile) {
      link.classList.add("active");
    }
  });

  // scope_detail.html은 무조건 이슈 분석 활성화
  if (currentFile === "scope_detail.html") {
    const scopeLink = document.querySelector(
      '.nav a[data-login-page="/view/scope_detail.html"]'
    );

    if (scopeLink) {
      scopeLink.classList.add("active");
    }
  }
}

function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  if (footerArea.innerHTML.trim()) {
    return;
  }

  fetch("/view/footer.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("footer.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}

function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  let headerUserName = document.getElementById("headerUserName");

  // header.html이 구버전이어도 이름 영역 자동 생성
  if (!headerUserName) {
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    if (themeToggleBtn && themeToggleBtn.parentElement) {
      headerUserName = document.createElement("span");
      headerUserName.id = "headerUserName";
      headerUserName.className = "header-user-name hidden";
      themeToggleBtn.insertAdjacentElement("afterend", headerUserName);
    }
  }

  if (
    !loginBtn ||
    !joinBtn ||
    !primaryUserBtn ||
    !logoutBtn ||
    !headerUserName
  ) {
    return;
  }

  const loginInfo = getLoginInfo();
  const token = loginInfo.token;
  const role = loginInfo.role;
  const userName = loginInfo.userName;

  if (!token) {
    loginBtn.classList.remove("hidden");
    joinBtn.classList.remove("hidden");

    primaryUserBtn.classList.add("hidden");
    logoutBtn.classList.add("hidden");

    headerUserName.textContent = "";
    headerUserName.classList.add("hidden");

    return;
  }

  loginBtn.classList.add("hidden");
  joinBtn.classList.add("hidden");

  primaryUserBtn.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");

  if (userName) {
    headerUserName.textContent = `${userName}님`;
    headerUserName.classList.remove("hidden");
  } else {
    headerUserName.textContent = "";
    headerUserName.classList.add("hidden");
  }

  const isAdmin =
    role === "ADMIN" ||
    role === "SUPERADMIN" ||
    role === "admin" ||
    role === "superadmin" ||
    token === "admin-test-token";

  primaryUserBtn.innerText = isAdmin
    ? "관리자 페이지"
    : "마이페이지";
}

window.goLoginRequiredPage = function (targetUrl) {
  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
    return;
  }

  location.href = targetUrl;
};

function bindGlobalClickEvents() {
  document.addEventListener("click", function (e) {
    const loginBtn = e.target.closest("#loginBtn");
    const joinBtn = e.target.closest("#joinBtn");
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");
    const cardTag = e.target.closest(".card-tag");

    if (cardTag) {
      e.preventDefault();

      const keyword = cardTag.dataset.keyword;

      goLoginRequiredPage(
        `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
      );

      return;
    }

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (loginBtn) {
      e.preventDefault();
      location.href = "/view/login.html";
      return;
    }

    if (joinBtn) {
      e.preventDefault();
      location.href = "/view/terms.html";
      return;
    }

    if (primaryUserBtn) {
      e.preventDefault();

      const loginInfo = getLoginInfo();
      const role = loginInfo.role;
      const token = loginInfo.token;

      const isAdmin =
        role === "ADMIN" ||
        role === "SUPERADMIN" ||
        role === "admin" ||
        role === "superadmin" ||
        token === "admin-test-token";

      if (isAdmin) {
        location.href = "/view/admin_dashboard.html";
      } else {
        location.href = "/view/mypage_home.html";
      }

      return;
    }

    if (logoutBtn) {
      e.preventDefault();
      logout();
      return;
    }

    if (loginRequiredLink) {
      e.preventDefault();

      const targetUrl = loginRequiredLink.dataset.loginPage;
      goLoginRequiredPage(targetUrl);
      return;
    }
  });
}

function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>

            <span class="search-suggest-keyword">
              ${highlightKeyword(item, value)}
            </span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const keyword = btn.dataset.suggestKeyword;

        selectSearchSuggestion(keyword);
      });
    });

    positionSearchSuggestBox();

    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);
    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
  );
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`
  );
}

window.logout = async function () {
  localStorage.removeItem("access_token");
  localStorage.removeItem("user_name");
  localStorage.removeItem("user_role");
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("userName");

  sessionStorage.removeItem("access_token");
  sessionStorage.removeItem("user_name");
  sessionStorage.removeItem("user_role");
  sessionStorage.removeItem("token");
  sessionStorage.removeItem("role");
  sessionStorage.removeItem("userName");

  try {
    await axios.post("/logout");
  } catch (e) {
    console.error("로그아웃 실패:", e);
  }

  location.href = "/view/main.html";
};

window.openFooterTermsModal = function () {
  const modal = document.getElementById("footerModal");
  const content = document.getElementById("footerModalContent");

  if (!modal || !content) return;

  content.innerHTML = `
    <h3>이용약관</h3>

/* ==============================
   scope_detail.js
============================== */

let scopeData = null;

const ARTICLE_BATCH_SIZE = 5;

const articleState = {
  positive: {
    visible: 5,
    infiniteEnabled: false
  },

  neutral: {
    visible: 5,
    infiniteEnabled: false
  },

  negative: {
    visible: 5,
    infiniteEnabled: false
  }
};

async function fetchScopeData() {
  const params = new URLSearchParams(location.search);
  const scopeID = params.get("scopeID");

  const apiUrl = scopeID
    ? `/api/scopes/${encodeURIComponent(scopeID)}`
    : "/api/scopes/random";

  try {
    const res = await axios.get(apiUrl);

    scopeData = res.data;

    if (!scopeID && scopeData.scopeID) {
      const newUrl =
        `/view/scope_detail.html?scopeID=${encodeURIComponent(scopeData.scopeID)}`;

      history.replaceState(null, "", newUrl);
      activateCurrentHeaderMenu();
    }

    loadScopeInfo();
    loadSentimentDist();
    loadViewpoints();
    loadArticleColumns();

  } catch (error) {
    console.error("AI 뉴스 분석 데이터 불러오기 실패:", error);
    alert("AI 뉴스 분석 데이터를 불러오지 못했습니다.");
  }
}

const sentimentNames = {
  positive: "긍정",
  neutral: "중립",
  negative: "부정"
};

const sentimentClass = {
  positive: "positive",
  neutral: "neutral",
  negative: "negative"
};

function loadScopeInfo() {
  document.getElementById("scopeTitle").innerText = scopeData.title;
  document.getElementById("scopeSummary").innerText = scopeData.summary;
  document.getElementById("breadcrumbTitle").innerText = scopeData.title;

  const keywordList = document.getElementById("keywordList");
  keywordList.innerHTML = "";

  scopeData.keywords.slice(0, 5).forEach(function(keyword, index) {
    keywordList.innerHTML += `
      <span
        class="keyword ${index === 0 ? "main" : ""}"
        data-keyword="${keyword}"
      >
        ${keyword}
      </span>
    `;
  });

  document.querySelectorAll(".keyword").forEach(function(el) {
    el.addEventListener("click", function() {
      const keyword = el.dataset.keyword;

      goLoginRequiredPage(
        `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
      );
    });
  });

  document.getElementById("articleCount").innerText =
    scopeData.articles.length + "건";

  document.getElementById("lastUpdated").innerText =
    scopeData.lastUpdated;
}

function loadSentimentDist() {
  const area = document.getElementById("sentimentArea");
  area.innerHTML = "";

  const rows = [
    ["positive", "긍정"],
    ["neutral", "중립"],
    ["negative", "부정"]
  ];

  rows.forEach(function(row) {
    const key = row[0];
    const label = row[1];
    const value = scopeData.sentimentDist[key];

    area.innerHTML += `
      <div class="sentiment-row">
        <div>
          <span class="dot ${key}-dot"></span>${label}
        </div>

        <div class="bar">
          <div class="fill ${key}" style="width:${value}%"></div>
        </div>

        <div>${value}%</div>
      </div>
    `;
  });
}

function loadViewpoints() {
  const area = document.getElementById("viewpointArea");
  area.innerHTML = "";

  scopeData.viewpoints.slice(0, 4).forEach(function(item) {
    area.innerHTML += `
      <span class="viewpoint">
        ${item.name} ${item.percent}%
      </span>
    `;
  });
}

function loadArticleColumns() {
  const positive = scopeData.articles.filter(function(article) {
    return article.sentiment === "positive";
  });

  const neutral = scopeData.articles.filter(function(article) {
    return article.sentiment === "neutral";
  });

  const negative = scopeData.articles.filter(function(article) {
    return article.sentiment === "negative";
  });

  document.getElementById("positiveCount").innerText = positive.length + "건";
  document.getElementById("neutralCount").innerText = neutral.length + "건";
  document.getElementById("negativeCount").innerText = negative.length + "건";

  renderArticleList("positiveList", positive, "positive");
  renderArticleList("neutralList", neutral, "neutral");
  renderArticleList("negativeList", negative, "negative");

  renderMoreButton("positive", positive.length);
  renderMoreButton("neutral", neutral.length);
  renderMoreButton("negative", negative.length);
}

function renderArticleList(targetId, articles, sentiment) {
  const target = document.getElementById(targetId);

  target.innerHTML = "";

  if (articles.length === 0) {
    target.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"></div>

        <div class="empty-title">
          ${sentimentNames[sentiment]} 기사가 없습니다
        </div>

        <div>
          현재 분석 기준상
          ${sentimentNames[sentiment]} 감성 기사가 없습니다
        </div>
      </div>
    `;

    return;
  }

  const visibleArticles = articles.slice(
    0,
    articleState[sentiment].visible
  );

  visibleArticles.forEach(function(article) {
    console.log(article);
    const tags = (article.keywords || [])
      .map(function(tag) {
        return `
          <span
            class="card-tag"
            data-keyword="${tag}"
          >
            ${tag}
          </span>
        `;
      })
      .join("");

    target.innerHTML += `
      <article
        class="news-card ${sentimentClass[article.sentiment]}"
        data-login-page="${article.url}"
      >

        <div class="card-meta">
          <span class="press">
            <span class="dot ${article.sentiment}-dot"></span>
            ${article.press}
          </span>

          <span>${article.time}</span>
        </div>

        <div class="card-title">
          ${article.title}
        </div>

        <div class="card-summary">
          ${article.summary}
        </div>

        <div class="tag-list">
          ${tags}
        </div>

      </article>
    `;
  });
}

/* =========================
   더보기 버튼
========================= */

function renderMoreButton(sentiment, totalCount) {
  const target = document.getElementById(`${sentiment}MoreWrap`);
  if (!target) return;

  const visible = articleState[sentiment].visible;

  if (totalCount <= visible) {
    target.innerHTML = "";
    return;
  }

  target.innerHTML = `
    <button
      class="more-btn"
      type="button"
      onclick="enableInfiniteScroll('${sentiment}')"
    >
      더보기
    </button>
  `;
}

/* =========================
   인피니트 스크롤 시작
========================= */

function enableInfiniteScroll(sentiment) {
  articleState[sentiment].infiniteEnabled = true;

  const wrap =
    document.getElementById(`${sentiment}MoreWrap`);

  if (wrap) {
    wrap.innerHTML = "";
  }

  loadMoreArticles(sentiment);
}

/* =========================
   기사 추가 로딩
========================= */

function loadMoreArticles(sentiment) {
  const state = articleState[sentiment];

  if (!state.infiniteEnabled) return;

  state.visible += ARTICLE_BATCH_SIZE;

  loadArticleColumns();
}

function handleColumnInfiniteScroll() {
  const scrollBottom =
    window.innerHeight + window.scrollY;

  const documentHeight =
    document.documentElement.offsetHeight;

  if (scrollBottom < documentHeight - 200) {
    return;
  }

  ["positive", "neutral", "negative"].forEach(function(sentiment) {
    const state = articleState[sentiment];

    if (!state.infiniteEnabled) return;

    const total =
      scopeData.articles.filter(function(article) {
        return article.sentiment === sentiment;
      }).length;

    if (state.visible >= total) return;

    state.visible += ARTICLE_BATCH_SIZE;

    loadArticleColumns();
  });
}

function reloadRandomScope() {
  document.body.style.opacity = "0.72";

  setTimeout(function() {
    location.href = `/view/scope_detail.html?v=${Date.now()}`;
  }, 140);
}
