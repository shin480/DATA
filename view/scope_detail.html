<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DATA 다타 - 이슈 분석</title>

<link rel="icon" type="image/png" href="/view/img/favicon.png?v=2" />

<style>
/* =========================================================
   0. RESET / BASE
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  overflow-x: hidden;
}

body {
  background: #050816;
  color: #e5e7eb;
  font-family: "Pretendard", Arial, sans-serif;
}

.hidden {
  display: none !important;
}

.page {
  width: min(1440px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 72px;
  background: #050816;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   1. HEADER
========================================================= */

.header {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10000;

  width: 100%;
  height: 72px;
  padding: 0 56px;

  display: flex;
  align-items: center;

  background: #070b1a;
  border-bottom: 1px solid #111827;
}

.logo {
  width: 155px;
  height: 52px;

  display: flex;
  align-items: center;

  text-decoration: none;
  flex-shrink: 0;
  overflow: hidden;
}

.header-logo-full {
  width: auto;
  height: 52px;
  display: block;
  object-fit: contain;
}

.nav {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: 22px;

  color: #6b7280;
  font-size: 15px;
  font-weight: 700;

  flex-shrink: 0;
}

.nav a {
  position: relative;
  color: inherit;
  text-decoration: none;
  transition: color 0.18s ease;
}

.nav a:hover {
  color: #00e5ff;
}

.nav a.active {
  color: #00e5ff !important;
  font-weight: 900 !important;
}

.nav a.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -26px;

  height: 3px;
  border-radius: 999px;

  background: #00e5ff;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.65);
}

.header-right {
  margin-left: auto;

  display: flex;
  align-items: center;
  gap: 12px;
}

/* 검색창 */
.main-search-wrap {
  position: relative;
  width: 370px;
  height: 40px;
  border-radius: 999px;
  background: #070b1a;
  border: 1px solid #1f2937;
  display: flex;
  align-items: center;
  padding: 0 14px 0 20px;
}

.main-search-wrap:focus-within {
  border-color: rgba(0, 229, 255, 0.85);
  box-shadow:
    0 0 0 1px rgba(0, 229, 255, 0.18),
    0 0 14px rgba(0, 229, 255, 0.32),
    0 0 28px rgba(0, 229, 255, 0.14);
}

.search-box {
  flex: 1;

  width: 100%;
  height: 100%;
  padding: 0;

  border: 0;
  outline: none;
  background: transparent;

  color: #cbd5e1;
  font-size: 15px;
}

.search-box::placeholder {
  color: #7c8493;
}

.search-icon-btn {
  width: 24px;
  height: 24px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 0;
  background: transparent;
  color: #8b95a7;

  cursor: pointer;
  flex-shrink: 0;
}

.search-icon-btn:hover {
  color: #00e5ff;
}

.theme-btn {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #070b1a;
  color: #facc15;

  cursor: pointer;
}

.theme-btn:hover {
  border-color: #334155;
}

.header-btn {
  height: 40px;
  padding: 0 20px;

  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;

  cursor: pointer;
}

.header-btn.login {
  border: 1px solid #00cfe8;
  background: #00cfe8;
  color: #020617;
}

.header-btn.join {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
}

.header-btn.join:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}

.header-user-name {
  display: inline-flex;
  align-items: center;

  height: 40px;
  margin: 0 2px;

  color: #cbd5e1;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
}


/* =========================================================
   2. SEARCH SUGGEST
========================================================= */

.search-suggest-box {
  position: fixed;
  z-index: 20000;

  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;

  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);

  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  border: 0;
  background: transparent;

  color: #cbd5e1;
  font-size: 15px;
  text-align: left;

  cursor: pointer;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: #94a3b8;
  color: #020817;

  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #41bfe0;
  font-weight: 900;
}


/* =========================================================
   3. FOOTER
========================================================= */

#footer {
  width: 100vw;
  margin-top: auto;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  overflow: visible;
  flex-shrink: 0;
}

.footer {
  width: 100%;
  background: #020617;
  color: #fff;
}

.footer-inner {
  width: 100%;
  min-height: 88px;
  padding: 0 70px;

  display: flex;
  align-items: center;
  gap: 22px;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  flex-shrink: 0;

  background-color: #ffffff;

  -webkit-mask-image: url("/view/img/favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;

  mask-image: url("/view/img/favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;
}

.footer-link {
  border: 0;
  background: transparent;

  color: #94a3b8;
  font-size: 12px;
  text-decoration: none;

  cursor: pointer;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}

.footer-modal {
  position: fixed;
  inset: 0;
  z-index: 30000;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(2, 8, 23, 0.75);
}

.footer-modal.hidden {
  display: none !important;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  padding: 28px;

  overflow-y: auto;

  border-radius: 18px;
  border: 1px solid #334155;
  background: #111827;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;

  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;

  font-weight: 900;
  cursor: pointer;
}


/* =========================================================
   4. MAIN LAYOUT
========================================================= */

.scope-detail-page {
  flex: 1;
}

.wrap {
  width: min(1040px, 100%);
  margin: 0 auto;
  padding: 34px 0 80px;
}

.back-btn {
  display: inline-block;
  margin-bottom: 26px;

  color: #3b82a0;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.back-btn:hover {
  color: #00e5ff;
}

.breadcrumb {
  margin-bottom: 22px;
  color: #53637f;
  font-size: 12px;
}

.scope-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  margin-bottom: 18px;
}

.scope-live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;

  border-radius: 999px;
  border: 1px solid rgba(76, 183, 211, 0.22);
  background: rgba(76, 183, 211, 0.10);

  color: #7dd3e8;
  font-size: 13px;
  font-weight: 700;
}

.scope-live-badge::before {
  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;
  background: #4cb7d3;
  box-shadow: 0 0 12px rgba(76, 183, 211, 0.65);
}

.random-scope-btn {
  padding: 10px 16px;

  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.06);

  color: #e2e8f0;
  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
  transition: 0.18s ease;
}

.random-scope-btn:hover {
  transform: translateY(-2px);
  background: rgba(76, 183, 211, 0.12);
  border-color: rgba(76, 183, 211, 0.24);
  color: #7dd3e8;
}

.top-area {
  display: grid;
  grid-template-columns: 1.9fr 1fr;
  gap: 20px;
  align-items: stretch;

  margin-bottom: 30px;
}

.scope-box,
.stat-box {
  min-width: 0;

  border-radius: 14px;
  border: 1px solid #16223b;
  background: #0b1223;
}

.scope-box {
  min-height: 270px;
  padding: 30px 32px;

  display: flex;
  flex-direction: column;
}

.stat-box {
  padding: 22px 24px;
}

.scope-label {
  margin-bottom: 14px;

  color: #16d9ff;
  font-size: 15px;
  font-weight: 800;
}

.scope-title {
  margin-bottom: 18px;

  color: #f1f6ff;
  font-size: 27px;
  font-weight: 900;
  line-height: 1.42;

  overflow-wrap: break-word;
}

.scope-summary {
  position: relative;

  margin-bottom: 26px;
  padding-left: 18px;

  color: #8fa0bd;
  font-size: 15px;
  line-height: 1.75;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

.scope-summary::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;

  width: 4px;
  height: 100%;

  border-radius: 999px;
  background: linear-gradient(
    to bottom,
    rgba(20, 217, 255, 0) 0%,
    rgba(20, 217, 255, 0.14) 14%,
    rgba(20, 217, 255, 0.85) 50%,
    rgba(20, 217, 255, 0.14) 86%,
    rgba(20, 217, 255, 0) 100%
  );
}

.keyword-list {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;

  margin-top: auto;
}

.keyword {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 10px 16px;

  border-radius: 999px;
  border: 1px solid #0c6e8a;
  background: #073044;

  color: #16d9ff;
  font-size: 13px;
  font-weight: 500;

  cursor: pointer;
  transition: 0.18s ease;
}

.keyword.main {
  background: #0b3d55;
  border-color: #16d9ff;
  font-weight: 800;
}

.keyword:hover {
  transform: translateY(-2px);
  background: rgba(76, 183, 211, 0.10);
  color: #4cb7d3;
  border-color: rgba(76, 183, 211, 0.35);
  box-shadow: 0 4px 14px rgba(76, 183, 211, 0.14);
}


/* =========================================================
   5. STAT
========================================================= */

.stat-title {
  margin-bottom: 16px;

  color: #7f8ea9;
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}

.sentiment-row {
  display: grid;
  grid-template-columns: 55px 1fr 40px;
  align-items: center;
  gap: 10px;

  margin-bottom: 12px;

  font-size: 12px;
}

.dot {
  display: inline-block;

  width: 8px;
  height: 8px;
  margin-right: 6px;

  border-radius: 50%;
}

.positive-dot { background: #34d6cc; }
.neutral-dot { background: #f0b83a; }
.negative-dot { background: #ff6578; }

.bar {
  height: 6px;
  overflow: hidden;

  border-radius: 10px;
  background: #1a2540;
}

.fill {
  height: 100%;
  border-radius: 10px;
}

.fill.positive { background: #34d6cc; }
.fill.neutral { background: #f0b83a; }
.fill.negative { background: #ff6578; }

.viewpoints {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;

  width: 100%;
  margin-top: 10px;
}

.viewpoint {
  min-width: 0;
  min-height: 28px;
  padding: 5px 10px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 999px;
  border: 1px solid rgba(120, 140, 180, 0.18);
  background: rgba(255,255,255,0.02);

  color: #9fb0ca;
  font-size: 11px;
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
}

.meta-info {
  width: 100%;
  max-width: 340px;
  margin: 18px auto 0;
  padding-top: 14px;

  border-top: 1px solid #17223a;

  color: #7f8ea9;
  font-size: 12px;
}

.meta-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;

  margin-top: 8px;
}

.meta-line strong {
  color: #8fa0bd;
  font-weight: 700;
}


/* =========================================================
   6. ARTICLE COLUMNS
========================================================= */

.mobile-article-section-title,
.mobile-sentiment-tabs {
  display: none;
}

.news-columns {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.sentiment-column {
  min-width: 0;
}

.column-head {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 12px;

  font-size: 13px;
  font-weight: 800;
}

.column-head.positive { color: #34d6cc; }
.column-head.neutral { color: #f2b648; }
.column-head.negative { color: #e05a5a; }

.news-card {
  position: relative;

  height: 195px;
  margin-bottom: 12px;
  padding: 16px;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 12px;
  border: 1px solid #16223b;
  background: #0b1223;

  cursor: pointer;
  transition: 0.18s ease;
}

.news-card:hover {
  transform: translateY(-2px);
  border-color: #2f6dff;
}

.news-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;

  width: 4px;
  height: 100%;
  opacity: 0.95;
}

.news-card.positive::before {
  background: linear-gradient(to bottom, transparent, rgba(52, 214, 204, 0.3), transparent);
}

.news-card.neutral::before {
  background: linear-gradient(to bottom, transparent, rgba(240, 184, 58, 0.3), transparent);
}

.news-card.negative::before {
  background: linear-gradient(to bottom, transparent, rgba(255, 101, 120, 0.3), transparent);
}

.card-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;

  margin-bottom: 12px;

  color: #63728d;
  font-size: 11px;
}

.press {
  font-weight: 800;
}

.card-title {
  margin-bottom: 12px;

  color: #f1f6ff;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.5;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
  text-overflow: ellipsis;
  overflow-wrap: break-word;
}

.card-summary {
  margin-bottom: 12px;

  color: #8fa0bd;
  font-size: 12px;
  line-height: 1.6;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
  text-overflow: ellipsis;
  overflow-wrap: break-word;
}

.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.card-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 5px 7px;

  border-radius: 5px;
  background: #151d31;

  color: #8fa0bd;
  font-size: 11px;

  cursor: pointer;
  transition: 0.18s ease;
}

.card-tag:hover {
  transform: translateY(-2px);
  background: rgba(76, 183, 211, 0.10);
  color: #4cb7d3;
  box-shadow: 0 4px 14px rgba(76, 183, 211, 0.14);
}

.empty-state {
  height: 195px;
  padding: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border-radius: 12px;
  border: 1px dashed #253452;

  color: #6f7d98;
  font-size: 13px;
  text-align: center;
}

.empty-icon {
  width: 40px;
  height: 40px;
  margin-bottom: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  border: 1px solid #53637f;

  color: #6f7d98;
  font-size: 22px;
  font-weight: 600;
}

.empty-icon::before {
  content: "!";
}

.empty-title {
  margin-bottom: 8px;
  color: #dce8ff;
  font-weight: 800;
}

.more-btn {
  width: 100%;
  height: 46px;

  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);

  color: #e5e7eb;
  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}

.more-btn:hover {
  background: rgba(255,255,255,0.06);
}


/* =========================================================
   7. LIGHT MODE
========================================================= */

body.light-mode {
  background: #edf2ee;
  color: #1f2937;
}

body.light-mode .page {
  background: #edf2ee;
}

body.light-mode .header {
  background: #f1f6f2;
  border-bottom: 1px solid #d5ddd6;
}

body.light-mode .nav {
  color: #66756d;
}

body.light-mode .nav a:hover,
body.light-mode .nav a.active {
  color: #41bfe0 !important;
}

body.light-mode .nav a.active::after {
  background: #41bfe0;
}

body.light-mode .main-search-wrap {
  background: #f7faf7;
  border: 1px solid #d8e1d9;
  box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
}

body.light-mode .main-search-wrap:focus-within {
  border-color: rgba(0, 207, 232, 0.45);
  box-shadow:
    0 0 0 4px rgba(0, 207, 232, 0.08),
    inset 0 1px 2px rgba(15, 23, 42, 0.08);
}

body.light-mode .search-box {
  color: #41bfe0;
}

body.light-mode .theme-btn,
body.light-mode .header-btn.join {
  background: #f7faf7;
  border-color: #d7dfd8;
  color: #4b5563;
}

body.light-mode .header-user-name {
  color: #55635c;
}

body.light-mode .scope-box,
body.light-mode .stat-box,
body.light-mode .news-card {
  background: #f7faf7;
  border: 1px solid #d9e2f2;
  box-shadow: 0 4px 14px rgba(148, 163, 184, 0.08);
}

body.light-mode .scope-title,
body.light-mode .card-title,
body.light-mode .empty-title {
  color: #0f172a;
}

body.light-mode .scope-summary,
body.light-mode .card-summary,
body.light-mode .meta-info,
body.light-mode .viewpoint,
body.light-mode .card-tag {
  color: #64748b;
}

body.light-mode .bar {
  background: #e2e8f0;
}

body.light-mode .viewpoint,
body.light-mode .card-tag {
  background: #f1f5f9;
  border-color: #cbd5e1;
}

body.light-mode .keyword {
  background: #e8f8fc;
  color: #0284a8;
  border-color: #9ee7f5;
}

body.light-mode .keyword.main {
  background: #dff7ff;
  color: #075985;
  border-color: #16d9ff;
}

body.light-mode .scope-live-badge {
  background: rgba(65, 191, 224, 0.10);
  border-color: rgba(65, 191, 224, 0.18);
  color: #1691b1;
}

body.light-mode .random-scope-btn {
  background: rgba(255,255,255,0.92);
  border-color: rgba(15, 23, 42, 0.08);
  color: #334155;
}

body.light-mode .mobile-article-section-title {
  color: #0f172a;
}

body.light-mode .mobile-sentiment-tabs {
  background: rgba(247, 250, 247, 0.92);

<script>
document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();
  moveFooterOutsideMain();
  bindGlobalClickEvents();
  bindMobileSentimentTabs();
  fetchScopeData();

  window.addEventListener("scroll", handleColumnInfiniteScroll);
});

window.addEventListener("pageshow", function (event) {
  if (event.persisted) {
    window.location.reload();
  }
});

function moveFooterOutsideMain() {
  const footer = document.getElementById("footer");
  const page = document.querySelector(".page");

  if (!footer || !page) return;

  if (footer.parentElement !== page) {
    page.appendChild(footer);
  }
}

function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");
    if (themeBtn) themeBtn.innerText = "☀️";
  } else {
    document.body.classList.remove("light-mode");
    if (themeBtn) themeBtn.innerText = "🌙";
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");
    if (themeBtn) themeBtn.innerText = "🌙";
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");
    if (themeBtn) themeBtn.innerText = "☀️";
  }
}

function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:
      sessionStorage.getItem("user_name") ||
      localStorage.getItem("user_name") ||
      sessionStorage.getItem("userName") ||
      localStorage.getItem("userName"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}

function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  fetch("/view/header.html?v=" + Date.now())
    .then(function (res) {
      if (!res.ok) throw new Error("header.html 경로 오류");
      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
      activateCurrentHeaderMenu();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}

function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  fetch("/view/footer.html?v=" + Date.now())
    .then(function (res) {
      if (!res.ok) throw new Error("footer.html 경로 오류");
      return res.text();
    })
    .then(function (html) {
      footerArea.innerHTML = html;
    })
    .catch(function (err) {
      console.error("footer 로드 실패:", err);
    });
}

function activateCurrentHeaderMenu() {
  const currentFile = window.location.pathname.split("/").pop();
  const navLinks = document.querySelectorAll(".nav a");

  navLinks.forEach(function (link) {
    const targetPath = link.dataset.loginPage;
    if (!targetPath) return;

    const targetFile = targetPath.split("/").pop();

    link.classList.remove("active");

    if (currentFile === targetFile) {
      link.classList.add("active");
    }
  });

  if (currentFile === "scope_detail.html") {
    const scopeLink = document.querySelector('.nav a[data-login-page="/view/scope_detail.html"]');
    if (scopeLink) scopeLink.classList.add("active");
  }
}

function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  let headerUserName = document.getElementById("headerUserName");

  if (!headerUserName) {
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    if (themeToggleBtn && themeToggleBtn.parentElement) {
      headerUserName = document.createElement("span");
      headerUserName.id = "headerUserName";
      headerUserName.className = "header-user-name hidden";
      themeToggleBtn.insertAdjacentElement("afterend", headerUserName);
    }
  }

  if (!loginBtn || !joinBtn || !primaryUserBtn || !logoutBtn || !headerUserName) return;

  const loginInfo = getLoginInfo();
  const token = loginInfo.token;
  const role = loginInfo.role;
  const userName = loginInfo.userName;

  if (!token) {
    loginBtn.classList.remove("hidden");
    joinBtn.classList.remove("hidden");
    primaryUserBtn.classList.add("hidden");
    logoutBtn.classList.add("hidden");

    headerUserName.textContent = "";
    headerUserName.classList.add("hidden");
    return;
  }

  loginBtn.classList.add("hidden");
  joinBtn.classList.add("hidden");
  primaryUserBtn.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");

  if (userName) {
    headerUserName.textContent = `${userName}님`;
    headerUserName.classList.remove("hidden");
  } else {
    headerUserName.textContent = "";
    headerUserName.classList.add("hidden");
  }

  const isAdmin =
    role === "ADMIN" ||
    role === "SUPERADMIN" ||
    role === "admin" ||
    role === "superadmin" ||
    token === "admin-test-token";

  primaryUserBtn.innerText = isAdmin ? "관리자 페이지" : "마이페이지";
}

window.goLoginRequiredPage = function (targetUrl) {
  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    alert("로그인이 필요한 서비스입니다.");
    location.href = "/view/login.html";
    return;
  }

  location.href = targetUrl;
};

function bindGlobalClickEvents() {
  document.addEventListener("click", function (e) {
    const loginBtn = e.target.closest("#loginBtn");
    const joinBtn = e.target.closest("#joinBtn");
    const primaryUserBtn = e.target.closest("#primaryUserBtn");
    const logoutBtn = e.target.closest("#logoutBtn");
    const themeToggleBtn = e.target.closest("#themeToggleBtn");
    const loginRequiredLink = e.target.closest("[data-login-page]");
    const cardTag = e.target.closest(".card-tag");

    if (cardTag) {
      e.preventDefault();

      const keyword = cardTag.dataset.keyword;

      goLoginRequiredPage(
        `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
      );

      return;
    }

    if (themeToggleBtn) {
      e.preventDefault();
      toggleThemeMode();
      return;
    }

    if (loginBtn) {
      e.preventDefault();
      location.href = "/view/login.html";
      return;
    }

    if (joinBtn) {
      e.preventDefault();
      location.href = "/view/terms.html";
      return;
    }

    if (primaryUserBtn) {
      e.preventDefault();

      const loginInfo = getLoginInfo();
      const role = loginInfo.role;
      const token = loginInfo.token;

      const isAdmin =
        role === "ADMIN" ||
        role === "SUPERADMIN" ||
        role === "admin" ||
        role === "superadmin" ||
        token === "admin-test-token";

      location.href = isAdmin
        ? "/view/admin_dashboard.html"
        : "/view/mypage_home.html";

      return;
    }

    if (logoutBtn) {
      e.preventDefault();
      logout();
      return;
    }

    if (loginRequiredLink) {
      e.preventDefault();

      const targetUrl = loginRequiredLink.dataset.loginPage;
      goLoginRequiredPage(targetUrl);
    }
  });
}

function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") moveSearch(input.value);
    if (e.key === "Escape") hideSearchSuggestions();
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(`/api/search/suggest?q=${encodeURIComponent(value)}`);
    const results = res.data || [];

    if (!results.length) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button class="search-suggest-item" type="button" data-suggest-keyword="${item}">
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>
            <span class="search-suggest-keyword">${highlightKeyword(item, value)}</span>
          </span>
          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectSearchSuggestion(btn.dataset.suggestKeyword);
      });
    });

    positionSearchSuggestBox();
    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);
    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");
  if (suggestBox) suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) input.value = keyword;

  hideSearchSuggestions();

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
  );
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  goLoginRequiredPage(
    `/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`
  );
}

window.logout = async function () {
  [
    "access_token",
    "user_name",
    "user_role",
    "token",
    "role",
    "userName"
  ].forEach(function (key) {
    localStorage.removeItem(key);
    sessionStorage.removeItem(key);
  });

  try {
    await axios.post("/logout");
  } catch (e) {
    console.error("로그아웃 실패:", e);
  }

  location.href = "/view/main.html";
};

async function fetchScopeData() {
  const params = new URLSearchParams(location.search);
  const scopeID = params.get("scopeID");

  const apiUrl = scopeID
    ? `/api/scopes/${encodeURIComponent(scopeID)}`
    : "/api/scopes/random";

  try {
    const res = await axios.get(apiUrl);

    scopeData = res.data;

    if (!scopeID && scopeData.scopeID) {
      const newUrl =
        `/view/scope_detail.html?scopeID=${encodeURIComponent(scopeData.scopeID)}`;

      history.replaceState(null, "", newUrl);
      activateCurrentHeaderMenu();
    }

    loadScopeInfo();
    loadSentimentDist();
    loadViewpoints();
    loadArticleColumns();

  } catch (error) {
    console.error("AI 뉴스 분석 데이터 불러오기 실패:", error);
    alert("AI 뉴스 분석 데이터를 불러오지 못했습니다.");
  }
}

function loadScopeInfo() {
  document.getElementById("scopeTitle").innerText = scopeData.title || "";
  document.getElementById("scopeSummary").innerText = scopeData.summary || "";
  document.getElementById("breadcrumbTitle").innerText = scopeData.title || "";

  const keywordList = document.getElementById("keywordList");
  keywordList.innerHTML = "";

  (scopeData.keywords || []).slice(0, 5).forEach(function (keyword, index) {
    keywordList.innerHTML += `
      <span class="keyword ${index === 0 ? "main" : ""}" data-keyword="${keyword}">
        ${keyword}
      </span>
    `;
  });

  document.querySelectorAll(".keyword").forEach(function (el) {
    el.addEventListener("click", function () {
      const keyword = el.dataset.keyword;

      goLoginRequiredPage(
        `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`
      );
    });
  });

  document.getElementById("articleCount").innerText =
    (scopeData.articles || []).length + "건";

  document.getElementById("lastUpdated").innerText =
    scopeData.lastUpdated || "-";
}

function loadSentimentDist() {
  const area = document.getElementById("sentimentArea");
  area.innerHTML = "";

  [
    ["positive", "긍정"],
    ["neutral", "중립"],
    ["negative", "부정"]
  ].forEach(function ([key, label]) {
    const value = scopeData.sentimentDist?.[key] || 0;

    area.innerHTML += `
      <div class="sentiment-row">
        <div>
          <span class="dot ${key}-dot"></span>${label}
        </div>

        <div class="bar">
          <div class="fill ${key}" style="width:${value}%"></div>
        </div>

        <div>${value}%</div>
      </div>
    `;
  });
}

function loadViewpoints() {
  const area = document.getElementById("viewpointArea");
  area.innerHTML = "";

  (scopeData.viewpoints || []).slice(0, 4).forEach(function (item) {
    area.innerHTML += `
      <span class="viewpoint">
        ${item.name} ${item.percent}%
      </span>
    `;
  });
}

function loadArticleColumns() {
  const articles = scopeData.articles || [];

  const positive = articles.filter(function (article) {
    return article.sentiment === "positive";
  });

  const neutral = articles.filter(function (article) {
    return article.sentiment === "neutral";
  });

  const negative = articles.filter(function (article) {
    return article.sentiment === "negative";
  });

  setCount("positiveCount", positive.length);
  setCount("neutralCount", neutral.length);
  setCount("negativeCount", negative.length);

  setCount("positiveTabCount", positive.length);
  setCount("neutralTabCount", neutral.length);
  setCount("negativeTabCount", negative.length);

  renderArticleList("positiveList", positive, "positive");
  renderArticleList("neutralList", neutral, "neutral");
  renderArticleList("negativeList", negative, "negative");

  renderMoreButton("positive", positive.length);
  renderMoreButton("neutral", neutral.length);
  renderMoreButton("negative", negative.length);
}

function setCount(id, count) {
  const el = document.getElementById(id);
  if (el) el.innerText = count + "건";
}

function bindMobileSentimentTabs() {
  const tabs = document.querySelectorAll(".mobile-sentiment-tab");
  const columns = document.querySelectorAll(".sentiment-column");

  if (!tabs.length || !columns.length) return;

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      const targetSentiment = tab.dataset.sentimentTab;

      tabs.forEach(function (item) {
        item.classList.remove("active");
      });

      columns.forEach(function (column) {
        column.classList.remove("active-column");
      });

      tab.classList.add("active");

      const targetColumn = document.querySelector(
        `.sentiment-column[data-sentiment-column="${targetSentiment}"]`
      );

      if (targetColumn) {
        targetColumn.classList.add("active-column");
      }
    });
  });
}

function renderArticleList(targetId, articles, sentiment) {
  const target = document.getElementById(targetId);

  target.innerHTML = "";

  if (!articles.length) {
    target.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"></div>
        <div class="empty-title">${sentimentNames[sentiment]} 기사가 없습니다</div>
        <div>현재 분석 기준상 ${sentimentNames[sentiment]} 감성 기사가 없습니다</div>
      </div>
    `;

    return;
  }

  const visibleArticles = articles.slice(0, articleState[sentiment].visible);

  visibleArticles.forEach(function (article) {
    const tags = (article.keywords || [])
      .map(function (tag) {
        return `
          <span class="card-tag" data-keyword="${tag}">
            ${tag}
          </span>
        `;
      })
      .join("");

    target.innerHTML += `
      <article class="news-card ${sentimentClass[article.sentiment]}" data-login-page="${article.url}">
        <div class="card-meta">
          <span class="press">
            <span class="dot ${article.sentiment}-dot"></span>
            ${article.press || "-"}
          </span>

          <span>${article.time || ""}</span>
        </div>

        <div class="card-title">${article.title || ""}</div>
        <div class="card-summary">${article.summary || ""}</div>

        <div class="tag-list">
          ${tags}
        </div>
      </article>
    `;
  });
}

function renderMoreButton(sentiment, totalCount) {
  const target = document.getElementById(`${sentiment}MoreWrap`);
  if (!target) return;

  const visible = articleState[sentiment].visible;

  if (totalCount <= visible) {
    target.innerHTML = "";
    return;
  }

  target.innerHTML = `
    <button class="more-btn" type="button" onclick="enableInfiniteScroll('${sentiment}')">
      더보기
    </button>
  `;
}

function enableInfiniteScroll(sentiment) {
  articleState[sentiment].infiniteEnabled = true;

  const wrap = document.getElementById(`${sentiment}MoreWrap`);
  if (wrap) wrap.innerHTML = "";

  loadMoreArticles(sentiment);
}

function loadMoreArticles(sentiment) {
  const state = articleState[sentiment];

  if (!state.infiniteEnabled) return;

  state.visible += ARTICLE_BATCH_SIZE;

  loadArticleColumns();
}

function handleColumnInfiniteScroll() {
  if (!scopeData) return;

  const scrollBottom = window.innerHeight + window.scrollY;
  const documentHeight = document.documentElement.offsetHeight;

  if (scrollBottom < documentHeight - 200) return;

  ["positive", "neutral", "negative"].forEach(function (sentiment) {
    const state = articleState[sentiment];

    if (!state.infiniteEnabled) return;

    const total = (scopeData.articles || []).filter(function (article) {
      return article.sentiment === sentiment;
    }).length;

    if (state.visible >= total) return;

    state.visible += ARTICLE_BATCH_SIZE;

    loadArticleColumns();
  });
}

function reloadRandomScope() {
  document.body.style.opacity = "0.72";

  setTimeout(function () {
    location.href = `/view/scope_detail.html?v=${Date.now()}`;
  }, 140);
}
</script>
