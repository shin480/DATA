<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관점 상세 | DATA 다타</title>
<link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  overflow-x: hidden;
}

.hidden {
  display: none !important;
}

body {
  background: #030817;
  color: #f8fafc;
  font-family: "Pretendard", sans-serif;
}

.app {
  min-height: 100vh;
  background: #030817;
  display: flex;
  flex-direction: column;
}

/* =========================================================
   1. 헤더
========================================================= */
.header {
  position: fixed;
  top: 0;
  left: 0;
  transform: none;
  z-index: 10000;

  width: 100%;
  height: 72px;
  padding: 0 56px;

  display: flex;
  align-items: center;

  background: #070b1a;
  border-bottom: 1px solid #111827;
}

.logo {
  width: 155px;
  height: 52px;
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  overflow: hidden;
}

.header-logo-full {
  height: 52px;
  width: auto;
  display: block;
  object-fit: contain;
}

.nav {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: 22px;
  color: #6b7280;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}

.nav a {
  text-decoration: none;
  color: inherit;
  transition: color 0.18s;
}

.nav a:hover {
  color: #00e5ff;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}


/* 검색창 */
.main-search-wrap {
  position: relative;
  width: 370px;
  height: 40px;
  border-radius: 999px;
  background: #070b1a;
  border: 1px solid #1f2937;
  display: flex;
  align-items: center;
  padding: 0 14px 0 20px;
}

.main-search-wrap:focus-within {
  border-color: #334155;
}

.search-box {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 15px;
  padding: 0;
}

.search-box::placeholder {
  color: #7c8493;
}

.search-icon-btn {
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: #8b95a7;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}

.search-icon-btn:hover {
  color: #00e5ff;
}


/* 테마 버튼 */
.theme-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #070b1a;
  color: #facc15;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-btn:hover {
  border-color: #334155;
}


/* 로그인 / 회원가입 버튼 */
.header-btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.header-btn.login {
  border: 1px solid #00cfe8;
  background: #00cfe8;
  color: #020617;
}

.header-btn.login:hover {
  filter: brightness(1.08);
}

.header-btn.join {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
}

.header-btn.join:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}



/* 로그인 유저 이름 */
.header-user-name {
  display: inline-flex;
  align-items: center;
  height: 40px;

  color: #cbd5e1;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;

  margin-left: 2px;
  margin-right: 2px;
}

/* ==============================
   SEARCH SUGGEST
============================== */

.search-suggest-box {
  position: fixed;
  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #00e5ff;
  font-weight: 900;
}

/* ==============================
   PAGE
============================== */

.detail-page {
  width: 800px;
  margin: 0 auto;
  padding-top: 120px;
  padding-bottom: 120px;
  flex: 1;
}

.back-btn {
  display: inline-block;
  margin-bottom: 26px;
  color: #3b82a0;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
}

.back-btn:hover {
  color: #00e5ff;
}

.title-section {
  margin-top: 30px;
  display: grid;
  grid-template-columns: 134px 1fr 170px;
  align-items: center;
}

.main-icon {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  border: 1px solid #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
  color: #2dd4bf;
  display: grid;
  place-items: center;
  font-size: 56px;
}

.main-icon img {
  width: 58px;
  height: 58px;
  object-fit: contain;
  display: block;
}

.main-icon.theme-teal {
  border-color: #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
  color: #2dd4bf;
}

.main-icon.theme-purple {
  border-color: #a855f7;
  background: rgba(168, 85, 247, 0.12);
  color: #a855f7;
}

.main-icon.theme-blue {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.12);
  color: #3b82f6;
}

.main-icon.theme-orange {
  border-color: #fb923c;
  background: rgba(251, 146, 60, 0.12);
  color: #fb923c;
}

.main-icon.theme-yellow {
  border-color: #facc15;
  background: rgba(250, 204, 21, 0.12);
  color: #facc15;
}

.title-section h1 {
  font-size: 34px;
  font-weight: 900;
}

.title-section h1 strong {
  color: #2dd4bf;
  margin-left: 20px;
}

#viewPercent.theme-teal {
  color: #2dd4bf;
}

#viewPercent.theme-purple {
  color: #a855f7;
}

#viewPercent.theme-blue {
  color: #3b82f6;
}

#viewPercent.theme-orange {
  color: #fb923c;
}

#viewPercent.theme-yellow {
  color: #facc15;
}

.title-section p {
  margin-top: 14px;
  color: #94a3b8;
  font-size: 15px;
}

.date {
  color: #94a3b8;
  font-size: 12px;
  justify-self: end;
  transform: translate(-6px, 28px);
}

/* ==============================
   COMMON PANEL
============================== */

.panel {
  background: #111a2d;
  border: 1px solid rgba(148, 163, 184, 0.13);
  border-radius: 17px;
  padding: 24px;
}

.panel h2 {
  color: #7dd3fc;
  font-size: 16px;
  margin-bottom: 22px;
}

.top-grid {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 14px;
  margin-top: 36px;
}

/* ==============================
   ANALYSIS
============================== */

.analysis-box {
  min-height: 142px;
  border-radius: 12px;
  border: 1px solid #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 24px;
}

.check-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #2dd4bf;
  color: #0f172a;
  font-size: 30px;
  font-weight: 900;
  flex-shrink: 0;
}

.analysis-box h3 {
  color: #2dd4bf;
  font-size: 23px;
  margin-bottom: 20px;
}

.analysis-box p {
  color: #e2e8f0;
  line-height: 1.5;
}

.analysis-box.theme-teal {
  border-color: #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
}

.analysis-box.theme-teal .check-icon {
  background: #2dd4bf;
}

.analysis-box.theme-teal h3 {
  color: #2dd4bf;
}

.analysis-box.theme-purple {
  border-color: #a855f7;
  background: rgba(168, 85, 247, 0.12);
}

.analysis-box.theme-purple .check-icon {
  background: #a855f7;
}

.analysis-box.theme-purple h3 {
  color: #a855f7;
}

.analysis-box.theme-blue {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.12);
}

.analysis-box.theme-blue .check-icon {
  background: #3b82f6;
}

.analysis-box.theme-blue h3 {
  color: #3b82f6;
}

.analysis-box.theme-orange {
  border-color: #fb923c;
  background: rgba(251, 146, 60, 0.12);
}

.analysis-box.theme-orange .check-icon {
  background: #fb923c;
}

.analysis-box.theme-orange h3 {
  color: #fb923c;
}

.analysis-box.theme-yellow {
  border-color: #facc15;
  background: rgba(250, 204, 21, 0.12);
}

.analysis-box.theme-yellow .check-icon {
  background: #facc15;
}

.analysis-box.theme-yellow h3 {
  color: #facc15;
}

/* ==============================
   SENTIMENT
============================== */

.sentiment-bar {
  height: 11px;
  display: flex;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
}

.positive {
  width: 40%;
  background: #2dd4bf;
}

.neutral {
  width: 40%;
  background: #64748b;
}

.negative {
  width: 20%;
  background: #fb7185;
}

.sentiment-labels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
  margin-top: 22px;
}

.tag,
.article-tag {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
}

.positive-tag {
  background: rgba(45, 212, 191, 0.16);
  color: #2dd4bf;
}

.neutral-tag {
  background: rgba(100, 116, 139, 0.25);
  color: #94a3b8;
}

.negative-tag {
  background: rgba(251, 113, 133, 0.16);
  color: #fb7185;
}

.sentiment-labels strong {
  display: block;
  margin-top: 20px;
  font-size: 34px;
  font-weight: 500;
}

.count-link {
  margin-top: 8px;
  border: none;
  background: transparent;
  color: #94a3b8;
  font-size: 15px;
  text-decoration: underline;
  cursor: pointer;
}

.count-link:hover {
  color: #38bdf8;
}

/* ==============================
   KEYWORDS
============================== */

.keyword-panel {
  margin-top: 20px;
}

.keywords {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.keywords span,
.keywords a {
  padding: 12px 22px;
  border-radius: 999px;
  background: rgba(20, 184, 220, 0.18);
  color: #58e5f5;
  font-weight: 800;
}

.keyword-link {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.keyword-link:hover {
  transform: translateY(-1px);
}

/* ==============================
   ARTICLES
============================== */

.article-panel {
  margin-top: 22px;
}

.article_list {
  margin-top: 16px;
}

.article-row {
  display: grid;
  grid-template-columns: 52px 100px 1fr 38px 100px;
  gap: 12px;
  align-items: center;
  padding: 17px 0;
  border-bottom: 1px solid #24314a;
  font-size: 13px;
  cursor: pointer;
}

.article-row:hover .article-title {
  color: #38bdf8;
}

.press-logo-box {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.press-logo-img {
  width: 40px;
  height: 40px;
  object-fit: cover;
  display: block;
}

.press-logo-fallback {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #1e293b;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #cbd5e1;
  font-size: 10px;
  font-weight: 900;
}

.press {
  color: #e2e8f0;
}

.article-title {
  color: #f8fafc;
}

.article-date {
  color: #94a3b8;
  justify-self: end;
  white-space: nowrap;
}

/* ==============================
   COMPARE
============================== */

.compare-panel {
  margin-top: 24px;
}

.compare-groups {
  display: block;
}

.compare-group {
  margin-bottom: 28px;
}

.compare-group:last-child {
  margin-bottom: 0;
}

.compare-group-title {
  margin-bottom: 12px;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 900;
}

.compare-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 14px;
}

.compare-grid.compare-count-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.compare-grid.compare-count-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.compare-grid.compare-count-4plus {
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
}

.compare-card {
  min-height: 170px;
  height: auto;
  border-radius: 12px;
  background: #202d42;
  border: 1px solid rgba(148, 163, 184, 0.16);
  padding: 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
}

.compare-title {
  font-size: 12px;
  font-weight: 900;
  color: #e2e8f0;
}

.compare-percent {
  margin-top: 18px;
  font-size: 28px;
  font-weight: 900;
  color: #2dd4bf;
}

.compare-core {
  margin-top: 12px;
  color: #cbd5e1;
  font-size: 11px;
  line-height: 1.5;
}

.compare-mini-sentiment {
  margin-top: 14px;
}

.compare-mini-bar {
  width: 100%;
  height: 6px;
  display: flex;
  overflow: hidden;
  border-radius: 999px;
  background: #334155;
}

.compare-mini-positive {
  background: #2dd4bf;
}

.compare-mini-neutral {
  background: #64748b;
}

.compare-mini-negative {
  background: #fb7185;
}

.compare-mini-labels {
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  color: #94a3b8;
  font-size: 10px;
}

.compare-card.theme-teal.active {
  border-color: #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
}

.compare-card.theme-teal .compare-percent,
.compare-card.theme-teal .compare-title {
  color: #2dd4bf;
}

.compare-card.theme-teal .compare-fill {
  background: #2dd4bf;
}

.compare-card.theme-purple.active {
  border-color: #a855f7;
  background: rgba(168, 85, 247, 0.12);
}

.compare-card.theme-purple .compare-percent,
.compare-card.theme-purple .compare-title {
  color: #a855f7;
}

.compare-card.theme-purple .compare-fill {
  background: #a855f7;
}

.compare-card.theme-blue.active {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.12);
}

.compare-card.theme-blue .compare-percent,
.compare-card.theme-blue .compare-title {
  color: #3b82f6;
}

.compare-card.theme-blue .compare-fill {
  background: #3b82f6;
}

.compare-card.theme-orange.active {
  border-color: #fb923c;
  background: rgba(251, 146, 60, 0.12);
}

.compare-card.theme-orange .compare-percent,
.compare-card.theme-orange .compare-title {
  color: #fb923c;
}

.compare-card.theme-orange .compare-fill {
  background: #fb923c;
}

.compare-card.theme-yellow.active {
  border-color: #facc15;
  background: rgba(250, 204, 21, 0.12);
}

.compare-card.theme-yellow .compare-percent,
.compare-card.theme-yellow .compare-title {
  color: #facc15;
}

.compare-card.theme-yellow .compare-fill {
  background: #facc15;
}

/* ==============================
   FOOTER
============================== */

#footer {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  overflow: visible;
  flex-shrink: 0;
}

.footer {
  width: 100%;
  background: #020617;
  color: #fff;
  box-sizing: border-box;
}

.footer-inner {
  width: 100%;
  min-height: 88px;
  padding: 0 70px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 22px;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  background-color: #ffffff;
  -webkit-mask-image: url("/view/img/favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;
  mask-image: url("/view/img/favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;
  flex-shrink: 0;
}

.footer-link {
  border: 0;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
  text-decoration: none;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}

.footer-modal {
  position: fixed;
  inset: 0;
  z-index: 30000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(2, 8, 23, 0.75);
}

.footer-modal.hidden {
  display: none !important;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}

/* ==============================
   LIGHT MODE
============================== */

body.light-mode {
  background: #edf2ee;
  color: #1f2937;
}

body.light-mode .app {
  background: #edf2ee;
}

body.light-mode .header {
  background: #f1f6f2;
  border-bottom: 1px solid #d5ddd6;
  box-shadow: none;
  backdrop-filter: none;
}

body.light-mode .nav {
  color: #66756d;
}

body.light-mode .nav a:hover {
  color: #4cb7d3;
}

body.light-mode .main-search-wrap {
  background: #f7faf7;
  border: 1px solid #d8e1d9;
  box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
}

body.light-mode .main-search-wrap:focus-within {
  border-color: rgba(0, 207, 232, 0.45);
  box-shadow:
    0 0 0 4px rgba(0, 207, 232, 0.08),
    inset 0 1px 2px rgba(15, 23, 42, 0.08);
}

body.light-mode .search-box {
  color: #41bfe0;
}

body.light-mode .search-box::placeholder {
  color: #8b9a91;
}

body.light-mode .search-icon-btn {
  color: #708177;
}

body.light-mode .search-icon-btn:hover {
  color: #4cb7d3;
}

body.light-mode .theme-btn {
  background: #f7faf7;
  border: 1px solid #d7dfd8;
  color: #4b5563;
}

body.light-mode .theme-btn:hover {
  border-color: #4cb7d3;
  background: #ffffff;
}

body.light-mode .header-btn.join {
  background: #f7faf7;
  border: 1px solid #cfd8d0;
  color: #55635c;

let pressLogoMap = {};

async function loadPressLogoMap() {

    if (!response.ok) {
      throw new Error("press_logo_map.json 불러오기 실패");
    }

    pressLogoMap = await response.json();
  } catch (error) {
    console.error("언론사 로고 맵 로드 실패:", error);
    pressLogoMap = {};
  }
}

// =========================================================
// 언론사 로고 HTML 생성
// =========================================================
function getPressLogoHtml(pressName) {
  const logoUrl = pressLogoMap[pressName];

  if (!logoUrl) {
    return `
      <div class="press-logo-fallback">
        ${(pressName || "?").slice(0, 1)}
      </div>
    `;
  }

  return `
    <img
      class="press-logo-img"
      src="${logoUrl}"
      alt="${pressName || "언론사"}"
      onerror="this.outerHTML='<div class=&quot;press-logo-fallback&quot;>${(pressName || "?").slice(0, 1)}</div>'"
    >
  `;
}

function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    userName:

      localStorage.getItem("user_name") ||

      sessionStorage.getItem("role") ||
      localStorage.getItem("role")

}

function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  if (headerArea.innerHTML.trim()) {
    setHeaderLoginState();
    bindCommonSearch();
    applyThemeMode();
    return;
  }

  fetch("/view/header.html?v=999")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("header.html 경로 오류");
      }

      return res.text();
    })
    .then(function (html) {
      headerArea.innerHTML = html;

      setHeaderLoginState();
      bindCommonSearch();
      applyThemeMode();
    })
    .catch(function (err) {
      console.error("header 로드 실패:", err);
    });
}

function loadFooter() {
  const footerArea = document.getElementById("footer");

  if (!footerArea) return;

  fetch("/view/footer.html?v=999")

window.closeFooterModal = function () {

function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  let headerUserName = document.getElementById("headerUserName");

  // header.html이 예전 버전이어도 유저명 영역을 자동 생성
  if (!headerUserName) {
    const themeToggleBtn = document.getElementById("themeToggleBtn");

    if (themeToggleBtn && themeToggleBtn.parentElement) {
      headerUserName = document.createElement("span");
      headerUserName.id = "headerUserName";
      headerUserName.className = "header-user-name hidden";
      themeToggleBtn.insertAdjacentElement("afterend", headerUserName);
    }
  }

  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    if (loginBtn) loginBtn.classList.remove("hidden");
    if (joinBtn) joinBtn.classList.remove("hidden");
    if (primaryUserBtn) primaryUserBtn.classList.add("hidden");
    if (logoutBtn) logoutBtn.classList.add("hidden");

    if (headerUserName) {
      headerUserName.textContent = "";
      headerUserName.classList.add("hidden");
    }

    return;
  }

  if (loginBtn) loginBtn.classList.add("hidden");
  if (joinBtn) joinBtn.classList.add("hidden");
  if (primaryUserBtn) primaryUserBtn.classList.remove("hidden");
  if (logoutBtn) logoutBtn.classList.remove("hidden");

  if (headerUserName) {
    if (loginInfo.userName) {
      headerUserName.textContent = `${loginInfo.userName}님`;
      headerUserName.classList.remove("hidden");
    } else {
      headerUserName.textContent = "";
      headerUserName.classList.add("hidden");
    }
  }

  const isAdmin =
    loginInfo.role === "ADMIN" ||
    loginInfo.role === "SUPERADMIN" ||
    loginInfo.role === "admin" ||
    loginInfo.role === "superadmin" ||
    loginInfo.token === "admin-test-token";

  if (primaryUserBtn) {
    primaryUserBtn.innerText = isAdmin ? "관리자 페이지" : "마이페이지";
  }
}

function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  } else {
    document.body.classList.remove("light-mode");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");

    if (themeBtn) {
      themeBtn.innerText = "🌙";
    }
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");

    if (themeBtn) {
      themeBtn.innerText = "☀️";
    }
  }
}

function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>
            <span class="search-suggest-keyword">${highlightKeyword(item, value)}</span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectSearchSuggestion(btn.dataset.suggestKeyword);
      });
    });

    positionSearchSuggestBox();
    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);
    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  location.href = `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`;
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  location.href = `/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`;
}

document.addEventListener("click", async function (e) {
  const loginBtn = e.target.closest("#loginBtn");
  const joinBtn = e.target.closest("#joinBtn");
  const loginRequiredLink = e.target.closest("[data-login-page]");
  const primaryUserBtn = e.target.closest("#primaryUserBtn");
  const logoutBtn = e.target.closest("#logoutBtn");
  const themeToggleBtn = e.target.closest("#themeToggleBtn");

  if (themeToggleBtn) {
    e.preventDefault();
    toggleThemeMode();
    return;
  }

  if (loginBtn) {
    e.preventDefault();
    location.href = "/view/login.html";
    return;
  }

  if (joinBtn) {
    e.preventDefault();
    location.href = "/view/terms.html";
    return;
  }

  if (primaryUserBtn) {
    e.preventDefault();

    const loginInfo = getLoginInfo();
    const isAdmin =
      loginInfo.role === "ADMIN" ||
      loginInfo.role === "SUPERADMIN" ||
      loginInfo.role === "admin" ||
      loginInfo.role === "superadmin" ||
      loginInfo.token === "admin-test-token";

    location.href = isAdmin ? "/view/admin_dashboard.html" : "/view/mypage_home.html";
    return;
  }

  if (logoutBtn) {
    e.preventDefault();

    localStorage.removeItem("access_token");
    localStorage.removeItem("user_name");
    localStorage.removeItem("user_role");
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    localStorage.removeItem("userName");

    sessionStorage.removeItem("access_token");
    sessionStorage.removeItem("user_name");
    sessionStorage.removeItem("user_role");
    sessionStorage.removeItem("token");
    sessionStorage.removeItem("role");
    sessionStorage.removeItem("userName");

    try {
      await axios.post("/logout");
    } catch (e) {
      console.error("로그아웃 실패:", e);
    }

    location.href = "/view/main.html";
    return;
  }

  if (loginRequiredLink) {
    e.preventDefault();

    const targetUrl = loginRequiredLink.dataset.loginPage;
    const loginInfo = getLoginInfo();

    if (!loginInfo.token) {
      alert("로그인이 필요한 서비스입니다.");
      location.href = "/view/login.html";
      return;
    }

    location.href = targetUrl;
  }
});

document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();
});
</script>

}

function getSentimentTagClass(sentiment) {
  if (sentiment === "positive") return "positive-tag";
  if (sentiment === "neutral") return "neutral-tag";
  if (sentiment === "negative") return "negative-tag";

}

function formatDate(dateText) {
  if (!dateText) return "";

  if (dateText.length >= 10) {
    return dateText.slice(5, 10).replace("-", ".");
  }

  return dateText;
}

function getCleanPercent(value) {
  const numberValue = Number(value);

  if (Number.isNaN(numberValue)) {
    return 0;
  }

  return Math.max(0, Math.min(100, numberValue));
}

  const percentValue = Number(percent) || 0;

  // 실제 기사가 1건 이상 있는데 반올림되어 0%로 내려간 경우
  if (countValue > 0 && percentValue === 0) {

  return `${percentValue}%`;

    "정부 개입 강조": "/view/icons/building.svg",
    "정책 요인(국내)": "/view/icons/location.svg",
    "외부 요인(글로벌)": "/view/icons/global.svg"
  };

  return iconMap[title] || "/view/icons/news.svg";
}

function getViewpointMeta(title) {
  const metaMap = {
    // overview에서 넘어오는 이름
    "정부 책임": { icon: "/view/icons/gov.svg", color: "teal" },
    "기업 책임": { icon: "/view/icons/company.svg", color: "orange" },
    "개인 책임": { icon: "/view/icons/person.svg", color: "purple" },
    "외부 책임": { icon: "/view/icons/global.svg", color: "yellow" },
    "복합 책임": { icon: "/view/icons/complex.svg", color: "blue" },

    "비판": { icon: "/view/icons/chat.svg", color: "blue" },
    "비판적 태도": { icon: "/view/icons/chat.svg", color: "blue" },
    "우려": { icon: "/view/icons/warning.svg", color: "orange" },
    "기대": { icon: "/view/icons/star.svg", color: "teal" },
    "성과 예찬": { icon: "/view/icons/trophy.svg", color: "purple" },

    "단순 전달": { icon: "/view/icons/news.svg", color: "blue" },
    "원인 분석": { icon: "/view/icons/search.svg", color: "yellow" },
    "결과 분석": { icon: "/view/icons/chart.svg", color: "teal" },
    "대응 방안": { icon: "/view/icons/gear.svg", color: "orange" },
    "대응 분석": { icon: "/view/icons/gear.svg", color: "orange" },
    "전망": { icon: "/view/icons/graph.svg", color: "purple" },
    "전망 분석": { icon: "/view/icons/graph.svg", color: "purple" },

    "정부 개입": { icon: "/view/icons/building.svg", color: "purple" },
    "정부 개입 강조": { icon: "/view/icons/building.svg", color: "purple" },
    "시장 자율": { icon: "/view/icons/balance.svg", color: "teal" },
    "시장 자율 강조": { icon: "/view/icons/balance.svg", color: "teal" },

    "글로벌 환경": { icon: "/view/icons/global.svg", color: "yellow" },
    "외부 요인(글로벌)": { icon: "/view/icons/global.svg", color: "yellow" },
    "국내 정책": { icon: "/view/icons/location.svg", color: "blue" },
    "정책 요인(국내)": { icon: "/view/icons/location.svg", color: "blue" },

    // 기존 상세 페이지 이름
    "정부 관점": { icon: "/view/icons/gov.svg", color: "teal" },
    "기업 관점": { icon: "/view/icons/company.svg", color: "orange" },
    "개인 관점": { icon: "/view/icons/person.svg", color: "purple" },
    "외부 관점": { icon: "/view/icons/global.svg", color: "yellow" },
    "복합 관점": { icon: "/view/icons/complex.svg", color: "blue" }
  };

  return metaMap[title] || {
    icon: "/view/icons/news.svg",
    color: "blue"
  };
}

function applyViewpointThemeImmediately(title, percent) {
  const meta = getViewpointMeta(title);

  const mainIcon = document.querySelector(".main-icon");
  const iconImg = document.getElementById("viewIconImg");
  const viewTitleEl = document.getElementById("viewTitle");
  const viewPercentEl = document.getElementById("viewPercent");
  const analysisBox = document.querySelector(".analysis-box");

  if (iconImg) {
    iconImg.src = meta.icon;
    iconImg.alt = `${title || "관점"} 아이콘`;
  }

  if (mainIcon) {
    mainIcon.classList.remove(
      "theme-teal",
      "theme-purple",
      "theme-blue",
      "theme-orange",
      "theme-yellow"
    );
    mainIcon.classList.add(`theme-${meta.color}`);
  }

  if (viewTitleEl && title) {
    viewTitleEl.innerText = title;
  }

  if (viewPercentEl) {
    viewPercentEl.innerText = percent ? `${percent}%` : "0%";

    viewPercentEl.classList.remove(
      "theme-teal",
      "theme-purple",
      "theme-blue",
      "theme-orange",
      "theme-yellow"
    );
    viewPercentEl.classList.add(`theme-${meta.color}`);
  }

  if (analysisBox) {
    analysisBox.classList.remove(
      "theme-teal",
      "theme-purple",
      "theme-blue",
      "theme-orange",
      "theme-yellow"
    );
    analysisBox.classList.add(`theme-${meta.color}`);
  }
}

async function loadViewpointDetail(selectedTitle) {
  try {
    const requestParams = {};

    if (selectedTitle) {
      requestParams.viewpoint = selectedTitle;
    }

    // 메인 핵심 키워드 관점 분석에서 들어온 경우에만 keyword 전달
    if (viewpointKeyword) {
      requestParams.keyword = viewpointKeyword;
    }

    const res = await axios.get("/api/viewpoints/detail", {
      params: requestParams
    });

    const data = res.data;

    if (!data) {
      alert("관점 상세 데이터를 불러오지 못했습니다.");
      return;
    }

    viewTitle = data.title || selectedTitle;

    localStorage.setItem("viewpoint_title", viewTitle);

    if (data.percent !== undefined && data.percent !== null) {
      localStorage.setItem("viewpoint_percent", data.percent);
    }

    renderViewpointDetail(data);

  } catch (error) {
    console.error("관점 상세 조회 실패:", error);
    alert("관점 상세 데이터를 불러오는 중 오류가 발생했습니다.");
  }
}

function renderViewpointDetail(data) {
  const mainIcon = document.querySelector(".main-icon");
  viewEsCategory = data.es_category || "";
  const viewTitleEl = document.getElementById("viewTitle");
  const viewPercentEl = document.getElementById("viewPercent");
  const dateEl = document.querySelector(".date");

  const analysisBox = document.querySelector(".analysis-box");
  const analysisTitleEl = document.querySelector(".analysis-box h3");
  const analysisDescEl = document.querySelector(".analysis-box p");

  const fallbackMeta = getViewpointMeta(data.title || viewTitle);
  const colorKey = data.color_key || fallbackMeta.color || "teal";

  if (mainIcon) {
    const iconImg = document.getElementById("viewIconImg");

    if (iconImg) {
      iconImg.src = data.icon_url || fallbackMeta.icon;
      iconImg.alt = `${data.title || "관점"} 아이콘`;
    }

    mainIcon.classList.remove(
      "theme-teal",
      "theme-purple",
      "theme-blue",
      "theme-orange",
      "theme-yellow"
    );

    mainIcon.classList.add(`theme-${colorKey}`);
  }

  if (viewTitleEl) {
    viewTitleEl.innerText = data.title || "";
  }

  if (viewPercentEl) {
    viewPercentEl.innerText = formatDisplayPercent(
      data.percent,
      data.count || data.article_count || 0
    );

    viewPercentEl.classList.remove(
      "theme-teal",
      "theme-purple",
      "theme-blue",
      "theme-orange",
      "theme-yellow"
    );

    viewPercentEl.classList.add(`theme-${colorKey}`);
  }

  if (dateEl) {
    dateEl.innerText = data.date || "기준일";
  }

  if (analysisTitleEl) {
    analysisTitleEl.innerText = data.title || "";
  }

  if (analysisDescEl) {
    analysisDescEl.innerText = data.analysis_desc || "";
  }

  if (analysisBox) {
    analysisBox.classList.remove(
      "theme-teal",
      "theme-purple",
      "theme-blue",
      "theme-orange",
      "theme-yellow"
    );

    analysisBox.classList.add(`theme-${colorKey}`);
  }

  renderSentiment(data.sentiment);
  renderKeywords(data.keywords);
  renderArticles(data.articles);
  renderCompareCards(data.compare_groups || data.compare);
}

function renderSentiment(sentiment) {
  if (!sentiment) return;

  const positive = sentiment.positive || { percent: 0, count: 0 };
  const neutral = sentiment.neutral || { percent: 0, count: 0 };
  const negative = sentiment.negative || { percent: 0, count: 0 };

  const positiveBar = document.querySelector(".sentiment-bar .positive");
  const neutralBar = document.querySelector(".sentiment-bar .neutral");
  const negativeBar = document.querySelector(".sentiment-bar .negative");

  if (positiveBar) positiveBar.style.width = `${getCleanPercent(positive.percent)}%`;
  if (neutralBar) neutralBar.style.width = `${getCleanPercent(neutral.percent)}%`;
  if (negativeBar) negativeBar.style.width = `${getCleanPercent(negative.percent)}%`;

  const sentimentItems = document.querySelectorAll(".sentiment-labels > div");

  const sentimentData = [
    { key: "positive", data: positive },
    { key: "neutral", data: neutral },
    { key: "negative", data: negative }
  ];

  sentimentItems.forEach(function (item, index) {
    const current = sentimentData[index];

    if (!current) return;

    const strong = item.querySelector("strong");
    const button = item.querySelector(".count-link");

    if (strong) {
      strong.innerText = `${current.data.percent || 0}%`;
    }

    if (button) {
      button.innerText = `(${current.data.count || 0}건)`;
      button.onclick = function () {
        goArticleList(current.key);
      };
    }
  });
}

function renderKeywords(keywords) {
  const keywordBox = document.querySelector(".keywords");

  if (!keywordBox) return;

  if (!keywords || keywords.length === 0) {
    keywordBox.innerHTML = `<span>키워드 없음</span>`;
    return;
  }

  keywordBox.innerHTML = keywords.map(function (keyword) {
    return `
      <a
        class="keyword-link"
        href="/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}"
      >
        ${keyword}
      </a>
    `;
  }).join("");
}

function renderArticles(articles) {
  const articleList = document.querySelector(".article_list");

  if (!articleList) return;

  if (!articles || articles.length === 0) {
    articleList.innerHTML = `
      <div class="article-row">
        <div></div>
        <div class="press">-</div>
        <div class="article-title">관련 기사가 없습니다.</div>
        <span class="article-tag neutral-tag">-</span>
        <div class="article-date">-</div>
      </div>
    `;
    return;
  }

  articleList.innerHTML = articles.slice(0, 5).map(function (article) {
    return `
      <div class="article-row" onclick="goArticleDetail('${article.article_id || ""}')">
        <div class="press-logo-box">
          ${getPressLogoHtml(article.press)}
        </div>

        <div class="press">
          ${article.press || "-"}
        </div>

        <div class="article-title">
          ${article.title || "제목 없음"}
        </div>

        <span class="article-tag ${getSentimentTagClass(article.sentiment)}">
          ${getSentimentText(article.sentiment)}
        </span>

        <div class="article-date">
          ${formatDate(article.published_at || article.date)}
        </div>
      </div>
    `;
  }).join("");
}

function renderCompareCards(compareGroups) {
  const compareGrid = document.getElementById("compareGrid");

  if (!compareGrid) return;

  if (!compareGroups || compareGroups.length === 0) {
    compareGrid.innerHTML = "";
    return;
  }

  if (!compareGroups[0].items) {
    compareGroups = [
      {
        group: "관점 비교",
        items: compareGroups
      }
    ];
  }

  compareGrid.innerHTML = compareGroups.map(function (group) {
    const items = group.items || [];
    const gridClass = getCompareGridClass(items.length);

    const itemsHtml = items.map(function (item) {
      const isActive = item.title === viewTitle;
      const positive = item.sentiment?.positive?.percent || item.positive || 0;
      const neutral = item.sentiment?.neutral?.percent || item.neutral || 0;
      const negative = item.sentiment?.negative?.percent || item.negative || 0;

      return `
        <button
          class="compare-card theme-${item.color_key || "teal"} ${isActive ? "active" : ""}"
          type="button"
          data-title="${item.title}"
        >
          <div class="compare-title">${item.title}</div>

          <div class="compare-percent">
            ${formatDisplayPercent(
              item.percent,
              item.count || item.article_count || 0
            )}
          </div>

          <div class="compare-core">
            ${item.core || item.analysis_title || item.analysis_desc || "해당 관점의 기사 흐름을 확인합니다."}
          </div>

          <div class="compare-bar">
            <div class="compare-fill" style="width:${getCleanPercent(item.percent || 0)}%"></div>
          </div>

          <div class="compare-mini-sentiment">
            <div class="compare-mini-bar">
              <div class="compare-mini-positive" style="width:${getCleanPercent(positive)}%"></div>
              <div class="compare-mini-neutral" style="width:${getCleanPercent(neutral)}%"></div>
              <div class="compare-mini-negative" style="width:${getCleanPercent(negative)}%"></div>
            </div>

            <div class="compare-mini-labels">
              <span>긍 ${positive}%</span>
              <span>중 ${neutral}%</span>
              <span>부 ${negative}%</span>
            </div>
          </div>
        </button>
      `;
    }).join("");

    return `
      <div class="compare-group">
        <div class="compare-group-title">${group.group || "관점 비교"}</div>
        <div class="compare-grid ${gridClass}">
          ${itemsHtml}
        </div>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".compare-card").forEach(function (card) {
    card.addEventListener("click", function () {
      const selectedTitle = card.dataset.title;

      if (!selectedTitle || selectedTitle === viewTitle) return;

      localStorage.setItem("viewpoint_title", selectedTitle);

      let nextUrl =
        `/view/viewpoint_detail.html?viewpoint=${encodeURIComponent(selectedTitle)}`;

      if (viewpointKeyword) {
        nextUrl += `&keyword=${encodeURIComponent(viewpointKeyword)}`;
      }

      history.pushState(null, "", nextUrl);

      loadViewpointDetail(selectedTitle);
    });
  });
}

function goArticleList(sentiment) {
  const currentParams = new URLSearchParams(window.location.search);
  const currentKeyword =
    currentParams.get("keyword") ||
    viewpointKeyword ||
    "";

  const urlParams = new URLSearchParams();

  urlParams.set("viewpoint", viewEsCategory || viewTitle);
  urlParams.set("sentiment", sentiment);

  if (currentKeyword) {
    urlParams.set("keyword", currentKeyword);
  }

  urlParams.set("v", Date.now());

  location.href = `/view/article_list.html?${urlParams.toString()}`;
}

function goArticleDetail(articleId) {
  if (!articleId) return;

  localStorage.setItem("selected_article_id", articleId);
  location.href = `/view/article_detail.html?article_id=${encodeURIComponent(articleId)}`;
}

document.addEventListener("DOMContentLoaded", async function () {
  const savedPercent =
    viewpointParams.get("percent") ||
    localStorage.getItem("viewpoint_percent") ||
    "";

  applyViewpointThemeImmediately(viewTitle, savedPercent);

  await loadPressLogoMap();
  loadViewpointDetail(viewTitle);
});
</script>
