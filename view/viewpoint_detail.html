<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관점 상세 | DATA 다타</title>
<link rel="icon" type="image/png" href="/view/img/favicon.png?v=2">

<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.hidden {
  display: none !important;
}

body {
  background: #030817;
  color: #f8fafc;
  font-family: "Pretendard", sans-serif;
}

.app {
  min-height: 100vh;
  background: #030817;
}

/* ==============================
   HEADER
============================== */

.header {
  position: fixed;
  top: 0;
  left: 0;
  transform: none;
  z-index: 10000;

  width: 100%;
  height: 72px;
  padding: 0 56px;

  display: flex;
  align-items: center;

  background: #070b1a;
  border-bottom: 1px solid #111827;
}

.logo {
  width: 155px;
  height: 52px;
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  overflow: hidden;
  cursor: pointer;
}

.header-logo-full {
  height: 52px;
  width: auto;
  display: block;
  object-fit: contain;
}

.nav {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-left: 22px;
  color: #6b7280;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}

.nav a {
  text-decoration: none;
  color: inherit;
  transition: color 0.2s;
}

.nav a:hover {
  color: #00e5ff;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.main-search-wrap {
  position: relative;
  width: 410px;
  height: 40px;
  border-radius: 999px;
  background: #070b1a;
  border: 1px solid #1f2937;
  display: flex;
  align-items: center;
  padding: 0 14px 0 20px;
}

.search-box {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 15px;
  padding: 0;
}

.search-box::placeholder {
  color: #7c8493;
}

.main-search-wrap:focus-within {
  border-color: #334155;
}

.search-icon-btn {
  width: 24px;
  height: 24px;
  border: 0;
  background: transparent;
  color: #8b95a7;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
}

.search-icon-btn:hover {
  color: #00e5ff;
}

.theme-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #070b1a;
  color: #facc15;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-btn:hover {
  border-color: #334155;
}

.header-btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
}

.header-btn.login {
  border: 1px solid #00cfe8;
  background: #00cfe8;
  color: #020617;
}

.header-btn.login:hover {
  filter: brightness(1.08);
}

.header-btn.join {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
}

.header-btn.join:hover {
  border-color: #00e5ff;
  color: #00e5ff;
}

/* ==============================
   Search Suggest
============================== */

.search-suggest-box {
  position: fixed;
  width: 410px;
  max-width: 80vw;
  padding: 10px 0 12px;
  border: 1px solid #1e293b;
  border-radius: 18px;
  background: #050b1c;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  z-index: 20000;
  overflow: hidden;
}

.search-suggest-list {
  display: flex;
  flex-direction: column;
}

.search-suggest-item {
  width: 100%;
  height: 38px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  text-align: left;
}

.search-suggest-item:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #ffffff;
}

.search-suggest-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.search-suggest-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #94a3b8;
  color: #020817;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.search-suggest-keyword {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-suggest-arrow {
  color: #94a3b8;
  font-size: 18px;
  flex-shrink: 0;
}

.search-highlight {
  color: #00e5ff;
  font-weight: 900;
}

/* ==============================
   PAGE
============================== */

.detail-page {
  width: 800px;
  margin: 0 auto 120px;
  padding-top: 120px;
}

.back-btn {
  border: none;
  background: transparent;
  color: #38bdf8;
  font-size: 12px;
  cursor: pointer;
}

.back-btn:hover {
  color: #00e5ff;
}

.title-section {
  margin-top: 30px;
  display: grid;
  grid-template-columns: 120px 1fr 170px;
  align-items: center;
}

.main-icon {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  border: 1px solid #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
  color: #2dd4bf;
  display: grid;
  place-items: center;
  font-size: 56px;
}

.title-section h1 {
  font-size: 34px;
  font-weight: 900;
}

.title-section h1 strong {
  color: #2dd4bf;
  margin-left: 20px;
}

.title-section p {
  margin-top: 14px;
  color: #94a3b8;
  font-size: 15px;
}

.date {
  color: #94a3b8;
  font-size: 12px;
}

/* ==============================
   COMMON PANEL
============================== */

.panel {
  background: #111a2d;
  border: 1px solid rgba(148, 163, 184, 0.13);
  border-radius: 17px;
  padding: 24px;
}

.panel h2 {
  color: #7dd3fc;
  font-size: 16px;
  margin-bottom: 22px;
}

.top-grid {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 14px;
  margin-top: 36px;
}

/* ==============================
   ANALYSIS
============================== */

.analysis-box {
  height: 142px;
  border-radius: 12px;
  border: 1px solid #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 24px;
}

.check-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #2dd4bf;
  color: #0f172a;
  font-size: 30px;
  font-weight: 900;
}

.analysis-box h3 {
  color: #2dd4bf;
  font-size: 23px;
  margin-bottom: 20px;
}

.analysis-box p {
  color: #e2e8f0;
  line-height: 1.5;
}

/* ==============================
   SENTIMENT
============================== */

.sentiment-bar {
  height: 11px;
  display: flex;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
}

.positive {
  width: 40%;
  background: #2dd4bf;
}

.neutral {
  width: 40%;
  background: #64748b;
}

.negative {
  width: 20%;
  background: #fb7185;
}

.sentiment-labels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
  margin-top: 22px;
}

.tag,
.article-tag {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
}

.positive-tag {
  background: rgba(45, 212, 191, 0.16);
  color: #2dd4bf;
}

.neutral-tag {
  background: rgba(100, 116, 139, 0.25);
  color: #94a3b8;
}

.negative-tag {
  background: rgba(251, 113, 133, 0.16);
  color: #fb7185;
}

.sentiment-labels strong {
  display: block;
  margin-top: 20px;
  font-size: 34px;
  font-weight: 500;
}

.count-link {
  margin-top: 8px;
  border: none;
  background: transparent;
  color: #94a3b8;
  font-size: 15px;
  text-decoration: underline;
  cursor: pointer;
}

.count-link:hover {
  color: #38bdf8;
}

/* ==============================
   KEYWORDS
============================== */

.keyword-panel {
  margin-top: 20px;
}

.keywords {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.keywords span {
  padding: 12px 22px;
  border-radius: 999px;
  background: rgba(20, 184, 220, 0.18);
  color: #58e5f5;
  font-weight: 800;
}

/* ==============================
   ARTICLES
============================== */

.article-panel {
  margin-top: 22px;
}

.article_list {
  margin-top: 16px;
}

.article-row {
  display: grid;
  grid-template-columns: 52px 100px 1fr 60px 100px;
  gap: 12px;
  align-items: center;
  padding: 17px 0;
  border-bottom: 1px solid #24314a;
  font-size: 13px;
}

.press-logo {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 900;
}

.press-logo.blue {
  background: #1e3a8a;
}

.press-logo.sky {
  background: #0284c7;
}

.press-logo.white {
  background: #ffffff;
  color: #111827;
}

.press-logo.red {
  background: #ffffff;
  color: #dc2626;
  font-size: 18px;
}

.press-logo.green {
  background: #ffffff;
  color: #0f766e;
  font-size: 18px;
}

.press {
  color: #e2e8f0;
}

.article-title {
  color: #f8fafc;
}

.article-date {
  color: #94a3b8;
}

/* ==============================
   COMPARE
============================== */

.compare-panel {
  margin-top: 24px;
}

.compare-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

.compare-card {
  height: 180px;
  border-radius: 12px;
  background: #202d42;
  border: 1px solid rgba(148, 163, 184, 0.16);
  padding: 14px;
}

.compare-card.active {
  border-color: #2dd4bf;
  background: rgba(45, 212, 191, 0.12);
}

.compare-title {
  font-size: 12px;
  font-weight: 900;
  color: #e2e8f0;
}

.compare-percent {
  margin-top: 20px;
  font-size: 28px;
  font-weight: 900;
  color: #2dd4bf;
}

.compare-bar {
  height: 7px;
  margin-top: 22px;
  border-radius: 999px;
  overflow: hidden;
  display: flex;
  background: #334155;
}

.compare-fill {
  height: 100%;
  border-radius: 999px;
  background: #2dd4bf;
}

/* ==============================
   FOOTER
============================== */

.footer {
  border-top: 1px solid #111827;
  background: #070b1a;
  padding: 24px 0;
  margin-top: 60px;
}

.footer-inner {
  width: 1440px;
  max-width: 100%;
  margin: 0 auto;
  padding: 0 64px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: #64748b;
  font-size: 12px;
}

.footer-logo-white {
  width: 34px;
  height: 34px;
  background-color: #ffffff;

  -webkit-mask-image: url("/view/img/data_favicon.png");
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  -webkit-mask-size: contain;

  mask-image: url("/view/img/data_favicon.png");
  mask-repeat: no-repeat;
  mask-position: center;
  mask-size: contain;

  flex-shrink: 0;
}

.footer-link {
  border: 0;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  font-size: 12px;
}

.footer-link:hover {
  color: #00e5ff;
}

.footer-divider {
  width: 1px;
  height: 12px;
  background: #334155;
}

.footer-copy {
  margin: 0;
  color: #64748b;
}

.footer-modal {
  position: fixed;
  inset: 0;
  background: rgba(2, 8, 23, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30000;
}

.footer-modal-box {
  width: 520px;
  max-width: calc(100% - 32px);
  max-height: 70vh;
  overflow-y: auto;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 18px;
  padding: 28px;
}

.footer-modal-content {
  color: #cbd5e1;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.footer-modal-content h3 {
  margin: 0 0 16px;
  color: #f8fafc;
}

.footer-modal-btn {
  width: 100%;
  margin-top: 24px;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #00e5ff;
  color: #020617;
  font-weight: 900;
  cursor: pointer;
}

/* ==============================
   LIGHT MODE
============================== */

body.light-mode {
  background: #f8fafc;
  color: #0f172a;
}

body.light-mode .app {
  background: #f8fafc;
}

body.light-mode .header {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
}

body.light-mode .nav {
  color: #64748b;
}

body.light-mode .nav a:hover {
  color: #0284c7;
}

body.light-mode .main-search-wrap {
  background: #ffffff;
  border-color: #cbd5e1;
}

body.light-mode .search-box {
  color: #0f172a;
}

body.light-mode .search-box::placeholder {
  color: #94a3b8;
}

body.light-mode .search-icon-btn {
  color: #64748b;
}

body.light-mode .theme-btn {
  background: #ffffff;
  border-color: #cbd5e1;
  color: #334155;
}

body.light-mode .header-btn.join {
  background: #ffffff;
  border-color: #94a3b8;
  color: #334155;
}

body.light-mode .header-btn.login {
  background: #00cfe8;
  border-color: #00cfe8;
  color: #020617;
}

body.light-mode .detail-page {
  color: #0f172a;
}

body.light-mode .panel,
body.light-mode .compare-card {
  background: #ffffff;
  border-color: #e2e8f0;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
}

body.light-mode .compare-card.active,
body.light-mode .analysis-box {
  background: #ecfeff;
  border-color: #5eead4;
}

body.light-mode .title-section h1,
body.light-mode .article-title,
body.light-mode .compare-title,
body.light-mode .press {
  color: #0f172a;
}

body.light-mode .analysis-box p,
body.light-mode .title-section p,
body.light-mode .date,
body.light-mode .article-date,
body.light-mode .count-link {
  color: #64748b;
}

body.light-mode .article-row {
  border-bottom: 1px solid #e2e8f0;
}

body.light-mode .search-suggest-box {
  background: #ffffff;
  border-color: #cbd5e1;
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
}

body.light-mode .search-suggest-item {
  color: #334155;
}

body.light-mode .search-suggest-item:hover {
  background: #e0f7ff;
  color: #0284c7;
}

body.light-mode .search-suggest-icon {
  background: #e2e8f0;
  color: #475569;
}

body.light-mode .search-suggest-arrow {
  color: #64748b;
}

body.light-mode .footer {
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
}

body.light-mode .footer-logo-white {
  background-color: #020617;
}

body.light-mode .footer-link {
  color: #475569;
}

body.light-mode .footer-link:hover {
  color: #0284c7;
}

body.light-mode .footer-copy {
  color: #64748b;
}

body.light-mode .footer-modal-box {
  background: #ffffff;
  border-color: #cbd5e1;
}

body.light-mode .footer-modal-content {
  color: #334155;
}

body.light-mode .footer-modal-content h3 {
  color: #0f172a;
}

/* ==============================
   RESPONSIVE
============================== */

@media (max-width: 900px) {
  .header {
    padding: 0 20px;
  }

  .main-search-wrap {
    width: 260px;
  }

  .detail-page {
    width: calc(100% - 32px);
  }

  .title-section,
  .top-grid,
  .compare-grid {
    grid-template-columns: 1fr;
  }

  .article-row {
    grid-template-columns: 1fr;
  }

  .footer-inner {
    padding: 0 24px;
    flex-wrap: wrap;
  }
}

@media (max-width: 640px) {
  .search-suggest-box {
    left: 18px !important;
    right: 18px !important;
    width: auto !important;
    max-width: none;
  }

  .sentiment-labels {
    grid-template-columns: 1fr;
    gap: 18px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div id="header"></div>

  <main class="detail-page">

    <button class="back-btn" onclick="location.href='/view/main.html'">
      ← 메인으로 돌아가기
    </button>

    <section class="title-section">
      <div class="main-icon">🏛</div>

      <div>
        <h1>
          <span id="viewTitle">정부 관점</span>
          <strong id="viewPercent">%</strong>
        </h1>
        <p>전체 기사 중 비율</p>
      </div>

      <div class="date">기준일 </div>
    </section>

    <section class="top-grid">
      <div class="panel">
        <h2>관점 해석</h2>

        <div class="analysis-box">
          <div class="check-icon">✓</div>
          <div>
            <h3></h3>
            <p><br></p>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>감성 분포</h2>

        <div class="sentiment-bar">
          <div class="positive"></div>
          <div class="neutral"></div>
          <div class="negative"></div>
        </div>

        <div class="sentiment-labels">
          <div>
            <span class="tag positive-tag">긍정</span>
            <strong>%</strong>
            <button class="count-link" onclick="goArticleList('positive')">(건)</button>
          </div>

          <div>
            <span class="tag neutral-tag">중립</span>
            <strong>%</strong>
            <button class="count-link" onclick="goArticleList('neutral')">(건)</button>
          </div>

          <div>
            <span class="tag negative-tag">부정</span>
            <strong>%</strong>
            <button class="count-link" onclick="goArticleList('negative')">(건)</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel keyword-panel">
      <h2>주요 키워드</h2>

      <div class="keywords">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

    <section class="panel article-panel">
      <h2>관련 기사 TOP 5</h2>

      <div class="article_list">
        <div class="article-row">
          <div class="press-logo blue"></div>
          <div class="press"></div>
          <div class="article-title"></div>
          <span class="article-tag positive-tag"></span>
          <div class="article-date"></div>
        </div>

        <div class="article-row">
          <div class="press-logo sky"></div>
          <div class="press"></div>
          <div class="article-title"></div>
          <span class="article-tag neutral-tag"></span>
          <div class="article-date"></div>
        </div>

        <div class="article-row">
          <div class="press-logo white"></div>
          <div class="press"></div>
          <div class="article-title"></div>
          <span class="article-tag positive-tag"></span>
          <div class="article-date"></div>
        </div>

        <div class="article-row">
          <div class="press-logo red"></div>
          <div class="press"></div>
          <div class="article-title"></div>
          <span class="article-tag negative-tag"></span>
          <div class="article-date"></div>
        </div>

        <div class="article-row">
          <div class="press-logo green"></div>
          <div class="press"></div>
          <div class="article-title"></div>
          <span class="article-tag neutral-tag"></span>
          <div class="article-date"></div>
        </div>
      </div>
    </section>

    <section class="panel compare-panel">
      <h2>관점 비교</h2>
      <div class="compare-grid" id="compareGrid"></div>
    </section>

  </main>

  <div id="footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
function getLoginInfo() {
  return {
    token:
      sessionStorage.getItem("access_token") ||
      localStorage.getItem("access_token") ||
      sessionStorage.getItem("token") ||
      localStorage.getItem("token"),

    role:
      sessionStorage.getItem("user_role") ||
      localStorage.getItem("user_role") ||
      sessionStorage.getItem("role") ||
      localStorage.getItem("role")
  };
}

function loadHeader() {
  const headerArea = document.getElementById("header");

  if (!headerArea) return;

  fetch("/view/header.html?v=999")
    .then(function (res) {

function setHeaderLoginState() {
  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const primaryUserBtn = document.getElementById("primaryUserBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const loginInfo = getLoginInfo();

  if (!loginInfo.token) {
    if (loginBtn) loginBtn.classList.remove("hidden");
    if (joinBtn) joinBtn.classList.remove("hidden");
    if (primaryUserBtn) primaryUserBtn.classList.add("hidden");
    if (logoutBtn) logoutBtn.classList.add("hidden");
    return;
  }

  if (loginBtn) loginBtn.classList.add("hidden");
  if (joinBtn) joinBtn.classList.add("hidden");
  if (primaryUserBtn) primaryUserBtn.classList.remove("hidden");
  if (logoutBtn) logoutBtn.classList.remove("hidden");

  const isAdmin =
    loginInfo.role === "ADMIN" ||
    loginInfo.role === "SUPERADMIN" ||
    loginInfo.role === "admin" ||
    loginInfo.role === "superadmin" ||
    loginInfo.token === "admin-test-token";

  if (primaryUserBtn) {
    primaryUserBtn.innerText = isAdmin ? "관리자 페이지" : "마이페이지";
  }
}

function applyThemeMode() {
  const savedTheme = localStorage.getItem("theme_mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");
    if (themeBtn) themeBtn.innerText = "☀️";
  } else {
    document.body.classList.remove("light-mode");
    if (themeBtn) themeBtn.innerText = "🌙";
  }
}

function toggleThemeMode() {
  const isLight = document.body.classList.contains("light-mode");
  const themeBtn = document.getElementById("themeToggleBtn");

  if (isLight) {
    document.body.classList.remove("light-mode");
    localStorage.setItem("theme_mode", "dark");
    if (themeBtn) themeBtn.innerText = "🌙";
  } else {
    document.body.classList.add("light-mode");
    localStorage.setItem("theme_mode", "light");
    if (themeBtn) themeBtn.innerText = "☀️";
  }
}

function bindCommonSearch() {
  const input = document.getElementById("commonSearchInput");
  const searchBtn = document.getElementById("commonSearchBtn");

  if (!input) return;

  if (searchBtn) {
    searchBtn.addEventListener("click", function () {
      moveSearch(input.value);
    });
  }

  input.addEventListener("input", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("focus", function () {
    renderSearchSuggestions(input.value);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      moveSearch(input.value);
    }

    if (e.key === "Escape") {
      hideSearchSuggestions();
    }
  });

  document.addEventListener("click", function (e) {
    const searchWrap = document.querySelector(".main-search-wrap");

    if (!searchWrap) return;

    if (!searchWrap.contains(e.target)) {
      hideSearchSuggestions();
    }
  });

  window.addEventListener("resize", positionSearchSuggestBox);
  window.addEventListener("scroll", positionSearchSuggestBox);
}

function highlightKeyword(text, keyword) {
  if (!keyword) return text;

  const escapedKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp(`(${escapedKeyword})`, "gi");

  return text.replace(regex, `<span class="search-highlight">$1</span>`);
}

async function renderSearchSuggestions(keyword) {
  const list = document.getElementById("searchSuggestList");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!list || !suggestBox) return;

  const value = keyword.trim();

  if (!value) {
    hideSearchSuggestions();
    return;
  }

  try {
    const res = await axios.get(
      `/api/search/suggest?q=${encodeURIComponent(value)}`
    );

    const results = res.data || [];

    if (results.length === 0) {
      hideSearchSuggestions();
      return;
    }

    list.innerHTML = results.map(function (item) {
      return `
        <button
          class="search-suggest-item"
          type="button"
          data-suggest-keyword="${item}"
        >
          <span class="search-suggest-left">
            <span class="search-suggest-icon">⌕</span>
            <span class="search-suggest-keyword">${highlightKeyword(item, value)}</span>
          </span>

          <span class="search-suggest-arrow">↖</span>
        </button>
      `;
    }).join("");

    document.querySelectorAll(".search-suggest-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectSearchSuggestion(btn.dataset.suggestKeyword);
      });
    });

    positionSearchSuggestBox();
    suggestBox.classList.remove("hidden");

  } catch (error) {
    console.error("검색 자동완성 실패:", error);
    hideSearchSuggestions();
  }
}

function positionSearchSuggestBox() {
  const searchWrap = document.querySelector(".main-search-wrap");
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!searchWrap || !suggestBox) return;

  const rect = searchWrap.getBoundingClientRect();

  suggestBox.style.top = `${rect.bottom + 4}px`;
  suggestBox.style.left = `${rect.left}px`;
  suggestBox.style.width = `${rect.width}px`;
}

function hideSearchSuggestions() {
  const suggestBox = document.getElementById("searchSuggestBox");

  if (!suggestBox) return;

  suggestBox.classList.add("hidden");
}

function selectSearchSuggestion(keyword) {
  const input = document.getElementById("commonSearchInput");

  if (input) {
    input.value = keyword;
  }

  hideSearchSuggestions();

  location.href = `/view/keyword_detail.html?keyword=${encodeURIComponent(keyword)}`;
}

function moveSearch(keyword) {
  const value = keyword.trim();

  if (!value) return;

  hideSearchSuggestions();

  location.href = `/view/keyword_detail.html?keyword=${encodeURIComponent(value)}`;
}

function goArticleList(sentiment) {
  localStorage.setItem("article_list_sentiment", sentiment);
  localStorage.setItem("article_list_viewpoint", viewTitle);

  location.href = "/view/article_list.html";
}

document.addEventListener("click", function (e) {
  const loginBtn = e.target.closest("#loginBtn");
  const joinBtn = e.target.closest("#joinBtn");
  const loginRequiredLink = e.target.closest("[data-login-page]");
  const primaryUserBtn = e.target.closest("#primaryUserBtn");
  const logoutBtn = e.target.closest("#logoutBtn");
  const themeToggleBtn = e.target.closest("#themeToggleBtn");

  if (themeToggleBtn) {
    e.preventDefault();
    toggleThemeMode();
    return;
  }

  if (loginBtn) {
    e.preventDefault();
    location.href = "/view/login.html";
    return;
  }

  if (joinBtn) {
    e.preventDefault();
    location.href = "/view/terms.html";
    return;
  }

  if (primaryUserBtn) {
    e.preventDefault();

    const loginInfo = getLoginInfo();
    const isAdmin =
      loginInfo.role === "ADMIN" ||
      loginInfo.role === "SUPERADMIN" ||
      loginInfo.role === "admin" ||
      loginInfo.role === "superadmin" ||
      loginInfo.token === "admin-test-token";

    location.href = isAdmin ? "/view/admin_dashboard.html" : "/view/mypage_home.html";
    return;
  }

  if (logoutBtn) {
    e.preventDefault();

    localStorage.removeItem("access_token");
    localStorage.removeItem("user_name");
    localStorage.removeItem("user_role");
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    localStorage.removeItem("userName");

    sessionStorage.removeItem("access_token");
    sessionStorage.removeItem("user_name");
    sessionStorage.removeItem("user_role");
    sessionStorage.removeItem("token");
    sessionStorage.removeItem("role");
    sessionStorage.removeItem("userName");

    location.href = "/view/main.html";
    return;
  }

  if (loginRequiredLink) {
    e.preventDefault();

    const targetUrl = loginRequiredLink.dataset.loginPage;
    const loginInfo = getLoginInfo();

    if (!loginInfo.token) {
      alert("로그인이 필요한 서비스입니다.");
      location.href = "/view/login.html";
      return;
    }

    location.href = targetUrl;
  }
});

document.addEventListener("DOMContentLoaded", function () {
  applyThemeMode();
  loadHeader();
  loadFooter();
});
</script>
